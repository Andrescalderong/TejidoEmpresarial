doc_id: D005
relevancia: "Núcleo"
relevancia_just: "Aporta evidencia organizacional sobre condiciones y consecuencias de adoptar IoT (calidad de datos, gobernanza, capacidades, compras), el factor humano y organizacional que la síntesis de Scopus AI señala como poco estudiado."
cluster_tema: "Adopción organizacional de IoT y gobernanza de datos"
metodo_tipo: "Revisión de literatura (Webster y Watson) + estudio de casos múltiples (dualidad de la tecnología)"
tipo_recurso: "Artículo científico (journal peer-reviewed)"
kw_inferidas: [adopción de IoT, gestión de activos, teoría de la estructuración, gobernanza de datos, calidad de datos, datos abiertos, Rijkswaterstaat, sector público, riesgos organizacionales, cambio institucional]
c2:
  objetivo: >
    Analizar el impacto de la adopción de Internet de las cosas (IoT) en las organizaciones, identificando de forma sistemática sus beneficios y riesgos esperados mediante una revisión de literatura organizada en las categorías de datos masivos, abiertos y enlazados (BOLD), y contrastándolos con los beneficios y riesgos efectivamente experimentados en dos casos de gestión de activos de infraestructura en los Países Bajos, a fin de comprender cómo la tecnología y la organización se transforman mutuamente y qué cambios institucionales deben ocurrir para que los beneficios esperados se concreten en la práctica.
  pregunta: >
    ¿Cómo impacta la adopción de IoT a las organizaciones? Se desagrega en cuatro subpreguntas: beneficios de IoT para las organizaciones, riesgos, condiciones organizacionales de la adopción y consecuencias organizacionales de la adopción.
  marco: >
    El marco es la teoría de la dualidad de la tecnología de Orlikowski (1992), que se apoya en la teoría de la estructuración de Giddens (1976): la tecnología es producto de la acción humana y a la vez adquiere propiedades estructurales que condicionan esa acción. Orlikowski distingue cuatro relaciones (tecnología como producto de la agencia humana, como medio de la agencia, condiciones institucionales de la interacción y consecuencias institucionales), que los autores traducen en cuatro proposiciones. Se contrasta con el modelo de aceptación tecnológica (TAM), la difusión de innovaciones de Rogers y la crítica de Leonardi (2013) al enfoque de práctica, que sugiere complementar con socio-materialidad. Los datos de IoT se clasifican con la tríada BOLD (Big, Open, Linked). El paradigma es interpretativo, con orientación a construcción de teoría desde casos.
  metodologia: >
    La revisión de literatura sigue a Webster y Watson (2002) y arma una matriz de conceptos. Para la parte teórica, las palabras clave 'adoption', 'technology' y 'organizations' arrojaron 23.391 resultados en Scopus, Web of Science, IEEE Xplore y JSTOR (julio de 2018); al filtrar por dominios de tecnología, política y administración, y comportamiento organizacional quedaron 3.585 y se seleccionaron 52 artículos. Para beneficios y riesgos de IoT, la búsqueda ('Internet of Things' OR 'IoT') con 'benefits' y 'risks' dio 139 resultados y, con búsqueda hacia adelante y hacia atrás, se escogieron 50 artículos. Los casos se ubican en una sola organización, Rijkswaterstaat (RWS), ministerio neerlandés de infraestructura: el sistema de pesaje en movimiento de vehículos (Weigh-in-Motion, WIM) y la red nacional de medición hidrológica (Landelijk Meetnet Water, LMW). Se usaron entrevistas individuales y discusiones grupales durante dieciocho meses (junio de 2015 y enero de 2017), en tres niveles (estratégico, táctico y operativo), más documentos internos y sitios web; la triangulación comparó beneficios y riesgos de los documentos con los de las entrevistas. El análisis combina comparación dentro de cada caso y entre casos, con razonamiento inductivo y cuatro proposiciones.
  resultados: >
    La revisión produjo dos síntesis (Tablas 1 y 2) de beneficios y riesgos por componente BOLD. En los casos, el WIM mide el peso de vehículos pesados en carretera: RWS estima que al menos 15 % del tráfico de carga está sobrecargado y que el daño al pavimento en 2008 fue de al menos 34 millones de euros al año; la red pasó de cinco estaciones hasta 2010 a una red nacional construida entre 2010 y 2013 (el texto dice 22 estaciones y la Tabla 4 dice 18). El LMW reúne unos 640 puntos de recolección (aproximadamente 300 operados por RWS y 340 por terceros) que alimentan el cierre de barreras contra tormentas y servicios de puertos, alertas de inundación y mensajes a navegantes. Los hallazgos confirman las cuatro proposiciones: los beneficios (datos oportunos, decisiones casi en tiempo real, mejor planificación) exigieron gestionar riesgos no previstos (calidad de datos incierta por sensores contaminados o vehículos heterogéneos, privacidad por matrículas, integridad de datos como evidencia legal, interoperabilidad entre tecnologías sin estándar, costos de mantenimiento) mediante cambios organizacionales: marco de calidad de datos, gobernanza de datos, nuevos equipos y roles, ajuste de contratos marco para incluir empresas emergentes y mayor coordinación entre procesos. Un hallazgo no previsto en la literatura es que la calidad de datos es tanto beneficio como riesgo. RWS asumió la mayor parte de los costos aunque los datos se ofrecen abiertos y los beneficios económicos recaen en terceros.
  discusion: >
    Los autores concluyen que el IoT ofrece beneficios, pero que estos solo se alcanzan después de cumplir condiciones institucionales (marco de calidad de datos, gobernanza, habilidades técnicas, capacidad de infraestructura de TI, políticas de compras flexibles y arquitecturas con estándares) y de aceptar consecuencias estructurales (nuevos departamentos de datos, equipos de configuración, cambios de compras, procesos, estrategia y comunicación). Proponen un modelo en el que la adopción es un ciclo continuo, porque nuevo conocimiento y nuevas formas organizacionales generan requisitos que impulsan más desarrollo tecnológico. Subrayan que los riesgos están interrelacionados y que la dualidad es un asunto de estructuración. Reconocen que la generalización a otros dominios es limitada, que el cambio de personal entre rondas de entrevistas afecta los datos y que la teoría de la práctica de Orlikowski podría complementarse con socio-materialidad.
  limitaciones: "Declaradas: ambos casos pertenecen a gestión de activos del sector público en una sola organización, lo que restringe la generalización; la segunda ronda de entrevistas incluyó personas distintas por cambios de personal; la aplicación del lente de dualidad podría complementarse con otras teorías."
  futuro: "Investigar consecuencias de largo plazo de la adopción de IoT, extender el análisis a otros dominios donde los beneficios ocultos (aprendizaje, cultura) pueden ser principales, y explorar otras teorías como la socio-materialidad."
c3:
  tesis: >
    Los beneficios del IoT en las organizaciones solo se materializan después de cumplir condiciones institucionales y de aceptar consecuencias estructurales, de modo que la adopción es un ciclo dual y continuo entre tecnología y organización, no un proceso lineal de instalación.
  antitesis: >
    La estructura de dualidad es difícil de falsar: cualquier beneficio puede emparejarse con un riesgo y cualquier cambio organizacional puede presentarse como consecuencia, de modo que el marco describe más de lo que explica. La evidencia empírica procede de dos casos en una sola organización pública financiada por el mismo ente estudiado (Rijkswaterstaat), con entrevistados seleccionados por ser 'early adopters' e implicados en los proyectos, lo que sesga hacia relatos de aprendizaje y cambio. No hay medición cuantitativa de beneficios ni de costos (no se informa retorno de inversión, ahorro o tasa de error), y la comparación entre casos se sostiene en cuadros descriptivos. Las cifras del propio texto son incoherentes en un punto básico (18 estaciones en la Tabla 4 frente a 22 en el texto), y la revisión mezcla definiciones heterogéneas de organización, que incluyen gobierno, empresas y ciudades.
  sintesis: >
    El artículo sostiene de forma convincente que la adopción de IoT impone condiciones organizacionales (calidad y gobernanza de datos, capacidades, compras, arquitectura) y que ignorarlas reduce los beneficios, una conclusión coherente con la literatura de adopción de sistemas empresariales. Su validez causal es débil, pero su aporte es una lista de condiciones operacionalizables que puede someterse a medición. Para el corpus, la síntesis consiste en tratar las seis condiciones y las seis consecuencias como variables candidatas a explicar la brecha entre tecnologías disponibles y resultados de recuperación productiva, en lugar de asumir que el sensor o el gemelo digital basta.
  areas_grises:
    - "Dependencia del financiador: la investigación fue apoyada por Rijkswaterstaat, que además es la organización estudiada y selecciona a los entrevistados, lo que no se discute como posible sesgo de aquiescencia."
    - "Inconsistencia de datos básicos: la red WIM aparece con 18 estaciones (Tabla 4) y con 22 estaciones (texto de la Sec. 4.1); la ambigüedad sobre fecha, versión del dato y alcance impide verificar escala."
    - "Ausencia de medidas de resultado: se afirma que los beneficios 'se confirman' en la práctica, pero no se informa ahorro de costos, reducción de la sobrecarga, precisión de datos ni retorno de inversión, salvo la estimación de daño de 34 millones de euros anuales en 2008, sin fuente primaria."
    - "Muestra de entrevistados: la composición cambió entre 2015 y 2017 por rotación de personal; los autores lo reconocen, pero no evalúan si los hallazgos de riesgos no previstos son artefacto de entrevistar a personas distintas."
    - "Teoría y prueba: el lente de dualidad se aplica a posteriori para ordenar los datos y las 'proposiciones' son casi tautológicas (la tecnología se desarrolla para obtener beneficios), con lo cual la contrastación empírica es débil."
  puntos_oscuros: >
    El texto afirma que la calidad de datos es a la vez beneficio y riesgo, pero esa ambigüedad desaparece si se distingue entre calidad potencial (que el sensor pueda medir con precisión) y calidad garantizada (que el sistema pueda demostrarla ante terceros y ante la ley). En WIM, el sistema distingue vehículo y carga, pero los tribunales no aceptan aún sus mediciones como prueba concluyente, y en LMW la contaminación de sensores y el costo económico de cerrar una barrera sin necesidad impiden automatizar por completo. Esta lectura aclara por qué el valor depende de procedimientos de verificación, calibración y gobernanza y no solo del dato. También explica que RWS asuma costos mientras los beneficios se externalizan: el dato abierto es un bien público con un productor que no captura el rendimiento. La paradoja central desaparece si se interpreta como problema de provisión de bienes públicos y de aseguramiento de calidad.
  ideas:
    - "Índice de preparación organizacional para IoT: operacionalizar las seis condiciones (marco de calidad de datos, gobernanza, habilidades técnicas, capacidad de TI, compras flexibles y arquitectura con estándares) en una escala de 0 a 100 aplicable a pymes y entidades locales, y estimar con modelos de ecuaciones estructurales su relación con la realización de beneficios y con el tiempo de recuperación tras un evento extremo. Fundamento: el artículo identifica esas seis condiciones en los casos como requisito de beneficios. Verificabilidad: encuesta a organizaciones que adoptaron sensores o gemelos digitales, con medición de beneficios obtenidos y de interrupción experimentada. Utilidad: focaliza asistencia técnica y evita invertir en sensores sin capacidades de uso."
    - "Mecanismo de provisión compartida de datos de infraestructura: diseñar un esquema de financiamiento tipo club o consorcio en el que las empresas beneficiarias de redes públicas de sensores (sísmicos, hidrológicos, de energía) contribuyan a los costos de operación a cambio de acceso con garantías de calidad. Fundamento: el caso LMW muestra que el costo recae en RWS mientras el valor se externaliza. Verificabilidad: experimento de elección discreta sobre disposición a pagar de empresas usuarias y comparación de calidad de datos con y sin cofinanciamiento. Utilidad: sostiene redes de monitoreo críticas para la continuidad empresarial."
  relaciones:
    - "Confianza de los gestores en el sistema (media) la relación entre calidad de datos y grado de automatización: sin confianza se mantienen inspecciones físicas; relación sugerida por los casos y no medida."
    - "Costo asumido por el productor del dato frente a beneficio capturado por terceros (genera) subinversión en mantenimiento de redes de sensores: argumento de bien público con implicaciones para redes de monitoreo sísmico."
  robustez: [6, 5, 3, 3]
  valor: [7, "Es una de las pocas piezas que documentan con casos reales qué condiciones organizacionales determinan que el IoT rinda, y su lista de condiciones y consecuencias se puede convertir en variables de medición. Su valor para el eje del corpus es alto en lo organizacional (transferencia de tecnología y capacidades), aunque limitado por su contexto de sector público neerlandés, sin pymes ni eventos sísmicos."]
  conexiones: []
socratica:
  p1: "'Adopción de IoT' es la incorporación de redes de sensores conectadas a decisiones organizacionales; 'dualidad' es que la tecnología es producto de la acción humana y a la vez estructura esa acción."
  p2: "Supone que los beneficios y riesgos de la literatura son comparables con los de los casos; que dos casos de una organización pública representan la adopción; que los relatos de los entrevistados reflejan los efectos reales."
  p3: "La evidencia es cualitativa (entrevistas, discusiones, documentos) sin indicadores de desempeño; la revisión (52 y 50 artículos) no reporta calidad de las fuentes."
  p4: "Si es cierto, las organizaciones deben invertir en gobernanza, calidad de datos y capacidades antes o junto con los sensores; si es falso, los costos organizacionales serían superados por la mejora tecnológica sin ajustes."
  p5: "Casos de adopción exitosa sin cambios organizacionales, o en empresas pequeñas con estructuras planas, no se examinan."
  p6: "Alternativas: que los resultados se deban a la naturaleza pública y jerárquica de RWS; que la maduración de proveedores explique los costos de configuración; que sea un problema de bienes públicos."
