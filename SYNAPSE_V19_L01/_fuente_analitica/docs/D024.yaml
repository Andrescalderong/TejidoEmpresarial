doc_id: D024
relevancia: "Periférico"
relevancia_just: "Revisión sistemática y bibliométrica (PRISMA) de 33 artículos sobre IoT en cadenas de suministro de alimentos, con trazabilidad, cadena de frío, agricultura de precisión, blockchain e IA; aporta barreras de adopción en contextos de bajos recursos y menciones de resiliencia, pero no trata sismos, recuperación productiva ni gemelos estructurales."
cluster_tema: "IoT en cadenas de suministro de alimentos"
metodo_tipo: "Revisión sistemática PRISMA con análisis bibliométrico de palabras clave y análisis de contenido"
tipo_recurso: "Artículo de revisión (journal peer-reviewed, acceso abierto)"
kw_inferidas: [cadena de suministro de alimentos inteligente, internet de las cosas, trazabilidad, cadena de frío, agricultura de precisión, blockchain, seguridad alimentaria, revisión sistemática, barreras de adopción, sostenibilidad]
c2:
  objetivo: >
    Examinar mediante una revisión sistemática y un análisis bibliométrico cómo el internet de las cosas (IoT) mejora la seguridad alimentaria, optimiza la eficiencia y promueve la sostenibilidad en las cadenas de suministro de alimentos, e identificar tendencias de investigación, avances tecnológicos, desafíos y oportunidades. El estudio clasifica las aplicaciones de IoT en producción, procesamiento, distribución y venta minorista, explora su integración con blockchain e inteligencia artificial y evalúa beneficios y barreras para orientar la adopción, con énfasis en soluciones económicas y accesibles.
  pregunta: >
    El artículo no formula preguntas de investigación numeradas. La pregunta implícita es cómo se usa el IoT en las cadenas de suministro de alimentos, con qué tecnologías complementarias, qué beneficios aporta y qué barreras (costos, privacidad, interoperabilidad, infraestructura) limitan su adopción, en especial en regiones en desarrollo.
  marco: >
    El marco es una revisión sistemática guiada por la declaración PRISMA 2020 con un análisis de contenido deductivo e inductivo, apoyado en una clasificación temática construida a partir de los artículos. Parte de la presión sobre la cadena de suministro de alimentos por el aumento de la población (9,7 mil millones hacia 2050 y un incremento de 70 % de la producción necesario según las fuentes de la FAO citadas), el desperdicio y la inocuidad, y concibe el IoT como tecnología habilitadora de monitoreo en tiempo real, trazabilidad y analítica predictiva, complementada con blockchain, IA y gemelos digitales. La orientación es descriptiva y de gestión tecnológica, sin teoría de adopción ni de resiliencia explícita.
  metodologia: >
    La búsqueda se hizo en Scopus, Google Scholar y ResearchGate con la cadena (IoT O 'Internet of Things' O 'machine-to-machine') Y alimentos Y (cadena de suministro O términos de optimización, analítica predictiva, simulación, gemelos digitales, modelado, herramientas de decisión, sistemas de apoyo a decisiones o tableros interactivos). El texto afirma que no hubo límites de tiempo, pero luego se aplicó un filtro de 2018 a 2024 y de idioma inglés. La búsqueda inicial arrojó 1497 registros, 1278 tras los filtros, 94 tras cribar títulos y resúmenes y 33 artículos incluidos tras la lectura completa (se excluyeron trabajos puramente técnicos sin contexto de cadena de suministro, revisiones y análisis económicos sin foco en operaciones). Se aplicó un análisis bibliométrico de palabras clave (mapa de árbol y red de co-palabras) y una clasificación de contenido con tablas de extracción. No se informan la concordancia entre revisores ni la evaluación de calidad de los estudios.
  resultados: >
    La distribución temporal de los 33 artículos muestra un pico de 11 en 2023, con 8 en 2022 y 7 en 2024, y un artículo en cada uno de 2014, 2017 y 2018; no hay artículos de 2015, 2016, 2019 y 2021. Las palabras clave más prominentes son 'sistemas de apoyo a decisiones' e 'internet de las cosas', junto con toma de decisiones, agricultura, IA y aprendizaje automático. La síntesis de contenido identifica grupos temáticos: integración de IoT en la gestión de la cadena de suministro, tecnologías avanzadas para la eficiencia, trazabilidad y seguridad (blockchain), calidad e inocuidad de los alimentos, optimización logística y papel de la Industria 4.0 en la agricultura inteligente. Entre los beneficios descritos figuran trazabilidad, gestión de la cadena de frío, control de calidad, analítica predictiva, estantes inteligentes y refrigeradores con sensores; se citan cifras externas (aumento de 20 % del rendimiento y reducción de hasta 30 % de agua y fertilizantes por agricultura de precisión según la FAO, reducción de 15 % del desperdicio global por monitoreo de cadena de frío según el Foro Económico Mundial, y 40 % menos costos de transmisión de datos con un sistema de partición dinámica) sin fuentes primarias claras. Las barreras principales son costos, privacidad y seguridad, interoperabilidad, infraestructura de conectividad y energía, y confianza del consumidor.
  discusion: >
    Los autores concluyen que el IoT mejora la eficiencia, la trazabilidad, la asignación de recursos y la sostenibilidad, y que reduce el desperdicio y fortalece la confianza del consumidor, pero que su adopción exige soluciones de bajo costo para países en desarrollo. Plantean como líneas de investigación el desarrollo de soluciones accesibles para pequeños productores (por ejemplo, dispositivos de monitoreo de cadena de frío), marcos integrados de IoT con blockchain e IA, gobernanza y cifrado de datos, estándares globales de interoperabilidad, estudios empíricos que cuantifiquen el impacto sobre seguridad alimentaria y soluciones adaptadas por región. Para la gestión y la política recomiendan infraestructura de internet y energía, capacitación, alianzas público-privadas y colaboración entre actores de la cadena.
  limitaciones: "No se presenta una sección de limitaciones. Implícitas: base de datos y fuentes no estándar (Google Scholar y ResearchGate), n pequeño (33 artículos), contradicción entre el filtro 2018-2024 y la presencia de artículos de 2014 y 2017, ausencia de evaluación de calidad y de concordancia, y cifras de beneficios tomadas de fuentes externas sin verificación."
  futuro: "Soluciones de IoT de bajo costo y fáciles de usar para pequeños productores, marcos integrados con blockchain, IA y aprendizaje automático, gobernanza de datos y encriptación, estándares globales de interoperabilidad, estudios empíricos que cuantifiquen el impacto sobre seguridad alimentaria y soluciones regionales."
c3:
  tesis: >
    El IoT, combinado con blockchain, IA y analítica, mejora la trazabilidad, el control de calidad, la gestión de la cadena de frío y la eficiencia de las cadenas de suministro de alimentos y reduce el desperdicio, y su adopción amplia depende de resolver costos, interoperabilidad, privacidad e infraestructura, sobre todo en regiones en desarrollo.
  antitesis: >
    La base empírica es una muestra de 33 artículos seleccionados con una cadena de búsqueda amplia y bases no estándar, sin evaluación de calidad y con inconsistencias de fechas (un filtro de 2018 a 2024 convive con artículos de 2014 y 2017 y con la afirmación de ausencia de límites temporales). Los beneficios cuantitativos más citados (20 % de rendimiento, 30 % de insumos, 15 % de desperdicio, 40 % de costos de transmisión) se atribuyen a organismos externos o a un sistema particular sin referencias primarias ni contexto, y las frases sobre resiliencia ('más resilientes') se afirman sin medición. Los hallazgos de co-palabras describen frecuencia de términos y no efectos. El título promete revisión de cadenas 'inteligentes', pero la síntesis combina tecnologías de naturaleza muy distinta (sensores, blockchain, IA) y el balance entre beneficios y costos no se cuantifica, de modo que la recomendación de adopción carece de análisis económico.
  sintesis: >
    La revisión ofrece un mapa de usos y de barreras del IoT en cadenas de alimentos y la señal de que el mayor vacío es la solución económica y utilizable en contextos de bajos recursos, que coincide con las condiciones de pequeñas empresas tras un desastre. Debe leerse como inventario cualitativo con cifras no verificadas. Para el corpus, la síntesis consiste en adoptar la lista de usos de bajo costo (monitoreo de cadena de frío, trazabilidad básica) como candidatos para la continuidad de empresas de alimentos tras un sismo, y evaluar con datos de pérdidas por cadena de frío interrumpida y costos de dispositivos si el retorno justifica su instalación previa, en lugar de asumir los beneficios citados.
  areas_grises:
    - "Consistencia del proceso de selección: el texto indica búsqueda sin límite de tiempo y un filtro 2018-2024, pero la distribución temporal incluye artículos de 2014 y 2017; se usan Scopus, Google Scholar y ResearchGate sin explicar cómo se reproducen búsquedas en estas dos últimas ni cómo se evitaron duplicados."
    - "Cifras externas de beneficio: los porcentajes de mejora de rendimiento, ahorro de insumos y reducción de desperdicio se atribuyen a la FAO y al Foro Económico Mundial sin referencia a un informe específico, y otros porcentajes (15 % de tiempo de entrega y 20 % de desperdicio) no se sustentan con estudios identificables."
    - "Alcance de 'resiliencia': el término aparece como atributo de las cadenas con IoT y blockchain, pero ningún indicador de resiliencia (tiempo de recuperación, continuidad ante interrupciones) se define o se mide en la revisión."
    - "Representatividad: 33 artículos tras cribar 1278 y la ausencia de años enteros (2015, 2016, 2019, 2021) sugieren que la muestra refleja la cadena de búsqueda más que la producción real, y no se discute el sesgo regional ni la calidad de los estudios."
  puntos_oscuros: >
    Llama la atención que el texto vincule el aumento de 2020 con la atención a la resiliencia durante la pandemia mientras no aparecen artículos en 2019 y 2021, y que se afirme que los sistemas de IoT hacen las cadenas 'más resilientes' sin analizar un solo caso de interrupción. Una explicación plausible es que la muestra es tan pequeña que cualquier año aislado puede variar por azar, y que la narrativa de resiliencia es una interpretación de los autores sobre aplicaciones cuyo objetivo declarado es la eficiencia y la trazabilidad. Además, el énfasis en costos como principal barrera y la propuesta de dispositivos baratos de cadena de frío sugieren que el valor práctico más cercano está en soluciones sencillas y no en plataformas integradas con blockchain e IA, que son las que más aparecen en la literatura. Por tanto, el mapa de la literatura puede estar sesgado hacia lo que se publica y no hacia lo que se adopta.
  ideas:
    - "Caso de negocio del monitoreo de cadena de frío como seguro de continuidad: estimar, para empresas de alimentos de una zona sísmica, la pérdida esperada de producto perecedero por interrupción de energía y transporte tras un sismo, y comparar con el costo de dispositivos de monitoreo y respaldo de bajo costo (sensores de temperatura con alerta, respaldo de energía), obteniendo un retorno esperado por escenario. Fundamento: la revisión señala el monitoreo barato de cadena de frío como oportunidad y los costos como barrera, sin cuantificar el caso de negocio. Verificabilidad: datos de pérdidas de empresas reales y cotizaciones de dispositivos. Utilidad: ofrece un criterio económico para que las pymes de alimentos decidan inversiones en continuidad."
    - "Auditoría de trazabilidad de las cifras de beneficio de IoT en alimentos: reunir los porcentajes de mejora citados en la literatura de IoT para cadenas de alimentos, rastrear su fuente primaria y clasificar la calidad de la evidencia (estudio controlado, caso, estimación de informe, afirmación sin fuente). Fundamento: el artículo reporta cifras de la FAO y del Foro Económico Mundial sin referencia específica. Verificabilidad: búsqueda de los informes originales y registro de discrepancias. Utilidad: permite incorporar al caso de negocio solo cifras con respaldo y reduce el riesgo de decisiones basadas en afirmaciones sin sustento."
  relaciones:
    - "Costos de implementación y falta de conectividad y energía (limitan) la adopción de IoT por pequeños productores y empresas: los autores los identifican como barreras principales en regiones en desarrollo, aunque no cuantifican su efecto."
    - "Estándares de interoperabilidad (condicionan) la escalabilidad de las soluciones de IoT en cadenas con muchos actores: la ausencia de marcos estándar impide la comunicación fluida entre dispositivos y limita la escala."
  robustez: [4, 3, 3, 3]
  valor: [4, "Ofrece un inventario de aplicaciones y de barreras del IoT en cadenas de alimentos, con énfasis útil en soluciones de bajo costo para pequeños productores y en la necesidad de estudios empíricos de impacto. Su valor para el corpus es contextual (cadena de frío y trazabilidad como posibles herramientas de continuidad); se reduce por la muestra de 33 artículos, las inconsistencias de selección, las cifras sin fuente y la ausencia de eventos de interrupción."]
  conexiones: []
socratica:
  p1: "'Cadena de suministro de alimentos inteligente' es una cadena con sensores, trazabilidad y analítica en tiempo real; 'resiliente' se usa sin definición operacional."
  p2: "Supone que 33 artículos representan el campo, que los beneficios citados de organismos externos son correctos y que la tecnología más avanzada es la más útil."
  p3: "La evidencia es una síntesis de contenido de 33 artículos y un mapa de co-palabras; no hay medición de impacto."
  p4: "Si es cierto, las empresas de alimentos deben priorizar monitoreo de cadena de frío y trazabilidad accesibles; si es falso, podrían invertir en tecnologías integradas con beneficios no verificados."
  p5: "No se examinan fracasos de implementación ni casos en que sistemas simples lograron el mismo resultado que sistemas con blockchain e IA."
  p6: "Alternativas: que la adopción dependa de la capacidad financiera de las empresas; que el costo de conectividad sea el factor limitante; que el beneficio provenga de la gestión y no de la tecnología."
