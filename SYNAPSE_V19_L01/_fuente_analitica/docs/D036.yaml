doc_id: D036
relevancia: "Periférico"
relevancia_just: "Revisión sistemática de tecnologías de comunicación (RIS, UAV, mmWave, mMIMO) para conectar entidades físicas con sus gemelos digitales e integrar detección y comunicación (ISAC) en sistemas de internet de las cosas. Aporta la capa de conectividad del gemelo digital, pero no trata sismos, empresas, cadenas de suministro ni recuperación económica."
cluster_tema: "Gemelo digital, ISAC y comunicaciones para internet de las cosas"
metodo_tipo: "Revisión sistemática de literatura (2019 a junio de 2025; 56 estudios incluidos de 2689 registros)"
tipo_recurso: "Artículo de revisión (journal peer-reviewed, acceso abierto)"
kw_inferidas: [gemelo digital, detección y comunicación integradas, internet de las cosas, superficie inteligente reconfigurable, UAV, onda milimétrica, MIMO masivo, latencia, edad de la información, eficiencia energética]
c2:
  objetivo: >
    Analizar, mediante una revisión sistemática, las tecnologías de comunicación que habilitan la conexión entre una entidad física y su representación digital en sistemas de internet de las cosas que integran gemelo digital y detección y comunicación integradas (ISAC, por sus siglas en inglés). El estudio se centra en superficies inteligentes reconfigurables (RIS), vehículos aéreos no tripulados (UAV), ondas milimétricas (mmWave) y MIMO masivo (mMIMO). Además, busca identificar la evolución y distribución de las publicaciones, comparar las tecnologías según métricas de desempeño y delimitar los desafíos abiertos.
  pregunta: >
    El artículo formula cuatro preguntas de investigación: cómo evolucionaron los tipos de publicación sobre gemelo digital e ISAC en internet de las cosas a lo largo de los años; qué tipos de publicación han usado los investigadores; qué bases de datos concentran más artículos; y cuáles son las tecnologías de comunicación esenciales que habilitan las conexiones físico-virtuales. Las tres primeras son bibliométricas y solo la cuarta es sustantiva, de modo que el diseño responde más a un mapeo cuantitativo que a una síntesis de efectos.
  marco: >
    El marco conceptual combina dos paradigmas: el gemelo digital, entendido como réplica virtual sincronizada de una entidad física que permite monitoreo en tiempo real, optimización y mantenimiento predictivo, y la detección y comunicación integradas, que comparten espectro y hardware para sensar y transmitir con el mismo sistema. Los autores sostienen que ambos paradigmas se complementan en internet de las cosas porque el gemelo reduce latencia y consumo energético, mientras que ISAC mejora la eficiencia espectral y la resolución de detección. El marco carece de una teoría explícita de sincronización gemelo-entidad; la taxonomía descansa en la clasificación por tecnología habilitadora y por tipo de esquema (basado en ISAC o basado en gemelo digital).
  metodologia: >
    Se realizó una revisión sistemática de artículos de revista, actas de congreso y trabajos de taller publicados entre 2019 y junio de 2025. Las fuentes fueron IEEE Xplore, ScienceDirect, ACM, SpringerLink y Google Scholar, indexadas mediante Web of Science o Scopus. La cadena de búsqueda arrojó 2689 registros; tras el cribado por criterios de inclusión y exclusión y la evaluación de calidad, se descartaron 14 artículos y se seleccionaron 56 estudios. Los autores extrajeron la tecnología de comunicación, el esquema (ISAC o gemelo digital) y las métricas de desempeño (eficiencia espectral, eficiencia energética, probabilidad de detección, latencia y edad de la información). La síntesis es descriptiva, con gráficos de barras y una tabla comparativa cualitativa de cinco tecnologías, sin metaanálisis, sin evaluación independiente por dos revisores descrita y sin protocolo registrado ni descripción de los criterios de calidad aplicados a los 14 artículos descartados, lo que limita la reproducibilidad del proceso de selección.
  resultados: >
    De los 56 estudios incluidos, el 71 % (40 estudios, por diferencia) se orientó a esquemas basados en ISAC y el 29 % (16 estudios) a esquemas basados en gemelo digital. La producción creció poco entre 2019 y 2021 y alcanzó un máximo de 16 artículos en junio de 2025. Por base de datos, IEEE Xplore concentró el 66 %, Springer el 18 %, ScienceDirect el 11 % y ACM el 5 %. En los esquemas con ISAC predominaron RIS, mMIMO y UAV; en los esquemas con gemelo digital, UAV representó el 43,7 % de los 16 estudios y RIS, CF-mMIMO, mmWave y redes heterogéneas el 12,5 % cada una, mientras mMIMO el 6,3 % y THz no tuvo estudios. La tabla comparativa califica RIS con costo computacional bajo y UAV y mMIMO con costos altos o muy altos. Entre las métricas, la eficiencia energética es la más frecuente, cinco estudios tratan la latencia, dos la edad de la información y tres la probabilidad de detección. Los autores concluyen que la integración de gemelo e ISAC reduce latencia y consumo energético y mejora la eficiencia espectral. Sin embargo, no reportan valores numéricos de latencia, energía o eficiencia espectral por tecnología, y la comparación entre RIS, UAV, mMIMO, mmWave y THz se presenta únicamente como calificaciones ordinales sin referencia de origen.
  discusion: >
    Los autores interpretan que la baja representación de las tecnologías de comunicación en los esquemas basados en gemelo digital evidencia una brecha, y que UAV domina allí porque mejora la confiabilidad del canal y la tasa de transferencia. Proponen seis líneas de desafíos: gestión de interferencia con integración de bandas de frecuencia y nuevos grados de libertad (RIS y UAV), conectividad masiva, traspaso de usuarios móviles con transferencia de aprendizaje entre gemelos, eficiencia energética con UAV verdes, seguridad con inteligencia artificial y privacidad con cadena de bloques. Concluyen que ninguna tecnología única satisface todos los requisitos y orientan el trabajo futuro hacia inteligencia artificial generativa con cadena de bloques, UAV-RIS híbridos con metaheurísticas y arquitecturas de hardware eficientes.
  limitaciones: "Declaradas: ninguna sección de limitaciones; solo se reconoce que el campo es incipiente y que hay pocos estudios. No declaradas: ausencia de protocolo registrado y de revisión por pares independientes en el cribado; incoherencia entre las fuentes (cinco bases y 'cuatro bases') y entre los conteos (71 % de 56 frente a las cifras de la Fig. 13); tabla comparativa sin cifras ni fuente por celda; inclusión de estudios de simulación sin evaluar su validez; sin análisis de calidad ni sesgo de publicación; foco exclusivo en capa física y de enlace, sin aplicaciones de dominio como infraestructura o desastres."
  futuro: "Explícito: inteligencia artificial generativa combinada con cadena de bloques para seguridad y privacidad; UAV-RIS híbridos con metaheurísticas para reducir interferencia; arquitecturas de hardware energéticamente eficientes. Implícito: evaluación experimental fuera de simulación y estándares de sincronización gemelo-entidad."
c3:
  tesis: >
    La integración de gemelo digital y detección y comunicación integradas es una vía necesaria para los servicios futuros de internet de las cosas porque el gemelo aporta baja latencia, eficiencia energética y mantenimiento predictivo, e ISAC aporta eficiencia espectral y precisión de detección; las tecnologías RIS, UAV, mmWave y mMIMO habilitan la conexión físico-virtual, y la escasez de estudios con gemelo en comunicaciones (29 %) revela un campo emergente con oportunidades de investigación.
  antitesis: >
    La evidencia que sustenta la tesis es débil. La revisión no mide el efecto del gemelo sobre la latencia ni sobre la energía; reproduce afirmaciones de estudios de simulación individuales. Las categorías de la tabla comparativa (bajo, alto, muy alto, extremadamente alto) carecen de cifras y de fuente por celda, y los conteos por tecnología son inconsistentes con el total de 40 estudios con ISAC. Además, se declara que la búsqueda se indexó en Web of Science o Scopus, pero se analizan cuatro bases y se citan cinco. El 66 % proveniente de IEEE Xplore sugiere sesgo de fuente. Por último, la conclusión de que la integración 'es esencial' no se deriva de comparaciones entre sistemas con y sin gemelo.
  sintesis: >
    La contribución sostenible del artículo es un mapa descriptivo de la producción reciente sobre comunicaciones para gemelos digitales en internet de las cosas, que muestra concentración en IEEE Xplore, predominio de UAV en esquemas con gemelo y de RIS y mMIMO en esquemas con ISAC, y una lista razonada de desafíos de capa de comunicación (interferencia, conectividad, traspaso, energía, seguridad y privacidad). Para el corpus del proyecto, su aporte reside en nombrar las condiciones de conectividad que limitan la sincronización del gemelo cuando la red se degrada, no en proporcionar evidencia cuantitativa de desempeño ni aplicación a infraestructura sísmica, de modo que su uso debe limitarse a especificar requisitos y a identificar riesgos de enlace.
  areas_grises:
    - "Consistencia de los conteos: el texto indica 56 estudios con 71 % en esquemas con ISAC (40 estudios) y 29 % con gemelo (16), pero la Fig. 13 cita seis y cuatro estudios para las tecnologías más frecuentes con ISAC y no se ve cómo suman 40; tampoco se aclara si un estudio puede contarse en varias tecnologías."
    - "Fuentes de la revisión: el texto declara cinco bases (IEEE Xplore, ScienceDirect, ACM, SpringerLink, Google Scholar) indexadas por Web of Science o Scopus, mientras la Fig. 12 reparte 56 estudios en cuatro bases; no se explica el tratamiento de Google Scholar ni la deduplicación entre bases."
    - "Tabla 4 de comparación: las calificaciones (bajo, alto, muy alto, extremadamente alto) de eficiencia espectral, eficiencia energética, detección, latencia, robustez, costo computacional y alcance no tienen cifras, referencia por celda ni criterio de umbral, de modo que la conclusión de que RIS es la opción viable de bajo costo es una síntesis cualitativa no verificable."
    - "Aplicabilidad a infraestructura y desastres: ninguna sección analiza condiciones de red degradada, interrupciones por desastres o sensores en estructuras; las recomendaciones de UAV y RIS no se contrastan con requisitos de emergencia, de modo que su traslado a gemelos para infraestructura sísmica es una extrapolación."
  puntos_oscuros: >
    Llama la atención que una revisión cuyo marco prioriza el gemelo digital concluya con una caracterización predominante de ISAC, dado que el 71 % de los estudios incluidos pertenece a esquemas basados en ISAC y solo 16 estudios tratan comunicaciones con gemelo, lo que cuestiona hasta qué punto el título refleja el contenido. También es notable que la afirmación central, según la cual el gemelo mejora la latencia y la eficiencia energética, se tome de la descripción de ventajas de cada paradigma y no de comparaciones entre sistemas con y sin gemelo. La redacción de la metodología mezcla la indexación en Web of Science o Scopus con cinco bases de datos y con una distribución final en cuatro, lo que dificulta la reproducibilidad. Además, el texto no contiene un análisis de riesgo de sesgo ni de heterogeneidad entre estudios de simulación, de modo que las cifras de porcentaje por tecnología describen la atención de los investigadores, no la eficacia de las tecnologías. Por último, la ausencia total de dominios de aplicación como infraestructura, energía o desastres impide saber si las conclusiones se sostienen fuera del entorno de redes inalámbricas.
  ideas:
    - "Requisitos de conectividad de un gemelo posterremoto: derivar de este estudio una matriz que asocie cada métrica (latencia, edad de la información, probabilidad de detección y eficiencia energética) con los requisitos de un gemelo de infraestructura durante y después de un sismo, y contrastarla con mediciones de redes en emergencias. Esto permitiría especificar qué tecnología (UAV como relevo, RIS para cobertura, redes heterogéneas) mantendría la sincronización cuando falle la red terrestre después de un sismo, y dimensionar el costo para una pequeña empresa."
    - "Edad de la información como indicador de resiliencia: usar la edad de la información, que solo dos estudios abordan, como indicador de calidad del gemelo en recuperación productiva, medido en horas desde el último dato válido de planta o de inventario. Se podría diseñar un piloto de seis semanas con sensores de bajo costo en una pyme manufacturera y registrar la degradación de la edad de la información durante cortes simulados, vinculando el resultado con decisiones de reanudación de producción. El diseño incluiría un grupo de comparación con registro manual de inventarios y mediría el tiempo hasta recuperar el nivel previo de producción, con lo cual el piloto aportaría la primera evidencia comparativa que esta revisión no ofrece."
  relaciones:
    - "Capa de comunicación (condiciona) la utilidad de los gemelos de infraestructura sísmica del corpus: gemelos como el de D034 dependen de la red para actualizarse (D034 reconoce dependencia de red) y esta revisión describe qué tecnologías podrían sostener la conectividad, aunque sin datos de desempeño ante un desastre."
    - "Gemelo digital con IoT (complementa) los estudios de resiliencia organizacional del corpus: los trabajos sobre adopción de gemelo e IoT y resiliencia (D029, D030) miden percepciones empresariales, mientras este artículo describe la capa técnica de comunicación que los sustenta, sin vínculo empírico entre ambos."
  robustez: [2, 2, 2, 3]
  valor: [4, "Ofrece un mapa descriptivo de tecnologías de comunicación para gemelos digitales en internet de las cosas y una lista ordenada de desafíos de conectividad, energía, seguridad y privacidad. Su valor para el corpus es periférico porque trata la capa de red sin dominio de aplicación en sismos, empresas o recuperación. Se reduce por la ausencia de evidencia cuantitativa comparativa, por inconsistencias en las fuentes y los conteos y por la falta de análisis de riesgo de sesgo; se conserva como referencia de requisitos de conectividad."]
  conexiones: []
socratica:
  p1: "'Gemelo digital' es una réplica virtual de una entidad física sincronizada mediante comunicación; 'ISAC' es el uso conjunto del espectro y del hardware para sensar y comunicar; 'conexión físico-virtual' es el enlace de comunicación entre ambas."
  p2: "Supone que las ventajas reportadas en simulaciones individuales se mantienen en sistemas reales, que la presencia de una tecnología en más artículos indica mayor madurez y que la combinación de gemelo e ISAC es complementaria y no redundante."
  p3: "La evidencia es un conteo de 56 estudios de 2689 registros, gráficos de distribución por base y por tecnología y una tabla cualitativa de cinco tecnologías, sin cifras de desempeño comparables."
  p4: "Si es cierto, los diseñadores pueden priorizar UAV, RIS y mMIMO para conectar gemelos; si es falso, pueden invertir en tecnologías cuya ventaja proviene de supuestos de simulación y no de despliegues reales."
  p5: "No se examinan despliegues reales, estudios negativos, costos de infraestructura, redes degradadas por desastres ni aplicaciones industriales o de infraestructura fuera de las telecomunicaciones."
  p6: "Alternativas: que la frecuencia de publicación refleje modas de investigación y no desempeño; que la ventaja de latencia se deba a computación en el borde y no al gemelo; que la comparación entre tecnologías dependa del escenario."
