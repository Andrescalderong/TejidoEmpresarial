doc_id: D097
relevancia: "Ajeno"
relevancia_just: "Estudio de biología molecular e inmunología de Leishmania (Viannia) panamensis sobre los genes hasp (PCR, clonación, secuenciación, ELISA y Western blot); no trata gemelos digitales, IoT, transferencia tecnológica ni recuperación empresarial."
cluster_tema: "Biología molecular: genes y proteínas HASP en Leishmania (Viannia) panamensis"
metodo_tipo: "Estudio experimental de laboratorio (PCR, clonación, secuenciación, ELISA y Western blot)"
tipo_recurso: "Artículo científico (investigación original, journal peer-reviewed)"
kw_inferidas: [Leishmania, Viannia, hasp, pseudogén, PCR, clonación, Western blot, ELISA, proteínas de superficie, leishmaniasis]
c2:
  objetivo: >
    Caracterizar la familia de proteínas hidrofílicas de superficie (HASP) en Leishmania (Viannia) panamensis mediante la búsqueda de genes ortólogos de hasp con cebadores diseñados para L. (L.) major, su secuenciación y análisis bioinformático, y la detección de anticuerpos contra proteínas HASP recombinantes en sueros de pacientes con leishmaniasis de zonas endémicas de Colombia, para determinar si la especie conserva una versión funcional de esta familia, en el marco de la divergencia evolutiva entre los subgéneros Viannia y Leishmania y del potencial diagnóstico y vacunal de estas proteínas.
  pregunta: >
    [INFERIDA] ¿Tiene L. (V.) panamensis genes hasp funcionales como los de L. (L.) major, y producen sus infecciones anticuerpos contra las proteínas HASP?
  marco: >
    El marco es la genómica comparada de los subgéneros Leishmania y Viannia, que difieren en manifestaciones clínicas, crecimiento in vitro, genética y expresión de proteínas. Las proteínas HASP (HASPA1, HASPA2, HASPB1 y HASPB2) de L. (L.) major se expresan en promastigotes metacíclicos y amastigotes, son codificadas por haspa (222 pb) y haspb (534 pb), y HASPB se ha usado como blanco diagnóstico y candidata vacunal. La hipótesis es que L. (V.) braziliensis y otras especies de Viannia han perdido o inactivado genes (pseudogenes) presentes en las especies del Viejo Mundo, lo que se apoya en la comparación de genomas de L. major, L. infantum y L. braziliensis. No se formula un modelo funcional de la pérdida.
  metodologia: >
    Se utilizó ADN de promastigotes de cuatro cepas de L. (V.) panamensis (una de referencia y tres colombianas) y de dos cepas de L. (L.) major, cultivados en M199 con 10 % de suero fetal bovino a 26 grados. Se purificó ADN con fenol-cloroformo y ARN de promastigotes en fase logarítmica (día 3) y estacionaria (día 6) de la cepa de referencia, con síntesis de ADNc. Se amplificaron los genes hasp con un par de cebadores diseñados para haspb de L. (L.) major (BamHI y HindIII) en 30 ciclos, con productos clonados en pGEM-T-Easy, secuenciados en el University College London y analizados con BLAST-n frente a NCBI y geneDB. Se expresaron rHASPA y rHASPB de L. major en E. coli (vector pMAL) y se purificaron en columna de amilosa. Los anticuerpos se buscaron con FAST-ELISA frente al péptido de la unidad repetitiva de HASPB1 de L. donovani (8 sueros de leishmaniasis visceral, 8 cutánea, 6 mucocutánea y controles Montenegro positivos y negativos, tres cada uno) y con Western blot (tres sueros de visceral, tres de cutánea, uno de leishmaniasis cutánea difusa por L. amazonensis y sueros de ratones BALB/c infectados). Se aplicó consentimiento informado y aval del comité de ética para animales.
  resultados: >
    En L. (L.) major se amplificaron fragmentos de 534 y 222 pb con 100 % de identidad con geneDB. En las cuatro cepas de L. (V.) panamensis se amplificaron fragmentos de unos 400 y 850 pb, sin identidad significativa con secuencias hasp ni repeticiones características (datos no mostrados). No hubo amplificación del ADNc de fase logarítmica, pero el de fase estacionaria produjo un fragmento de 450 pb con 60 % de identidad con haspa de L. major; su secuencia deducida muestra seis bloques repetidos de nueve aminoácidos (GARCRQLEA), con sustituciones en dos bloques y un codón de parada tras cada bloque, lo que sugiere un pseudogén. En el ELISA, solo los sueros de pacientes con leishmaniasis visceral superaron el punto de corte (0,027 de densidad óptica); los de cutánea, mucocutánea y controles no. En Western blot, los sueros de visceral reconocieron rHASPA y rHASPB (el primero solo rHASPB), pero no los de cutánea por L. panamensis, el de leishmaniasis difusa ni los de ratones infectados con L. panamensis o L. amazonensis; el suero de ratón con L. major reconoció rHASPB y, más débilmente, rHASPA. Southern blot y comparación con el genoma de L. braziliensis no detectaron hasp (datos no mostrados).
  discusion: >
    Los autores interpretan que los resultados sugieren la pérdida de los genes hasp funcionales en L. (V.) panamensis, con un pseudogén transcrito en el estadio infeccioso, y que esto refuerza la divergencia entre Leishmania del Nuevo y el Viejo Mundo, pues los genomas de L. braziliensis presentan más pseudogenes (161 frente a 97 en L. major y 41 en L. infantum). Explican la ausencia de anticuerpos en pacientes cutáneos como apoyo a la falta de proteínas funcionales y la presencia en visceral por L. infantum chagasi. Admiten que no detectaron la proteína nativa en L. amazonensis, que sí tiene un gen ortólogo, y lo atribuyen a modificaciones postraduccionales o a mecanismos reguladores desconocidos. Proponen que la pérdida de hasp podría implicar diferencias en la respuesta inmune del huésped. Dejan sin discutir que los cebadores se diseñaron para L. major y la divergencia puede impedir la amplificación, y que varios resultados clave 'no se muestran'.
  limitaciones: "No declaradas formalmente. Los autores reconocen que la ausencia de reconocimiento en L. amazonensis, que tiene el gen, fue inesperada y que las modificaciones postraduccionales o mecanismos desconocidos podrían explicarlo."
  futuro: "Comprobar la hipótesis de que la ausencia del locus en Viannia modifica la respuesta inmune del huésped frente a L. major; el texto no formula otros diseños concretos."
c3:
  tesis: >
    L. (V.) panamensis carece de genes hasp funcionales (solo conserva un pseudogén haspa transcrito con 60 % de identidad), lo que se refleja en la ausencia de anticuerpos contra las proteínas HASP en pacientes con leishmaniasis cutánea y apoya la divergencia entre los subgéneros Viannia y Leishmania.
  antitesis: >
    La conclusión de ausencia se apoya en evidencia negativa obtenida con cebadores heterólogos de L. major: la falta de amplificación o de identidad puede reflejar divergencia de secuencia, no pérdida del gen. Los datos que sustentarían el argumento (secuencias de los productos de 400 y 850 pb, Southern blot, ELISA de recombinantes, 95 % de identidad en L. amazonensis) 'no se presentan', de modo que no pueden evaluarse. La ausencia de anticuerpos en pacientes cutáneos también se observó en un suero de L. amazonensis, que tiene el gen, por lo que la falta de respuesta no distingue ausencia del gen de falta de inmunogenicidad. El ELISA emplea un péptido de L. donovani, con punto de corte de 0,027 de densidad óptica (muy bajo) y 3 a 8 sueros por grupo, sin curvas de dilución ni controles de sensibilidad. Una secuencia con codones de parada puede provenir de un artefacto de PCR.
  sintesis: >
    El estudio aporta indicios convergentes (secuencia truncada, falta de anticuerpos, ausencia en el genoma de L. braziliensis) de que la familia HASP está inactivada en Viannia, y documenta un posible pseudogén transcrito. Sin embargo, el diseño no puede afirmar ausencia funcional. La síntesis propone confirmar con secuenciación genómica de las cepas, qPCR con cebadores diseñados para Viannia, proteómica de lisados nativos y ensayos con sueros de más pacientes, y publicar los datos suplementarios. Para el corpus, el documento es ajeno al dominio de tecnología y recuperación productiva tras eventos extremos, y se usa solo como control negativo temático en los análisis de similitud y de sensibilidad.
  areas_grises:
    - "Cebadores heterólogos: los cebadores se diseñaron con la secuencia haspb de L. (L.) major y se usan para buscar un gen en otro subgénero; la ausencia de amplificación del gen esperado o de identidad de los productos de 400 y 850 pb no distingue entre pérdida del gen y divergencia que impide el alineamiento, y no se usan cebadores degenerados ni se secuencia el genoma."
    - "Datos no mostrados: las secuencias de los productos de 400 y 850 pb, el Southern blot en L. panamensis y L. braziliensis, la identidad de 95 % en L. amazonensis y los resultados del ELISA con proteínas recombinantes se citan como 'no se muestran', lo que impide verificar los pilares de la conclusión y contradice la rastreabilidad."
    - "Sensibilidad y controles de los ensayos serológicos: el ELISA usa un péptido de L. donovani con punto de corte de 0,027 de densidad óptica, sin curvas ni especificidad, y solo 3 a 8 sueros por grupo; la ausencia de reactividad en L. amazonensis, que tiene el gen, indica que la prueba no discrimina la presencia del gen, y las diluciones de suero difieren entre métodos (1:100) y la figura 4 (1:50)."
    - "Interpretación del pseudogén: la secuencia de 450 pb con codones de parada tras cada bloque se interpreta como pseudogén, pero no se descarta error de amplificación, de clonación (un solo clon) ni de secuenciación, y no se reporta número de clones ni lectura bidireccional."
  puntos_oscuros: >
    El texto afirma al mismo tiempo que existe transcripción del 450 pb en el estadio infeccioso y que el gen se convirtió en pseudogén por presión selectiva fuerte. Si el pseudogén se transcribe, su expresión sugiere cierta regulación y no necesariamente inactividad evolutiva; la presión selectiva 'fuerte' invocada no se mide (no hay cálculo de dN/dS). La explicación de la falta de anticuerpos en pacientes con L. panamensis por la ausencia de proteína contradice el resultado en L. amazonensis, en el que se esperaba proteína y no hubo anticuerpos ni proteína nativa; entonces la falta de anticuerpos no evidencia ausencia de gen. Además, la comparación de 161, 97 y 41 pseudogenes entre tres especies proviene de otra referencia y no prueba que hasp sea un pseudogén en L. panamensis; la inferencia de especie a partir de L. braziliensis asume que ambas comparten el mismo evento de pérdida. Por último, la afirmación de que la pérdida implica diferencias en la respuesta inmune se plantea como hipótesis sin evidencia, y el uso de HASPB como candidato vacunal y diagnóstico se menciona sin relacionarlo con los resultados.
  ideas:
    - "Confirmación genómica y transcriptómica de la pérdida de hasp: secuenciar el genoma de las cepas colombianas de L. (V.) panamensis o analizar lecturas de genomas ya publicados, buscar el locus ortólogo en la sintenia con L. major y L. braziliensis, y cuantificar la expresión del pseudogén por qPCR y RNA-seq en promastigotes de fases logarítmica y estacionaria y en amastigotes. Fundamento: la conclusión se basa en PCR con cebadores heterólogos y datos no mostrados. Verificabilidad: ensamblaje de genomas con cobertura suficiente y depósito de secuencias en bancos públicos. Utilidad: define si la familia HASP puede usarse como marcador diferencial entre subgéneros y si una vacuna basada en HASPB tendría cobertura frente a especies de Viannia."
    - "Evaluación serológica con sensibilidad y especificidad conocidas: validar el ELISA con curvas de dilución y un panel mayor de sueros (al menos 30 por forma clínica) de pacientes con L. infantum chagasi, L. panamensis, L. braziliensis y L. amazonensis y controles sanos, con proteínas recombinantes y péptidos de las especies, y calcular curvas ROC. Fundamento: el estudio usa 3 a 8 sueros por grupo y un punto de corte de 0,027 sin validación. Verificabilidad: cálculo de muestra para sensibilidad del 90 % y análisis ciego. Utilidad: permite determinar si la respuesta a HASPB sirve para diferenciar leishmaniasis visceral de cutánea y evita conclusiones biológicas basadas en una prueba sin desempeño conocido."
  relaciones:
    - "Pérdida o inactivación de hasp en Viannia (se asocia con) ausencia de anticuerpos contra rHASPA y rHASPB en pacientes con leishmaniasis cutánea por L. (V.) panamensis: asociación observada en tres sueros de pacientes, con la excepción no explicada de L. amazonensis."
    - "Mayor número de pseudogenes en L. braziliensis (161 frente a 97 y 41) (apoya) la hipótesis de pérdida o silenciamiento génico en Viannia, según una referencia externa."
  robustez: [4, 3, 3, 3]
  valor: [1, "Aporta evidencia preliminar de la inactivación de la familia HASP en L. (V.) panamensis y un pseudogén transcrito de 450 pb. Está fuera del dominio del corpus de tecnología y recuperación empresarial; su valor para el análisis es de control negativo temático y como ejemplo de conclusión de ausencia basada en métodos con sensibilidad no demostrada."]
  conexiones: []
socratica:
  p1: "Define pérdida de la familia HASP como ausencia de amplificación de un gen funcional con cebadores de L. major, presencia de un pseudogén de 60 % de identidad y falta de anticuerpos en pacientes cutáneos."
  p2: "Supone que los cebadores de L. major amplificarían un ortólogo en Viannia, que la falta de anticuerpos refleja ausencia de proteína y que un solo clon de 450 pb representa el locus."
  p3: "La evidencia es experimental con cuatro cepas, un fragmento de 450 pb con 60 % de identidad y sueros de 3 a 8 pacientes por grupo; varios resultados no se muestran."
  p4: "Si es cierto, los antígenos HASP no sirven en diagnóstico ni vacunas para especies de Viannia; si es falso, se descartarían candidatos útiles por un resultado negativo de baja sensibilidad."
  p5: "No se examinan cebadores diseñados para Viannia, lisados nativos de L. panamensis ni más cepas de campo, que podrían contradecir la conclusión."
  p6: "Hipótesis rivales: el gen existe con divergencia que impide la amplificación; la ausencia de anticuerpos refleja baja inmunogenicidad de la prueba usada."
