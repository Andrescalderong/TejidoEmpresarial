doc_id: D052
relevancia: "Adyacente"
relevancia_just: "Estudio por encuesta (n = 313 profesionales de la construcción, PLS-SEM y análisis de condición necesaria) sobre cómo la tecnología de gemelo digital se asocia con la eficiencia de la gestión de operaciones mediante transparencia de información y toma de decisiones colaborativa, con la preparación digital como moderadora. Aporta mecanismos organizacionales del valor del gemelo digital, pero no trata sismos, resiliencia ni recuperación, y su evidencia es de percepción."
cluster_tema: "Gemelo digital y eficiencia operativa en construcción (encuesta PLS-SEM)"
metodo_tipo: "Estudio cuantitativo transversal por encuesta con PLS-SEM (SmartPLS 4) y análisis de condición necesaria (NCA)"
tipo_recurso: "Artículo científico (journal peer-reviewed)"
kw_inferidas: [gemelo digital, eficiencia de gestión de operaciones, transparencia de la información, decisión colaborativa, preparación digital, construcción, teoría de orquestación de recursos, PLS-SEM, análisis de condición necesaria]
c2:
  objetivo: >
    Examinar cómo la tecnología de gemelo digital (DTT), entendida como réplica virtual de sistemas físicos habilitada por datos en tiempo real, influye en la eficiencia de la gestión de operaciones (OME) en la construcción, con base en la teoría de orquestación de recursos (ROT). El estudio busca identificar los mecanismos organizacionales mediante los cuales la DTT contribuye a la OME, en particular la transparencia de la información (IT) y la toma de decisiones colaborativa (CDM), y examinar la preparación digital organizacional (ODR) como condición contextual que modera la relación DTT–OME.
  pregunta: >
    El estudio plantea hipótesis sobre efectos directos de la DTT sobre IT, CDM y OME, sobre efectos de IT y CDM sobre OME, sobre la mediación de IT y CDM entre DTT y OME, y sobre la moderación positiva de la ODR en la relación DTT–OME. La pregunta implícita es por qué y bajo qué condiciones la DTT mejora la eficiencia operativa en proyectos de construcción con estructuras temporales y múltiples actores.
  marco: >
    El marco es la teoría de orquestación de recursos, según la cual el valor de un recurso tecnológico proviene de estructurar, agrupar y aprovechar recursos complementarios, y se complementa con la teoría de capacidad de absorción para justificar la moderación por preparación digital. Se postula que la DTT, al sincronizar información de manera continua, aumenta la transparencia y la coordinación de decisiones, que a su vez mejoran la eficiencia operativa, y que mayor preparación digital refuerza ese efecto. El análisis de condición necesaria se justifica para evaluar si niveles mínimos de cada factor son requisitos de una eficiencia alta. El contexto de construcción se caracteriza por organizaciones temporales de proyecto, obras dispersas, múltiples actores independientes y sistemas digitales heterogéneos, rasgos que los autores usan para sostener que la tecnología por sí sola no basta.
  metodologia: >
    El diseño es una encuesta a 313 profesionales de la construcción, con cuestionario traducido al chino y retrotraducido por expertos bilingües, validado por académicos y profesionales del sector. Las escalas miden DTT, IT, CDM, ODR y OME. El análisis usó PLS-SEM en SmartPLS 4 con 5000 remuestras para pruebas de significancia, evaluación de colinealidad (VIF menor que 3,3), tamaños de efecto, mediación con la metodología de Nitzl y colaboradores y moderación, además de NCA con líneas de techo. No se incluyeron variables de control (tamaño de empresa, complejidad del proyecto, tipo de proyecto, antigüedad del encuestado, experiencia previa con gemelos digitales), aunque se recolectaron datos demográficos. El texto reconoce que varios ítems de OME refieren a mejoras operativas derivadas de tecnologías digitales. La validez de los instrumentos se evaluó con fiabilidad compuesta, varianza extraída promedio y validez discriminante, y se reportan cargas de los ítems, pero el texto leído no detalla el procedimiento de muestreo, la tasa de respuesta ni el control de sesgo de método común.
  resultados: >
    La DTT tuvo efectos positivos sobre IT, CDM y OME. Las rutas reportadas son: DTT a OME 0,222 (t = 6,602), IT a OME cercano a 0,81, DTT a IT cercano a 0,93, DTT a CDM cercano a 0,77 y CDM a OME 0,263, con un R2 de OME de 0,911. Los efectos indirectos fueron 0,749 (t = 9,805) vía IT y 0,202 (t = 3,321) vía CDM, y el texto reporta un efecto total de 0,769, con VAF de 97,4 % para IT y 26,3 % para CDM. La moderación por ODR fue significativa y negativa (aproximadamente -0,056; t = 3,203; p = 0,002), contraria a la hipótesis. El NCA identificó condiciones necesarias con tamaños de efecto de 0,395 para IT, 0,363 para CDM, 0,274 para DTT y 0,231 para ODR, y a IT como el requisito más fuerte. Los autores señalan que la magnitud de IT a OME es mayor de lo habitual y debe interpretarse con cautela, y que un R2 como el observado es raro en investigación del comportamiento. Reportan además una colinealidad aceptable, y describen la capacidad de la DTT de anticipar desviaciones de cronograma, fallas de equipos, faltantes de materiales y riesgos de seguridad antes de que afecten el desempeño.
  discusion: >
    Los autores sostienen que la DTT mejora la eficiencia operativa sobre todo a través de la transparencia de la información, con la decisión colaborativa como mecanismo complementario, y que el efecto negativo de la preparación digital sugiere rendimientos marginales decrecientes de la DTT cuando las capacidades digitales de base ya son altas, por superposición de capacidades, complejidad de integración y rutinas establecidas. Plantean implicaciones teóricas para la orquestación de recursos y prácticas para priorizar la transparencia y la coordinación al implementar gemelos digitales en proyectos fragmentados. Reconocen que la moderación contraria a la hipótesis y la magnitud de algunos coeficientes exigen precaución, y que la preparación digital no debe tratarse como requisito uniformemente favorable para obtener valor del gemelo.
  limitaciones: "Declaradas: ausencia de variables de control (tamaño de empresa, complejidad y tipo de proyecto, antigüedad del encuestado y experiencia previa con DTT); algunos ítems de OME aluden a mejoras por tecnologías digitales, lo que puede inflar la asociación; el tamaño del coeficiente IT a OME debe leerse con cautela. No declaradas: diseño transversal y de un solo informante, con riesgo de sesgo de método común; un R2 de 0,911 y coeficientes superiores a 0,9 sugieren redundancia conceptual entre constructos; la reconciliación del efecto total (0,769) con la suma de efectos directo e indirectos (0,222 + 0,749 + 0,202 = 1,173) no se explica, y los VAF suman más de 100 %; muestra de procedencia y método de muestreo no descritos con claridad en el texto leído; solo percepciones, sin datos de desempeño observado."
  futuro: "Explícito: incorporar controles organizacionales y de proyecto (tamaño de empresa, complejidad, tipo, antigüedad del encuestado y experiencia previa con gemelos digitales) para evaluar la robustez. Implícito: diseños longitudinales, datos objetivos de desempeño y análisis de la moderación negativa de la preparación digital."
c3:
  tesis: >
    La tecnología de gemelo digital mejora la eficiencia de la gestión de operaciones en la construcción principalmente porque aumenta la transparencia de la información (efecto indirecto de 0,749) y, en menor medida, porque favorece la decisión colaborativa (0,202); la transparencia es además la condición necesaria más fuerte, y la preparación digital modera el efecto de forma negativa, lo que indica rendimientos decrecientes cuando la base digital ya es alta.
  antitesis: >
    La evidencia estadística tiene problemas de consistencia y de validez. Un R2 de 0,911 para la eficiencia percibida y rutas de 0,81 a 0,93 sugieren que los constructos no son empíricamente distintos o que hay sesgo de método común. El efecto total reportado (0,769) es menor que la suma de los efectos directo e indirectos (1,173) y los VAF suman más de 100 %, lo que no es coherente. Los propios autores admiten que ítems de OME refieren a mejoras derivadas de tecnología digital, de modo que la asociación con DTT se mide parcialmente por construcción. No hay controles, los datos son de un solo informante en un solo momento, y la moderación negativa se explica a posteriori, contraria a la hipótesis, sin prueba alternativa.
  sintesis: >
    La contribución sostenible es un modelo plausible, con datos de percepción de profesionales, de que el valor del gemelo digital se canaliza por visibilidad y coordinación, y una advertencia sobre rendimientos decrecientes. Las magnitudes no son confiables como estimaciones de efecto. Para el corpus, importa entonces porque converge con D029 y D030 en un patrón de transparencia y coordinación como mediadores, y porque la moderación negativa es una hipótesis para estudiar en pymes con baja madurez digital, donde se esperaría el efecto contrario, y además como advertencia metodológica sobre el uso de medidas de percepción con constructos altamente correlacionados en estudios de adopción tecnológica.
  areas_grises:
    - "Consistencia de la mediación: el texto reporta efecto directo de 0,222, indirectos de 0,749 y 0,202, y un efecto total de 0,769 con VAF de 97,4 % para IT y 26,3 % para CDM; la suma de los efectos es 1,173 y los porcentajes suman 123,7 %, resultados incompatibles con la descomposición habitual del efecto total."
    - "Redundancia de constructos: un R2 de 0,911 para OME y coeficientes de 0,81 a 0,93 entre constructos de percepción sugieren falta de validez discriminante o sesgo de método común; los autores señalan que el coeficiente es mayor al habitual, pero lo explican por la cercanía conceptual sin aplicar pruebas de sesgo."
    - "Medición de OME: algunos ítems de la eficiencia operativa se refieren a mejoras derivadas de tecnologías digitales, lo que incorpora la variable explicativa en la dependiente; el efecto de la DTT sobre OME queda sobreestimado por diseño."
    - "Muestra y contexto: la encuesta se aplicó a 313 profesionales con cuestionario traducido al chino, pero el método de muestreo, la tasa de respuesta, el tipo de empresas y el estado de adopción de DTT no se describen con detalle, y no hay controles; la generalización a otros países o a pymes es incierta."
  puntos_oscuros: >
    Llama la atención que el artículo reporte un efecto total de 0,769 con efectos indirectos que suman 0,951 y un efecto directo de 0,222, y que calcule VAF superiores a 100 % en conjunto sin comentar la inconsistencia. También es notable que se interprete una moderación negativa de la preparación digital como rendimientos decrecientes cuando el coeficiente es pequeño y no hay prueba alternativa. El R2 de 0,911 se presenta como poder explicativo valioso, aunque los propios autores reconocen que es inusual en ciencias del comportamiento. La conclusión de que el gemelo digital mejora la eficiencia se apoya en una variable de eficiencia con ítems que aluden a la tecnología digital. Además, la ausencia de controles y de datos objetivos limita la interpretación causal, y las implicaciones prácticas se formulan como prescripciones. Por último, el artículo no discute riesgos de implementación ni casos de fracaso del gemelo digital, y no examina si la transparencia de información es un efecto del gemelo o de prácticas previas de gestión de datos.
  ideas:
    - "Replicación con datos objetivos y pymes: medir la eficiencia operativa con indicadores observados (desviaciones de cronograma, retrabajos, costos) en proyectos con y sin gemelo digital, y estimar el efecto de la transparencia de información con un diseño de diferencias entre proyectos, con controles de tamaño, complejidad y experiencia, y con medición de la transparencia como número de actores con acceso al estado del proyecto y frecuencia de actualización de ese estado. El resultado permitiría contrastar los coeficientes percibidos de 0,81 a 0,93 con efectos observados, y evaluar si la moderación negativa de la preparación digital aparece también con datos objetivos en pequeñas constructoras."
    - "Transparencia de información como requisito de recuperación: trasladar la idea de condición necesaria de la transparencia al caso de reanudación de obras y servicios tras un sismo, con un NCA aplicado a datos de empresas que reabrieron en plazos distintos, donde la transparencia sea el acceso a información del estado de daño de edificios y vías. Se podría establecer un umbral mínimo de transparencia necesario para alcanzar reaperturas rápidas, y probar si un gemelo ligero lo suministra a costo asequible, con la comparación de dos grupos de empresas y la estimación del tiempo de reapertura asociado a cada nivel, y con registro del costo de generar y mantener esa información."
  relaciones:
    - "Mediación por transparencia y coordinación (converge con) D029 y D030: D029 y D030 estiman efectos de gemelo digital y de IoT sobre resiliencia y desempeño operativo con encuestas de percepción, y D052 aporta el mecanismo de transparencia y decisión colaborativa con un diseño similar y las mismas limitaciones."
    - "Efectos sobre desempeño con PLS-SEM (se relaciona con) D020: D020 estima con PLS-SEM la relación entre IoT y resiliencia sísmica en 141 casos; ambos usan percepciones y reportan coeficientes altos."
  robustez: [2, 2, 1, 2]
  valor: [4, "Ofrece un modelo de mecanismos del valor del gemelo digital (transparencia y decisión colaborativa) con una advertencia sobre moderación negativa de la preparación digital y un análisis de condición necesaria. Su valor para el corpus es adyacente-bajo: la evidencia es de percepción en construcción, con inconsistencias en la descomposición del efecto, ausencia de controles y constructos redundantes, y sin relación con sismos o recuperación."]
  conexiones: []
socratica:
  p1: "'Transparencia de la información' es la visibilidad de datos entre actores del proyecto; 'preparación digital' es la capacidad organizacional de aprovechar tecnología digital; 'condición necesaria' es un nivel mínimo sin el cual no se alcanza un resultado alto."
  p2: "Supone que las percepciones de un informante reflejan el desempeño real, que los constructos son distinguibles y que los ítems de eficiencia no incorporan la tecnología."
  p3: "La evidencia es una encuesta de 313 profesionales con coeficientes de 0,22 a 0,93, R2 de 0,911, mediación con inconsistencias y NCA con tamaños de efecto de 0,23 a 0,40."
  p4: "Si es cierto, las empresas pueden priorizar la transparencia y la coordinación al implantar gemelos; si es falso, pueden esperar efectos mucho menores o inexistentes con datos objetivos."
  p5: "No se examinan datos observados de desempeño, controles, otros países, proyectos sin gemelo ni fracasos de implementación."
  p6: "Alternativas: que el sesgo de método común explique los coeficientes; que la preparación digital capture la misma varianza que la DTT; que la eficiencia dependa de la gestión y no de la tecnología."
