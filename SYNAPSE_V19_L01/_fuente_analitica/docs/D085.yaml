doc_id: D085
relevancia: "Periférico"
relevancia_just: "Estudio de factores de éxito de gemelos digitales en proyectos de construcción (oficina, obra e interfaz oficina-obra) con encuesta a 122 profesionales; trata gemelos digitales e IoT en obra, pero no aborda sismos, continuidad empresarial ni recuperación productiva."
cluster_tema: "Gemelos digitales en gestión de proyectos de construcción"
metodo_tipo: "Revisión de literatura (30 variables) y encuesta Likert con CFA y PLS-SEM"
tipo_recurso: "Artículo científico (investigación empírica, journal peer-reviewed)"
kw_inferidas: [gemelo digital, industria de la construcción, ciclo de vida del proyecto, factores de éxito, PLS-SEM, análisis factorial confirmatorio, interfaz oficina-obra, BIM, IoT, comunicación]
c2:
  objetivo: >
    Identificar los factores críticos para implementar con éxito gemelos digitales (DT) en el monitoreo y el control de proyectos de construcción a lo largo de su ciclo de vida, agrupados en tres dominios: factores de la oficina (ORF), factores de la obra (SRF) y factores de la interfaz oficina-obra (OSRF). El estudio busca además estimar el peso relativo de cada dominio sobre la implementación exitosa del gemelo digital y ofrecer orientación práctica a gerentes de proyecto, responsables de política pública e investigadores del sector.
  pregunta: >
    [INFERIDA] ¿Qué factores de la oficina, de la obra y de la interfaz entre ambas explican la implementación exitosa de gemelos digitales en proyectos de construcción, y cuál de los tres grupos contribuye más a ese resultado según la percepción de profesionales del sector?
  marco: >
    El marco parte de la definición de gemelo digital como réplica virtual de un activo físico que se actualiza con datos de sensores, redes de comunicación y modelos tridimensionales, con intercambio bidireccional en tiempo real, y lo contrasta con el modelado de información de construcción (BIM), al que el texto atribuye ausencia de integración ciberfísica dinámica. Revisa las tecnologías habilitantes (Internet de las cosas, computación en la nube, inteligencia artificial, realidad extendida) y la literatura de aplicaciones en oficina, obra e interfaz. De allí extrae 30 variables, diez por paquete, que se someten a un modelo de ecuaciones estructurales por mínimos cuadrados parciales. No formula una teoría propia de adopción tecnológica; el texto declara una brecha de investigación sobre factores esenciales de aplicación.
  metodologia: >
    El diseño combina revisión de literatura y encuesta transversal. Los autores revisaron la literatura de gemelos digitales en construcción, extrajeron 30 variables y las organizaron en tres paquetes de diez indicadores (ORF, SRF, OSRF). Elaboraron un cuestionario con escala Likert de cinco puntos en que los participantes expresan su nivel de acuerdo con cada variable y con indicadores de implementación exitosa del gemelo digital. Distribuyeron 200 cuestionarios por vía electrónica mediante muestreo intencional y recibieron 122 respuestas completas (tasa de respuesta de 61 %). Los participantes son gerentes de proyecto, ingenieros, expertos en BIM y académicos de Irán, Norteamérica, Europa, Asia-Pacífico y Oriente Medio. El análisis emplea estadística descriptiva (media y desviación), análisis factorial confirmatorio y PLS-SEM en SmartPLS 4, con remuestreo de 5 000 muestras para evaluar la significancia de los coeficientes de trayectoria. Evalúa fiabilidad, validez convergente y discriminante, R2 y tamaño de efecto f2, y clasifica los indicadores en un diagrama bidimensional de media frente a carga factorial. Los datos están disponibles solo por solicitud a la persona autora de correspondencia.
  resultados: >
    El modelo estructural explica 53,3 % de la varianza de la implementación exitosa del gemelo digital (R2 = 0,533), valor que el texto califica de satisfactorio. Los coeficientes de trayectoria son 0,472 para ORF, 0,413 para SRF y 0,297 para OSRF, todos reportados como significativos. Los tamaños de efecto f2 son 0,201 para SRF, 0,192 para ORF y 0,169 para OSRF; según los umbrales de Cohen que el propio artículo cita (0,15 a 0,35 como efecto medio), los tres son medios, aunque el texto describe el de SRF como mayor. El análisis factorial confirmatorio indica ajuste adecuado entre el modelo y los datos. El diagrama bidimensional ubica 11 indicadores en el Cuadrante I (media y carga superiores al promedio): ORF4, ORF7, ORF9 y ORF10 (requisitos de usuario, inteligencia artificial en tiempo real, monitoreo del estado del proyecto y gestión automatizada de inventario); SRF1, SRF4, SRF8 y SRF10 (sensores en obra, trazabilidad de la cadena de suministro, seguridad con IoT y procesamiento de imágenes); y OSRF1, OSRF3 y OSRF6 (actualización semántica continua, comparación de avance real y planificado, repositorio centralizado). Las implicaciones gerenciales recomiendan plataformas de datos en tiempo real, sistemas de decisión con inteligencia artificial, monitoreo con sensores y flujos de trabajo híbridos entre oficina y obra.
  discusion: >
    Los autores interpretan que la oficina es el dominio de mayor influencia y que la gestión y la colaboración en ella determinan el éxito del gemelo digital, coherente con trabajos que destacan la inteligencia artificial y la analítica en gestión de proyectos. Atribuyen al paquete de interfaz el menor aporte y lo leen como señal de una brecha de investigación sobre la integración entre oficina y obra. Declaran como contribución un marco integrado que ordena jerárquicamente las influencias y como implicación práctica una guía para reducir retrasos, errores y desperdicio de materiales. Quedan sin discutir tres puntos: la discrepancia entre el orden de los coeficientes de trayectoria y el de los tamaños de efecto, la medición de factores y de éxito por los mismos respondientes y la ausencia de resultados de proyecto que no sean percepciones. El texto contiene además inconsistencias editoriales, como la atribución de la invención del término a 2003 y a 2010 en párrafos contiguos y el rótulo SRF aplicado a los factores de interfaz.
  limitaciones: "Tamaño de muestra relativamente pequeño respecto de la comunidad objetivo, acceso restringido a expertos de la industria y restricciones de los estudios previos que pueden afectar la precisión y la integridad de los factores considerados (p. 29)."
  futuro: "Los autores piden investigación futura que supere estas restricciones y profundice la comprensión del potencial de los gemelos digitales en proyectos de construcción; el texto no precisa diseños concretos ni poblaciones adicionales."
c3:
  tesis: >
    La implementación exitosa de gemelos digitales en construcción depende de tres grupos de factores (oficina, obra e interfaz), con el grupo de oficina como principal contribuyente, y once indicadores concretos de los treinta revisados destacan por su importancia percibida y su carga factorial.
  antitesis: >
    La evidencia procede de percepciones de 122 personas que califican a la vez los factores y el éxito de la implementación, con lo que el sesgo de método común y la varianza compartida pueden inflar los coeficientes. El muestreo intencional y la tasa de 61 % impiden generalizar, y el texto reconoce que la muestra es pequeña frente a la población objetivo. La jerarquía entre grupos no resiste una lectura estricta: el coeficiente de trayectoria favorece a ORF (0,472), pero el tamaño de efecto f2 favorece a SRF (0,201 frente a 0,192), y las tres diferencias caen en la categoría media de Cohen, de modo que el texto no sustenta un orden claro. La variable dependiente mide percepción de éxito, no desempeño de proyectos con gemelo digital frente a testigos sin él. Los once indicadores seleccionados dependen de un corte por promedios, que clasifica a la mitad de la distribución en cualquier conjunto de datos. Por último, el estudio no incluye tecnología propia ni valida un prototipo.
  sintesis: >
    El artículo ofrece un inventario ordenado de condiciones organizacionales y de obra que los profesionales consideran necesarias para operar gemelos digitales, útil como lista de verificación de capacidades, pero no como estimación causal del éxito. Para el corpus aporta la distinción entre factores de oficina, de obra y de interfaz, trasladable a la recuperación productiva posterior a un sismo, donde la interfaz entre el centro de decisión y el activo dañado condiciona la rapidez de reanudación. La síntesis propone tratar los tres coeficientes como hipótesis de partida, contrastarlos con resultados objetivos de proyecto (plazo, costo, retrabajo, seguridad) y repetir la medición con fuentes separadas para factores y desenlace, en muestras estratificadas por región y tamaño de empresa.
  areas_grises:
    - "Medición por los mismos respondientes: la misma persona califica los treinta factores y la implementación exitosa en un único cuestionario, y el texto no informa pruebas de sesgo de método común ni separación temporal o de fuentes; con ello, la correlación estructural puede reflejar consistencia de actitud y no relación entre factores y resultados de proyecto."
    - "Jerarquía ambigua entre dominios: el abstract destaca la contribución de ORF, pero la sección de resultados atribuye el mayor tamaño de efecto a SRF, y el artículo no reporta intervalos de confianza ni pruebas de diferencia entre coeficientes; esto impide afirmar que la oficina pese más que la obra o que la interfaz pese menos."
    - "Representatividad y composición de la muestra: 122 respuestas de 200 invitaciones, con muestreo intencional, de Irán y cuatro regiones agrupadas; el texto no desglosa el peso de cada región ni el tamaño de las empresas, de modo que no puede establecerse para qué contexto de construcción, tamaño de firma o nivel de madurez digital vale el modelo."
    - "Sin desenlace objetivo ni contexto de riesgo: el estudio no mide plazo, costo, seguridad ni continuidad de operaciones y no considera eventos extremos como sismos; la utilidad para la reanudación de actividades tras un desastre debe inferirse, y el artículo no discute si los factores se mantienen en emergencia."
  puntos_oscuros: >
    El texto sostiene que el paquete de interfaz contribuye menos y que esto señala una brecha de investigación, pero la misma observación admite una explicación metodológica: los diez indicadores de interfaz son más abstractos (actualización semántica, repositorio centralizado) y pueden ser menos distinguibles para los respondientes, lo que reduce su variabilidad y su coeficiente. Si la relación fuera sustantiva, la interfaz debería pesar más en entornos de alta incertidumbre, como la reconstrucción posterior a un desastre, donde la información de obra cambia con rapidez y la oficina debe decidir con datos parciales. Esa hipótesis de interacción entre incertidumbre del entorno e importancia de la interfaz no se formula ni se prueba. El artículo tampoco aclara si la calificación de los factores proviene de experiencia directa con gemelos digitales o de expectativas, y la composición mixta de profesionales y académicos puede mezclar ambos tipos de juicio. La ausencia de comparación con proyectos sin gemelo digital impide además distinguir el efecto de los factores del efecto de seleccionar organizaciones ya digitalizadas, que son las que pueden responder con conocimiento.
  ideas:
    - "Replicación con desenlaces objetivos y fuentes separadas: ejecutar el mismo modelo ORF-SRF-OSRF en proyectos con gemelo digital documentado, midiendo los factores con encuesta a un grupo (oficina y obra por separado) y el desenlace con registros de plazo, costo, retrabajo y seguridad extraídos de bitácoras de proyecto. Fundamento: el estudio califica factores y éxito en el mismo cuestionario y reconoce una muestra pequeña. Verificabilidad: comparar los coeficientes de trayectoria con y sin variables de desenlace objetivo y estimar el sesgo de método común con una variable marcadora. Utilidad: separa lo que los profesionales creen necesario de lo que reduce atrasos y errores, y entrega a los gestores de reconstrucción una priorización de inversiones respaldada por resultados y no por percepciones."
    - "Modelo condicional por incertidumbre del entorno: reestimar los pesos de oficina, obra e interfaz en subconjuntos de proyectos según un indicador de incertidumbre (obras en zonas posteriores a un sismo frente a obra convencional), con prueba de interacción entre grupo de factores e incertidumbre. Fundamento: el texto atribuye a la interfaz el menor peso, pero no examina contextos donde la información cambia con rapidez. Verificabilidad: análisis multigrupo en PLS-SEM con prueba de invariancia de medición y muestras no inferiores a las recomendadas para cada grupo. Utilidad: determina si la interfaz oficina-obra es el cuello de botella de la recuperación productiva, lo que orienta dónde invertir primero en sensores, repositorios de datos y protocolos de comunicación durante la reconstrucción."
  relaciones:
    - "Factores de la oficina (determinan) la implementación exitosa del gemelo digital: coeficiente de trayectoria 0,472 reportado por los autores, con tamaño de efecto f2 de 0,192, medido con percepciones y sin control de confusión."
    - "Interfaz oficina-obra (modula) la utilidad del flujo de datos en tiempo real: coeficiente de 0,297 y f2 de 0,169, el menor de los tres; la lectura causal queda abierta porque el texto no prueba mediación ni moderación."
  robustez: [5, 4, 3, 3]
  valor: [4, "Aporta una lista priorizada de factores de oficina, obra e interfaz para operar gemelos digitales y un modelo estructural reproducible en cuanto a método, útil como punto de partida para diseñar indicadores de capacidad en proyectos de reconstrucción. Su valor es indirecto para el corpus: no estudia sismos ni empresas afectadas, y su evidencia es de percepción con muestra pequeña, de modo que sirve para formular hipótesis y no para fundamentar recomendaciones de política."]
  conexiones: []
socratica:
  p1: "Define el éxito del gemelo digital mediante diez criterios percibidos por los respondientes y el gemelo digital como réplica virtual con actualización bidireccional en tiempo real; no define operacionalmente 'éxito' con resultados de proyecto."
  p2: "Supone que la percepción de profesionales representa el efecto real de los factores, que los 30 variables de la literatura cubren el espacio relevante y que el corte por promedio identifica los factores críticos."
  p3: "La evidencia es de encuesta con 122 respuestas, R2 de 0,533 y coeficientes de 0,472, 0,413 y 0,297; no hay medición objetiva de desempeño ni comparación con proyectos sin gemelo digital."
  p4: "Si es cierto, los gerentes deberían priorizar plataformas de datos en tiempo real, inteligencia artificial en la oficina y sensores en obra; si es falso, se arriesga invertir en capacidades que los profesionales valoran pero que no mejoran plazos ni costos."
  p5: "No se examinan casos de implementaciones fallidas, entornos de alta incertidumbre ni organizaciones sin experiencia previa, que podrían contradecir el orden de importancia de los factores."
  p6: "Hipótesis rivales: la jerarquía refleja el sesgo de método común y el perfil de los respondientes; o la interfaz pesa menos porque sus indicadores son más abstractos y no por ser menos importante."
