doc_id: D090
relevancia: "Ajeno"
relevancia_just: "Encuesta de conocimientos y prácticas sobre leishmaniasis tegumentaria y captura de flebotominos en dos comunidades rurales de Mérida (Venezuela); es literatura de salud pública y parasitología sin relación con gemelos digitales, IoT, transferencia tecnológica ni recuperación empresarial tras sismos."
cluster_tema: "Salud pública: conocimientos sobre leishmaniasis y fauna de flebotominos"
metodo_tipo: "Encuesta transversal con muestreo sistemático de viviendas y capturas entomológicas"
tipo_recurso: "Artículo científico (investigación original, journal peer-reviewed)"
kw_inferidas: [leishmaniasis tegumentaria, conocimientos y prácticas, Lutzomyia, flebotominos, Venezuela, Mérida, comunidades rurales, peridomicilio, educación sanitaria, control vectorial]
c2:
  objetivo: >
    Determinar el nivel de conocimientos y prácticas sobre la leishmaniasis tegumentaria y la fauna de flebotominos en las comunidades endémicas de Bolero Alto y Bolero Bajo, municipio Pinto Salina, estado Mérida (Venezuela), entre septiembre de 2006 y julio de 2007, mediante encuestas domiciliarias y capturas entomológicas, con el fin de orientar alternativas educativas que complementen el control de la enfermedad y se enfoquen en evitar las picaduras del insecto vector, con atención a las especies de Lutzomyia presentes en el entorno de las viviendas.
  pregunta: >
    [INFERIDA] ¿Qué nivel de conocimientos y qué prácticas de protección tienen los habitantes de dos comunidades rurales endémicas de los Andes venezolanos frente a la leishmaniasis, y qué especies de flebotominos circulan en el peridomicilio de esas comunidades?
  marco: >
    El marco combina la epidemiología de la leishmaniasis (zoonosis transmitida por flebotominos del género Lutzomyia, con control basado en detección y tratamiento de casos, sin modelo costo-eficaz definido y con fumigación considerada inviable por el daño ecológico) y la educación sanitaria como complemento del control. Se apoya en estudios previos de conocimientos en Brasil y Colombia, en las cifras mundiales (88 países endémicos y 350 millones de personas en riesgo) y en la hipótesis de que la deforestación, la cría de animales domésticos y los cultivos de café favorecen la transmisión peridomiciliaria. No formula un modelo teórico del comportamiento ni usa teoría de cambio educativo.
  metodologia: >
    Estudio transversal en dos comunidades mestizas rurales de la cordillera andina: Bolero Bajo (738 msnm, 45 viviendas y unos 250 habitantes) y Bolero Alto (915 msnm, 86 viviendas y unos 400 habitantes). Se seleccionaron viviendas por muestreo sistemático (una de cada tres o cuatro) y se encuestó a todas las personas mayores de siete años presentes, con un cuestionario de 40 preguntas abiertas y cerradas, apoyado con insectos vivos y fotografías de lesiones. El tamaño mínimo se estimó con una calculadora en línea (70 encuestas en Bolero Bajo y 64 en Bolero Alto, con 95 % de confianza). Se seleccionaron 20 preguntas de conocimiento sobre enfermedad, vector, transmisión y prevención, con un punto por pregunta, y se clasificó el nivel como insuficiente (0 a 10 puntos) o básico (11 a 20 puntos). La captura de flebotominos fue mensual: trampas Shannon en el peridomicilio de 19:00 a 20:00 horas y trampas de papel aceitado en tres cuartos del 10 % de las viviendas durante 24 horas; las hembras se disecaron para buscar infección natural. Se empleó Epi-Info 6 con pruebas de ji al cuadrado (p < 0,05), aval del comité de bioética y consentimiento verbal.
  resultados: >
    Se encuestaron 143 personas (75 en Bolero Bajo y 68 en Bolero Alto), con predominio femenino cercano a 56 %. Entre 80 % y 82 % había oído hablar de la enfermedad, pero el 68 % de los de Bolero Alto y el 75 % de los de Bolero Bajo tuvo un nivel de conocimientos insuficiente; las mayores deficiencias fueron sobre el vector, la transmisión y la prevención. Cerca de 70 % reconoció que se transmite por picadura, pero menos de 20 % identificó a la angoleta (flebotomino) como transmisor, y solo 43 % y 30 % reconocieron al insecto vivo. Solo 10 % en Bolero Alto y 0 % en Bolero Bajo usaba mosquitero, y 36 % y 46 % usaba insecticida. Todas las viviendas de Bolero Bajo y 55 % de las de Bolero Alto criaban animales; 93 % y 90 % tenía café en el peridomicilio. En el peridomicilio se capturaron 171 flebotominos en Bolero Alto y 170 en Bolero Bajo, con 7 especies de Lutzomyia en Bolero Alto y 5 en Bolero Bajo; predominaron L. youngi (63,2 % y 55,9 %) y L. ovallesi (32,7 % y 23,5 %). Dentro de las viviendas se capturó solo una hembra de L. gomezi en Bolero Bajo. No hubo infección natural en 341 hembras disecadas.
  discusion: >
    Los autores interpretan que el bajo nivel de conocimientos se concentra en transmisión y prevención y que se restringe a quienes han padecido la enfermedad o tienen familiares o vecinos afectados. Sostienen que la transmisión ocurre principalmente en el peridomicilio por la presencia de especies antropofílicas, vegetación silvestre, cafetales, animales domésticos, hacinamiento y poca ropa, y que las diferencias de fauna entre comunidades se explican por una barrera geográfica y por el mayor impacto ambiental en Bolero Bajo. Proponen medidas de bajo costo y menor impacto ambiental (evitar picaduras, repelentes caseros, quema de hojas, animales fuera de la vivienda) y reformular el control con participación comunitaria. Quedan sin discutir la ausencia de medición de la incidencia de casos, la validación del cuestionario y de la puntuación y el efecto del mes de captura.
  limitaciones: "No declaradas formalmente. El texto reconoce que no existe evidencia consolidada del cafetal como refugio de flebotominos y que la información sobre estacionalidad en Venezuela es escasa."
  futuro: "Reformular las estrategias de control con políticas integrales de promoción de calidad de vida y mayor participación comunitaria preventiva, y desarrollar alternativas educativas dirigidas a las deficiencias de conocimiento más acentuadas (p. 8)."
c3:
  tesis: >
    Los habitantes de las comunidades andinas estudiadas tienen un nivel de conocimientos insuficiente sobre la transmisión y la prevención de la leishmaniasis, y la transmisión probablemente ocurre en el peridomicilio por flebotominos antropofílicos, por lo que la educación sanitaria enfocada en evitar las picaduras es una medida complementaria prioritaria.
  antitesis: >
    El diseño transversal con dos comunidades y 143 encuestados no permite vincular el nivel de conocimientos con la incidencia de casos ni con el comportamiento de protección, y los autores no muestran que el conocimiento mejore las prácticas. El instrumento no se valida ni se describe su consistencia, y el punto de corte de 10 puntos sobre 20 para 'insuficiente' no se justifica. Las inferencias ecológicas (hacinamiento, ropa, café, animales, barrera geográfica) se plantean sin medir su asociación con casos, y la ausencia de infección natural en 341 hembras indica que la transmisión no se demostró en el período. La comparación entre comunidades usa pruebas de ji al cuadrado sin ajuste por múltiples comparaciones en más de 20 variables, y la clasificación de especies de importancia 'epidemiológica' se basa en literatura, no en esta muestra.
  sintesis: >
    El estudio ofrece una línea base descriptiva de conocimientos y prácticas y un inventario de especies de flebotominos en dos comunidades, útil para diseñar intervenciones educativas locales. Su alcance inferencial es limitado a la descripción. La síntesis propone evaluar la intervención educativa con un diseño pre y post con grupo de comparación, validar el cuestionario y relacionar el conocimiento con prácticas y con casos notificados. Para el corpus, el documento es ajeno al dominio temático y sirve como contraste negativo para las pruebas de similitud y la sensibilidad con y sin el bloque SciELO, sin aportar evidencia sobre tecnología, empresas ni recuperación productiva tras eventos extremos.
  areas_grises:
    - "Validez del instrumento: el cuestionario de 40 preguntas y la selección de 20 para la puntuación no se validan ni se reporta su confiabilidad, y el punto de corte entre insuficiente (0 a 10) y básico (11 a 20) no se fundamenta, de modo que el 68 % y el 75 % de 'insuficiente' dependen de una convención no evaluada."
    - "Relación entre conocimiento y comportamiento: se describen niveles de conocimiento y de uso de mosquitero e insecticida, pero no se analiza si las personas con mayor conocimiento protegen más, ni si el conocimiento se asocia con casos; la recomendación educativa descansa en una suposición no contrastada."
    - "Inferencia sobre el lugar de transmisión: se concluye que la transmisión es peridomiciliaria a partir de capturas con trampa Shannon durante una hora y de la hembra intradomiciliaria única, sin demostrar infección natural (0 de 341 hembras) y sin datos de casos con lugar probable de infección."
    - "Representatividad: dos comunidades de 250 y 400 habitantes y 143 encuestados, muestreo sistemático por vivienda con 'todos los presentes', que sobrerrepresenta a quienes están en casa (mujeres y niños), sin ponderar ni describir no respuesta."
  puntos_oscuros: >
    El texto atribuye las diferencias de fauna entre comunidades a la barrera geográfica y al mayor impacto ambiental de Bolero Bajo, pero las dos comunidades difieren también en altitud (738 y 915 msnm), y los autores señalan que L. youngi prefiere altitudes superiores a 800 msnm; la altitud explicaría la composición sin recurrir a la deforestación. Esa explicación alternativa no se contrasta. Además, el número de especies capturadas depende del esfuerzo de captura (una hora en el peridomicilio por trampa Shannon cada mes), y las diferencias de 7 y 5 especies pueden reflejar la diferencia de muestreo y no de biodiversidad. En cuanto al nivel de conocimientos, la diferencia entre 68 % y 75 % no se prueba como significativa en el texto, aunque se afirma que las deficiencias son significativas para vector, transmisión y prevención; el cuadro muestra p significativa solo para algunas variables. Por último, la discrepancia entre el resumen (L. ovallesi más de 24 %) y el texto (más de 23 %) sugiere errores de redondeo que no afectan la conclusión pero muestran poca revisión.
  ideas:
    - "Evaluación de una intervención educativa con grupo de comparación: diseñar una intervención sobre prevención de picaduras en comunidades como las estudiadas, con asignación por comunidad o por grupo de viviendas y medición antes y después del conocimiento, del uso de mosquitero, repelente y medidas caseras y de los casos notificados. Fundamento: el artículo concluye que la educación es prioritaria pero solo mide una línea base. Verificabilidad: diferencias en diferencias con control de edad y sexo, con tamaño de muestra calculado para el cambio en la proporción de uso de mosquitero. Utilidad: ofrece a los programas de control evidencia sobre si la educación cambia prácticas y si su costo se justifica frente a medidas ambientales."
    - "Modelo ecológico de abundancia de flebotominos: ajustar un modelo de conteo con altitud, cobertura vegetal, presencia de gallinero y de café, mes y esfuerzo de captura como covariables, para separar el efecto del impacto ambiental del de la altitud. Fundamento: las dos comunidades difieren en altitud y en intervención de la vegetación, y los autores atribuyen la diferencia de fauna a la barrera geográfica. Verificabilidad: capturas mensuales estandarizadas en más comunidades y regresión binomial negativa con intervalos de confianza. Utilidad: identifica factores modificables en el peridomicilio y orienta medidas de manejo del entorno que reduzcan el riesgo sin fumigación."
  relaciones:
    - "Altitud y vegetación (se asocian con) la composición de especies de Lutzomyia: L. youngi predomina en ambas comunidades, con diferencias entre ellas atribuidas a la barrera geográfica sin análisis multivariado."
    - "Cría de animales domésticos y cafetales (se asocian con) la presencia peridomiciliaria de flebotominos: relación tomada de la literatura, sin medición de asociación en el estudio."
  robustez: [4, 4, 3, 3]
  valor: [1, "Aporta una línea base de conocimientos y fauna de flebotominos para dos comunidades andinas y una guía de variables para intervenciones educativas. Está fuera del dominio del corpus sobre tecnología y recuperación empresarial; su valor es de control negativo para los análisis temáticos y no tiene aplicación directa en el estudio."]
  conexiones: []
socratica:
  p1: "Define nivel de conocimientos mediante una puntuación de 20 preguntas con corte en 10 puntos, y distingue entre conocimientos y prácticas de protección."
  p2: "Supone que el conocimiento reportado en encuesta predice comportamiento de protección y que las capturas con trampa Shannon en una hora representan la fauna del peridomicilio."
  p3: "La evidencia es descriptiva: 143 encuestas, 68 % y 75 % de conocimiento insuficiente, 341 hembras disecadas sin infección y 171 y 170 flebotominos capturados."
  p4: "Si es cierto, la educación sobre prevención de picaduras complementaría el control; si es falso, se invierte en educación sin cambios en prácticas ni casos."
  p5: "No se examinan personas con mayor conocimiento y su comportamiento, ni comunidades con intervención educativa previa."
  p6: "Hipótesis rivales: la composición de especies depende de la altitud; el bajo conocimiento refleja el punto de corte de la puntuación y no la realidad de la comunidad."
