notas: "Texto completo extraído (22 páginas con referencias). Las figuras bibliométricas y las tablas I, II, III, IV y V no son legibles en la extracción; las cifras se tomaron del texto narrativo. La cifra de 80 artículos en 2024 se cita de forma aproximada ('over 80'). No se encontraron en el texto términos de empresas, pymes ni cadena de suministro en el contexto de recuperación."
