doc_id: D042
relevancia: "Adyacente"
relevancia_just: "Revisión sistemática y bibliométrica (Scopus, PRISMA 2020) de sensado con internet de las cosas y vehículos aéreos no tripulados (UAV) para preparación, respuesta y recuperación en terremotos. Aporta una taxonomía por fase y los vacíos de interoperabilidad, energía y decisión, pero no trata empresas, recuperación económica ni gemelos digitales como objeto central."
cluster_tema: "IoT y UAV en la gestión de desastres sísmicos (revisión)"
metodo_tipo: "Revisión sistemática con análisis bibliométrico (Biblioshiny) y síntesis temática de 53 estudios"
tipo_recurso: "Artículo de revisión (journal peer-reviewed, acceso abierto)"
kw_inferidas: [internet de las cosas, vehículos aéreos no tripulados, terremoto, alerta temprana, evaluación de daños, restauración de comunicaciones, interoperabilidad, bibliometría, fusión de datos, eficiencia energética]
c2:
  objetivo: >
    Analizar el papel de las tecnologías emergentes, en particular el internet de las cosas (IoT) y los vehículos aéreos no tripulados (UAV), en la gestión de desastres por terremotos mediante una revisión sistemática y bibliométrica. El estudio busca identificar tendencias de investigación, redes de colaboración y patrones de coocurrencia de palabras clave, clasificar las contribuciones por fase (preparación y alerta temprana, respuesta en tiempo real y recuperación posterior), proponer una taxonomía que relacione capacidades tecnológicas con requisitos operativos y señalar vacíos de interoperabilidad, fusión de datos y eficiencia energética.
  pregunta: >
    El artículo no enuncia preguntas de investigación formales. Las preguntas implícitas son qué tecnologías de IoT y UAV se usan en cada fase de la gestión de terremotos, cómo evolucionó la producción científica y qué temas estructuran el campo, qué tecnologías de comunicación sostienen la conectividad durante y después del evento y qué desafíos técnicos de integración impiden un despliegue fiable a gran escala.
  marco: >
    El marco es el ciclo de gestión de desastres con tres fases temporales (antes, durante y después del evento), en el que la preparación incluye prevención y alerta temprana, la respuesta incluye monitoreo en tiempo real y apoyo a la emergencia, y la recuperación incluye evaluación de daños y reconstrucción. A ese ciclo se superponen una taxonomía tecnológica (sistemas basados en IoT, basados en UAV e integrados) y una clasificación de UAV por alcance, autonomía, altitud, carga útil y propulsión. La interoperabilidad se estructura en cuatro niveles: protocolo, plataforma, sensado y apoyo a la decisión. No se formula una teoría de resiliencia ni de recuperación económica.
  metodologia: >
    La búsqueda se hizo en Scopus con una cadena booleana que combina términos de sismo (earthquake, seismic, aftershock, tremor), de tecnología (UAV, drone, IoT, redes de sensores) y de aplicación (monitoreo, alerta temprana, evaluación de daños, monitoreo de salud estructural, respuesta a desastres), limitada a inglés y a registros hasta 2025. Se obtuvieron 522 artículos de revista y 505 únicos tras eliminar duplicados. El cribado manual de títulos y resúmenes dejó 230 estudios, y la lectura completa, con criterios de marco tecnológico definido, aplicación a un escenario sísmico real o simulado y validación empírica o técnica, dejó 53 estudios. Las discrepancias se resolvieron por consenso entre revisores. La síntesis temática clasificó cada estudio por tecnología y fase, y el análisis bibliométrico con R y Biblioshiny examinó tendencias, coocurrencia de palabras clave, acoplamiento documental y colaboración entre países. El texto reconoce el sesgo de una sola base de datos y del filtro de idioma.
  resultados: >
    La producción anual fue inferior a cinco artículos por año entre 1998 y 2010, mostró un punto de inflexión hacia 2014-2015 y superó los 80 artículos en 2024. La red de coocurrencia mostró tres pilares (UAV, gestión y prevención de desastres, IoT) y tres conglomerados: teledetección y análisis con inteligencia artificial, sistemas IoT con computación en niebla, ciudades inteligentes y redes de sensores, y operaciones con UAV con planificación de trayectorias, búsqueda y rescate y aprendizaje por refuerzo. Los sistemas IoT se usan sobre todo para monitoreo sísmico en tiempo real, difusión de alertas y comunicación de datos, y los UAV para evaluación rápida de daños, restauración de comunicaciones y apoyo logístico después del terremoto. Las tablas clasifican las tecnologías de comunicación inalámbrica, los UAV por alcance y por carga útil y los escenarios de respuesta con criterios de selección. Los vacíos se organizan en cuatro niveles de interoperabilidad y en desafíos de eficiencia energética en la red, en el UAV y en la coordinación del sistema. Entre los ejemplos citados figuran los relevos aéreos con transferencia inalámbrica de energía y superficies reflectantes, una estrategia probabilística de almacenamiento de contenido en UAV y modelos de clasificación de imágenes aéreas en dispositivos de borde. El texto no reporta una medida agregada de desempeño por tecnología ni una distribución de los 53 estudios por fase o por país.
  discusion: >
    Los autores sostienen que la combinación de IoT, UAV e inteligencia artificial refuerza la conciencia situacional, la eficiencia de coordinación y la toma de decisiones basada en datos, y que ningún sistema de comunicación satisface todos los requisitos, por lo que se requieren redes heterogéneas con relevos aéreos cuando la infraestructura terrestre falla. Interpretan que los sistemas IoT son persistentes entre fases, los UAV son específicos de la respuesta con transición hacia evaluación y logística, y la teledetección y la inteligencia artificial operan como habilitadores transversales. Concluyen que persisten desafíos de regulación, límites ambientales, restricciones de hardware y complejidad de coordinación, y proponen arquitecturas híbridas terrestres-aéreas, computación en el borde y monitoreo autónomo.
  limitaciones: "Declaradas: dependencia exclusiva de Scopus y del filtro de idioma inglés, que puede subrepresentar enfoques regionales y técnicas de restauración de comunicaciones. No declaradas: sin evaluación del riesgo de sesgo ni de calidad de los 53 estudios; inclusión de simulaciones como validación; análisis bibliométrico sobre un conjunto cuyo tamaño exacto no se aclara (505 o 53); sin cuantificación de desempeño comparado entre tecnologías; ausencia de recuperación económica y empresarial; sin análisis de costo, escalabilidad ni adopción por usuarios."
  futuro: "Explícito: integración de monitoreo autónomo habilitado por inteligencia artificial, arquitecturas de computación en el borde para baja latencia y marcos híbridos terrestres-aéreos de comunicación; búsquedas multibase y en otros idiomas. Implícito: estandarización de formatos de datos de daño estructural y evaluación en despliegues reales."
c3:
  tesis: >
    La integración de sensado con IoT, plataformas aéreas (UAV), comunicaciones heterogéneas e inteligencia artificial a lo largo de todo el ciclo del terremoto refuerza la conciencia situacional, la coordinación y la decisión basada en datos; los sistemas IoT sostienen el monitoreo continuo y la alerta, los UAV la evaluación de daños, la restauración de comunicaciones y la logística posterior, y las brechas de interoperabilidad, fusión de datos y energía definen la agenda para sistemas adaptativos y persistentes entre fases.
  antitesis: >
    La evidencia de la revisión es principalmente descriptiva. De 505 publicaciones únicas se retienen 53 por criterios que incluyen validación 'técnica' por simulación, sin evaluar la calidad ni el riesgo de sesgo de los estudios, y no se cuantifica ningún desempeño comparado de las tecnologías. El análisis bibliométrico describe temas y centralidad, pero la frecuencia de palabras clave no mide eficacia operativa. La afirmación de que la integración mejora la coordinación y la toma de decisiones se infiere de la lógica de los sistemas, no de comparaciones con y sin integración. Además, la recuperación se trata como evaluación de daños y comunicaciones, sin incluir recuperación económica, empresarial ni de servicios, y la dependencia de una sola base de datos y del inglés condiciona la representatividad del conjunto.
  sintesis: >
    La contribución sostenible es un inventario ordenado de qué tecnologías de IoT y UAV se estudian en cada fase del terremoto y una lista estructurada de brechas de interoperabilidad en cuatro niveles (protocolo, plataforma, sensado y decisión). Para el corpus, tiene valor como taxonomía de partida y como evidencia de que la literatura de IoT y UAV prioriza detección, respuesta y evaluación de daños, mientras la reanudación de actividades productivas queda sin tratar. No sustenta, por sí sola, estimaciones de efecto ni de costo, y sus recomendaciones sobre integración deben leerse como hipótesis de diseño que requieren contraste con datos de despliegues reales y con análisis de costos.
  areas_grises:
    - "Alcance del conjunto analizado: el texto indica 522 artículos, 505 únicos, 230 tras el cribado y 53 incluidos, pero no aclara si el análisis bibliométrico (más de 80 artículos en 2024, redes de coocurrencia) se hizo sobre los 505 o sobre los 53, lo que cambia el significado de las tendencias reportadas."
    - "Calidad de la evidencia: se aceptan como validación los experimentos, estudios de caso y simulaciones, y no se evalúa riesgo de sesgo ni se distingue entre desempeño medido en campo y en simulación, de modo que las afirmaciones de eficacia de UAV e IoT no pueden ponderarse."
    - "Recuperación económica: la fase de recuperación se limita a evaluación de daños, restauración de comunicaciones y logística; el texto no trata empresas, cadenas de suministro, reapertura de comercios ni recuperación de medios de vida, aun cuando el título menciona respuesta en tiempo real y el resumen recuperación."
    - "Transferibilidad: las tablas de selección de UAV y de tecnologías de comunicación orientan escenarios de respuesta con criterios cualitativos, sin costos, requisitos regulatorios por país ni capacidades locales, lo que limita su uso en economías con menos recursos."
  puntos_oscuros: >
    Llama la atención que una revisión que declara rigor PRISMA y análisis bibliométrico no aclare el tamaño del conjunto sobre el que se calculan las redes y las tendencias, ya que 505 y 53 describen fenómenos distintos. También es notable que la fase de recuperación se tematice como evaluación de daños y restauración de comunicaciones, sin una sola referencia a empresas, comercio o cadenas de suministro. La afirmación de que el uso integrado de IoT y UAV fortalece la coordinación se presenta como hallazgo, aunque no se encuentra una comparación de sistemas integrados frente a no integrados. Además, el reconocimiento explícito del sesgo por una sola base de datos y por el idioma se acompaña de la conclusión de que el campo es 'maduro e interconectado'. Por último, los vacíos de interoperabilidad se enuncian en cuatro niveles con ejemplos, pero sin priorización ni estimación del esfuerzo necesario para cerrarlos, y sin indicar cuáles de ellos impedirían que un sistema de bajo costo funcione en un territorio con redes frágiles.
  ideas:
    - "Extender la taxonomía a la fase de recuperación productiva: añadir a la tabla integrada por fase una cuarta columna de reanudación de actividad económica, con tecnologías y datos requeridos (estado de planta, inventario, proveedores, energía, comunicaciones) y señalar cuáles de los 53 estudios aportan algún dato de ese tipo. Con ello se obtendría una medida de cobertura de la literatura en el eslabón empresarial, que probablemente sea cercana a cero, y una lista de datos mínimos para un gemelo de continuidad. La revisión se actualizaría con un segundo repositorio de referencias (Web of Science) para reducir el sesgo de base única."
    - "Prueba piloto de relevo aéreo para pymes: evaluar un UAV como relevo de comunicaciones y sensor de inspección rápida de naves industriales tras un sismo simulado, midiendo el tiempo hasta restablecer enlace con el gemelo de la planta, el tiempo de inspección frente a la inspección manual y el costo por evento. El resultado ofrecería una primera estimación de valor para una pyme, vinculando los criterios de selección de UAV de las tablas con una métrica empresarial concreta. La prueba se repetiría con dos tipos de nave (metálica ligera y de concreto) y con un grupo de comparación sin UAV, para estimar la diferencia en horas hasta la decisión de reocupación."
  relaciones:
    - "Revisión de tecnologías emergentes para la gestión de desastres sísmicos (se solapa con) D019: ambas cubren IoT, UAV e inteligencia artificial en terremotos; D042 aporta la taxonomía por fase y la lista de brechas de interoperabilidad, mientras D019 abarca un conjunto más amplio de tecnologías."
    - "Restauración de comunicaciones con UAV (complementa) D022: D022 revisa 117 estudios de comunicación con UAV tras desastres con PRISMA, y D042 la integra con sensado IoT y monitoreo estructural."
  robustez: [3, 2, 3, 3]
  valor: [5, "Ofrece una taxonomía por fase y una lista estructurada de brechas de interoperabilidad (protocolo, plataforma, sensado y decisión) para IoT y UAV en terremotos, con análisis bibliométrico reproducible en principio. Su valor para el corpus es adyacente: cubre alerta, monitoreo y evaluación de daños que alimentan un gemelo digital, pero omite empresas, recuperación económica y costos. Se reduce por el tamaño ambiguo del conjunto analizado, la ausencia de evaluación de calidad y la dependencia de una sola base de datos."]
  conexiones: []
socratica:
  p1: "'Fase persistente' es una tecnología que funciona en todas las fases; 'interoperabilidad' se entiende en cuatro niveles (protocolo, plataforma, sensado y decisión); 'recuperación' en el texto es evaluación de daños y restauración de comunicaciones."
  p2: "Supone que los 53 estudios representan la literatura, que la frecuencia de palabras clave refleja importancia y que la validación por simulación equivale a evidencia operativa."
  p3: "La evidencia es un proceso de cribado de 522 a 53 artículos, redes bibliométricas, tablas de clasificación y una síntesis cualitativa, sin medidas de desempeño comparadas."
  p4: "Si es cierto, los diseñadores pueden seleccionar IoT y UAV por fase y priorizar interoperabilidad; si es falso, pueden suponer una madurez del campo que se basa en simulaciones y en una sola base de datos."
  p5: "No se examinan estudios en otros idiomas, bases distintas de Scopus, costos de despliegue, desempeño en campo ni recuperación económica de empresas."
  p6: "Alternativas: que la persistencia de IoT refleje definiciones de los autores; que el crecimiento de publicaciones refleje modas y no capacidad; que la interoperabilidad se resuelva con estándares abiertos existentes."
