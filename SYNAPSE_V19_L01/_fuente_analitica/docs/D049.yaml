doc_id: D049
relevancia: "Adyacente"
relevancia_just: "Propone y prueba por simulación una arquitectura de alerta temprana sísmica de bajo costo con detección y generación de alertas en el nodo (acelerómetros MEMS en hogares, red definida por software SD-WAN con perforación de NAT y algoritmo PLUM modificado), frente a una arquitectura centralizada. Aporta la capa de IoT de borde de la cadena sensor-alerta-acción, con latencias medidas, pero en escenarios hipotéticos y sin evaluar efectos sobre empresas o recuperación."
cluster_tema: "Alerta temprana sísmica de bajo costo con procesamiento en el nodo"
metodo_tipo: "Desarrollo de arquitectura con experimentos de latencia en escenarios sísmicos hipotéticos (seis escenarios; sesenta simulaciones) y comparación con arquitectura centralizada"
tipo_recurso: "Artículo científico (journal peer-reviewed, acceso abierto)"
kw_inferidas: [alerta temprana sísmica, sensores MEMS, procesamiento en el nodo, SD-WAN, ZeroTier, PLUM, latencia, TCP, MQTT, ciencia ciudadana, Nueva Zelanda]
c2:
  objetivo: >
    Presentar una guía paso a paso para desarrollar una arquitectura de red de alerta temprana sísmica (EEW) de bajo costo, basada en acelerómetros MEMS alojados por el público, con procesamiento de datos descentralizado en el nodo y una red SD-WAN con tecnología de perforación de NAT, y evaluar sus latencias frente a una arquitectura centralizada. El estudio busca demostrar que el procesamiento en el nodo reduce el tiempo de generación de la alerta y alarga el tiempo de aviso para el usuario final, y que es viable un sistema comunitario con sensores baratos y seguridad adecuada.
  pregunta: >
    El artículo no formula preguntas de investigación explícitas. Las preguntas implícitas son si un algoritmo PLUM modificado puede ejecutarse en sensores MEMS de bajo costo, qué protocolo de comunicación (TCP, UDP, MQTT) minimiza la latencia de transmisión, cuánto tiempo se ahorra al detectar en el nodo frente a un servidor central y cómo mitigar los riesgos de seguridad de una red comunitaria.
  marco: >
    El marco combina tres elementos. Primero, la alerta temprana regional basada en el movimiento del suelo, con el algoritmo PLUM, que dispara una alerta cuando dos estaciones cercanas superan un umbral de intensidad dentro de un radio de 30 km. Segundo, una latencia del sistema definida como la suma del tiempo de detección, el tiempo de transmisión y el tiempo de viaje de la onda S entre la primera y la segunda estación. Tercero, una red definida por software (ZeroTier) que permite conectar nodos detrás de NAT con perforación UDP. El diseño toma la hipótesis de que la centralización genera cuellos de botella y puntos únicos de falla.
  metodologia: >
    La arquitectura utiliza sensores Raspberry Shake RS4D y un algoritmo PLUM modificado que se ejecuta en cada nodo, con comunicación entre sensores dentro de un radio de 30 km por TCP sobre ZeroTier. Se midió el retardo de transmisión con distintos protocolos (TCP, UDP, MQTT), el tiempo de detección en el nodo y el tiempo de viaje de la onda S en seis escenarios hipotéticos de sismos superficiales con ondas S de 3 km/s que llegan desde distintos acimuts a una red de cinco sensores instalados en Wellington. Se comparó con una arquitectura centralizada con un servidor virtual de Amazon Web Services (t2.micro, 1 GB de RAM), usando TCP y MQTT. Se informan resultados de sesenta simulaciones. Además se analizaron riesgos de seguridad de redes comunitarias y se implementaron medidas, y se probó la dependencia de la latencia con el número de sensores añadiendo sensores simulados a los cinco instalados en Wellington. Las latencias se obtuvieron como suma de los tiempos medidos de transmisión y de detección y del tiempo de viaje de la onda S calculado para cada geometría, de modo que la parte de la onda S es analítica y no medida.
  resultados: >
    El tiempo de viaje de la onda S entre el primer y el segundo sensor varió entre 1,0 y 2,7 s según el escenario y la densidad de sensores en la dirección de la onda. La latencia total del sistema con procesamiento en el nodo varió entre 1,24 s y 2,88 s. En los seis escenarios, la latencia con arquitectura centralizada y MQTT fue de 3,24 a 4,57 s, con arquitectura centralizada y TCP de 1,48 a 3,13 s, y con la arquitectura descentralizada de 1,24 a 2,88 s (por ejemplo, escenario 1: 4,15; 2,94 y 2,65 s). La ventaja de la arquitectura descentralizada sobre la centralizada con TCP fue de 0,24 a 0,32 s, y sobre la centralizada con MQTT de unos 2 s. UDP superó a TCP en unos 35 ms. La pérdida de paquetes fue significativa con MQTT. Los autores concluyen que el tiempo de detección de la arquitectura descentralizada no varía con el número de sensores, mientras que en la centralizada aumenta, y que la pérdida de paquetes es despreciable en la descentralizada frente a la centralizada. También informan que la densidad de sensores en la dirección de propagación reduce el tiempo de viaje de la onda S entre las dos estaciones que confirman la alerta, y por tanto la latencia total.
  discusion: >
    Los autores concluyen que la arquitectura descentralizada con TCP sobre SD-WAN genera las condiciones de alerta óptimas, ahorra segundos y es más robusta ante fallas porque la redundancia depende de la densidad de sensores en un radio de 30 km y no de un servidor único. Argumentan que el costo de los sistemas descentralizados disminuye con sensores cada vez más baratos y potentes, que el diseño se escala con facilidad y que puede extenderse a otros dominios, como alertas comunitarias de incendios forestales. Señalan que la seguridad de redes comunitarias casi no se trata en la literatura y proponen medidas de mitigación, y presentan el trabajo como guía de referencia para futuras redes.
  limitaciones: "Declaradas: se trata de hallazgos de investigación en curso; las evaluaciones se hicieron con escenarios hipotéticos y la red experimental es pequeña. No declaradas: la comparación se hace con un servidor centralizado de baja capacidad (t2.micro), cuya especificación los autores admiten que no se describe en la literatura; la ventaja frente a la centralizada con TCP es de 0,24 a 0,32 s, y la mayor parte de la diferencia con la centralizada con MQTT proviene del protocolo; no se midió la precisión de detección, las falsas alarmas ni la tasa de pérdida de alertas con sismos reales; no hay evaluación del tiempo de entrega al usuario ni del efecto de la alerta; el costo del sistema no se cuantifica; la seguridad se describe sin pruebas de penetración ni auditoría independiente."
  futuro: "Explícito: aplicar el concepto a otras amenazas con alertas comunitarias (incendios forestales) y usar la guía como referencia para redes futuras. Implícito: pruebas con sismos reales, redes más grandes, seguridad verificada y evaluación de falsas alarmas."
c3:
  tesis: >
    La detección y la generación de alertas en el nodo, con un algoritmo PLUM modificado en sensores MEMS de bajo costo comunicados por TCP sobre una SD-WAN con perforación de NAT, reducen la latencia del sistema frente a arquitecturas centralizadas (1,24 a 2,88 s frente a 3,24 a 4,57 s con MQTT), no dependen del número de sensores, resisten fallas de componentes y permiten sistemas comunitarios asequibles y escalables, con lo que aumentan el tiempo de aviso al usuario.
  antitesis: >
    El resultado se apoya en una comparación favorable al diseño propuesto. La ventaja principal proviene del protocolo (TCP frente a MQTT, unos 2 s), mientras que frente a una arquitectura centralizada que también usa TCP la mejora es de 0,24 a 0,32 s, del orden de 10 % a 20 %. El servidor centralizado es una máquina virtual de 1 GB de memoria, y las pruebas se limitan a cinco sensores reales y simulación de más, en escenarios hipotéticos. No se mide la calidad de las alertas (detección, falsas alarmas), el tiempo hasta que la alerta llega a las personas ni el valor de segundos ganados para decisiones. La afirmación de robustez ante fallas se argumenta, no se prueba. Faltan costos y pruebas de seguridad.
  sintesis: >
    La contribución sostenible es una arquitectura documentada y una medición de latencias por componente que muestra que el procesamiento en el nodo es viable en hardware de bajo costo y que la elección del protocolo tiene un efecto mayor que la ubicación del procesamiento en el rango probado. El carácter de guía abierta y la atención a la seguridad de redes comunitarias son aportes prácticos. Su valor para el corpus es como eslabón de borde de IoT en la cadena sensor-alerta-acción de un sistema de continuidad, pendiente de evaluación con sismos reales, con costos medidos y de uso por empresas.
  areas_grises:
    - "Magnitud de la ventaja: el resumen habla de superioridad de la arquitectura descentralizada, pero la Tabla 2 muestra que, con el mismo protocolo TCP, la diferencia es de 0,24 a 0,32 s; la mejora de aproximadamente 2 s se obtiene contra la arquitectura con MQTT, de modo que gran parte del efecto atribuido a la descentralización corresponde al protocolo."
    - "Representatividad de la línea base: el servidor centralizado es una instancia virtual t2.micro de 1 GB, elegida porque la literatura no describe las especificaciones de servidores reales, y su capacidad puede ser inferior a la de sistemas operativos; con un servidor más potente la brecha de 0,24 a 0,32 s podría reducirse."
    - "Evidencia con sismos: los seis escenarios son hipotéticos, con ondas S de velocidad constante de 3 km/s y sismos superficiales; no hay eventos reales, ni mediciones de falsas alarmas, ni detección, ni tiempo de alerta efectivo para personas, que es la variable que importa al usuario."
    - "Costo y seguridad: se afirma menor costo que los sismógrafos científicos y mitigación de riesgos de seguridad, pero no hay cifras de costo por nodo ni de operación, ni pruebas de seguridad que verifiquen las medidas en un entorno hostil."
  puntos_oscuros: >
    Llama la atención que el artículo declare que la arquitectura descentralizada supera a la centralizada y que ahorra segundos valiosos, cuando la mejora frente a la arquitectura centralizada con el mismo protocolo es de entre 0,24 y 0,32 s y el grueso de la diferencia proviene del cambio de MQTT a TCP. También es notable que los autores reconozcan que no existe información sobre los servidores centralizados reales y que aun así comparen contra un servidor mínimo. El trabajo se describe como investigación en curso, pero se presenta como una guía integral y como referencia para otras amenazas. Además, la simulación usa cinco sensores reales y escenarios hipotéticos, y se extrapola a redes nacionales de cientos de sensores. Por último, el texto no informa el costo por nodo ni la tasa de falsas alarmas, dos variables que determinan la adopción por hogares y empresas, y no discute la dependencia del esquema de dos estaciones de confirmación, que añade por diseño entre 1,0 y 2,7 s a la latencia.
  ideas:
    - "Medición del tiempo de aviso efectivo para empresas: combinar la latencia de 1,24 a 2,88 s con el tiempo de entrega al actuador (corte de gas, parada de línea) y el tiempo de viaje de la onda S hasta la planta, y calcular para cada escenario cuántos segundos de aviso efectivo ganaría una empresa a distintas distancias del epicentro. El resultado sería una curva de segundos útiles por ubicación, que permitiría decidir qué acciones automáticas caben y valorar la inversión de una pyme frente al costo de nodos de bajo costo, incluyendo el costo de una falsa alarma que detenga la producción sin necesidad."
    - "Banco de pruebas con sismos reales y falsas alarmas: reproducir con registros de redes de sensores de bajo costo en Nueva Zelanda o California los eventos reales y medir tasas de detección, falsas alarmas y pérdida de alertas con la arquitectura descentralizada, contra una línea base centralizada de capacidad realista. Un resultado con intervalos de confianza permitiría estimar si el ahorro de 0,2 a 0,3 s justifica la complejidad de la descentralización y para qué densidad de sensores, además de reportar el consumo de energía y de ancho de banda por nodo en operación continua durante al menos tres meses."
  relaciones:
    - "Procesamiento en el nodo (implementa) las líneas futuras de D045: la revisión D045 identificó el procesamiento descentralizado, el soporte multisensor y los algoritmos basados en el movimiento del suelo como áreas prioritarias, y D049 es una implementación con PLUM en el nodo; comparten autores del mismo grupo."
    - "Computación en el borde para sensado (comparte enfoque con) D039: D039 corrige la sincronización de sensores de monitoreo con un modelo de 108 mil parámetros apto para el borde, y D049 ejecuta la detección en el nodo; ambos buscan reducir la dependencia de la conectividad central."
  robustez: [3, 2, 3, 3]
  valor: [6, "Aporta una arquitectura abierta y medida para alerta temprana de bajo costo con detección en el nodo, con latencias por componente, comparación entre protocolos y atención a la seguridad de redes comunitarias. Su valor para el corpus es adyacente-alto como capa de IoT de borde, y se reduce por la evaluación en escenarios hipotéticos, la línea base centralizada débil, la ventaja moderada frente a TCP centralizado, y la falta de costos, de falsas alarmas y de efecto sobre empresas."]
  conexiones: []
socratica:
  p1: "'Latencia del sistema' es la suma del tiempo de detección, de transmisión y de viaje de la onda S entre dos estaciones; 'detección en el nodo' es ejecutar el algoritmo en el sensor; 'SD-WAN' es una red definida por software que conecta nodos detrás de NAT."
  p2: "Supone que los escenarios hipotéticos con onda S constante representan sismos reales, que el servidor t2.micro representa un servidor centralizado típico y que la reducción de latencia se traduce en mayor tiempo de aviso útil."
  p3: "La evidencia es una tabla de seis escenarios con latencias de tres arquitecturas, mediciones de protocolos y sesenta simulaciones en una red de cinco sensores reales."
  p4: "Si es cierto, comunidades y empresas pueden desplegar redes de alerta asequibles con ganancia de segundos; si es falso, pueden esperar una ventaja pequeña frente a una arquitectura centralizada bien configurada."
  p5: "No se examinan sismos reales, falsas alarmas, detección, costos por nodo, pruebas de seguridad ni el tiempo de entrega al usuario."
  p6: "Alternativas: que un servidor central mejor dimensionado iguale el desempeño; que el protocolo sea el factor dominante; que la densidad de sensores determine la latencia más que la arquitectura."
