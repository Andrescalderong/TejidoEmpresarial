doc_id: D014
relevancia: "Adyacente"
relevancia_just: "Integra monitoreo de salud estructural (SHM), gemelo digital numérico y respuesta sísmica de un edificio patrimonial, con marco de 'resiliencia circular inteligente' para gestión del riesgo de desastres; no modela recuperación productiva ni dimensión empresarial."
cluster_tema: "Gemelos digitales y SHM sísmico de estructuras"
metodo_tipo: "Estudio de caso con modelación numérica (elementos discretos y finitos) y aprendizaje profundo sobre salidas simuladas"
tipo_recurso: "Artículo científico (journal peer-reviewed)"
kw_inferidas: [gemelo digital, monitoreo de salud estructural, edificio patrimonial, análisis tiempo-historia, ubicación de sensores, LSTM, resiliencia circular inteligente, alerta temprana, mampostería, Lima]
c2:
  objetivo: >
    Proponer un marco metodológico para integrar sistemas de monitoreo de salud estructural (SHM) con modelos numéricos de gemelo digital (GD) en la evaluación sísmica de estructuras patrimoniales, y aplicarlo a la Basílica de María Auxiliadora en Lima, Perú. El propósito operativo de la fase presentada es construir y calibrar el modelo virtual, caracterizar las demandas de ingeniería mediante análisis tiempo-historia con registros reales, definir la ubicación y las características de los sensores y obtener funciones de transferencia con aprendizaje profundo que conviertan señales de movimiento en esfuerzos en los muros.
  pregunta: >
    El texto no formula preguntas de investigación explícitas. Las preguntas implícitas son: dónde ubicar sensores y con qué rango de operación para alimentar en tiempo real un gemelo digital de una estructura patrimonial; si un modelo de aprendizaje profundo entrenado con salidas del modelo numérico puede estimar esfuerzos en los muros a partir de aceleraciones, velocidades y desplazamientos; y si el modelo reproduce el daño histórico documentado.
  marco: >
    El marco combina la ingeniería sísmica basada en desempeño de edificios existentes, el monitoreo de salud estructural y el concepto de gemelo digital como acoplamiento entre un mundo físico instrumentado y un modelo virtual actualizado. Añade el concepto propio de 'resiliencia circular inteligente' (ICR), definido en tres etapas (comprender el riesgo sísmico, implementar mitigación y responder a eventos) y tres niveles (experticia institucional, gestión del riesgo de infraestructura y monitoreo en tiempo real), orientado a ciudades inteligentes y a la reducción del riesgo de desastres. El paradigma es de ingeniería computacional con orientación a la instrumentación, no de ciencias sociales ni de gestión empresarial; la seis fases de la metodología parten de la virtualización del edificio y terminan en un sistema de alerta temprana.
  metodologia: >
    La basílica (construida entre 1916 y 1924, con unos 2000 m2 de planta, 70 m por 30 m y torre de 56 m) se digitalizó con escáner láser y modelo BIM. Se desarrollaron dos modelos: uno lineal elástico de varios grados de libertad en SAP2000 y otro no lineal de elementos discretos en 3DEC versión 9, con aproximadamente 4500 bloques y 161.000 zonas de contacto. Las propiedades de los materiales se tomaron de archivos y estudios previos, sin ensayos destructivos por razones de conservación; la calibración con vibración ambiental queda para trabajo futuro. Se calibraron masa sísmica, periodos fundamentales y formas modales entre ambos modelos y se contrastó el daño simulado con los reportes de los sismos de 1940 y de Ica 2007. Se seleccionaron registros sísmicos a partir de un catálogo de 5745 eventos, de los cuales 75 tenían magnitud de momento de al menos 6,0 y 12 contaban con información; el texto menciona 34 registros en el resumen, una lista final de 33 y cinco análisis tiempo-historia no lineales. Los resultados se condensaron en gráficos de intensidad, duración y frecuencia (IDF) de parámetros de demanda, con cuatro regiones de interés. Para las funciones de transferencia se entrenaron 24 modelos LSTM con entrada múltiple y salida simple, con partición 70/15/15, ventanas de 4 s con traslape de 0,5 s y error cuadrático medio (RMSE) como métrica.
  resultados: >
    El análisis modal arrojó 220 modos y periodos fundamentales de 0,39 s en la dirección X y 0,38 s en la dirección Y, con una masa sísmica cercana a 21.400 kN y una diferencia menor al 5 % entre la estimación manual y la del modelo BIM. El modelo no lineal reprodujo el patrón de agrietamiento de las bóvedas de concreto armado observado tras el sismo de Ica de 2007 (grietas de 0,01 a 4 mm y una de 7 mm), con un módulo de ruptura de 2,84 MPa, y concluyó que la mayoría de los registros no produce daño significativo, lo que concuerda con el estado de salud del edificio. Los gráficos IDF mostraron duraciones máximas sostenidas de 1,3 s, 0,5 s y 0,2 s en rangos de intensidad baja, alta y extrema. Se definieron 25 puntos de control para sensores, con desplazamientos horizontales críticos de hasta 0,40 m (en promedio 3,0 cm durante el 60 % de la duración de los registros), rango de frecuencias de 1,5 a 25 Hz, aceleraciones esperadas de unos 1,40 g y velocidades de hasta 0,80 m/s. Los modelos LSTM alcanzaron RMSE mayoritariamente inferiores a 0,1, con mejor desempeño en niveles bajos (9,38 m y 20,31 m, con valores entre 0,018 y 0,10) que en niveles altos (36,15 m y 39,65 m, hasta 0,283), y la inclusión de la componente vertical mejoró varias configuraciones. Se recomienda sensores triaxiales.
  discusion: >
    Los autores sostienen que la metodología permite estandarizar la distribución de sensores a partir de la respuesta numérica, que el modelo reproduce el comportamiento histórico del edificio y que las funciones de transferencia con aprendizaje profundo son viables para convertir movimientos en esfuerzos. Reconocen que la validación actual descansa en el desempeño histórico y la consistencia analítica, que la calibración con datos de sensores es una etapa pendiente y que el artículo cubre solo dos de seis fases (virtualización y, parcialmente, obtención de datos). Plantean que la metodología se puede extender a otras estructuras civiles y que, a futuro, se integrará en un sistema de alerta temprana dentro del marco de resiliencia circular inteligente. La discusión no examina la sensibilidad a las propiedades de los materiales más allá de una mención, ni el costo de la instrumentación.
  limitaciones: "Propiedades de materiales sin ensayos propios ni calibración con vibración ambiental; ausencia de datos reales de sensores; entrenamiento de los modelos de aprendizaje profundo con salidas del propio modelo numérico; un solo edificio; cinco análisis tiempo-historia; datos disponibles solo previa solicitud."
  futuro: "Despliegue de sensores triaxiales en los puntos recomendados, calibración del modelo con datos experimentales de vibración, validación experimental de los puntos de control y de las funciones de transferencia, y desarrollo completo de las fases 3 a 6 (sensado, integración con el gemelo, alerta temprana y operación en la ciudad)."
c3:
  tesis: >
    Un modelo numérico calibrado de una estructura patrimonial, combinado con gráficos IDF de las demandas y funciones de transferencia de aprendizaje profundo, permite definir de forma sistemática dónde y con qué características instalar sensores para alimentar un gemelo digital, como primer paso de una resiliencia circular inteligente en ciudades.
  antitesis: >
    El gemelo digital descrito aún no existe: no hay sensores instalados, no hay datos de campo y las funciones de transferencia se entrenan con las salidas del mismo modelo que pretenden aproximar, de modo que el error reportado mide la capacidad del LSTM de reproducir un modelo numérico y no de estimar esfuerzos reales. La validación del modelo descansa en una comparación cualitativa con daño histórico y con propiedades tomadas de la literatura, sin ensayos in situ, de manera que la incertidumbre de materiales de la mampostería, que domina la respuesta, queda sin cuantificar. Los conteos de registros sísmicos (34, 33, 12 y 5) no son consistentes entre secciones, y el marco de ICR se enuncia sin indicadores ni validación. La generalización a otras estructuras y a ciudades inteligentes carece de evidencia, y el título sugiere una integración más avanzada que la reportada.
  sintesis: >
    La contribución verificable es un procedimiento de diseño de instrumentación basado en simulación: modelo calibrado, registros reales, gráficos IDF y rangos de sensores justificados, útil como protocolo previo a la instalación. Debe leerse como estudio de factibilidad del componente virtual (nivel de prueba de concepto analítica) y no como gemelo digital operativo. Para el corpus, la síntesis consiste en tratar este tipo de trabajo como el eslabón físico de una cadena que debe prolongarse hacia el efecto sobre la continuidad de operaciones: asociar los estados de daño estimados por el gemelo con tiempos de inhabilitación y costos, de modo que el valor de la instrumentación se exprese en reducción esperada del tiempo de cierre y no solo en precisión de la respuesta estructural.
  areas_grises:
    - "Circularidad de la validación: los modelos LSTM se entrenan y evalúan con salidas simuladas del modelo 3DEC, por lo que un RMSE bajo no demuestra capacidad de estimar esfuerzos reales con ruido, deriva y fallas de sensor; el texto reconoce que la calibración con datos físicos es futura."
    - "Inconsistencia en el conjunto de registros sísmicos: el resumen menciona 34 registros, el texto una lista final de 33 y el análisis tiempo-historia no lineal usa cinco; no queda claro qué registros sustentan cada resultado ni cómo se escalaron."
    - "Incertidumbre de materiales: las propiedades de la mampostería y del concreto provienen de archivos y de estudios previos, sin ensayos in situ ni análisis de sensibilidad completo, aunque la respuesta no lineal y el patrón de agrietamiento dependen de ellas."
    - "Alcance de la resiliencia circular inteligente: el marco ICR se declara con tres etapas y tres niveles, pero no define indicadores, actores ni mecanismos de participación público-privada, y el artículo solo cubre dos de seis fases de la metodología."
  puntos_oscuros: >
    Llama la atención que el artículo presente como 'gemelo digital' un sistema cuyo componente físico no existe todavía y que las funciones de transferencia se evalúen mejor justamente en los niveles bajos del edificio, donde la respuesta es menos compleja y de menor interés para detectar daño en la torre y en las bóvedas. Una explicación plausible es que el RMSE normalizado favorece las señales de menor amplitud y variabilidad, y que la dificultad de predecir esfuerzos en niveles altos refleja efectos no lineales y de amplificación que el modelo de entrada con tres componentes captura mal. Esto sugiere que la ubicación de sensores recomendada por el desempeño del LSTM (priorizar niveles bajos) puede entrar en conflicto con la ubicación recomendada por la demanda de ingeniería (regiones de interés en la torre y la nave), de modo que la decisión de instrumentación necesita un criterio conjunto de información sobre daño y de costo, y no solo la minimización del error de reconstrucción. Además, la ausencia de cualquier consideración económica o de continuidad de uso indica que el marco ICR se concentra en la protección del bien y no en la recuperación de la actividad que alberga.
  ideas:
    - "Criterio conjunto de ubicación de sensores: formular la selección de los 25 puntos de control como un problema de optimización multiobjetivo que combine la información sobre estados de daño (derivas e índices de esfuerzo de los gráficos IDF), el error de reconstrucción del LSTM y el costo de instalación y mantenimiento, y comparar el resultado con la ubicación propuesta por los autores. Fundamento: los autores observan que la fidelidad de la señal es mayor en niveles bajos, pero las regiones de interés críticas están en la torre. Verificabilidad: repetir el ejercicio con el mismo modelo 3DEC y validar con una campaña corta de vibración ambiental en la basílica. Utilidad: ofrece un método transferible para instrumentar edificios con presupuesto limitado."
    - "Conversión del gemelo estructural en indicador de continuidad: asociar los estados de daño estimados por el gemelo (grietas, derivas, esfuerzos) con curvas de funcionalidad y tiempos de inhabilitación, y con el costo de interrupción de las actividades que alberga el edificio (culto, turismo, servicios), para obtener un tiempo de recuperación esperado por escenario. Fundamento: el artículo sitúa el gemelo en un marco de resiliencia circular pero no vincula daño con uso. Verificabilidad: reconstrucción retrospectiva del sismo de Ica de 2007 con registros de uso y reparación disponibles. Utilidad: permite justificar económicamente la instrumentación y vincula este eje con el tema de recuperación productiva del corpus."
  relaciones:
    - "Calidad de las propiedades de los materiales (condiciona) la fiabilidad de las funciones de transferencia entrenadas con el modelo: si la rigidez y la resistencia reales difieren de las supuestas, la relación entre movimientos y esfuerzos aprendida no se traslada a la estructura física."
    - "Ubicación de sensores en niveles bajos (reduce) el error de reconstrucción pero (puede limitar) la detección de daño en la torre y en las bóvedas, donde el artículo identifica las regiones de mayor demanda."
  robustez: [5, 4, 3, 3]
  valor: [6, "Aporta un procedimiento detallado y reproducible en su lógica para definir instrumentación de un gemelo digital sísmico en estructuras de mampostería, con cifras de rango de sensores y modelos de transferencia. Su valor para el corpus es como referencia del componente físico y de datos del gemelo; se reduce porque no hay datos de campo, ni validación de la red de sensores, ni vínculo con costos o con continuidad de operaciones."]
  conexiones: []
socratica:
  p1: "'Gemelo digital' es un modelo virtual de la estructura acoplado a sensores que lo actualizan; 'resiliencia circular inteligente' es un marco de tres etapas y tres niveles sin indicadores definidos."
  p2: "Supone que el modelo con propiedades de la literatura representa la estructura, que las salidas simuladas son un sustituto adecuado de datos reales para entrenar las funciones de transferencia y que los registros elegidos cubren la demanda esperada."
  p3: "La evidencia es la comparación cualitativa con daño histórico, la coincidencia de periodos y masa entre modelos, y el RMSE de modelos LSTM entrenados con salidas simuladas; no hay datos de sensores."
  p4: "Si es cierto, instrumentar un edificio patrimonial puede planificarse antes de instalar sensores y con rangos definidos; si es falso, se podrían instalar sensores en puntos y con características no adecuadas para detectar daño real."
  p5: "No se discuten casos de edificios patrimoniales con redes de sensores de bajo costo que hayan logrado detección de daño sin un gemelo numérico detallado, ni la comparación con ubicación óptima por métodos de teoría de la información."
  p6: "Alternativas: que un modelo más simple calibrado con vibración ambiental sea suficiente; que la dispersión de materiales explique el desempeño más que la arquitectura de la red; que el valor del gemelo dependa de datos de uso y no solo de estructura."
