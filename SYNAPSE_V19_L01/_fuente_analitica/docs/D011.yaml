doc_id: D011
relevancia: "Núcleo"
relevancia_just: "Modela explícitamente el tiempo de recuperación de empresas tras un sismo (tiempos de inactividad físicos y no físicos y tácticas de mitigación), con datos observados del terremoto de Christchurch de 2011; es el documento más cercano al eje de recuperación productiva."
cluster_tema: "Recuperación empresarial posterior a sismos y modelos de interrupción"
metodo_tipo: "Marco analítico + evaluación retrospectiva con datos de 22 empresas"
tipo_recurso: "Artículo científico (journal peer-reviewed)"
kw_inferidas: [interrupción de negocios, tiempo de recuperación, Christchurch 2011, cordón de acceso, interrupción de servicios públicos, interrupción de proveedores, tácticas de resiliencia, REDi, tiempo de inactividad, resiliencia empresarial]
c2:
  objetivo: >
    Desarrollar un marco analítico para modelar el tiempo de recuperación de las empresas después de eventos sísmicos, que considere múltiples tipos de inactividad inducida por el terremoto (recuperación del edificio, interrupción del vecindario por cordones de acceso, interrupción de servicios públicos, interrupción de proveedores e inaccesibilidad de empleados) y las tácticas que las empresas emplean para mitigarlos, y evaluar su capacidad de explicar tiempos de recuperación observados frente al uso habitual de la inactividad del edificio como aproximación, con el propósito de aportar un vínculo entre la ingeniería de recuperación física y la perspectiva económica de la continuidad de negocio.
  pregunta: >
    [INFERIDA] ¿En qué medida considerar tipos de inactividad no físicos y tácticas de mitigación acerca el tiempo de recuperación calculado de las empresas al tiempo observado, en comparación con usar la inactividad del edificio donde se ubican como sustituto?
  marco: >
    El marco articula la ingeniería sísmica de recuperación funcional (metodología REDi del Arup, procedimiento simplificado FEMA P-58) con la economía de la resiliencia a nivel de empresa. Adopta de Rose y Huyck las tácticas de resiliencia estática y dinámica (reubicación, efectividad de gestión, aceleración de la recuperación, independencia de ubicación, servicios de respaldo, independencia de servicios, conservación y sustitución de importaciones) y los factores de reducción de pérdida directa por propiedad. Se conecta con estudios de Kajitani y Tatano sobre pérdida de capacidad productiva por fallas de instalaciones y líneas vitales, con Almufti et al. sobre seguimiento de empresas y con Cutfield et al. sobre pérdidas por interrupción. El paradigma es determinista y de ingeniería con dato socioeconómico, de tipo 'max-min' de tiempos de bloqueo, y considera la recuperación como un estado binario de cierre temporal.
  metodologia: >
    El marco modela cinco tipos de inactividad no mitigada (DT*1 a DT*5) y ocho factores de mitigación que reducen cada inactividad de forma multiplicativa (ecuación 2); para servicios públicos se toma el máximo entre los servicios afectados (ecuación 3), y la recuperación de la empresa es el máximo de las inactividades mitigadas (ecuación 4). La evaluación usa las bases de la encuesta del proyecto Economics of Resilient Infrastructure (ERI), la base CEBA de evaluaciones de edificios y una base de investigación de Kim, vinculadas por dirección. De ellas se obtienen 22 empresas, de 1 a 5.500 empleados y 13 sectores industriales. El tiempo de recuperación del edificio se predice con REDi a partir de sistema lateral, época de diseño, ocupación, pisos, periodo fundamental y área, con movimientos del suelo interpolados con un modelo empírico; los cordones se toman de fechas de levantamiento; las interrupciones de servicios se codifican (horas se descartan, días = 7, semanas = 14, meses = 30) y la interrupción de proveedores se fija en 45 días si fue moderada o muy disruptiva. Los factores de mitigación se activan según las respuestas del cuestionario; efectividad de gestión (0,12) y aceleración de la recuperación (0,15) toman medianas de Rose y Huyck, y los demás eliminan su inactividad asociada. El tiempo observado es la duración del cierre temporal (pregunta 13b). Las métricas son la raíz del error cuadrático medio (RMSE) y el error absoluto mediano (MdAE).
  resultados: >
    Con el tiempo de recuperación del edificio sin mitigación como estimador, RMSE = 144,0 días y MdAE = 76,0 días; con los factores de mitigación, RMSE = 105,1 y MdAE = 17,8 (reducciones de 27 % y 77 %). Al añadir los cordones, RMSE = 37,0 y MdAE = 9,3 (reducciones de 65 % y 48 % respecto del paso anterior). Al añadir la interrupción de servicios, RMSE = 36,9 y MdAE = 8,5 (menos de 1 % y 9 %), y con proveedores, RMSE = 35,9 y MdAE = 8,5 (3 % menos). En conjunto, el RMSE desciende 75 % y el MdAE 89 % respecto del uso exclusivo del tiempo de recuperación del edificio sin mitigación. La interrupción de la mayoría de las empresas queda determinada por la inactividad del edificio mitigada y luego por la de servicios públicos; los cordones determinaron la recuperación de solo dos empresas, aunque su inclusión redujo mucho los errores. En el ejemplo de la empresa de hospitalidad (concreto, 10 pisos), la inactividad del edificio fue de 140 días (105 con mitigación), el cordón de 562 días, la de servicios de 14 días (0 con respaldo) y la de proveedores de 45 días (0 por conservación); la predicción fue de 562 días frente a 561 observados.
  discusion: >
    Los autores concluyen que el tiempo de recuperación calculado con todos los tipos de inactividad y mitigación se alinea de forma significativa mejor con los observados que la inactividad del edificio, lo que muestra la influencia de factores no edilicios, y que el marco crea un vínculo entre la perspectiva de ingeniería (inactividad de estructuras e infraestructura) y las perspectivas económicas y sociales. Destacan que la mejora sería menor en un ejercicio predictivo porque las fechas de reubicación y los cordones eran conocidos y la interrupción de servicios y proveedores se estimó con datos observados posteriormente. Proponen usar modelos probabilistas (REDi, HAZUS, modelos de servicios de Kammouh et al., modelos de cadena de suministro) para predecir eventos futuros, y reconocen que tratar la recuperación como estado binario omite su dinámica, que podría capturarse si inactividades y factores fueran funciones del tiempo.
  limitaciones: "Declaradas: la recuperación se trata como un estado estático 'todo o nada'; no se incluyen la interrupción de empleados ni la sustitución de importaciones por falta de datos; las inactividades de servicios y proveedores se estiman con datos observados después del evento; las fechas de reubicación y de los cordones eran conocidas."
  futuro: "Aplicar el marco con modelos probabilistas para predecir recuperación en eventos futuros, definir inactividades y factores de mitigación como funciones del tiempo para capturar trayectorias de recuperación y añadir inaccesibilidad de empleados mediante modelos de transporte."
c3:
  tesis: >
    La recuperación de una empresa tras un sismo depende de varios tipos de inactividad y de tácticas de mitigación, y modelarlos juntos reproduce mucho mejor los tiempos de cierre observados que usar el tiempo de reparación del edificio como sustituto.
  antitesis: >
    La mejora se evalúa retrospectivamente con 22 empresas, sin validación fuera de muestra ni intervalos de incertidumbre, y los insumos de varios componentes proceden de las mismas encuestas que contienen los resultados (utilidades, proveedores, reubicación, cordones), de modo que parte del ajuste es circular. La reducción de 65 % del RMSE al incluir cordones depende de solo dos empresas con cordones de varios cientos de días, es decir, de valores atípicos. Los factores de mitigación se asignan por reglas binarias derivadas de respuestas 'moderada o muy importante' y se valoran con constantes (0,12, 0,15 o eliminación total), sin calibración ni sensibilidad. Las cifras de sectores de la muestra suman 30 empresas, no 22, lo que sugiere un error de reporte. La recuperación se mide como cierre temporal en días y no como regreso a niveles de producción, por lo que no captura el éxito a largo plazo.
  sintesis: >
    El estudio aporta una estructura creíble y transparente de recuperación empresarial en la que el máximo de tiempos de bloqueo gobierna, y demuestra que el edificio no es el único cuello de botella. Su valor es de especificación y no de predicción: indica qué variables medir y cómo combinarlas, pero no puede usarse sin calibración con más datos. La síntesis consiste en mantener la lógica de máximo de bloqueos y reemplazar las constantes de mitigación por parámetros estimados con muestras mayores y con incertidumbre explícita, además de incorporar datos de sensores y de servicios para alimentar los componentes de inactividad.
  areas_grises:
    - "Inconsistencia en la muestra: el texto declara 22 empresas en 13 sectores y lista conteos por sector (5, 5, 3, 3, 3, 3, 2, 1, 1, 1, 1, 1, 1) que suman 30; no se explica si hay empresas con varias sedes o un error de reporte, lo que afecta la interpretación de las métricas."
    - "Circularidad de insumos: las interrupciones de servicios y de proveedores se codifican a partir de respuestas de la misma encuesta que contiene el tiempo de recuperación observado, y las fechas de reubicación y los cordones se conocían a posteriori; los autores admiten que la mejora no se mantendría en predicción."
    - "Peso de valores atípicos: los cordones solo gobiernan la recuperación de dos empresas, pero reducen 65 % el RMSE; no se informan resultados sin esas dos empresas ni intervalos de confianza, y el MdAE cambia menos."
    - "Calibración de factores: los factores 0,12 y 0,15 provienen de medianas de pérdida de propiedad directa (Rose y Huyck) y los demás se fijan en eliminar toda la inactividad; no se contrastan con datos de recuperación empresarial ni se prueba su sensibilidad."
    - "Definición del resultado: el tiempo observado es la duración de un cierre temporal; no incluye reducción parcial de operaciones ni reapertura gradual, por lo que no mide recuperación productiva sino reapertura."
  puntos_oscuros: >
    Resulta llamativo que la inclusión de servicios públicos mejore el MdAE solo en 9 % y el RMSE en menos de 1 %, aunque la literatura y las entrevistas con empresas destacan la dependencia de servicios. Una interpretación es que en Christchurch las interrupciones de servicios fueron de pocos días (cuatro de electricidad, nueve de comunicaciones, catorce de gas), por lo que rara vez superaron el tiempo del edificio o del cordón; en contextos con redes más frágiles, como muchas ciudades latinoamericanas, el componente de servicios gobernaría más casos. El resultado es entonces dependiente del contexto y no una propiedad general. Asimismo, el hecho de que la mayoría de las empresas sean gobernadas por el edificio mitigado sugiere que las tácticas de mitigación no-edilicias tendrían un efecto limitado en este conjunto, algo que contradice la narrativa de que 'los factores no físicos importan', y que solo se sostiene a través del caso de los cordones.
  ideas:
    - "Estimación bayesiana jerárquica de los factores de mitigación: reemplazar las constantes de mitigación por distribuciones estimadas a partir de datos de varias encuestas de recuperación (Christchurch 2010-2011, Kaikoura 2016, Chile 2010, Ecuador 2016), con efectos por sector y tamaño, y propagar la incertidumbre a la predicción del tiempo de cierre. Fundamento: el artículo reconoce que los factores se asumieron y que los sectores difieren. Verificabilidad: validación cruzada dejando fuera un evento y comparación del RMSE con el modelo de constantes. Utilidad: ofrece un instrumento calibrado para seguros, bancos y gobiernos que necesitan estimar interrupción de actividad."
    - "Gemelo de recuperación empresarial alimentado por sensores: usar medidores inteligentes, sensores de vibración y datos de transporte para estimar en tiempo casi real las inactividades de edificio, servicios y acceso de cada establecimiento y actualizar el máximo de bloqueos, de modo que el marco funcione como panel de seguimiento tras un evento. Fundamento: el marco ya diferencia las fuentes de inactividad y el texto admite que los datos son posteriores al evento. Verificabilidad: pilotear en un barrio con sensores y comparar el tiempo de reapertura predicho con el observado. Utilidad: focaliza apoyo en las empresas gobernadas por el componente que más pesa en cada caso."
  relaciones:
    - "Dependencia de la ubicación de la empresa (modula) el efecto del cordón: las empresas que declaran que 'mudarse no es una opción' quedan atadas a la duración del cordón, como en el ejemplo de hospitalidad con 562 días."
    - "Sector económico (se asocia con) el tipo de inactividad que gobierna la recuperación: el marco permite pero no prueba diferencias entre manufactura, comercio y servicios públicos; la muestra de 22 casos no admite contraste."
  robustez: [7, 5, 4, 3]
  valor: [8, "Es el documento con mayor afinidad directa con el eje del corpus: modela explícitamente recuperación empresarial tras un sismo con tipos de inactividad medibles y un resultado cuantitativo. Aporta una estructura de variables (edificio, cordón, servicios, proveedores, empleados, mitigaciones) reutilizable en gemelos digitales de recuperación y en diseño de políticas, aunque con evidencia empírica limitada a 22 casos de un contexto neozelandés."]
  conexiones: []
socratica:
  p1: "'Recuperación de la empresa' es el cierre temporal en días tras el sismo, y se aproxima como el máximo de inactividades mitigadas; 'mitigación' son tácticas de resiliencia que reducen cada inactividad."
  p2: "Supone independencia entre tipos de inactividad (se toma el máximo), efectos multiplicativos de las mitigaciones, equivalencia entre respuestas de encuesta y valores en días, y que los cierres temporales representan recuperación."
  p3: "La evidencia son 22 empresas de Christchurch con datos de encuesta y de edificios; mejora de RMSE de 144,0 a 35,9 días y de MdAE de 76,0 a 8,5 días."
  p4: "Si es cierto, los modelos de pérdidas deben incluir inactividades no físicas; si es falso, el edificio seguiría siendo un buen sustituto y el aporte sería marginal fuera de casos con cordones largos."
  p5: "Empresas con operación parcial, con múltiples sedes o recuperación gradual, y contextos con servicios frágiles, no están representados."
  p6: "Alternativas: modelos de simulación de agentes o de insumo-producto, modelos de supervivencia con covariables, modelos de capacidad funcional parcial."
