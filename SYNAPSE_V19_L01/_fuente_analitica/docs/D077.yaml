- 1
- 'TRL 2 con BRL 3 e IRL 1: marco sin validación, sin integración y con evidencia secundaria sobre adaptación empresarial.'
- Alta
- Datos primarios, definición operativa de IoT, aplicación a desastres físicos y medición de continuidad.
falacias:
- - Equivocación en el término IoT
  - Se identifican redes sociales, teléfonos y televisores inteligentes con el IoT de la cadena de valor (Sec. 4, p. 3; Sec. 5, p. 4)
  - El concepto cambia de sentido
- - Validación afirmada sin contraste
  - La sección de validación describe la pandemia y concluye que el marco demuestra buena utilización de IoT (Sec. 6, p. 7)
  - No hay prueba de efecto
- - Generalización desde un solo evento
  - Se transfiere el caso de compras en línea en la pandemia a desastres naturales, con mención de Japón y de incendios sin datos (Sec. 6, p. 7)
  - Un evento no establece una regla
recomendacion: Rechazar como evidencia (usar solo como hipótesis)
