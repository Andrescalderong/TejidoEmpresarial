  valor:
  - 5
  - Aporta un marco conceptual que une empresas, comunidad y gobierno con información por IoT y redes sociales, ocho fuentes de riesgo de la cadena de suministro y cuatro pasos de acción, con cifras secundarias del caso de compras en línea durante la pandemia (57 % de apoyo a minoristas locales, 73 % de pequeñas y medianas empresas que cambiaron su modelo). Su valor para el corpus es moderado porque el marco no se valida, el IoT se confunde con redes sociales y dispositivos de consumo, el caso es una pandemia y no un desastre físico y no hay mediciones de impacto, pero tiende un puente hacia la continuidad empresarial y el apoyo público.
