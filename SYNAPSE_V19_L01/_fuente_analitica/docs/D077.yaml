doc_id: D077
relevancia: Adyacente
relevancia_just: Propone un marco conceptual de gestión de riesgos de cadenas de suministro en desastres en el que el IoT y las redes sociales permiten la colaboración entre empresas, comunidad y gobierno, e ilustra el marco con el caso de las compras en línea durante la pandemia de COVID-19 en Australia, con cifras secundarias de encuestas de correos y estadísticas oficiales. Aborda de forma explícita la interrupción y la continuidad empresarial ante desastres y el papel de la información y del apoyo público, pertinente para el corpus, aunque no trata sismos ni gemelos digitales, el IoT se confunde con redes sociales y dispositivos de consumo y el marco no se valida.
cluster_tema: Gestión de riesgos de cadena de suministro en desastres con IoT, redes sociales y colaboración empresa-comunidad-gobierno
metodo_tipo: Marco conceptual con ilustración por caso a partir de datos secundarios abiertos sobre compras en línea durante la pandemia de COVID-19 en Australia
tipo_recurso: Artículo conceptual (journal peer-reviewed, acceso abierto)
kw_inferidas:
- gestión de riesgos de cadena de suministro
- IoT
