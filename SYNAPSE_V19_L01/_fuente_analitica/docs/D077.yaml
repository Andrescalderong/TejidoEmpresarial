socratica:
  p1: '''Gestión de riesgos de la cadena de suministro'' es la coordinación entre socios para asegurar rentabilidad y continuidad; ''IoT'' se define como tecnología que comunica información en tiempo real por la cadena de valor; ''colaboración'' involucra a empresas, comunidad y política; ''resiliencia'' es la capacidad de empresas y comunidad de absorber la perturbación.'
  p2: Supone que las redes sociales son parte del IoT, que la información gubernamental es confiable, que el caso de la pandemia se transfiere a desastres físicos y que la colaboración mejora la continuidad.
  p3: La evidencia son cifras secundarias de encuestas e informes sobre compras en línea y política pública en Australia, y la narración de la respuesta durante la pandemia.
  p4: Si es cierto, una red de información validada reduce la incertidumbre y facilita decisiones de empresas y comunidades; si es falso, el marco puede dar una falsa seguridad ante desastres que dañan la infraestructura de comunicación.
  p5: No se examinan datos primarios, mediciones de efecto, desinformación, brechas digitales, costos para las empresas ni desastres físicos.
  p6: 'Alternativas: que el efecto provenga de los subsidios y no de la información; que sensores y datos operativos importen más que redes sociales; que la colaboración dependa de la confianza previa y no de la tecnología.'
