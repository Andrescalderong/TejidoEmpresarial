- continuidad empresarial
c2:
  objetivo: 'Proponer un marco que muestre cómo las empresas o los actores de la cadena de suministro pueden colaborar con la comunidad y el gobierno en la gestión de riesgos de la cadena de suministro en desastres, con apoyo del Internet de las cosas (IoT) y de las redes sociales, que se consideran mecanismos para que el gobierno garantice la confiabilidad de la información, para que la comunidad exprese necesidades y para que las empresas se adapten a preferencias cambiantes bajo amenazas. El estudio sostiene que las empresas deben tener un plan de mitigación actualizado y que la colaboración comunitaria y el liderazgo gubernamental, financiero y no financiero, construyen una sociedad resiliente.

    '
  pregunta: 'El artículo no formula preguntas de investigación explícitas. La pregunta implícita, formulada hacia el final de la sección del marco, es cómo un marco de colaboración con IoT puede ayudar a reducir el impacto de los riesgos al integrar a empresas, comunidad y responsables de política en una sola red de información.

    '
  marco: 'El marco redefine la gestión de riesgos de la cadena de suministro como la gestión de riesgos mediante la coordinación entre todos los socios, a fin de crear una perspectiva dinámica de creación y transferencia de conocimiento y asegurar la rentabilidad y la continuidad. Identifica ocho fuentes de riesgo (de suministro, operativos, de demanda, de seguridad de la información, macroeconómicos, de política, competitivos y de recursos), define el IoT como tecnología que comunica información relevante en tiempo real a lo largo de la cadena de valor y trata las redes sociales como herramienta de comunicación habilitada por el IoT. La coordinación política se justifica porque la interrupción de un actor interrumpe a otros y la asignación de recursos afecta el bienestar comunitario, de modo que el gobierno actúa como negociador y proveedor de subsidios.

    '
  metodologia: 'El estudio usa datos abiertos y reportes publicados en internet como encuestas de la International Post Corporation y de Australia Post, estadísticas de la oficina de estadísticas de Australia y documentos de gobierno, para analizar las compras en línea durante la pandemia de COVID-19 como caso. Se examinan tres actores: la comunidad (pánico de compra, cambio de demanda y de dispositivos), las empresas (adopción de canales en línea, entrega e información en tiempo real y planes flexibles) y los responsables de política (apoyo financiero, información y regulación). El marco se representa en un esquema de flujos de materiales, información e intervención política y en cuatro pasos: recolectar, validar y difundir la información necesaria por redes sociales; comunicar y actualizar el nivel de riesgo y su impacto; desarrollar e implementar planes de mitigación; y fomentar el apoyo y la resiliencia de la comunidad y de las empresas. La sección de validación discute el caso de la
    pandemia sin pruebas formales.

    '
  resultados: Los resultados del caso indican que, durante la pandemia, las compras en línea se desplazaron de minoristas internacionales a nacionales, que 57 % de los compradores comenzó a apoyar a minoristas locales y que 73 % de las pequeñas y medianas empresas australianas cambió su modelo de operación para fortalecer la resiliencia, que el uso del teléfono móvil para comprar pasó de 87 % en 2019 a 91 % en 2020 y que los televisores inteligentes llegaron a 60 %. La satisfacción mostró mayor margen de mejora en el rastreo y la velocidad de entrega que en el lugar, el costo y la devolución. El desempleo alcanzó 13,8 % en el segundo trimestre de 2020 y 1,8 millones de personas redujeron su trabajo, el gobierno australiano estableció el programa JobKeeper entre marzo de 2020 y marzo de 2021, y la Unión Europea un plan de recuperación con 1,8 billones de euros. El texto concluye que el marco aprovecha el IoT y las redes sociales para la colaboración en la mitigación y que la información debe
    validarse. No hay mediciones de efecto del marco sobre pérdidas, tiempo de recuperación o continuidad. Las figuras muestran la comparación entre minoristas nacionales y extranjeros y las formas de compra.
  discusion: 'El artículo sostiene que los países que enfrentaron bien la pandemia mostraron alta conciencia empresarial, adaptación rápida y resiliencia, y que algo similar ocurre con los terremotos en Japón, por los simulacros periódicos, y con los incendios forestales en Australia. Afirma que una fuente de redes sociales establecida por el gobierno se considera confiable para la comunidad y las empresas, que el gobierno puede centralizar el liderazgo en un desastre y regular a las empresas para el mejor resultado comunitario, y que el marco ayuda a investigadores y profesionales a acceder con rapidez a información priorizada de muchas fuentes. El texto reconoce cuellos de botella de entrega durante el cierre y la necesidad de una red de cadena de suministro diseñada de forma sistemática, como puntos de recogida cercanos.

    '
  limitaciones: 'Declaradas: el texto no incluye una sección de limitaciones. No declaradas: el marco no se prueba con datos de efecto, de modo que la validación consiste en una discusión del caso de la pandemia; los datos son secundarios, de encuestas de cobertura y metodología no descritas, y la fuente primaria que se menciona en la introducción como encuesta abierta no se presenta; el IoT se asimila a redes sociales, teléfonos móviles y televisores inteligentes, lo que no es el IoT de sensores y dispositivos conectados; un solo país y un solo evento, que es una pandemia y no un desastre físico con daño a infraestructura; las referencias a terremotos en Japón y a incendios en Australia son afirmaciones sin datos; no se discuten la desinformación, la brecha digital salvo una mención de personas mayores ni el costo para las empresas; no se estiman pérdidas, tiempos de recuperación o resultados de las políticas.'
  futuro: 'Explícito: no se presenta una sección de trabajo futuro. Implícito: validar el marco con datos primarios de empresas y comunidades, aplicarlo a desastres físicos como terremotos e incluir sensores y dispositivos IoT en la información compartida.'
c3:
  tesis: 'Integrar a empresas, comunidad y gobierno en una red de información sostenida por el IoT y las redes sociales, con información validada, planes de mitigación flexibles y apoyo público financiero y no financiero, mejora la gestión de riesgos de la cadena de suministro en desastres y la resiliencia, como lo ilustra el caso de las compras en línea durante la pandemia de COVID-19 en Australia, donde 73 % de las pequeñas y medianas empresas cambió su modelo de operación y 57 % de los compradores apoyó a minoristas locales.

    '
  antitesis: 'El marco no se valida, ya que la sección de validación narra la pandemia sin contrastar hipótesis ni medir resultados, y los datos provienen de fuentes secundarias de cobertura desconocida. El IoT se identifica con redes sociales, teléfonos y televisores inteligentes, y la relación entre sensores conectados y el marco no se desarrolla. La pandemia es un evento con una estructura distinta de la de un desastre físico, que destruye infraestructura y comunicaciones, por lo que su transferencia a terremotos queda afirmada sin evidencia. La confianza en las redes sociales del gobierno se supone, no se discuten la desinformación ni la brecha digital, y las cifras de compras en línea no permiten inferir efectos de la colaboración sobre la continuidad.

    '
  sintesis: 'La contribución sostenible es una estructura conceptual de tres actores, ocho fuentes de riesgo y cuatro pasos de información que recuerda que la continuidad empresarial depende de la información validada y del apoyo público, y que la demanda y la logística cambian en los desastres. Para el corpus, aporta una conexión entre resiliencia empresarial, información y gobierno que los estudios técnicos de gemelos y sensores omiten. No obstante, es un marco sin prueba, con IoT definido de manera amplia, que requiere datos primarios de empresas, desastres físicos y mediciones de impacto, y puede servir como lista de variables para estudios que sí midan la recuperación.

    '
  areas_grises:
  - 'Concepto de IoT: el artículo define el IoT como una tecnología que comunica información en tiempo real en la cadena de valor, pero lo ejemplifica con plataformas de mensajería y redes sociales, teléfonos, computadores y televisores inteligentes de consumo, sin sensores ni dispositivos conectados de la cadena de suministro, de modo que el aporte específico del IoT al marco no se distingue del de las redes sociales.'
  - 'Validación del marco: la sección de validación sostiene que el marco demuestra buena utilización del IoT y de las redes sociales, pero se limita a describir la pandemia y la respuesta de las empresas y del gobierno; no se comparan casos con y sin colaboración, no se definen indicadores y no se mide el efecto sobre pérdidas, tiempo de recuperación o continuidad.'
  - 'Transferencia de la pandemia a desastres físicos: el estudio plantea el marco para desastres naturales y pandemias, pero la evidencia es de compras en línea durante cierres; en un terremoto fallan la energía, las comunicaciones y las vías, y la información por redes sociales puede no estar disponible, condición que el marco no analiza.'
  - 'Confiabilidad de la información: se afirma que la información del gobierno en redes sociales es confiable y debe validarse, pero no se discuten mecanismos de validación, el riesgo de desinformación en emergencias ni el hecho de que la población mayor use medios tradicionales, que el artículo solo menciona al pasar.'
  puntos_oscuros: 'Llama la atención que la introducción indique que el estudio usa datos de una encuesta abierta para descubrir cómo se coordinan comunidad, empresas y gobierno, y que el cuerpo del artículo no presente ninguna encuesta propia ni analice los microdatos, sino cifras de informes de terceros. También es notable que el marco proponga que el gobierno regule y limite a las empresas, como las restricciones de aforo y de ciertos bienes, sin evaluar los costos para las pequeñas empresas, y que se describa a las políticas como una mano invisible. El texto afirma que los países con menor proporción de compras en línea tuvieron el mayor aumento, sin datos. La mención de los simulacros en Japón como fuente de resiliencia no se respalda con referencias específicas. Además, la sección de marco enumera ocho riesgos que no se conectan con los cuatro pasos de acción. Por último, el artículo no incluye ni una sección de limitaciones ni una de trabajo futuro, de modo que no se señala qué falta
    por demostrar.

    '
  ideas:
  - 'Encuesta primaria a empresas tras una interrupción: aplicar una encuesta a 200 o más pequeñas y medianas empresas de una zona que sufrió un evento extremo reciente (sismo, inundación) sobre las fuentes de información que usaron (autoridades, redes sociales, sensores, proveedores), su confianza en cada una, las decisiones que tomaron y los días que tardaron en reanudar operaciones, y estimar con regresión la asociación entre calidad de la información y tiempo de reapertura. El resultado permitiría contrastar de forma empírica la premisa del marco y señalar qué canales de información acortan la interrupción. Los datos se anonimizarían y se compartirían.'
  - 'Protocolo de información validada gobierno-empresa: diseñar y probar en un simulacro con 30 empresas un canal único en el que la autoridad publica alertas validadas de acceso, energía y cierres, y los sensores de las empresas reportan su estado, con medición del tiempo de difusión, del porcentaje de empresas que actúan según la información y de los rumores circulantes. Con ello se podría evaluar si el esquema reduce las decisiones erróneas y el tiempo de reapertura, y qué parte de la población empresarial no se alcanza por brechas digitales, información útil para políticas de apoyo a la recuperación. Se documentaría el costo de operar el canal.'
  relaciones:
  - 'Resiliencia de cadenas de suministro y gemelos (complementa) D081 y D082: D081 revisa si el gemelo digital mejora la resiliencia de cadenas de suministro y D082 los mecanismos de resiliencia organizacional; D077 aporta la perspectiva de colaboración con la comunidad y el gobierno y la información pública.'
  - 'Industria 4.0 y resiliencia ante desastres (se relaciona con) D099 y D074: D099 revisa Industria 4.0, gestión del riesgo de desastres y resiliencia, y D074 propone indicadores de resiliencia en gemelos IoT; D077 muestra que la resiliencia empresarial en desastres también depende de actores y políticas externas.'
