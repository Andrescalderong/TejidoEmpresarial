doc_id: D013
relevancia: "Núcleo"
relevancia_just: "Revisión sistemática de gemelos digitales para gestión de riesgo posdesastre (respuesta y recuperación) y alerta temprana, con propuesta de marco que incluye entidades económicas y cadenas de suministro; identifica la recuperación como fase desatendida."
cluster_tema: "Gemelos digitales para gestión posdesastre y recuperación"
metodo_tipo: "Revisión sistemática (Kitchenham) con propuesta de marco conceptual"
tipo_recurso: "Artículo científico (journal peer-reviewed)"
kw_inferidas: [gemelo digital, gestión de riesgo posdesastre, alerta temprana, recuperación, sombra digital, aprendizaje automático, IA explicable, sensado remoto, sensado social, ciudades inteligentes]
c2:
  objetivo: >
    Explorar los logros actuales, los desafíos y el potencial no aprovechado de los gemelos digitales (GD) en la gestión de riesgo posdesastre (PRM) y en los sistemas de alerta temprana (EW), y proponer un marco conceptual mejorado de 'gemelo digital de gestión de riesgo posdesastre' (DPRMT) que ofrezca a los decisores modelación detallada y en tiempo real sobre las zonas y comunidades afectadas, con integración de aprendizaje automático e inteligencia artificial. La revisión sintetiza 96 estudios para responder cinco preguntas sobre países, tipos de desastre, métodos y datos de recolección, algoritmos de aprendizaje automático y direcciones de investigación.
  pregunta: >
    RQ1: ¿Qué países y casos de estudio contribuyen al uso de DPRMT y EW? RQ2: ¿Qué tipos de desastre y dominios abordan? RQ3: ¿Qué métodos y tipos de datos se usan? RQ4: ¿Qué algoritmos de aprendizaje automático se usan? RQ5: ¿Cuáles son las direcciones, los logros y los retos de investigación?
  marco: >
    El marco combina la teoría del riesgo de desastres (riesgo = amenaza × exposición × vulnerabilidad, según las definiciones de las Naciones Unidas), el ciclo de gestión de desastres (prevención, mitigación, preparación, alerta temprana, respuesta y recuperación), el Marco de Sendai 2015-2030 y el concepto de gemelo digital de Grieves (2002) con los hitos de la NASA y la Fuerza Aérea de Estados Unidos. Distingue modelo digital, sombra digital y gemelo digital según el sentido del flujo de datos, y adopta la idea de ciudad inteligente como fuente de datos. Propone un marco con seis componentes: entidades en riesgo, recolección y preprocesamiento de datos, procesamiento, modelado digital, decodificación de la información e interacción con el usuario. Se trata de un paradigma sistémico de integración tecnológica con orientación a decisiones.
  metodologia: >
    Revisión sistemática según Kitchenham et al. con cinco preguntas de investigación y una cadena de búsqueda de tres bloques (gestión posdesastre o términos de recuperación, tipos de amenaza y 'digital twin', 'smart city' o 'digital city'), aplicada en Scopus y Web of Science en abril de 2024 sin límite de fecha. Se identificaron 1.483 documentos (842 en Scopus y 641 en Web of Science), que quedaron en 185 y 127 tras leer títulos, palabras clave y resúmenes, y en 96 tras eliminar duplicados y aplicar nueve criterios de exclusión (no inglés, sin texto completo, GD mencionado solo brevemente, sin foco en desastres, sin aporte a PRM o EW, estudios de un solo edificio o infraestructura, efectos climáticos de largo plazo, estudios no urbanos y eventos específicos de edificios como incendios). Se incluyeron artículos de revisión y de modelos conceptuales. Se diseñó un formulario de extracción con atributos generales y específicos, y se analizaron los resultados con estadística descriptiva y síntesis narrativa. No se declara evaluación de calidad de los estudios ni concordancia entre revisores.
  resultados: >
    Los 96 estudios abarcan 28 países, con Estados Unidos (21), China (13), Reino Unido (9), Indonesia (7) y Corea del Sur (6) a la cabeza; 50 son artículos de revista, 42 de conferencia y cuatro capítulos de libro; IEEE aporta 33, MDPI 16 y Elsevier 15. Por tipo de documento, 58 son estudios de caso de PRM y cinco de EW, 26 son modelos conceptuales y solo siete son revisiones. Por amenaza, 32 estudios son multiamenaza, 32 tratan inundaciones, 13 incendios forestales, 10 sismos, seis huracanes y tres deslizamientos; ninguno se centra en tsunami, tifón ni volcán. Por dominio, 21 trabajan en gestión de desastres, 15 en alerta temprana, 11 en conciencia situacional, 10 en evacuación y solo tres en recuperación; solo seis examinan evaluación de daños y uno el impacto indirecto en precios de vivienda. Los datos provienen sobre todo de fuentes secundarias, seguidas de sensado remoto, modelado 3D, colaboración abierta, recolección manual, redes de sensores y sensado social. Solo un estudio con flujo dinámico de datos usa aprendizaje automático (redes neuronales convolucionales, LSTM, SVM, bosques aleatorios, entre otros). Los autores concluyen que la mayoría de los estudios son modelos digitales o sombras digitales sin sincronización bidireccional, dependen de una o dos fuentes de datos, omiten datos demográficos, financieros y sociales, y descuidan los sistemas interconectados y la recuperación.
  discusion: >
    Los autores sostienen que el campo de los GD para PRM es incipiente y que la literatura previa se limita a declaraciones generales. Proponen que un DPRMT con múltiples entidades en riesgo (vidas, edificios, hospitales, escuelas, infraestructura crítica, cadenas de suministro, redes sociales, patrimonio, ambiente, servicios públicos y sectores económicos), recolección diversa (sensado remoto, social, colaboración abierta, redes de sensores, recolección manual y modelado 3D), procesamiento con IA, validación, fusión y análisis de incertidumbre, modelos socioeconómicos, de IA, BIM, probabilísticos y físicos, y herramientas de interacción como realidad virtual podría apoyar evaluación de daños, asignación de recursos, evacuación, pruebas de escenarios y recuperación. Destacan la necesidad de IA explicable, recolección manual combinada con sensores y datos demográficos y financieros. Concluyen que las revisiones previas coinciden en la necesidad de explicabilidad, comprensión de comportamiento humano y manejo de datos y privacidad.
  limitaciones: "No se presenta una sección de limitaciones. Implícitas: marco propuesto sin validación empírica, exclusión de estudios de un solo edificio o infraestructura, restricción a inglés y a dos bases de datos, y ausencia de evaluación de calidad de los estudios."
  futuro: "Recolección de datos diversa y dinámica, incorporación de datos demográficos, financieros y de dinámicas sociales, modelos continuamente actualizados, integración de sistemas interconectados, atención a la fase de recuperación y desarrollo de IA explicable en DPRMT."
c3:
  tesis: >
    Los gemelos digitales tienen potencial para transformar la gestión posdesastre, pero la literatura existente es incipiente, estática y fragmentada; un marco integral (DPRMT) con datos diversos, dinámica social, sistemas interconectados e IA explicable puede cubrir esos vacíos, sobre todo en la fase de recuperación.
  antitesis: >
    El marco propuesto es una síntesis conceptual sin validación ni caso de aplicación, y se deriva de una literatura que, según los propios autores, está compuesta mayoritariamente por modelos digitales y sombras digitales que no son gemelos en sentido estricto; la revisión amplía el concepto al incluir cualquier estudio de 'smart city' o 'digital city'. Los criterios de exclusión (un solo edificio o infraestructura, eventos específicos de edificios) eliminan buena parte de los gemelos estructurales de sismos, de modo que el hallazgo de solo diez estudios sísmicos y tres de recuperación depende de esas reglas. No hay evaluación de calidad ni de sesgo, y la clasificación 'modelo, sombra o gemelo' se hace por juicio de los autores. La generalización de que 'previous studies are not beyond only providing general statements' no se sustenta con una medición de profundidad de los estudios.
  sintesis: >
    La contribución sólida de la revisión es el mapa cuantitativo de lo que existe (distribución por país, amenaza y dominio) y la identificación de la recuperación, los factores socioeconómicos y los sistemas interconectados como lagunas. El marco DPRMT debe entenderse como lista de requisitos y como hipótesis de diseño, no como solución validada. Para el corpus, la síntesis es operacionalizar la recuperación económica como entidad en riesgo con variables medibles y evaluar con casos si un gemelo con esas entidades mejora tiempos de respuesta y de reapertura frente a un tablero de sombra digital más simple, y documentar el costo de datos y de mantenimiento de cada alternativa para que la recomendación no dependa solo de la sofisticación técnica.
  areas_grises:
    - "Alcance del concepto 'gemelo digital': los autores definen el GD como sincronización bidireccional y reconocen que la mayoría de los estudios son modelos o sombras digitales, pero los incluyen como evidencia sobre 'DT' y no cuantifican cuántos cumplen la definición; la conclusión sobre el estado del GD resulta ambigua."
    - "Sesgos por criterios de exclusión: al excluir estudios de un solo edificio o infraestructura y los eventos específicos de edificios, se pierden aplicaciones de monitoreo estructural y de daño sísmico; el resultado de solo 10 estudios de sismo y tres de recuperación depende de esa decisión y de la cadena de búsqueda."
    - "Marco sin validación: el DPRMT enumera componentes, métodos y aplicaciones (damage assessment, casualty prediction, resource allocation) pero no define interfaces, requisitos de datos, costos ni un caso de uso piloto."
    - "Calidad de la evidencia: no se evalúa el riesgo de sesgo; 42 de 96 documentos son de conferencia y los casos se concentran en Estados Unidos y China; no se discuten diferencias de resultados por calidad ni se reportan tamaños de efecto."
  puntos_oscuros: >
    Resulta llamativo que solo tres estudios traten la recuperación cuando el propio marco declara que esa fase define el resultado global. Una explicación plausible es la dificultad de obtener datos en la recuperación: es larga, involucra procesos económicos y sociales y no ofrece señales de sensores tan directas como la respuesta, de modo que los gemelos basados en sensado y en simulación física son más fáciles de construir para la fase inmediata. El artículo recomienda recolección manual y datos demográficos, lo que indica que un gemelo de recuperación sería un sistema sociotécnico con encuestas y registros administrativos más que un sistema de sensores. Por tanto, la brecha en recuperación no es una omisión aleatoria, sino un síntoma de que los datos relevantes (ingresos, empleo, reapertura de empresas) están en manos de actores que no comparten con los desarrolladores de gemelos, de manera que la solución exige acuerdos de datos, estándares de interoperabilidad y mecanismos de confianza antes que más algoritmos.
  ideas:
    - "Prueba del 'umbral de gemelo' en la literatura: aplicar a los 96 estudios una lista de verificación de cuatro criterios (flujo de datos dinámico, sincronización bidireccional, modelo con actualización, uso en decisiones) y estimar cuántos son modelo, sombra o gemelo, con intervalos de confianza. Fundamento: la revisión afirma que casi todos son estáticos pero no lo cuantifica. Verificabilidad: dos codificadores independientes y cálculo de concordancia. Utilidad: mide la 'brecha de gemelización' del campo, orienta qué financiar y permite comparar con el corpus de este lote, además de proporcionar un indicador reproducible para repetir la medición en cinco años."
    - "Módulo de recuperación empresarial del DPRMT: añadir como entidades en riesgo las empresas y sus cadenas de suministro con variables de cierre, reapertura parcial, ventas, empleo y dependencia de servicios, alimentadas por registros mercantiles, facturación electrónica y encuestas rápidas, y acoplar el modelo de tiempos de inactividad (edificio, servicios, proveedores) a escenarios de intervención. Fundamento: el artículo enumera 'business and economic sectors' pero no los modela; estudios previos muestran que el tiempo de cierre depende de varios componentes. Verificabilidad: reconstrucción retrospectiva con un sismo reciente y comparación de reaperturas observadas y simuladas. Utilidad: orienta la asignación de apoyo a la recuperación productiva y permite justificar la inversión en datos de empresas antes de construir plataformas más complejas."
  relaciones:
    - "Disponibilidad de datos socioeconómicos (condiciona) la existencia de gemelos de recuperación: los datos de ingresos, empleo y reapertura de empresas están en poder de actores públicos y privados distintos, lo que limita la construcción de gemelos de esa fase."
    - "Interdependencia entre infraestructuras y cadenas de suministro (amplifica) los retrasos de recuperación: el artículo ejemplifica con Kobe (telecomunicaciones) y Wenchuan (transporte), pero no cuantifica la contribución de cada sistema al tiempo total."
  robustez: [6, 5, 3, 4]
  valor: [7, "Es una revisión reciente que cuantifica el estado de los gemelos digitales en gestión posdesastre y señala las lagunas más relevantes para el eje del corpus: recuperación, factores socioeconómicos y sistemas interconectados. Aporta una arquitectura de seis componentes aprovechable, aunque su valor se reduce por la falta de validación y por las decisiones de inclusión que debilitan la lectura sobre sismos."]
  conexiones: []
socratica:
  p1: "'Gemelo digital' es una representación virtual en tiempo real con flujo bidireccional de datos con el sistema físico; 'sombra digital' es solo flujo hacia el modelo; 'modelo digital' es estático."
  p2: "Supone que los estudios incluidos representan el campo, que la clasificación de los autores es correcta y que un marco integral es mejor que soluciones modulares."
  p3: "La evidencia son conteos de 96 estudios y una síntesis narrativa; el marco DPRMT no se contrasta con datos."
  p4: "Si es cierto, los gestores de desastres deben invertir en gemelos con datos diversos y atención a la recuperación; si es falso, se podría invertir en plataformas complejas sin demostrar ventaja sobre tableros más simples."
  p5: "Casos en que sistemas simples (sombras digitales o paneles) lograron los mismos resultados que un gemelo completo no se discuten."
  p6: "Alternativas: que la brecha en recuperación se deba a falta de datos y no de tecnología; que la integración de datos requiera gobernanza más que modelos."
