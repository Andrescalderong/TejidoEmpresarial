doc_id: D074
relevancia: "Adyacente"
relevancia_just: "Propone un marco para gemelos digitales basados en IoT sobre el modelo de referencia IoT-A, con requisitos de Industria 5.0 (sostenibilidad, centralidad en las personas y resiliencia) incorporados como metadatos de la información, y una prueba de concepto de un gemelo de monitoreo en un sistema de cultivo vertical aeropónico. Aporta una definición operativa de resiliencia de sistemas IoT con gemelo digital y una revisión de la literatura que concluye que casi no existen contribuciones sobre resiliencia en IoT-A, pertinentes para el corpus, aunque el caso es agrícola, no hay mediciones y no se trata ni sismos ni recuperación empresarial."
cluster_tema: "Marco IoT para gemelos digitales en Industria 5.0 con requisitos de resiliencia y sostenibilidad"
metodo_tipo: "Diseño de marco conceptual, revisión por citación hacia adelante de un proyecto de referencia y prueba de concepto en cultivo vertical sin resultados cuantitativos"
tipo_recurso: "Artículo científico (journal peer-reviewed, acceso abierto)"
kw_inferidas: [gemelo digital, IoT, Industria 5.0, IoT-A, resiliencia, sostenibilidad, centralidad en las personas, aeroponía, MQTT, modelo de dominio]
c2:
  objetivo: >
    Proponer un marco para el desarrollo e implementación de gemelos digitales basados en IoT, a partir del Modelo de Referencia Arquitectónica de IoT (IoT-A o IoT-ARM), proyecto financiado por la Unión Europea entre 2010 y 2013, de modo que incluya los aspectos de la Industria 5.0, a saber, la sostenibilidad, la centralidad en las personas y la resiliencia, que los autores consideran ausentes en los marcos existentes. El marco busca servir de referencia para diseñar arquitecturas IoT centradas en gemelos digitales que permitan la sostenibilidad, la resiliencia y la centralidad humana del sistema de información, y se prueba mediante un gemelo de monitoreo de un cultivo vertical y una discusión de aplicaciones en manufactura y servicios.
  pregunta: >
    El artículo no formula preguntas de investigación explícitas. Las preguntas implícitas son cómo contribuyeron los trabajos que citan IoT-A a los requisitos de la Industria 5.0 y a los gemelos digitales, cómo se pueden traducir la sostenibilidad, la centralidad humana y la resiliencia en requisitos y metadatos de un modelo de información IoT, y si el marco es aplicable a un caso real.
  marco: >
    El marco combina el modelo de referencia IoT-A, con sus modelos de dominio, de información y funcional, con el concepto de gemelo digital entendido como un conjunto de modelos adaptativos sincronizados con el sistema físico y con capacidad de actuar sobre él, distinto de la sombra digital de flujo unidireccional. La Industria 5.0, propuesta por la Comisión Europea en 2020, se define por la sostenibilidad, la centralidad en las personas y la resiliencia, esta última entendida como producción robusta capaz de resistir perturbaciones y sostener infraestructura crítica. Los autores derivan requisitos no funcionales y los asocian a indicadores: para la sostenibilidad, indicadores ambientales (huella de carbono, energía por mensaje) y económicos (costo de información); para la resiliencia, la capacidad de adaptarse a perturbaciones, un nivel suficiente de escalabilidad y la calidad estimada de los datos enviados; para la centralidad humana, el grado de participación y el impacto sobre las personas.
  metodologia: >
    La revisión de literatura siguió un proceso de citación hacia adelante en Scopus a partir del libro de IoT-A: se encontraron 237 documentos que citan el libro y 88 que citan capítulos, para 325, de los cuales un filtrado manual por título dejó 109 sin duplicados (32 artículos, 52 ponencias, 3 revisiones, 12 capítulos, 2 libros y 1 estudio), un filtrado por resumen dejó 28 que tocan gemelos digitales, Industria 5.0, sostenibilidad, centralidad humana o resiliencia, y una revisión profunda identificó cuáles contribuyen al modelo. El marco se construyó adaptando los modelos de dominio, de información y funcional, reemplazando la gestión de entidades virtuales por gestión de gemelos digitales en el modelo funcional de ocho grupos y añadiendo un bloque de metadatos de Industria 5.0 a los atributos del gemelo. La prueba de concepto es un módulo de cultivo aeropónico de lechuga con sensores de pH, conductividad eléctrica, nivel de agua, radiación fotosintéticamente activa, CO2, temperatura y humedad, un computador Raspberry Pi con el programa Mycodo, actuadores (calentador, humidificador, luces y bombas dosificadoras) y una plataforma IoT con MQTT, base de datos, analítica, tablero y módulo de gemelo.
  resultados: >
    Los resultados de la revisión indican que, de los 28 documentos revisados en profundidad, solo 5 mencionan el concepto de gemelo digital y 2 lo tratan con aportes significativos, 11 introducen IoT-ARM y 3 hacen aportes considerables, y 11 tocan conceptos de Industria 5.0, pero ninguno la menciona de forma explícita, solo la sostenibilidad (2) y la centralidad humana, y no se encontraron contribuciones directas a la resiliencia. El marco resultante define un modelo de dominio con entidad física, entidad virtual, dispositivo inteligente, recursos y servicios, un modelo de información con atributos de entidad virtual y metadatos generales y de Industria 5.0, y un modelo funcional con ocho capas. En el caso, el gemelo de una planta de lechuga agrupa los atributos en ambientales, de productividad (peso fresco y seco, diámetro del tallo, área foliar), de calidad y de sostenibilidad ambiental, y para cada pilar de Industria 5.0 se consideran dos métricas: grado de participación humana e impacto en las personas, costo promedio por bit entregado y energía por bit, y escalabilidad y tolerancia a fallas. Los buses Modbus e I2C admiten hasta 255 dispositivos. El artículo no entrega mediciones del sistema, errores de predicción, ahorros, tiempos de respuesta ni evidencia de resiliencia.
  discusion: >
    Los autores sostienen que el marco ofrece una colección estandarizada de instrumentos arquitectónicos que asegura interoperabilidad, compatibilidad y escalabilidad, que el modelo de dominio es robusto en distintos dominios, como la agricultura inteligente y las fábricas inteligentes, y que la capa de gestión del modelo funcional da el carácter de Industria 5.0, pues allí se supervisan el reporte de errores para la resiliencia, la salud del sistema para la sostenibilidad y las decisiones estratégicas. Reconocen que el uso de IoT-A para lograr los objetivos de la Industria 5.0 casi no se trata en la literatura y que los indicadores de sostenibilidad social y de resiliencia requieren refinamiento. Como trabajo futuro plantean validar el marco en tres casos de manufactura, agricultura y servicios, adaptar el marco dinámicamente a nuevos estándares y reforzar la seguridad y la privacidad.
  limitaciones: "Declaradas: la validación en escenarios reales diversos está pendiente; las métricas para la sostenibilidad social y la resiliencia deben refinarse; la seguridad y la privacidad quedan fuera del alcance de este artículo. No declaradas: la prueba de concepto se describe pero no se reportan mediciones ni resultados, de modo que no se prueba la validez del marco; la revisión parte de citas de un solo libro, filtra por título y no cubre literatura sobre resiliencia de gemelos que no cite IoT-A; la resiliencia se reduce a escalabilidad, calidad de datos y tolerancia a fallas, sin definir cómo se mide la capacidad de adaptarse; el caso es un solo módulo agrícola en un ambiente controlado; no se evalúan costos de implementación ni de operación; la conexión con la centralidad humana se apoya en prácticas organizacionales que los propios autores consideran imposibles de abordar en el diseño de IoT."
  futuro: "Explícito: refinar métricas de Industria 5.0, especialmente la sostenibilidad social y la resiliencia, validar en tres casos de manufactura, agricultura y servicios, explorar la adaptación dinámica a nuevos estándares y reforzar la seguridad y la privacidad. Implícito: mediciones de desempeño del gemelo, pruebas de fallas y comparación con otros marcos de referencia de IoT."
c3:
  tesis: >
    Un marco que extiende el modelo de referencia IoT-A con un gemelo digital como entidad virtual y con metadatos de sostenibilidad, centralidad humana y resiliencia permite diseñar sistemas IoT conformes con la Industria 5.0, llena un vacío de la literatura, donde de 28 documentos revisados ninguno trata la resiliencia, y se muestra viable en un gemelo de monitoreo de un cultivo vertical aeropónico, con aplicabilidad a manufactura y servicios.
  antitesis: >
    El artículo describe una prueba de concepto sin presentar datos, de modo que la afirmación de que prueba la validez del marco carece de evidencia, y sostiene la aplicabilidad a manufactura y servicios solo por la abstracción del modelo de dominio. La revisión, basada en las citas de un único libro y en filtrado manual por título, no puede afirmar que no existen contribuciones sobre resiliencia en la literatura de gemelos. La resiliencia se redefine como escalabilidad, calidad de datos y tolerancia a fallas, sin umbrales ni método de medición, lo que se aleja de la capacidad de resistir y recuperarse de perturbaciones que el propio texto define al inicio. El marco no considera eventos extremos, cortes de energía o de comunicaciones, ni costos, y el aspecto humano se limita a atributos de metadatos sin evaluación.
  sintesis: >
    La contribución sostenible es un modelo conceptual ordenado que traduce requisitos de Industria 5.0 en metadatos de un gemelo digital sobre una arquitectura de referencia conocida, y una evidencia de que la literatura de ese marco casi no aborda la resiliencia. Para el corpus, aporta un vocabulario y una estructura de información en los que se podrían registrar indicadores de continuidad de un gemelo empresarial, y señala una brecha de métricas de resiliencia. Su alcance es de diseño, sin resultados, y no trata desastres ni recuperación, por lo que su utilidad depende de definir y medir la resiliencia con pruebas de falla, y de aplicar el marco a un caso de manufactura o de servicios con perturbaciones reales.
  areas_grises:
    - "Evidencia de la prueba de concepto: el resumen declara que un gemelo de monitoreo de un sistema de cultivo vertical se desarrolló para probar la validez del marco, pero el caso solo describe el sistema, sus sensores, actuadores y atributos, sin reportar mediciones, errores del gemelo, tiempos de respuesta, consumo de energía ni comparación con una línea base."
    - "Alcance de la revisión: la revisión parte de 325 documentos que citan el libro de IoT-A y se reduce por título y por resumen a 28, con lo cual excluye la literatura sobre gemelos digitales, resiliencia e Industria 5.0 que no cite IoT-A; la conclusión de que no hay contribuciones directas a la resiliencia se limita a ese subconjunto."
    - "Definición operativa de resiliencia: el texto define la resiliencia como la capacidad de resistir y recuperarse de ataques, perturbaciones y fallas, pero la operacionaliza con la capacidad de adaptarse a perturbaciones, una escalabilidad suficiente y la calidad de los datos, y los metadatos de la prueba usan escalabilidad y tolerancia a fallas sin valores ni método de medición."
    - "Generalización del marco: la afirmación de que el modelo de dominio es robusto en distintos dominios se sostiene en su abstracción, y la aplicación a manufactura y a servicios se deja como trabajo en curso, de modo que no se sabe qué ajustes requerirían los activos, las personas y las perturbaciones propias de una empresa."
  puntos_oscuros: >
    Llama la atención que un artículo cuyo aporte central es incorporar la resiliencia no presente un solo indicador medido de ella y que el único ejemplo de resiliencia desarrollado en el texto sean redes eléctricas y de transporte descritas en la literatura. También es notable que el marco descarte la entidad aumentada de IoT-A argumentando que no agrega información, sin analizar el efecto de esa decisión sobre la compatibilidad con el estándar. La lista de funciones de centralidad humana incluye prácticas de recursos humanos, como recompensas por creatividad y liderazgo de apoyo, que el propio texto califica de imposibles de considerar en el diseño de IoT. Además, el resumen presenta el marco como estándar de referencia, mientras que el texto lo describe como una propuesta sin adopción. El caso agrícola usa un calentador por el clima frío de la cámara, un detalle que muestra una instalación particular y no un escenario de perturbación. Por último, la sección de datos indica que los datos están en el manuscrito, pero el manuscrito no contiene datos de desempeño.
  ideas:
    - "Indicadores de resiliencia medidos para un gemelo de planta: instrumentar el módulo del caso, o una línea de producción de una pyme, con cinco indicadores de resiliencia (tiempo de detección de falla, tiempo de recuperación de la sincronización del gemelo, porcentaje de datos perdidos, degradación de calidad de datos y tareas críticas mantenidas) y aplicar 30 fallas inyectadas de energía, de red y de sensor, registrando los valores en los metadatos de Industria 5.0. El resultado mostraría si la escalabilidad y la tolerancia a fallas descritas capturan la resiliencia, cuánto tarda un gemelo en recuperarse tras una interrupción y qué diseño reduce más la pérdida de información."
    - "Aplicación del marco a la continuidad tras un evento extremo: adaptar el modelo de dominio a una empresa manufacturera con entidades físicas (máquinas, inventario, edificio) y atributos de continuidad (capacidad disponible, tiempo hasta reanudar), y probarlo con un simulacro de sismo o de corte prolongado durante dos jornadas, midiendo la calidad de la información que el gemelo ofrece a los responsables durante la emergencia. Con ello se podría comprobar si el marco sirve para decisiones de recuperación y qué atributos faltan, y se obtendría una guía de aplicación para empresas pequeñas con costos de implementación documentados."
  relaciones:
    - "Resiliencia organizacional y gemelos (complementa) D082 y D083: D082 revisa los mecanismos de resiliencia organizacional y D083 trata IoT y sostenibilidad en sistemas de producción; D074 aporta una forma de registrar indicadores de resiliencia y sostenibilidad en un gemelo."
    - "Marcos de IoT para gemelos (se relaciona con) D079 y D078: D079 revisa IoT, IA y gemelos en ciudades inteligentes y D078 presenta un ecosistema de gemelo comunitario; D074 propone una estructura de información y capas funcionales con carácter más general."
  robustez: [2, 2, 2, 3]
  valor: [4, "Aporta un marco conceptual de gemelo digital IoT sobre IoT-A con metadatos de sostenibilidad, centralidad humana y resiliencia, y una revisión que identifica 28 documentos y la ausencia de contribuciones directas a la resiliencia. Su valor para el corpus es limitado porque el caso es un cultivo vertical sin mediciones, la revisión parte de un solo libro de referencia, la resiliencia se define con indicadores no medidos y no hay conexión con desastres, empresas o recuperación, pero ofrece un vocabulario y una estructura de información que pueden reutilizarse."]
  conexiones: []
socratica:
  p1: "'IoT-A' es el modelo de referencia europeo de arquitectura IoT; 'entidad virtual' es la representación digital de una entidad física, que puede ser un gemelo digital si está sincronizada y puede actuar; 'sombra digital' es un modelo con flujo unidireccional; 'Industria 5.0' integra sostenibilidad, centralidad en las personas y resiliencia."
  p2: "Supone que un marco abstracto es aplicable a distintos dominios, que escalabilidad, calidad de datos y tolerancia a fallas representan la resiliencia, y que describir una prueba de concepto equivale a validar el marco."
  p3: "La evidencia son 28 documentos revisados, una descripción de modelos de dominio, información y funcional, y un caso de cultivo vertical sin datos de desempeño."
  p4: "Si es cierto, los diseñadores pueden construir gemelos conformes con la Industria 5.0 con una estructura común; si es falso, el marco puede ser un ejercicio de nomenclatura que no mejora la resiliencia ni la sostenibilidad."
  p5: "No se examinan mediciones del sistema, fallas, costos, comparación con otros marcos, otros dominios ni la dimensión humana."
  p6: "Alternativas: que otros marcos de referencia den una estructura equivalente; que la resiliencia se logre con redundancia física y no con metadatos; que el costo de documentar los indicadores supere su beneficio."
