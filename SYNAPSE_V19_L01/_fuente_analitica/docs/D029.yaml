doc_id: D029
relevancia: "Adyacente"
relevancia_just: "Estudio empírico a nivel de organización sobre cómo el gemelo digital en la gestión del mantenimiento mecánico mejora la resiliencia operativa, con capacidad de absorción como mediadora y turbulencia tecnológica como moderadora; es de los pocos documentos del corpus que modela resiliencia empresarial con gemelos digitales, pero en mantenimiento industrial, con percepciones y sin eventos sísmicos."
cluster_tema: "Gemelo digital y resiliencia operativa de la organización"
metodo_tipo: "Encuesta transversal con modelación de ecuaciones estructurales basada en composites (ADANCO), con mediación y moderación"
tipo_recurso: "Artículo científico (journal peer-reviewed)"
kw_inferidas: [gemelo digital, mantenimiento mecánico, resiliencia operativa, capacidad de absorción, turbulencia tecnológica, capacidades dinámicas, encuesta, modelación estructural, mantenimiento predictivo, transformación digital]
c2:
  objetivo: >
    Examinar cómo el gemelo digital aplicado a la gestión del mantenimiento mecánico influye en la resiliencia operativa de los sistemas mecánicos, y a la vez investigar el papel mediador de la capacidad de absorción y el efecto moderador de la turbulencia tecnológica. El estudio busca una comprensión integral de cómo la transformación digital y las capacidades de conocimiento contribuyen conjuntamente al desempeño resiliente en entornos tecnológicamente dinámicos, y ofrecer a los gestores una guía sobre la inversión en gemelos digitales acompañada de capacidades de aprendizaje organizacional.
  pregunta: >
    Se plantean cuatro hipótesis: H1, el gemelo digital en la gestión del mantenimiento mecánico afecta de forma significativa la resiliencia operativa; H2, la capacidad de absorción afecta la resiliencia operativa; H3, la capacidad de absorción media la relación entre el gemelo digital y la resiliencia operativa; y H4, la turbulencia tecnológica modera esa relación.
  marco: >
    El marco teórico es la teoría de capacidades dinámicas (Teece y colaboradores), que distingue las capacidades de percibir (el gemelo digital como fuente de información en tiempo real y de simulación), aprovechar (la capacidad de absorción: adquirir, asimilar, transformar y explotar conocimiento, siguiendo la conceptualización de Cohen y Levinthal) y reconfigurar (la resiliencia operativa: absorber el cambio y recuperarse tras perturbaciones). La turbulencia tecnológica, entendida como ritmo e incertidumbre del cambio tecnológico, se incorpora como condición contextual que modula la relación. La resiliencia operativa se define como la capacidad de absorber, adaptarse y sostener niveles aceptables de funcionamiento ante fallas, choques o variabilidad. El paradigma es cuantitativo, positivista y de gestión de operaciones, con un modelo causal de cuatro constructos y reglas de interpretación derivadas de la literatura de capacidades.
  metodologia: >
    Se empleó un diseño cuantitativo y transversal con cuestionario estructurado dirigido a ingenieros mecánicos, gerentes de mantenimiento, supervisores técnicos y personal operativo de industrias intensivas en activos, seleccionados por muestreo intencional. Se obtuvieron 295 respuestas válidas. Las escalas se adaptaron de estudios previos: gemelo digital con diez ítems adaptados de marcos de gemelos, mantenimiento predictivo y sistemas ciberfísicos; turbulencia tecnológica con cinco ítems de Jaworski y Kohli; capacidad de absorción con cuatro dimensiones (adquisición, asimilación, transformación y explotación) de Flatten y colaboradores; y resiliencia operativa con dos dimensiones (absorber el cambio y recuperarse) basadas en Irawan y colaboradores, todas en una escala Likert de cinco puntos. El análisis se realizó con ADANCO: confiabilidad (alfa de Cronbach y rhos de Jöreskog y Dijkstra-Henseler), validez convergente (varianza media extraída) y discriminante (razón HTMT), y un modelo estructural con bootstrapping para coeficientes de trayectoria, mediación y moderación, con R2, Q2 predictivo, RMSE y MAE. No se informan país, sector, tasa de respuesta, método de muestreo detallado ni control de sesgo de método común.
  resultados: >
    Los constructos mostraron confiabilidad y validez altas: el gemelo digital tuvo rho de Dijkstra-Henseler de 0,953, rho de Jöreskog de 0,951 y alfa de 0,952; la turbulencia tecnológica, 0,81 o más; las dimensiones de absorción, entre 0,799 y 0,875; y las dimensiones de resiliencia, alfa de 0,749 y 0,776. Los valores HTMT estuvieron entre 0,62 y 0,84. El R2 de la capacidad de absorción fue 0,540 (Q2 de 0,412) y el de la resiliencia operativa, 0,859 (Q2 de 0,673; RMSE de 0,348). Las trayectorias fueron: gemelo digital hacia resiliencia, beta de 0,625 (t de 7,210; H1); capacidad de absorción hacia resiliencia, beta de 0,544 (t de 9,480; H2); mediación de la capacidad de absorción, beta de 0,455 (t de 5,320; H3); y moderación de la turbulencia tecnológica, beta de 0,182 (t de 2,140; p de 0,033; H4). Todas las hipótesis se aceptaron. El texto describe en un punto la turbulencia como 'mediadora' aunque la hipótesis es de moderación. No se informan intervalos de confianza ni tamaños de efecto, ni se discuten los indicadores de ajuste global del modelo, la colinealidad entre constructos o las diferencias entre subgrupos de organizaciones, y el efecto de moderación se reporta como un único coeficiente sin gráfico de pendientes simples.
  discusion: >
    Los autores interpretan que el gemelo digital mejora la resiliencia operativa de forma directa y por la vía del aprendizaje organizacional (capacidad de absorción), y que su efecto es mayor cuando la turbulencia tecnológica es alta. Concluyen que el gemelo debe tratarse como un activo estratégico que se aprende y se ajusta a las condiciones del entorno, no como una herramienta operativa aislada, y que las organizaciones deben invertir de forma conjunta en tecnología digital y en capacidades de conocimiento (capacitación, interpretación de datos, intercambio de conocimiento). Reconocen como limitaciones el diseño transversal, el uso de percepciones autoinformadas, el contexto industrial y geográfico acotado, la omisión de otros mediadores (cultura digital, habilidades, agilidad) y la concepción holística del gemelo, y proponen estudios longitudinales con indicadores objetivos y diferentes tipos de gemelo.
  limitaciones: "Declaradas: diseño transversal, datos autoinformados, entorno industrial y geográfico acotado, mediadores no examinados, gemelo digital conceptualizado de forma holística. No declaradas: ausencia de país y sector, de tasa de respuesta y de control de sesgo de método común; R2 de 0,859 sin discusión de colinealidad; inconsistencias entre etiquetas de hipótesis y descripción; efecto de moderación débil (beta 0,182, p de 0,033)."
  futuro: "Diseños longitudinales con seguimiento de la adopción del gemelo y la resiliencia, indicadores objetivos (registros de sistemas, sensores, datos de máquina), pruebas en otras industrias (aeroespacial, automotriz, energía, infraestructura inteligente), inclusión de otros mediadores y análisis por tipos de gemelo (componente, proceso, sistema y red)."
c3:
  tesis: >
    El gemelo digital aplicado al mantenimiento mecánico mejora la resiliencia operativa de las organizaciones de forma directa y a través de la capacidad de absorción de conocimiento, y esta relación se refuerza cuando la turbulencia tecnológica es alta, lo que respalda la teoría de capacidades dinámicas y la inversión conjunta en tecnología y aprendizaje.
  antitesis: >
    Los resultados provienen de percepciones de una sola fuente y un solo momento, en que gemelo digital, capacidad de absorción y resiliencia se miden con el mismo cuestionario, de modo que la varianza de método común puede inflar las asociaciones; el R2 de 0,859 para resiliencia, con tres predictores, es inusualmente alto para datos de encuesta y sugiere solapamiento conceptual o colinealidad entre constructos, y no se reportan pruebas de ello. Las cifras no son internamente coherentes: el efecto indirecto de 0,455 resulta incompatible con un R2 de 0,540 de la capacidad de absorción y un efecto de 0,544 hacia la resiliencia (el producto de las trayectorias sería cercano a 0,40), y el texto designa como 'mediación' una hipótesis de moderación. No se describen país, sector, tasa de respuesta ni representatividad de una muestra intencional, la moderación es débil (beta de 0,182; p de 0,033) y no se informan intervalos de confianza. La resiliencia operativa se mide con tres a cuatro ítems de 'absorber el cambio' y 'recuperarse' sin vínculo con recuperación real tras una interrupción. Varias referencias de apoyo son genéricas o de campos distantes, lo que debilita la base teórica.
  sintesis: >
    El estudio ofrece un modelo de hipótesis plausible y un instrumento adaptado (gemelo digital, capacidad de absorción, turbulencia, resiliencia), con asociaciones de percepción compatibles con la idea de que la tecnología rinde cuando la organización puede aprender de sus datos. Debe leerse como evidencia preliminar de asociación en una muestra no descrita y no como efecto causal del gemelo sobre la resiliencia. Para el corpus, la síntesis consiste en trasladar la tríada tecnología, capacidad de aprendizaje y entorno a empresas afectadas por sismos, y probar con datos observados de reapertura y de tiempo de recuperación si la presencia de un gemelo o de monitoreo mejora la recuperación solo en empresas con capacidad de absorción alta, de modo que la recomendación de inversión incluya capacitación y procesos y no solo tecnología.
  areas_grises:
    - "Descripción de la muestra y del contexto: el texto no informa país, sector, tamaño de las empresas ni tasa de respuesta, aunque los autores reconocen un entorno 'estrecho' industrial y geográfico; el muestreo intencional impide estimar sesgo de selección y generalización."
    - "Coherencia de los resultados: el efecto indirecto de 0,455 no concuerda con el R2 de 0,540 de la capacidad de absorción y el coeficiente de 0,544 hacia la resiliencia; el R2 de 0,859 de la resiliencia es muy elevado para datos de encuesta y no se discuten colinealidad ni varianza de método común; la hipótesis de moderación se describe en un pasaje como mediación."
    - "Medición de la resiliencia: la resiliencia operativa se mide mediante percepción de capacidad para absorber cambios y recuperarse (ítems adaptados), no con indicadores observados de tiempo de recuperación, pérdida de producción o costo de falla, por lo que no queda claro si captura desempeño ante interrupciones reales."
    - "Base de referencias: la revisión cita un gran número de trabajos de 2024 y 2025 de ámbitos variados para sustentar cada hipótesis y algunas referencias parecen alejadas del constructo al que se asocian (por ejemplo, citas de campos distintos para turbulencia tecnológica), lo que impide evaluar la solidez de la fundamentación sin verificación."
  puntos_oscuros: >
    Llama la atención que un efecto de moderación débil (0,182) se interprete como confirmación sólida de que el gemelo es 'más útil' bajo alta turbulencia, y que un R2 de 0,859 se presente como prueba de la fortaleza del modelo y no como señal de posible redundancia entre constructos. Una explicación plausible es que los encuestados que valoran positivamente la tecnología de su organización tienden a puntuar alto también la capacidad de aprendizaje y la resiliencia, produciendo correlaciones elevadas por respuesta uniforme, y que el procedimiento de análisis basado en composites tolera constructos fuertemente correlacionados sin advertencias. Esto sugiere que la jerarquía de efectos (directo mayor que indirecto) puede depender del instrumento y que la contribución teórica sobre el papel mediador del aprendizaje es una hipótesis razonable pero no demostrada. Además, que el texto no informe sector ni país impide saber si la resiliencia que se mide corresponde a fallas de máquinas, que es el contexto del título, y no a las interrupciones de gran escala que interesan para la recuperación empresarial.
  ideas:
    - "Contraste de la tríada tecnología-aprendizaje-resiliencia con datos observados: aplicar el modelo a empresas que sufrieron la misma perturbación (por ejemplo, un sismo o una interrupción de servicios), midiendo capacidad de absorción y adopción de monitoreo o de gemelos antes del evento y, después de él, el tiempo hasta recuperar la producción, la pérdida de ventas y los costos de reparación, y estimar si el efecto del gemelo depende de la capacidad de absorción mediante un modelo de interacción con controles por tamaño y sector. Fundamento: el estudio solo tiene percepciones transversales. Verificabilidad: base de empresas con registros de producción y encuesta previa. Utilidad: separa el efecto de la tecnología del de la capacidad de aprendizaje y orienta el tipo de apoyo (equipos o formación)."
    - "Prueba de robustez del modelo estructural: reanalizar con los datos originales la coherencia entre R2, efecto directo, indirecto y moderación; evaluar colinealidad (factores de inflación de varianza), varianza de método común (factor único de Harman o variable marcadora) y diferencias por subgrupos de empresas, y publicar los intervalos de confianza de los coeficientes. Fundamento: las cifras de mediación y de R2 no concuerdan entre sí. Verificabilidad: acceso a los datos y reproducción con el mismo software y con un método alternativo. Utilidad: define cuánta de la asociación reportada puede atribuirse al instrumento y permite decidir si el modelo sirve de base para adaptar encuestas en el corpus."
  relaciones:
    - "Capacidad de absorción (media) parte del efecto del gemelo digital sobre la resiliencia: según el modelo, el gemelo genera datos que solo se traducen en resiliencia si la organización los adquiere, asimila, transforma y explota, aunque la magnitud reportada no es coherente con los R2."
    - "Turbulencia tecnológica (refuerza) la relación entre gemelo y resiliencia: el efecto de moderación es débil (beta de 0,182; p de 0,033) y se basa en percepciones, por lo que su generalización es limitada."
  robustez: [3, 4, 2, 3]
  valor: [5, "Aporta un modelo de hipótesis y escalas para estudiar el vínculo entre gemelo digital, capacidad de aprendizaje y resiliencia operativa de las organizaciones, con la sugerencia de que la tecnología requiere capacidades de conocimiento para producir resiliencia. Su valor para el corpus es teórico y de instrumento; se reduce por la muestra no descrita, la medición de percepción, las incoherencias estadísticas, el contexto de mantenimiento mecánico y la ausencia de eventos de desastre."]
  conexiones: []
socratica:
  p1: "'Resiliencia operativa' es la capacidad percibida de un sistema u organización de absorber perturbaciones y recuperar su funcionamiento; 'gemelo digital en mantenimiento' es el uso de modelos virtuales sincronizados con activos para monitoreo y predicción."
  p2: "Supone que las percepciones de ingenieros y gestores miden de forma válida la adopción del gemelo y la resiliencia, que las escalas adaptadas se comportan igual en este contexto y que las trayectorias estimadas son causales."
  p3: "La evidencia son 295 respuestas de encuesta, índices de fiabilidad altos y cuatro trayectorias significativas; no hay datos de desempeño observado."
  p4: "Si es cierto, las organizaciones deben invertir en capacidades de aprendizaje junto con el gemelo; si es falso, podrían adquirir tecnología con la expectativa de resiliencia sin resultados medidos."
  p5: "No se examinan organizaciones con gemelos que no mejoraron su resiliencia ni con alta resiliencia sin gemelos, ni el efecto de otras capacidades como la agilidad o la cultura digital."
  p6: "Alternativas: que la varianza de método común explique las asociaciones; que el tamaño o la madurez de la organización expliquen tanto la adopción como la resiliencia; que el aprendizaje tenga efecto directo independiente del gemelo."
