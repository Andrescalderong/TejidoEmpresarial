doc_id: D079
relevancia: Adyacente
relevancia_just: Revisión sistemática de 64 artículos de revistas sobre la integración de gemelos digitales urbanos, IoT e inteligencia artificial en el desarrollo de ciudades inteligentes, con protocolo PSALSAR y PRISMA 2020, mapeo bibliométrico, cinco dominios de aplicación (incluye emergencias y servicios públicos) y una agenda de tareas de investigación comprobables. Aporta una síntesis de madurez, brechas y límites de evidencia de los gemelos urbanos (laboratorio, interoperabilidad, falta de retorno de inversión), pertinente para el corpus, aunque trata los desastres de forma marginal y no aborda sismos, empresas ni recuperación.
cluster_tema: 'Gemelos digitales urbanos, IoT e IA en ciudades inteligentes: mapeo temático y brechas de evidencia'
metodo_tipo: Revisión sistemática de la literatura con protocolo PSALSAR y PRISMA 2020, apreciación de calidad con CASP adaptado, análisis bibliométrico con Bibliometrix y síntesis temática
tipo_recurso: Artículo de revisión sistemática (journal peer-reviewed, acceso abierto)
