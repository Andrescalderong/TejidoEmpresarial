socratica:
  p1: '''Gemelo digital urbano'' es una réplica dinámica de un entorno urbano actualizada con datos IoT; ''PSALSAR'' es un método de revisión con protocolo, búsqueda, apreciación, síntesis, análisis y reporte; ''literatura gris'' en este estudio incluye libros, capítulos, ponencias y revisiones; ''IA de las cosas'' integra IoT y IA.'
  p2: Supone que los artículos de revista representan el campo, que una ecuación con cuatro términos obligatorios recupera la literatura relevante y que las 64 piezas son una muestra suficiente para generalizar sobre madurez e impacto.
  p3: La evidencia son 899 registros de cuatro bases, 64 artículos incluidos, una apreciación con kappa de 0,82 en una submuestra, análisis bibliométrico y una síntesis temática.
  p4: Si es cierto, los gemelos urbanos son una tecnología madura con brechas conocidas y una agenda clara; si es falso, la revisión puede sobrerrepresentar un subconjunto de artículos de revista y subestimar la literatura de congresos y la de desastres.
  p5: No se examinan las ponencias excluidas, las diferencias de recuento, los umbrales de calidad ni los gemelos para desastres que no usan la terminología de la ecuación.
  p6: 'Alternativas: que una revisión de alcance más amplia muestre mayor madurez; que el retorno de inversión exista pero no se publique; que la falta de evidencia se deba a la novedad del campo.'
