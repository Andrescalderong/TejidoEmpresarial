c2:
  objetivo: 'Examinar mediante una revisión sistemática de la literatura la integración de los gemelos digitales (DTw), el Internet de las cosas (IoT) y la inteligencia artificial (IA) en el desarrollo de ciudades inteligentes, con el fin de identificar tendencias tecnológicas y metodológicas, clasificar las aplicaciones urbanas prácticas y orientar la investigación futura. Los autores sostienen que las revisiones previas se centran en aspectos parciales (modelos 3D, políticas públicas, bibliometría) y buscan ofrecer un examen integral de la convergencia, con una clasificación temática estructurada y una agenda alineada con las necesidades reales de las ciudades.

    '
  pregunta: 'La pregunta de investigación (RQ1) es de qué manera se integran los gemelos digitales urbanos, el IoT y la IA en el desarrollo de ciudades inteligentes, y cuáles son las principales áreas de aplicación, los enfoques metodológicos predominantes y las brechas de investigación identificadas en la literatura científica para mejorar la gestión urbana. El protocolo añade seis preguntas de mapeo sobre revistas, autores influyentes, tecnologías habilitantes, casos de uso, metodologías y brechas.

    '
  marco: 'El marco define el gemelo digital urbano como una réplica digital dinámica de un entorno urbano físico, actualizada de forma continua con datos en tiempo real, en la que el IoT aporta flujos de datos y la IA funciona como núcleo analítico para decisiones autónomas, lo que se denomina IA de las cosas. Se vincula con los Objetivos de Desarrollo Sostenible 9, 11 y 13 y con la resiliencia de los sistemas urbanos. El texto señala riesgos éticos de transparencia, sesgo y privacidad, la vulnerabilidad de ciberseguridad y la falta de estándares interoperables y de marcos unificados. La Tabla 5 contrasta la revisión con tres revisiones previas, de integración de datos, de sostenibilidad y resiliencia y de gemelos basados en IA.

    '
  metodologia: 'La revisión siguió el método PSALSAR (protocolo, búsqueda, apreciación, síntesis, análisis y reporte) junto con PRISMA 2020. La búsqueda se hizo en IEEE Xplore, ACM Digital Library, Web of Science y Scopus el 24 de mayo de 2025, con ecuaciones booleanas que exigen los términos gemelos digitales urbanos, ciudades inteligentes, IoT e IA, y se prefirió la literatura de revistas sobre actas de congresos y literatura gris. De 899 documentos (159 de Scopus, 26 de WoS, 83 de IEEE y 631 de ACM) se eliminaron 25 duplicados y 803 elementos clasificados como literatura gris (libros, capítulos, ponencias y revisiones), 10 por no ajustarse al tema y 5 por inaccesibilidad, y 64 documentos cumplieron los criterios. La apreciación de calidad usó una rúbrica adaptada de CASP con puntaje máximo de 10 aplicada por dos revisores, con calibración en 10 % de los estudios (kappa de Cohen de 0,82) y un tercer revisor para discrepancias. Los datos se extrajeron en una matriz de seis campos y se analizaron
    con Bibliometrix en R, con redes de coocurrencia de palabras clave, tendencias temporales y codificación temática inductiva, y los materiales se registraron en la plataforma OSF.

    '
  resultados: 'Los resultados indican un crecimiento sostenido de la producción desde 2019, con aumentos en 2022 y 2023 y un desplazamiento de conceptos fundacionales (IA, gemelos) a temas aplicados (macrodatos, ciudad inteligente), atribuidos a la expansión de 5G y de la computación en el borde y la niebla, a la inclusión de los gemelos en la misión de ciudades climáticamente neutras de Horizonte Europa y a plataformas industriales de grandes empresas. Se identifican tendencias tecnológicas (arquitecturas de borde y nube, visualización 3D y realidad aumentada, IA generativa, blockchain, plataformas como KTWIN y UMBRELLA, y el conjunto TUM2TWIN de unos 100 000 m² y 767 GB) y cinco dominios de aplicación (gestión de tráfico, planificación urbana, monitoreo ambiental, sistemas de energía y servicios públicos). En emergencias, los gemelos se aplican a todo el ciclo del desastre y a bancos de prueba para entrenar respondedores, y en Lisboa a la simulación de inundaciones. Las brechas principales
    son la interoperabilidad semántica, la predicción en tiempo real, la privacidad y la seguridad, la escalabilidad y la replicabilidad, y la evaluación de impacto: no hay métricas claras de retorno de inversión, de eficiencia operativa o de beneficio social, y las implementaciones se limitan en su mayoría a pruebas de laboratorio. La agenda propone tareas comprobables sobre indicadores, adopción en políticas, costo de servicio, replicabilidad, comparación federada y centralizada, ontologías, conjuntos de datos y ética.

    '
  discusion: 'Los autores sostienen que los gemelos digitales urbanos han madurado de herramientas descriptivas a sistemas proactivos y predictivos por la convergencia de IA generativa, IoT masivo, cómputo en el borde y la nube, visualización 3D y blockchain, con impacto tangible en eficiencia operativa y resiliencia urbana. Afirman que el desafío más apremiante es la brecha entre la ambición técnica y la evidencia de retorno de inversión y de beneficios socioeconómicos, y que se requiere un enfoque holístico que integre procesos, estudios longitudinales y participación ciudadana para convertir los gemelos en lugares significativos. Destacan que las capas de IoT, analítica de IA y apoyo a la decisión se repiten entre sectores como patrones reutilizables.

    '
  limitaciones: 'Declaradas: no se incluye una sección de limitaciones. Se declara la decisión de excluir ponencias y literatura gris para mantener la consistencia, y la Tabla A1 con puntajes se presenta como muestra representativa. No declaradas: la exclusión de 803 de 899 documentos por tipo (89 %) puede dejar fuera gran parte de la literatura de gemelos, que es abundante en congresos; la suma de los pasos de selección (899 menos 25, 803, 10 y 5) da 56 y no los 64 documentos incluidos; la ecuación exige simultáneamente cuatro términos, por lo que los estudios sobre desastres, resiliencia o sismos que no usan ''gemelos digitales urbanos'' quedan fuera; no se reporta el umbral de puntaje de apreciación para incluir o excluir; la calibración con kappa se aplicó solo a 10 % de los estudios; no se describe el número de clasificaciones temáticas de manera coherente (tres grupos, cuatro áreas, cuatro grupos de palabras y cinco sectores según la sección); las afirmaciones de impacto tangible en
    la conclusión contradicen la brecha de evidencia señalada.'
  futuro: 'Explícito: tareas comprobables de investigación orientadas al retorno de inversión (taxonomía mínima de indicadores y evaluación comparativa, registro de adopción en políticas, costo de servicio a escala), a la escalabilidad (guía de replicabilidad, comparación federada y centralizada, interoperabilidad semántica con ontologías, conjuntos de datos de referencia) y a la ética (evaluación de impacto algorítmico con ciudadanos, trazabilidad y auditoría, piloto de confianza cero con análisis de latencia y seguridad). Implícito: estudios longitudinales y de impacto social, y revisiones específicas de gemelos para desastres.'
c3:
  tesis: 'Los gemelos digitales urbanos, apoyados en IoT e IA, han pasado de la representación descriptiva a sistemas predictivos y proactivos aplicables al tráfico, la planificación, el ambiente, la energía y los servicios públicos, incluida la gestión de emergencias en todo el ciclo del desastre, pero su adopción a escala depende de resolver la interoperabilidad, la escalabilidad, la seguridad y, sobre todo, la falta de evidencia de retorno de inversión y de beneficios socioeconómicos.

    '
  antitesis: 'La revisión excluye 89 % de los documentos encontrados por no ser artículos de revista, usa una ecuación que exige cuatro términos a la vez, y su aritmética de selección no cuadra, lo que limita la afirmación de síntesis integral y reproducible. La apreciación de calidad no reporta puntajes completos ni umbrales, y la clasificación temática varía entre secciones. La conclusión afirma impacto tangible en eficiencia y resiliencia, aunque el mismo texto indica que casi todas las implementaciones son de laboratorio y sin evidencia de retorno. El tratamiento de desastres y resiliencia es breve, apoyado en pocas referencias, y no hay análisis de la recuperación, del costo ni de la utilidad para empresas.

    '
  sintesis: 'La contribución sostenible es un mapa estructurado de tecnologías, aplicaciones y brechas de los gemelos urbanos, con un diagnóstico claro de que la evidencia de valor es débil, y una agenda de tareas comprobables que puede reutilizarse. Para el corpus, valida desde otra fuente la hipótesis de que la literatura de gemelos digitales no demuestra retorno de inversión ni impacto en recuperación, y señala que los gemelos para desastres son un subconjunto pequeño. Sus resultados cuantitativos de selección deben tomarse con cautela por el sesgo de tipo de documento y por errores de recuento, y requieren una revisión complementaria específica de desastres, sismos y recuperación empresarial.

    '
  areas_grises:
  - 'Selección de documentos: de 899 documentos, 803 se excluyeron como literatura gris, que el texto define como libros, capítulos, ponencias y revisiones; la exclusión de ponencias en un campo donde la mayor parte de la producción se presenta en congresos puede sesgar la síntesis, y el texto no reporta cuántas de las 803 eran ponencias ni qué se pierde.'
  - 'Coherencia aritmética del flujo PRISMA: 899 documentos menos 25 duplicados, 803 de literatura gris, 10 fuera del tema y 5 inaccesibles dan 56 documentos, mientras que se incluyen 64; la diferencia de 8 documentos no se explica en el texto, lo que afecta la trazabilidad que el método declara garantizar.'
  - 'Cobertura de desastres y resiliencia: la ecuación de búsqueda exige gemelos digitales urbanos, ciudades inteligentes, IoT e IA, por lo que los trabajos sobre sismos, inundaciones o recuperación sin esos cuatro términos no entran; el tratamiento de emergencias se limita a pocos párrafos y casos como un banco de pruebas para primeros respondedores y simulaciones de inundación en Lisboa.'
  - 'Apreciación de calidad: la rúbrica de diez puntos se aplicó a todos los estudios, pero solo se presenta una muestra en el apéndice, no se reporta el umbral de inclusión ni la distribución de puntajes, y la concordancia de 0,82 corresponde a 10 % de los estudios, de modo que la calidad de la evidencia que sustenta las conclusiones no puede verificarse.'
  puntos_oscuros: 'Llama la atención que la conclusión afirme un impacto tangible en la eficiencia operativa y en la resiliencia urbana y, a la vez, que el desafío más urgente sea la ausencia de evidencia de retorno de inversión y de beneficios socioeconómicos. También es notable que el artículo describa una clasificación en tres grupos temáticos en los puntos destacados, en cuatro áreas en la síntesis, en cuatro grupos en el análisis de palabras clave y en cinco dominios o sectores en otras secciones, sin explicar cómo se relacionan. El texto presenta una tabla de apreciación de calidad como muestra representativa en lugar de todos los resultados, y el nivel de acuerdo entre revisores se calcula con una submuestra pequeña. Además, la sección de tendencias atribuye el crecimiento a la misión de Horizonte Europa y a plataformas de grandes empresas sin análisis de causalidad. Por último, la sección de conclusiones señala un consenso insuficiente en la terminología, pero la revisión define
    el gemelo urbano sin discutir sus diferencias con los de infraestructura o edificios.

    '
  ideas:
  - 'Revisión complementaria de gemelos para desastres con ecuación ampliada: replicar el protocolo con términos de desastre, sismo, inundación, resiliencia y recuperación sin exigir la expresión de gemelos digitales urbanos, incluyendo ponencias de congresos y literatura gris relevante, y extraer para cada estudio el nivel de madurez, la presencia de datos reales, las métricas de recuperación y los costos. El resultado permitiría contar cuántos gemelos de desastres tienen evidencia de efecto en la recuperación y cuántos informan costos, y comparar con la conclusión de esta revisión de que la mayoría son de laboratorio y carecen de retorno de inversión. El protocolo y los datos se registrarían en una plataforma abierta.'
  - 'Taxonomía mínima de indicadores para gemelos de recuperación: tomar la primera tarea de la agenda y definir diez indicadores operativos, socioeconómicos y ambientales para gemelos usados en la recuperación posdesastre (tiempo de diagnóstico, tiempo de restablecimiento de servicios, empresas reabiertas, costo por escenario simulado, uso en decisiones oficiales), y aplicarla a tres proyectos piloto durante seis meses para medir su viabilidad y el costo de recolección. Con ello se podría contar con una base de comparación que hoy no existe y estimar el retorno de inversión de un gemelo para una ciudad o una cámara de comercio. Los resultados se publicarían como guía.'
  relaciones:
  - 'Marco conceptual del gemelo para sismos (complementa) D070: D070 presenta un marco y un FODA de gemelos digitales para la resiliencia sísmica urbana sin datos, y D079 aporta la evidencia sistemática de que la mayoría de los gemelos urbanos son de laboratorio y sin retorno de inversión demostrado.'
  - 'Gemelos comunitarios y de desastres (se relaciona con) D078 y D080: D078 presenta un gemelo comunitario para tornados y D080 un gemelo para gestión sostenible de desastres; ambos ilustran los casos de emergencia que D079 resume en pocas líneas.'
