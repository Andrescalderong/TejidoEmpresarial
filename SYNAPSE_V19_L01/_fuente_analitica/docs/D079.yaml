  - Revisión de artículos de revista con exclusión de ponencias y recuento de selección inconsistente
- - VAR
  - Faltan métricas de retorno de inversión, costos, resiliencia y recuperación
- - TEOR
  - Gemelos digitales urbanos e IA de las cosas; sin teoría de recuperación
- - CAUS
  - Efecto de los gemelos sobre la eficiencia y la resiliencia sin evidencia comparativa
