doc_id: D051
relevancia: "Periférico"
relevancia_just: "Revisión sistemática de 32 artículos (2004 a 2023) que clasifica 92 desafíos en 16 categorías y 67 impulsores (4 antecedentes y 10 consecuentes) de la adopción del internet de las cosas en cadenas de suministro, y propone un modelo de implementación. Aporta factores de adopción útiles para pymes y proveedores, pero no trata desastres, resiliencia ni recuperación."
cluster_tema: "Desafíos e impulsores del IoT en la cadena de suministro (revisión sistemática)"
metodo_tipo: "Revisión sistemática de literatura (Scopus y Web of Science, 32 artículos) con clasificación temática de desafíos e impulsores"
tipo_recurso: "Artículo de revisión (journal peer-reviewed)"
kw_inferidas: [internet de las cosas, cadena de suministro, desafíos de adopción, impulsores, revisión sistemática, privacidad y seguridad, aceptación de la tecnología, modelo de implementación, transparencia, agilidad]
c2:
  objetivo: >
    Identificar y clasificar, mediante una revisión sistemática de la literatura, los desafíos y los impulsores de la adopción del internet de las cosas (IoT) en el nivel de la cadena de suministro (SC), para el que los autores afirman que no existe una clasificación de impulsores y que las clasificaciones de desafíos requieren actualización. El estudio busca además presentar un modelo de implementación del IoT que sintetice los hallazgos y ofrezca una hoja de ruta práctica para organizaciones que quieran aprovechar el IoT en sus cadenas de suministro.
  pregunta: >
    El estudio formula dos preguntas explícitas: RQ1, cuáles son los desafíos del IoT en el nivel de la cadena de suministro y cómo se clasifican; y RQ2, cuáles son los impulsores del IoT en ese nivel y cómo se clasifican. Ambas son descriptivas y se responden con taxonomías, sin contrastar hipótesis ni estimar efectos.
  marco: >
    El marco es la revisión sistemática como método organizado, transparente y replicable, y la perspectiva de adopción tecnológica en la que los impulsores se dividen en antecedentes (presiones, comprensión de los beneficios, regulaciones gubernamentales e incentivos) y consecuentes (beneficios de producción, ventaja competitiva, gestión de inventarios y de costos, transparencia, eficiencia del flujo de información, capacidad de respuesta y agilidad, desarrollo sostenible, facilitación de la gestión y cooperación y coordinación). Los desafíos se organizan en 16 categorías desde financieras hasta confianza del usuario. No se adopta una teoría formal de adopción, como el modelo de aceptación tecnológica (TAM) o el marco tecnología-organización-entorno (TOE), y los factores se ordenan por afinidad temática de los autores.
  metodologia: >
    El protocolo incluye la formulación de las preguntas, el protocolo de búsqueda, la búsqueda en Web of Science y Scopus con la cadena (supply chain* OR supply network) AND (Internet of things* OR IoT), filtros por año (2004 a 2023), idioma y tipo de documento (solo artículos de revista; se excluyeron capítulos, libros e informes), la presencia de las palabras clave en título y resumen, la lectura de texto completo, la extracción de datos y una evaluación de calidad con el programa de habilidades de evaluación crítica (CASP). La selección final fue de 32 artículos. La extracción y la clasificación de desafíos e impulsores fueron cualitativas, sin información sobre revisores múltiples ni acuerdo entre codificadores. El flujo de selección se presenta en una figura con criterios de exclusión que incluyen artículos sin la palabra clave en título o resumen y artículos rechazados por el programa de evaluación crítica. El protocolo se documenta como medio para reducir el sesgo, pero no se registró de antemano.
  resultados: >
    Se identificaron 92 desafíos clasificados en 16 categorías: financieros, estándares y regulaciones gubernamentales, privacidad y seguridad, consumo de energía, problemas de salud, problemas de hardware y software, cultura en la cadena, falta de conocimiento y conciencia, mala gestión de TI, coordinación en la cadena, percepción, incertidumbre, falta de plan y estrategia, incompatibilidad con la tecnología existente, problemas de suministro y aceptación y confianza del usuario. Se identificaron 67 impulsores, agrupados en 4 antecedentes (presiones, comprensión de los beneficios, regulaciones gubernamentales e incentivos) y 10 consecuentes. Los autores presentan un modelo de implementación que integra desafíos e impulsores como hoja de ruta para las organizaciones. El texto no informa la frecuencia de cada categoría en la literatura ni los pesos relativos de los factores. Entre los impulsores consecuentes se citan, por ejemplo, la mejora de la gestión del desempeño de la cadena al reducir retrasos en la recolección de datos y en la decisión, la transparencia de las operaciones logísticas, el mejor ajuste a la producción justo a tiempo, la reducción del efecto látigo y el fortalecimiento de la inteligencia de negocio. Entre los antecedentes se citan la presión de los clientes, la competencia, las expectativas sociales y los incentivos y regulaciones gubernamentales.
  discusion: >
    Los autores sostienen que el IoT puede mejorar el seguimiento, el monitoreo, la visibilidad, la agilidad, la adaptabilidad y la capacidad de respuesta de la cadena de suministro, y que su implementación exige atender las categorías de desafíos y aprovechar los impulsores. Afirman que la clasificación es completa y única, que los impulsores no habían sido investigados ni categorizados antes, y que el modelo propuesto orienta a las organizaciones. Concluyen que, al abordar desafíos y aprovechar impulsores, las organizaciones pueden integrar el IoT para mejorar la eficiencia, la transparencia y el desempeño de sus operaciones, y sugieren que cada categoría puede ser un tema de investigación por sí misma. No discuten diferencias por sector, tamaño de empresa o nivel de desarrollo del país.
  limitaciones: "Declaradas: uso de solo dos bases (Scopus y Web of Science), con posible omisión de artículos no indexados, y solo artículos de revista; se sugiere considerar libros, capítulos y actas. No declaradas: 32 artículos como base de 92 desafíos y 67 impulsores, sin frecuencias ni jerarquía; no hay revisión por pares independientes del cribado ni acuerdo entre codificadores; el modelo de implementación no se valida con casos o expertos; se mezclan desafíos de nivel técnico, organizacional y de contexto sin teoría de adopción; la afirmación de clasificación completa y única no se contrasta con revisiones previas; no se tratan contextos de riesgo o disrupción."
  futuro: "Explícito: considerar otras fuentes (libros, capítulos y actas) y estudiar cada categoría de desafíos e impulsores como tema de investigación. Implícito: validación empírica del modelo de implementación y estudios por sector."
c3:
  tesis: >
    La adopción del IoT en cadenas de suministro enfrenta 92 desafíos agrupados en 16 categorías y está motivada por 4 impulsores antecedentes y 10 consecuentes; una clasificación integrada y un modelo de implementación permiten a las organizaciones anticipar obstáculos y aprovechar motivaciones, con mejoras de eficiencia, transparencia, agilidad y desempeño.
  antitesis: >
    La clasificación se basa en 32 artículos y no se acompaña de frecuencias, pesos ni validación, de modo que no distingue desafíos centrales de anecdóticos. El modelo de implementación es una síntesis de los autores sin contraste con casos ni con expertos, y la afirmación de que la clasificación es 'completa y única' no se prueba frente a revisiones previas. La revisión no usa una teoría de adopción, mezcla niveles de análisis (hardware, cultura, regulación) y no estudia contextos de disrupción. La lista de impulsores consecuentes (beneficios) se presenta como motivación de adopción, aunque son resultados esperados y no evidencia de efecto. El texto no informa cómo se resolvieron desacuerdos entre revisores.
  sintesis: >
    La contribución sostenible es una taxonomía organizada de obstáculos y motivaciones de adopción del IoT en cadenas de suministro, útil como lista de verificación al diseñar una intervención. Su valor es descriptivo y no establece cuáles factores pesan más ni cómo se comportan en contextos de riesgo. Para el corpus, en consecuencia, aporta categorías relevantes para pymes (financieras, de conocimiento, de aceptación y de confianza) que podrían explorarse como barreras de adopción de sensado y gemelos ligeros en cadenas locales, siempre como hipótesis a contrastar con datos de empresas reales y con estudios de campo de adopción en contextos de riesgo sísmico.
  areas_grises:
    - "Base empírica de la taxonomía: 92 desafíos y 67 impulsores salen de 32 artículos, es decir, unos tres desafíos por artículo; el texto no informa en cuántos artículos aparece cada categoría, de modo que no es posible ordenarlas por importancia ni estimar su prevalencia."
    - "Evaluación de calidad: el texto menciona un programa de evaluación crítica (CASP) con rechazo de artículos, pero no informa el número de artículos evaluados ni excluidos en esa etapa, ni quiénes evaluaron, ni el acuerdo entre revisores."
    - "Validación del modelo: el modelo de implementación sintetiza desafíos e impulsores como hoja de ruta, pero no se prueba con casos, entrevistas ni un panel de expertos; se presenta como práctico sin evidencia de uso, y sin precisar quién debe aplicarlo ni con qué secuencia de pasos."
    - "Contextos de riesgo: la revisión trata la adopción en condiciones normales; no considera disrupciones, desastres ni resiliencia, aunque el texto señale que el IoT mejora la capacidad de respuesta y la adaptabilidad."
  puntos_oscuros: >
    Llama la atención que una revisión que identifica 92 desafíos y 67 impulsores a partir de 32 artículos presente la clasificación como completa y única sin informar frecuencias, solapamientos ni validación. También es notable que el texto describa los impulsores consecuentes (beneficios) como motivaciones de adopción, sin distinguir entre beneficios esperados y beneficios demostrados. La evaluación de calidad se menciona sin cifras. El modelo de implementación se presenta como hoja de ruta práctica aunque no se contrasta con ninguna organización. Además, la afirmación de una clasificación sin antecedentes ignora que los trabajos de adopción tecnológica usan marcos como TOE o TAM para ordenar factores de manera similar. Finalmente, las conclusiones no distinguen entre tipos de cadena (alimentos, manufactura, logística), de modo que la utilidad para una pyme concreta es limitada, y la lista de desafíos incluye aspectos tan distintos como la salud y el consumo de energía que no se relacionan con una jerarquía de causalidad.
  ideas:
    - "Priorización de barreras para pymes de territorios sísmicos: aplicar un método de decisión multicriterio (por ejemplo, un proceso analítico jerárquico) a las 16 categorías de desafíos con un panel de gestores de pymes manufactureras de una región sísmica, para obtener pesos de importancia y distinguir barreras críticas (financiamiento, conocimiento, confianza) de secundarias. El resultado sería una jerarquía de barreras de adopción de sensado y gemelos ligeros, que hoy no existe en el corpus, y permitiría diseñar paquetes de transferencia tecnológica adaptados. Se aplicaría un índice de consistencia a los juicios del panel y se descartarían paneles con inconsistencia alta y se compararía la jerarquía entre pequeñas y medianas empresas."
    - "Extensión a contextos de disrupción: repetir la revisión con el término 'resilience' o 'disruption' y reclasificar los desafíos e impulsores en situaciones de interrupción, para identificar cuáles factores cambian de signo cuando la cadena se ve afectada (por ejemplo, la conectividad, la energía o la confianza en proveedores). El resultado sería una matriz de factores de adopción en normalidad frente a disrupción, útil para el diseño de sistemas de continuidad que funcionen cuando más se necesitan. Se contrastaría con los hallazgos de D037 sobre la fase de recuperación para detectar coincidencias entre factores de adopción y desempeño."
  relaciones:
    - "Adopción de IoT y resiliencia de cadenas (complementa) D017 y D037: D017 revisa IoT y resiliencia con WoS y D037 cuantifica la asociación con tecnologías digitales; D051 aporta los factores de adopción que condicionan esas relaciones."
    - "Revisión de IoT en negocios (se solapa con) D046: ambas sintetizan beneficios y desafíos de IoT en contextos empresariales con una base única o doble y sin cuantificar efectos."
  robustez: [2, 2, 2, 3]
  valor: [4, "Ofrece una taxonomía de desafíos e impulsores de adopción de IoT en cadenas de suministro, con un modelo de implementación, útil como lista de verificación. Su valor para el corpus es periférico: no trata desastres, no jerarquiza factores, no valida el modelo y se basa en 32 artículos. Sirve como punto de partida para estudiar barreras de adopción en pymes."]
  conexiones: []
socratica:
  p1: "'Desafío' es una barrera para la implementación del IoT en la cadena; 'impulsor antecedente' es un factor que precede a la adopción; 'impulsor consecuente' es un beneficio que motiva la adopción."
  p2: "Supone que 32 artículos de revista representan la literatura, que la clasificación es exhaustiva y que los beneficios esperados motivan la adopción."
  p3: "La evidencia es una clasificación cualitativa de 92 desafíos y 67 impulsores de 32 artículos y un modelo sin validación."
  p4: "Si es cierto, las organizaciones pueden anticipar obstáculos y motivaciones; si es falso, pueden dar el mismo peso a factores de muy distinta importancia."
  p5: "No se examinan frecuencias, validación del modelo, teorías de adopción ni contextos de disrupción."
  p6: "Alternativas: que unos pocos factores expliquen la mayor parte de la adopción; que el contexto sectorial cambie la jerarquía; que los impulsores consecuentes no motiven la adopción."
