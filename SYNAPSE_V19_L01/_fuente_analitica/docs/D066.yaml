  Z: Carga de trabajo, topología, restricciones de ancho de banda y recursos, semillas aleatorias
  datos: Conjunto industrial público de unos 120 000 registros de unas 30 horas a 1 Hz con 24 variables, en una simulación de borde y niebla
  metodo: Simulación con 20 repeticiones, intervalos de confianza de 95 % y pruebas t pareadas bilaterales
  efecto: Latencia de 39 a 52 ms; ahorro de ancho de banda de hasta 48 %; ahorro de energía de hasta 31 %; precisión de descarga de 89 a 93 %
  endogeneidad: No - no se discute
  instrumento: No aplica
  robustez: 20 repeticiones y pruebas pareadas en el mismo conjunto de datos; sin validación externa ni valores p
vacios:
- - TERR
  - No especificado en documento; autor en Shangqiu, China, sin territorio de despliegue
- - POBL
  - Dispositivos IoT simulados; sin empresas ni usuarios
- - TEMP
  - Unas 30 horas de datos; milisegundos de latencia; sin operación prolongada
- - MET
  - Solo simulación, un conjunto de manufactura y bases no equivalentes
- - VAR
  - Faltan costos, consumo medido en hardware, tipo de falla y cortes de energía o de comunicaciones
- - TEOR
  - Computación en el borde y aprendizaje por refuerzo; sin teoría de resiliencia empresarial
- - CAUS
  - Efecto de la tolerancia a fallas sobre la continuidad operativa sin evidencia
notas: Texto completo extraído (24 páginas, hasta las referencias). Las tablas 6 y 7 se leyeron con filas desordenadas; los valores de ELARA se tomaron del texto y de las filas legibles. La cifra de ancho de banda de 245 312 MB/min se cita tal como aparece y se marca como incoherente. Las páginas siguen los marcadores del PDF.
