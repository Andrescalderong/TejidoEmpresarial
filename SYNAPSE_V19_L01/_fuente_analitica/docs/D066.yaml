socratica:
  p1: '''ELARA'' es la arquitectura propuesta; ''microclúster con consenso'' es un grupo local de nodos de borde que acuerdan estado, líder y recuperación; ''descarga adaptativa'' es decidir si una tarea se ejecuta localmente, en un nodo cercano o en un módulo remoto; ''recuperación ante fallas'' es el tiempo que el sistema tarda en restablecer el servicio tras la falla de un nodo o tarea.'
  p2: Supone que la simulación con datos de manufactura representa redes IoT masivas, que los tres métodos de referencia son comparables, que el consenso local mantiene un costo constante y que los resultados de un dominio se transfieren a otros sin cambiar la arquitectura.
  p3: La evidencia son ocho indicadores de simulación con 20 repeticiones, intervalos de confianza de 95 % y pruebas t pareadas con p < 0,05, una tabla de latencia por modelo de procesamiento y cinco escenarios de precisión de descarga, sin hardware real.
  p4: Si es cierto, los nodos de borde de una planta podrían decidir en milisegundos y recuperarse rápido de fallas sin la nube; si es falso, el sistema puede tener costos de entrenamiento y de coordinación que los dispositivos pequeños no soportan y fallar ante cortes largos.
  p5: No se examinan comparaciones con soluciones de descarga especializadas, fallas bizantinas, ataques de inferencia, hardware real, consumo del aprendizaje federado ni cortes de energía o de comunicaciones.
  p6: 'Alternativas: que una heurística simple de descarga logre resultados similares; que el beneficio provenga más de la extracción de características que del refuerzo; que la nube con respaldo local sea suficiente para pymes.'
