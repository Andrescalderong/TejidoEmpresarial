doc_id: D081
relevancia: "Núcleo"
relevancia_just: "Revisión sistemática de 89 artículos sobre tecnología de gemelo digital y resiliencia de cadenas de suministro, con una síntesis por cuatro etapas (preparación, resistencia, rebote y crecimiento), beneficios (monitoreo en tiempo real, decisión, reducción de riesgo) y barreras de adopción (datos, costos, habilidades, gobernanza). Reúne gemelo digital, disrupción, recuperación empresarial y evidencia de madurez, ejes del corpus, aunque el IoT y los desastres naturales aparecen de manera indirecta, no trata sismos y reconoce que la evidencia de rebote y crecimiento es escasa y mayormente conceptual o simulada."
cluster_tema: "Gemelo digital y resiliencia de cadenas de suministro por etapas de la disrupción"
metodo_tipo: "Revisión sistemática de la literatura con PRISMA, búsqueda en Scopus y Web of Science, apreciación ligera de calidad y análisis de contenido con codificación abductiva por etapa de resiliencia"
tipo_recurso: "Artículo de revisión sistemática (journal peer-reviewed, acceso abierto)"
kw_inferidas: [gemelo digital, resiliencia de cadena de suministro, revisión sistemática, preparación, resistencia, rebote, crecimiento, visibilidad, barreras de adopción, gestión de riesgos]
c2:
  objetivo: >
    Sintetizar la literatura revisada por pares sobre el uso de la tecnología de gemelo digital (DTT) para mejorar la resiliencia de las cadenas de suministro (SCR), con un enfoque integrado por etapas de la disrupción. Los objetivos son identificar dónde se ha implementado el gemelo digital para la resiliencia, qué beneficios adicionales ofrece y qué impactos y desafíos acompañan su adopción. Los autores sostienen que la evidencia previa es fragmentada, que muchos estudios no especifican las capacidades del gemelo como mecanismos, que la resiliencia se trata en términos generales sin distinguir las etapas y que la evidencia sobre adopción está dispersa por sectores.
  pregunta: >
    Las preguntas de investigación son: RQ1, cuáles son las principales capacidades del gemelo digital asociadas con una mayor resiliencia de la cadena de suministro y si varían entre las etapas de resiliencia; RQ2, qué beneficios adicionales se obtienen con su adopción; y RQ3, qué desafíos o barreras existen al adoptar el gemelo para reforzar la resiliencia.
  marco: >
    El marco define el gemelo digital como una réplica virtual de un objeto, sistema o proceso sincronizada con datos en tiempo real, compuesta por adquisición y transmisión de datos (IoT), almacenamiento y procesamiento (nube y borde), modelado y simulación (incluida la IA) y visualización e interacción. En las cadenas de suministro se distinguen un nivel de red (valor entre varios actores) y un nivel de sitio (almacenes, plantas). La resiliencia se concibe como la capacidad adaptativa de prepararse para eventos inesperados, responder y recuperarse, con tres etapas conocidas (preparación, resistencia y rebote) y una cuarta etapa de crecimiento, que implica aprendizaje y mejora más allá de la recuperación. Las capacidades del gemelo se distinguen de los beneficios de desempeño y de las barreras de adopción.
  metodologia: >
    La revisión siguió un proceso de planificación, ejecución y reporte con criterios PRISMA. Las bases fueron Scopus (125 registros) y Web of Science (117), con ecuaciones que combinan los términos gemelo digital, sombra digital o gemelo virtual con resiliencia, incertidumbre, disrupción o robustez de la cadena de suministro, sin restricción de año y limitadas a artículos revisados por pares en inglés. La búsqueda inicial fue en noviembre de 2023 y se actualizó el 31 de mayo de 2025. De los 242 registros quedaron 182 sin duplicados, 26 no pudieron recuperarse y se retuvieron 89 artículos tras la evaluación de texto completo. Se usó una lista de apreciación ligera, con evaluación independiente de cada estudio por dos investigadores. Los textos se codificaron manualmente en NVivo y Excel con un enfoque abductivo; los 89 se codificaron para beneficios y desafíos, y un subconjunto de 40 artículos con detalle temporal y de mecanismos se asignó a las cuatro etapas. También se exploró Google Scholar con 117 registros que no aportaron estudios adicionales.
  resultados: >
    Los resultados descriptivos indican que el primer artículo apareció en 2013, que la producción creció de 3 estudios en 2019 a 13 en 2020, 19 en 2021, 18 en 2022 y 17 en 2023, con 5 en 2024 y 8 en 2025, y que los 89 artículos se publicaron en 34 revistas. Solo 22 de 89 especifican sector (siete farmacéutico, cinco alimentario, cuatro manufactura, dos automotriz, dos multisectorial y uno en eléctricos y servicios financieros). Predomina la investigación de construcción de teoría: 24 conceptuales, 29 analíticos (18 estadísticos y 11 matemáticos), 36 empíricos (21 estudios de caso, 14 estadísticos y 1 experimental). En la síntesis por etapas, de los 40 artículos asignables, 14 corresponden a preparación (visibilidad de extremo a extremo, análisis predictivo de riesgos, pruebas de estrés virtuales), 7 a resistencia (detección en tiempo real, control adaptativo, coordinación), 8 a rebote (modelado predictivo de recuperación, evaluación de rutas, reconfiguración de recursos) y 11 a crecimiento (análisis posterior, desarrollo de capacidades, rediseño estratégico). Entre los beneficios, la mejora de la decisión aparece en 21 artículos, el monitoreo en tiempo real, la reducción de riesgos y la eficiencia en 15 cada uno, el ahorro de tiempo y costos en 10, el mantenimiento predictivo y la colaboración en 8. Los desafíos más citados son interoperabilidad de datos y seguridad y privacidad (5 cada uno), exactitud de datos y compatibilidad de sistemas (4), costo y complejidad del modelo (3) y conectividad (2).
  discusion: >
    Los autores sostienen que las aplicaciones del gemelo en la resiliencia son incipientes pero ganan impulso, que la contribución difiere por etapa, que en la preparación mejora la visibilidad, la detección de nodos críticos y las pruebas de escenarios, que en la resistencia permite alertas tempranas y simulación de mitigaciones, que en el rebote ayuda a evaluar rutas de recuperación y estimar el tiempo de recuperación, y que en el crecimiento apoya el aprendizaje y el rediseño de redes. Señalan que la integración con tecnologías complementarias, como IA, IoT y blockchain, permite funcionalidades más avanzadas, y que las barreras principales son la calidad de los datos, los costos de implementación, la escasez de habilidades especializadas y la gobernanza. Proponen que el estudio sirva para priorizar casos de uso, requisitos de integración de datos y arreglos de gobernanza antes de una inversión a gran escala.
  limitaciones: "Declaradas: algunos estudios relevantes pueden no haberse recuperado por cobertura de las bases, indexación y restricción al inglés; solo un subconjunto de los artículos (40 de 89) tiene detalle suficiente para asignarse a etapas; muchos estudios son conceptuales o basados en simulación y no evalúan gemelos operativos, de modo que los mecanismos son indicativos y no definitivos; la apreciación de calidad es ligera. No declaradas: la lista de barreras del resumen incluye escasez de habilidades y gobernanza, pero la Tabla 7 de desafíos no las lista como categorías; el recuento de artículos por categoría de beneficio o de desafío no mide la magnitud del efecto; la ecuación exige el término cadena de suministro con resiliencia, incertidumbre, disrupción o robustez, de modo que la literatura de gemelos para desastres naturales o recuperación empresarial sin esas palabras queda fuera; la búsqueda se cerró en mayo de 2025 y el artículo se publicó en febrero de 2026; no se reportan los puntajes de apreciación ni la concordancia entre revisores; el número 117 aparece para Web of Science y para Google Scholar."
  futuro: "Explícito: priorizar estudios de implementación y entre sectores que operacionalicen métricas de resiliencia, pongan a prueba condiciones de contorno como la madurez de integración y la gobernanza de datos, y evalúen la contribución de los gemelos a los resultados de resiliencia a lo largo del tiempo; mayor evidencia empírica y longitudinal de las afirmaciones de rebote y crecimiento, como la automatización de flujos de trabajo y la acumulación de capacidades. Implícito: estudios de gemelos para disrupciones de origen natural y en empresas pequeñas, y análisis de costos."
c3:
  tesis: >
    La tecnología de gemelo digital fortalece la resiliencia de las cadenas de suministro de manera distinta según la etapa de la disrupción: mejora la visibilidad y las pruebas de escenarios en la preparación, la detección en tiempo real y la coordinación en la resistencia, la evaluación de rutas de recuperación y la estimación del tiempo de recuperación en el rebote, y el aprendizaje y rediseño de la red en el crecimiento, aunque su adopción enfrenta barreras de calidad de datos, interoperabilidad, costos, habilidades y gobernanza.
  antitesis: >
    La base de evidencia es mayormente conceptual o basada en simulación, solo 36 de 89 estudios son empíricos y uno es experimental, y los autores reconocen que los mecanismos son indicativos, por lo que la tesis de contribuciones por etapa descansa en pocos estudios por etapa (14, 7, 8 y 11) y en recuentos de artículos que no miden efectos. Casi todos los beneficios son descripciones de capacidades y no resultados medidos de resiliencia. La clasificación por etapas se aplica a 40 de 89 artículos con criterios de los autores, y la tabla de desafíos no recoge las barreras de habilidades y gobernanza que se destacan en el resumen. Los desastres naturales aparecen sin análisis específico y el sector está especificado en solo 22 artículos, con pocas pymes.
  sintesis: >
    La contribución sostenible es una matriz de capacidades del gemelo digital por etapa de resiliencia, junto con un inventario de beneficios y barreras y una advertencia explícita de que el rebote y el crecimiento son las etapas con menor evidencia. Para el corpus, es el documento que mejor une gemelo digital, disrupción y recuperación empresarial, y que formaliza la brecha de evidencia de resultados medidos en recuperación. Los recuentos son descriptivos y deben interpretarse con la limitación del muestreo y del criterio de relevancia, y la agenda requiere estudios que midan el tiempo de recuperación y los costos con y sin gemelo, en especial para empresas pequeñas y disrupciones de origen natural.
  areas_grises:
    - "Fuerza de la evidencia por etapa: los 40 artículos asignados a etapas se distribuyen en 14 de preparación, 7 de resistencia, 8 de rebote y 11 de crecimiento, y la conclusión reconoce que muchos estudios son conceptuales o de simulación y que no miden resultados de resiliencia, de modo que las capacidades por etapa son indicativas y el rebote, el más relevante para la recuperación, se apoya en ocho artículos."
    - "Coherencia entre barreras y tabla: el resumen incluye entre las barreras principales la escasez de habilidades especializadas y los desafíos de gobernanza, mientras que la Tabla 7 lista interoperabilidad, exactitud, costo, seguridad, complejidad, conectividad y compatibilidad, con 2 a 5 artículos cada una, y el costo se cita solo en tres artículos pese a ser una de las barreras destacadas."
    - "Alcance sectorial y de peligros: solo 22 de 89 artículos especifican sector, con predominio de farmacéutico y alimentario, y la ecuación exige términos de resiliencia, incertidumbre, disrupción o robustez de la cadena de suministro, por lo que los gemelos usados tras desastres naturales o para continuidad empresarial sin esas palabras quedan fuera, y el texto no analiza qué tipo de disrupción se estudia (pandemia, falla de proveedor o desastre natural)."
    - "Apreciación de calidad y recuentos: la apreciación se describe como lista ligera sin puntajes, la concordancia entre revisores no se informa y el conteo de artículos por beneficio o desafío se usa como indicador de importancia; el número de registros de Web of Science (117) coincide con el de Google Scholar (117), y la suma de la Tabla 4 de 89 incluye 18 estudios estadísticos analíticos cuya definición no se aclara."
  puntos_oscuros: >
    Llama la atención que el resumen afirme que el gemelo apoya el rebote mediante coordinación de respuesta y planificación de recuperación, cuando solo ocho artículos se asignan a esa etapa y casi todos son conceptuales o de simulación. También es notable que la conclusión del texto describa la contribución del gemelo en términos de capacidades, y que el estudio introduzca una cuarta etapa de crecimiento que reúne 11 artículos, más que el rebote y la resistencia. La tabla de la evolución de las definiciones incluye una definición de 2010 que describe un elemento digital que genera un gemelo caracterizado para cada usuario, que no corresponde al uso actual. Además, el texto explica la expansión de la literatura desde 2019 por la pandemia, sin considerar que la ecuación incluye el término disrupción que se popularizó en ese periodo. La caída a cinco artículos en 2024 se interpreta en el marco de una búsqueda actualizada en 2025, sin discutir la indexación tardía. Por último, el texto no contiene ninguna mención de terremotos, de desastres naturales como categoría de análisis ni de pequeñas y medianas empresas, aunque su aporte práctico se dirige a decisiones de inversión de empresas.
  ideas:
    - "Meta-síntesis de resultados medidos de recuperación: volver a los 36 estudios empíricos y a los 29 analíticos para extraer, cuando existan, los resultados numéricos (tiempo de recuperación, nivel de servicio, costo de la interrupción, reducción de inventario) con y sin gemelo, y calcular efectos estandarizados con intervalos para cada etapa. El resultado mostraría cuántos estudios aportan un efecto medido de rebote, qué magnitud tiene y cuánta heterogeneidad existe, y permitiría contrastar con la afirmación de capacidades de la revisión y construir una base cuantitativa para decidir si el gemelo reduce el tiempo de recuperación."
    - "Ensayo de campo del gemelo ligero en el rebote para pequeñas empresas: seleccionar entre 30 y 40 pymes de una zona expuesta a sismos, asignar al azar a la mitad un gemelo ligero de planificación de recuperación (inventario, capacidad, proveedores y rutas) y a la otra mitad su procedimiento habitual, y medir en un simulacro de interrupción de dos semanas el tiempo hasta reanudar un nivel mínimo de servicio, el costo de la interrupción y la calidad de las decisiones. Con ello se podría estimar el efecto del gemelo en el rebote, que hoy carece de evidencia experimental, y el costo de implementación necesario para una pyme."
  relaciones:
    - "Resiliencia de cadenas de suministro e información (complementa) D077 y D082: D077 propone un marco de colaboración con IoT y gobierno ante desastres en cadenas de suministro y D082 revisa mecanismos de resiliencia organizacional; D081 aporta un mapa de capacidades del gemelo por etapa de la disrupción."
    - "Gemelos y resiliencia en otros niveles (se relaciona con) D074 y D079: D074 propone indicadores de resiliencia en gemelos IoT y D079 revisa gemelos urbanos con IoT e IA; ambos coinciden con D081 en que faltan resultados medidos y métricas de resiliencia."
  robustez: [3, 3, 3, 3]
  valor: [8, "Aporta una revisión sistemática con búsqueda, criterios y recuentos explícitos de 89 artículos, una matriz de capacidades del gemelo por cuatro etapas de resiliencia (14, 7, 8 y 11 estudios), un inventario de siete beneficios y siete desafíos con recuentos, y una advertencia clara de que la evidencia de rebote y crecimiento es escasa. Su valor para el corpus es alto por unir gemelo digital, disrupción y recuperación empresarial; se reduce porque los recuentos no miden efectos, la apreciación de calidad es ligera, el IoT y los desastres naturales se tratan de forma indirecta y no hay análisis de pymes ni de sismos."]
  conexiones: []
socratica:
  p1: "'Preparación, resistencia, rebote y crecimiento' son las etapas de la disrupción; 'capacidad del gemelo' es un mecanismo funcional (visibilidad, análisis predictivo, automatización); 'nivel de red' y 'nivel de sitio' distinguen el alcance del gemelo; 'revisión ligera de calidad' es una apreciación sin puntajes completos."
  p2: "Supone que los recuentos de artículos reflejan la importancia de las capacidades, que los 40 artículos asignados representan los 89, y que una ecuación sobre resiliencia de cadena de suministro recupera la literatura relevante."
  p3: "La evidencia son 89 artículos de 34 revistas (24 conceptuales, 29 analíticos y 36 empíricos), una codificación manual de beneficios y desafíos y una asignación a etapas de 40 estudios."
  p4: "Si es cierto, los gestores pueden priorizar casos de uso por etapa y las barreras de datos y gobernanza; si es falso, se pueden sobrestimar los beneficios del gemelo para el rebote, que tiene poca evidencia."
  p5: "No se examinan efectos medidos de recuperación, costos comparables, empresas pequeñas, desastres naturales específicos ni la concordancia de los revisores."
  p6: "Alternativas: que beneficios similares se logren con analítica de datos sin gemelo; que la visibilidad de la cadena sea el factor determinante; que la preparación no se traduzca en rebote más rápido."
