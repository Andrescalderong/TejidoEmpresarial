  - Aporta una arquitectura completa de gemelo digital sísmico para un distrito industrial de tamaño medio, con pipeline de datos de cinco familias, bitácora de procedencia, red de sensores y tableros de riesgo y escenarios, financiada por el municipio caso y alineada con cuatro ODS. Su valor para el corpus es alto por reunir gemelo digital, IoT, sismo y recuperación en un caso real, y se reduce porque la exactitud de 87 % y la disponibilidad de 99,2 % carecen de método, la red de sensores aparece como propuesta y como operativa, el sistema declarado de código abierto usa software propietario y no hay costos ni modelo de interrupción empresarial.
