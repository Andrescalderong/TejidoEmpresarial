socratica:
  p1: '''SRDT'' (Seismic Risk Digital Twin) es el gemelo de riesgo sísmico de Çayırova; ''exactitud de 87 %'' es la coincidencia entre daño simulado y observado, sin métrica definida; ''disponibilidad'' es la proporción de tiempo en que el sistema respondió en la prueba de varios usuarios; ''datos en tiempo real'' son los flujos de sensores por MQTT.'
  p2: Supone que un escenario hipotético puede compararse con daño observado, que las pruebas de laboratorio representan la disponibilidad en una emergencia, que los datos de sensores están integrados y que el código abierto y el acceso a datos son compatibles con su operación.
  p3: La evidencia son capturas de tableros, una descripción del pipeline y del hardware, un escenario de magnitud mayor o igual a 7,0 y tres cifras (18 %, 87 % y 99,2 %) sin método.
  p4: Si es cierto, el municipio puede priorizar inspecciones y unidades móviles con datos y simulaciones; si es falso, la cifra de exactitud puede no representar el desempeño y la plataforma puede quedar inoperante cuando falle la nube o la red.
  p5: No se examinan la métrica de exactitud, el evento observado, el número de sensores, los costos, la interrupción de empresas ni el desempeño sin conectividad.
  p6: 'Alternativas: que una herramienta de SIG con curvas de fragilidad dé resultados similares a menor costo; que el valor principal esté en la integración de datos y no en la simulación; que la operación sin nube sea más importante que la sofisticación.'
