doc_id: D080
relevancia: Núcleo
relevancia_just: Desarrolla un gemelo digital de código abierto para la gestión de desastres sísmicos en el distrito industrial de Çayırova (Kocaeli, Türkiye), que integra datos geoespaciales, de edificios, demográficos y de una red de sensores IoT (acelerómetros, galgas, sensores ambientales y de energía) en una base PostGIS, con paneles de riesgo sísmico, simulación de escenarios (Mw ≥ 7,0) y alineación con los ODS 9, 11, 13 y 17. Reúne gemelo digital, IoT, sismo, respuesta y recuperación en un caso real financiado por el municipio, que es el núcleo de la temática del corpus, aunque las cifras de desempeño (87 % de exactitud, 99,2 % de disponibilidad) se informan sin método ni línea base.
cluster_tema: Gemelo digital sísmico con IoT para gestión de desastres y resiliencia en una ciudad industrial
metodo_tipo: Estudio de caso con desarrollo de sistema, métodos mixtos (análisis espacial, simulación y evaluación cualitativa) y pruebas de uso del gemelo, sin protocolo de validación descrito
tipo_recurso: Artículo científico (journal peer-reviewed, acceso abierto)
kw_inferidas:
- gemelo digital
- gestión de desastres
- riesgo sísmico
- IoT
- QGIS
- InfraWorks
- PostGIS
- ODS
- Çayırova
- resiliencia urbana
c2:
  objetivo: 'Desarrollar un marco de gemelo digital (DT) de código abierto para la gestión de desastres sísmicos en el distrito de Çayırova, en Kocaeli (Türkiye), una de las regiones más activas sísmicamente del país, con el fin de reforzar la resiliencia local integrando datos de múltiples fuentes en un entorno digital unificado que apoye la evaluación de riesgo, la planificación de respuesta y la coordinación de la recuperación. El modelo busca servir como base de datos digital de respaldo en emergencias, contribuir a prácticas urbanas sostenibles, reducir el número de personas afectadas y las pérdidas económicas directas, y alinear las decisiones con los objetivos de desarrollo sostenible.

    '
  pregunta: 'El artículo no formula preguntas de investigación explícitas. Sus tres propósitos declarados son diseñar y presentar un gemelo digital de código abierto para la gestión de desastres centrada en terremotos en Çayırova, demostrar cómo puede apoyar la evaluación del riesgo sísmico y la planificación para reducirlo y alinear los procesos de decisión con los ODS pertinentes.

    '
  marco: 'El marco combina el ciclo de gestión de desastres (mitigación, preparación, respuesta y recuperación), la definición de gemelo digital como modelo virtual actualizado con datos en tiempo real y los ODS. Los autores sostienen que los estudios de gemelos se concentran en grandes metrópolis con infraestructura de datos extensa (Londres, Singapur, Shanghái), que las ciudades pequeñas y medianas industriales están subrepresentadas y que la mayoría de los trabajos se limita a arquitecturas conceptuales o visualizaciones sin flujos operativos de gestión del riesgo. Se vincula el gemelo con las metas 11.5 y 11.B, 13.1, 9.1 y 9.4 y 17.6 y 17.17, y se reconocen riesgos de calidad de datos, dependencia de la nube, costos y continuidad en emergencias.

    '
  metodologia: 'El estudio adopta un estudio de caso con métodos mixtos de análisis espacial, simulación y evaluación cualitativa. El hardware es híbrido: una estación de trabajo local (procesador Ryzen 9 7950X, tarjeta RTX 4070 Ti, 64 GB de memoria y 2 TB de almacenamiento) y un servidor en la nube (8 CPU virtuales, 32 GB y 1 TB) con PostGIS en AWS o DigitalOcean. El modelo se construye con QGIS y Autodesk InfraWorks con simulación en Unreal Engine. El flujo de datos integra cinco familias de entrada (vectoriales, ráster, 3D, nubes de puntos y tabulares/demográficas) en un esquema por etapas, armonizadas a UTM 35N y WGS 84, con un identificador estable de edificio, interpolación areal ponderada para desagregar datos del censo, imputación jerárquica de atributos faltantes, bitácora de procedencia y vistas materializadas. La red de sensores propuesta incluye acelerómetros, galgas y medidores de desplazamiento, sensores ambientales y medidores de energía que transmiten por LoRaWAN, Wi-Fi o
    5G y MQTT, con puertas de enlace de borde tipo Raspberry Pi o Jetson Nano.

    '
  resultados: 'Los resultados se presentan como el funcionamiento del modelo y tableros: capturas del modelo, un tablero de riesgo sísmico con detecciones, réplicas, pronósticos probabilísticos e indicadores de respuesta, un tablero de gestión de la infraestructura IoT, un tablero de simulación de escenarios (deterministas y probabilísticos, incendios posterremoto y fallas de infraestructura) con daño predicho, tiempo de respuesta y recomendaciones automáticas de evacuación y recursos médicos, y un panel de atributos por edificio con índices de vulnerabilidad. En un escenario sísmico con magnitud mayor o igual a 7,0, el modelo indica que alrededor de 18 % de los edificios de concreto reforzado de mediana altura sufre daño de menor a moderado, en particular en zonas residenciales anteriores al año 2000, que los corredores de transporte críticos se mantienen funcionales, que la exactitud entre daño simulado y observado es de 87 % y que la disponibilidad fue de 99,2 % en pruebas de varios usuarios
    con cinco escenarios concurrentes. El texto concluye que las prioridades deben ser la inspección rápida de edificios y las unidades móviles y no las evacuaciones masivas. No se explican la fuente del daño observado, la métrica de exactitud ni el número de sensores instalados. El modelo se describe como en funcionamiento sobre el distrito.'
  discusion: 'Los autores sostienen que el estudio implementó con infraestructura concreta de hardware y software los enfoques conceptuales de la literatura, que el sistema va más allá de un SIG tradicional porque recalibra parámetros con datos de sensores y ofrece retroalimentación entre el nivel digital y el físico, que la arquitectura híbrida de estación local y nube permite simulaciones de alta fidelidad y acceso de varios usuarios, y que la alineación con los ODS convierte al gemelo en habilitador estratégico de sostenibilidad y resiliencia. Reconocen que el despliegue masivo de sensores exige considerar costo, mantenimiento y confiabilidad de red, que la nube introduce dependencias y costos y riesgos en emergencias, que la calidad de los datos determina la exactitud y que la integración con los ODS es indicativa y no cuantifica impactos de largo plazo.

    '
  limitaciones: 'Declaradas: la exactitud depende de la calidad y de la resolución temporal de los datos, que varían entre municipios; el costo, el mantenimiento y la confiabilidad de la red de sensores; la dependencia de la nube en términos de seguridad, costo y continuidad durante emergencias; el modelo prioriza escalabilidad y accesibilidad frente a la fidelidad de la simulación; la vinculación con los ODS es indicativa y no cuantifica impactos de largo plazo; la analítica predictiva y el aprendizaje automático quedan para trabajo futuro. No declaradas: la exactitud de 87 % entre daño simulado y observado no tiene definición de métrica, evento observado, muestra ni método de comparación, y el artículo trata un escenario hipotético de magnitud 7,0; la disponibilidad de 99,2 % se mide en pruebas de laboratorio de cinco escenarios y no refleja operación en una emergencia; la integración de datos en vivo de sensores se presenta como propuesta y como capacidad actual en secciones distintas;
    se denomina de código abierto a un sistema que usa software propietario (InfraWorks, Unreal Engine) y cuyos datos se ofrecen bajo consentimiento del municipio financiador; no hay costos de desarrollo ni de operación; el estudio fue financiado por el municipio caso y declara no tener conflictos de interés; no se modelan las empresas ni las cadenas de suministro de la zona industrial.'
  futuro: 'Explícito: mejorar la interoperabilidad de datos con estándares nacionales e internacionales, integrar inteligencia artificial y analítica predictiva para pronóstico adaptativo del riesgo, y medir los impactos ambientales y sociales de largo plazo de los gemelos para gestión de desastres, con métricas de contribución a los indicadores de los ODS. Implícito: validación con eventos reales, datos en vivo de la red de sensores y módulos de interrupción empresarial.'
c3:
  tesis: 'Un gemelo digital de código abierto para un distrito industrial de tamaño medio, construido con datos geoespaciales, de edificios y demográficos, una red de sensores IoT y una arquitectura híbrida de estación local y nube, permite simular escenarios sísmicos (Mw ≥ 7,0) con una exactitud de 87 % frente a daño observado, mantener 99,2 % de disponibilidad con varios usuarios y apoyar la respuesta, la recuperación y la planificación alineadas con los ODS, de modo que ofrece un modelo replicable para ciudades fuera de las grandes metrópolis.

    '
  antitesis: 'Las cifras que sustentan la tesis carecen de método: no se define la métrica de exactitud, no se identifica el evento observado con el que se compara un escenario hipotético, y la disponibilidad se mide en pruebas de laboratorio. El artículo propone la integración de sensores y a la vez describe tableros con detecciones en vivo, de modo que no queda claro si hay datos reales en operación. El sistema se declara de código abierto, pero depende de software propietario y de datos sujetos a consentimiento del municipio que financió el estudio. No hay costos, ni modelo de interrupción de empresas pese a tratarse de una zona industrial, y la conclusión de que las prioridades son la inspección y las unidades móviles y no las evacuaciones proviene del modelo no validado. La alineación con los ODS es declarativa.

    '
  sintesis: 'La contribución sostenible es una arquitectura operativa, con pipeline de datos documentado, bitácora de procedencia, tableros y un diseño de red de sensores, para un distrito industrial de tamaño medio, que muestra cómo integrar geodatos, inventario de edificios y simulación en una plataforma accesible. Para el corpus, es la pieza que más se acerca a la unión de gemelo digital, IoT, sismo y recuperación en un caso real, y su valor está en el diseño de datos y en la agenda que deja abierta, más que en las cifras de desempeño, que no se pueden evaluar. Su utilidad para la recuperación empresarial requiere validación contra un evento real, publicación de la métrica y de los datos, y módulos de interrupción de empresas y de cadenas de suministro.

    '
  areas_grises:
  - 'Exactitud de 87 %: el texto afirma una alta exactitud de predicción entre daño simulado y observado, pero no define la métrica (por edificio, por estado de daño o por zona), no identifica el evento sísmico con daño observado ni el número de edificios comparados, y el escenario evaluado es un terremoto hipotético de magnitud mayor o igual a 7,0, de modo que la cifra no puede interpretarse.'
  - 'Estado real de la red de sensores: la sección de diseño indica que el estudio propone integrar adquisición en tiempo real con sensores y describe la integración de datos en vivo como extensión futura, mientras que los resultados y la discusión describen detecciones en vivo, retroalimentación en tiempo real y recalibración continua; no se indica cuántos sensores existen, dónde están ni qué datos mostraron.'
  - 'Naturaleza de código abierto y acceso a datos: el título del objetivo habla de un sistema de código abierto, pero el modelo usa Autodesk InfraWorks y Unreal Engine, y los datos se entregan a solicitud con el consentimiento del municipio de Çayırova, que financió la investigación; no se indica qué componentes y datos están disponibles públicamente.'
  - 'Pruebas de disponibilidad: la disponibilidad de 99,2 % se refiere a pruebas de estrés con cinco escenarios concurrentes, sin duración, carga, tipo de fallas ni condiciones de red, y el propio texto reconoce que la dependencia de la nube puede ser crítica cuando la comunicación se interrumpe en emergencias.'
  puntos_oscuros: 'Llama la atención que el resumen presente el modelo como esperado para crear cadenas logísticas sostenibles y reducir pérdidas económicas, mientras que los resultados no incluyen ninguna estimación económica ni de interrupción productiva pese a tratarse de un distrito industrial. También es notable que el texto describa un tablero de riesgo con eventos y réplicas recientes y pronósticos probabilísticos de sismos secundarios sin explicar el origen de esos datos, y que el panel se titule con el nombre de la provincia y no del distrito. La conclusión de que el sistema reduce los tiempos de respuesta y minimiza pérdidas humanas y materiales no tiene medición. El financiamiento del municipio objeto del estudio y la declaración de ausencia de conflictos de interés conviven con la entrega de datos condicionada a su consentimiento. Además, la introducción sostiene que el gemelo identifica poblaciones marginadas e integra datos demográficos, pero la desagregación del censo a edificios
    se hace por interpolación areal, sin evaluación de error. Por último, la definición de gemelo adoptada exige un modelo que actualiza con datos en tiempo real, y el artículo la aplica sin mostrar los datos.

    '
  ideas:
  - 'Validación del escenario con el terremoto de Kocaeli de 1999 o con un evento reciente: construir una tabla de daño observado por edificio (inspecciones de seguridad posterremoto) para una muestra de 500 o más edificios del distrito, ejecutar el escenario correspondiente en el gemelo y reportar la matriz de confusión por estado de daño, la exactitud y el índice kappa con intervalos de confianza. El resultado mostraría si la exactitud de 87 % se mantiene con una métrica definida, qué estados de daño se confunden y si el modelo sirve para priorizar inspecciones y para el cálculo del tiempo de cierre de edificios.'
  - 'Módulo de interrupción productiva y piloto de sensores: añadir al gemelo atributos de las empresas de la zona industrial (actividad, empleados, dependencia de energía y de proveedores, existencias peligrosas) y vincular el daño por edificio con días de cierre y pérdidas de producción, con una instalación piloto de 10 a 20 sensores durante seis meses que mida latencia, falsos disparos y disponibilidad real de la red. Con esto se podría estimar la pérdida por interrupción en escenarios de magnitud 6,5 y 7,0 y calcular cuánto reduce un orden de inspección priorizado el tiempo de reapertura, información para empresas y municipios sobre el valor del gemelo.'
  relaciones:
  - 'Gemelos comunitarios y revisiones de ciudades inteligentes (complementa) D078 y D079: D078 presenta un gemelo comunitario para tornados con datos públicos y D079 revisa los gemelos urbanos y su falta de evidencia de retorno; D080 aporta un caso sísmico con IoT y un pipeline de datos documentado.'
  - 'Gemelo sísmico con sensores y red (se relaciona con) D064 y D073: D064 diseña un gemelo para edificios con 5G y retardos medidos y D073 mide la latencia de alerta con IoT y nube; D080 propone usar LoRaWAN, 5G, MQTT y puertas de enlace de borde en un distrito industrial, sin medir latencias.'
