falacias:
- - Cifra de exactitud sin método
  - Se afirma 87 % de exactitud entre daño simulado y observado para un escenario hipotético (Sec. 4, p. 19; Sec. 5, p. 21)
  - No se define métrica ni evento observado
- - Propuesta presentada como capacidad operativa
  - La integración de sensores se propone en el diseño y se describe como funcionando en resultados y discusión (Sec. 2.2.2, p. 13; Sec. 3, p. 15; Sec. 4, p. 19)
  - Inconsistencia entre secciones
- - Etiqueta de código abierto con componentes propietarios
  - Se declara un gemelo de código abierto que usa software propietario y datos sujetos a consentimiento (Resumen, p. 1; Sec. 2.2.1, p. 10; Data Availability, p. 22)
  - El alcance de la apertura no se aclara
