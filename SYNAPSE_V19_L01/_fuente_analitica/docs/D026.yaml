doc_id: D026
relevancia: "Adyacente"
relevancia_just: "Inventaría y compara 89 soluciones digitales (web, móviles, redes sociales) surgidas tras el sismo de febrero de 2023 en Türkiye por fase de gestión de desastres, con 43 soluciones de recuperación; es el caso empírico de sismo real más cercano del corpus para tecnología de recuperación, aunque no incluye gemelos digitales, IoT ni recuperación empresarial."
cluster_tema: "Soluciones digitales para gestión de sismos (caso Türkiye 2023)"
metodo_tipo: "Estudio comparativo descriptivo de soluciones digitales (inventario y clasificación en un marco de cuatro categorías)"
tipo_recurso: "Artículo científico (journal peer-reviewed, acceso abierto)"
kw_inferidas: [gestión de desastres, soluciones digitales, sismo de Türkiye 2023, fases de gestión de desastres, redes sociales, plataformas web y móviles, recuperación, campañas de ayuda, información de emergencia, proveedores privados]
c2:
  objetivo: >
    Investigar el papel de las tecnologías de la información, incluidas plataformas de comunicación y soluciones de redes sociales, en la gestión de desastres sísmicos, con foco en el sismo de febrero de 2023 en Türkiye, mediante un marco comparativo de cuatro categorías (objetivo, proveedores, fase objetivo y plataforma). El estudio busca describir cómo se distribuyen las soluciones entre las fases de mitigación, preparación, respuesta y recuperación, cuáles son sus objetivos principales, qué plataformas y qué tipos de proveedores predominan y qué impacto tuvieron las soluciones de redes sociales, para informar a residentes, equipos de respuesta, decisores y desarrolladores de tecnología.
  pregunta: >
    RQ1: ¿cómo varía la distribución de campañas de ayuda, respuesta de emergencia, difusión de información y servicios de apoyo entre las fases de gestión de desastres sísmicos? RQ2: ¿cuáles son los objetivos principales de las soluciones usadas antes y después del sismo reciente en Türkiye? RQ3: ¿qué plataformas de TI son las más usadas en cada fase y cómo contribuyen? RQ4: ¿qué impacto tuvieron las soluciones de redes sociales durante y después del sismo?
  marco: >
    El marco es el ciclo de gestión de desastres en cuatro fases (mitigación, preparación, respuesta y recuperación), con definiciones tomadas de la literatura y de fuentes institucionales: la mitigación reduce los efectos adversos, la preparación construye capacidades, la respuesta atiende necesidades de corto plazo y la recuperación restaura activos y actividades sociales, físicas, culturales, económicas y ambientales de la comunidad. Se apoya en la tesis de que la tecnología puede mejorar la eficacia del manejo de desastres y en la necesidad de un enfoque interdisciplinar. El instrumento analítico es un marco comparativo de cuatro categorías (objetivo, proveedores, fase objetivo y plataforma) que organiza las soluciones identificadas. No se usa una teoría explícita de adopción tecnológica ni de resiliencia comunitaria.
  metodologia: >
    Se identificaron 130 soluciones inmediatamente tras el sismo de febrero de 2023 mediante búsquedas en la web y en redes sociales. Tras una primera revisión (duplicados e irrelevantes) quedaron 102; una segunda revisión excluyó 13 soluciones no disponibles; y una tercera combinó diez soluciones que pertenecían a dos instituciones para centrarse en proveedores únicos, lo que dejó 89 soluciones de 82 proveedores. Las soluciones se clasificaron en cuatro categorías: objetivo (campaña de ayuda, apoyo, emergencia, información), proveedor (público, privado, ONG, asociación, fundación, unión o centro), fase objetivo y plataforma (web, móvil o ambas). La revisión fue realizada por los autores, sin concordancia entre codificadores ni descripción de los términos de búsqueda ni de las fechas de captura. Las cifras se presentan como conteos y figuras, sin pruebas estadísticas, y el conjunto de datos final se ofrece en un enlace del artículo. Cada solución pudo asignarse a varios objetivos y a varias fases, por lo que los totales por categoría no son excluyentes y no coinciden con el número de soluciones.
  resultados: >
    Se identificaron 21 soluciones predesastre (11 de mitigación y 5 de preparación según el texto) y 77 posdesastre (34 de respuesta y 43 de recuperación); los conteos no suman 89 porque una solución puede abarcar varias fases. Por objetivo, hay 15 campañas de ayuda (siete de vivienda y diez de donaciones), 29 de apoyo (reclutamiento, salud física y mental, asesoría legal, becas, educación y recolección de datos), 12 de emergencia (dos de alerta temprana, cuatro de mensajes de 'estoy a salvo', ocho de SOS, entre otras) y 33 de información (sobre sismos, ayuda, orientación legal, ubicación, salud, verificación de información y educación). Por plataforma, 67 de 81 son web, 8 móviles y 6 mixtas. Las organizaciones privadas lideran el desarrollo de plataformas web y móviles, y las entidades públicas, fundaciones y ONG participan menos. En redes sociales, Twitter, Facebook e Instagram sirvieron para mensajes de 'estoy vivo', localización de víctimas y coordinación de voluntarios; se citan Ahbap, que canalizó solicitudes de rescate y donaciones, y deprem.io, desarrollada por voluntarios para organizar información publicada en Twitter. El análisis del 'impacto' es descriptivo y no incluye métricas de uso, alcance ni desempeño; tampoco se informa cuántas de las soluciones continuaban operando después de la emergencia ni qué parte de la población las utilizó.
  discusion: >
    Los autores concluyen que las soluciones se distribuyen en las cuatro fases con un número creciente de soluciones posdesastre (respuesta y recuperación), que sus objetivos principales son ayudar, apoyar, notificar emergencias y difundir información crítica, que las organizaciones privadas lideran su oferta y que predomina la plataforma web. Sostienen que el uso de soluciones web y móviles mejora la comunicación, la coordinación, la gestión de recursos y el acceso a servicios. Recomiendan aumentar el número de aplicaciones móviles y su difusión, abordar la contaminación informativa con soluciones basadas en fuentes confiables y ampliar el apoyo legal, en especial la concientización y la recolección de evidencias.
  limitaciones: "No se presenta una sección de limitaciones. Implícitas: inventario sin protocolo reproducible ni fecha de corte; clasificación por los autores sin concordancia; exclusión de 13 soluciones no disponibles; ausencia de métricas de uso o efecto; un único evento y país."
  futuro: "Aumentar las aplicaciones móviles y la concientización pública sobre ellas, desarrollar soluciones basadas en fuentes confiables contra la desinformación y ampliar el apoyo en procesos legales, la concientización y la recolección de evidencias."
c3:
  tesis: >
    Tras el sismo de febrero de 2023 en Türkiye surgió un conjunto amplio y diverso de soluciones digitales, dominado por plataformas web de proveedores privados y orientado sobre todo a la respuesta y la recuperación (campañas de ayuda, apoyo, emergencia e información), y las redes sociales fueron un canal central de comunicación, búsqueda de víctimas y coordinación de voluntarios.
  antitesis: >
    El estudio describe qué existe, no qué funcionó: el título promete analizar el impacto, pero no se miden uso, alcance, tiempos de respuesta ni resultados, y el apartado sobre redes sociales ilustra dos casos sin evaluación. El inventario depende de la visibilidad de las soluciones en la web y en redes durante el periodo posterior al sismo, sin protocolo de búsqueda ni fecha de corte, lo que sesga hacia soluciones públicas y ya existentes; los conteos por fase (21 predesastre, 77 posdesastre) no son consistentes con 89 soluciones ni con la suma de 11 y 5 y no se explica el solapamiento. La clasificación en 'recuperación' mezcla servicios de apoyo emocional, becas y vivienda con la reconstrucción económica, y solo cinco soluciones de reclutamiento tocan el empleo; no se encuentra ninguna solución dirigida a la recuperación de empresas. Las conclusiones sobre mejora de coordinación y de efectividad no tienen respaldo medido.
  sintesis: >
    El artículo documenta con claridad la oferta tecnológica espontánea tras un sismo de gran magnitud y deja ver una laguna: la mayoría de las soluciones son de comunicación, ayuda e información, y casi ninguna atiende la reactivación productiva. Debe leerse como inventario de un evento y no como evaluación de efectividad. Para el corpus, la síntesis consiste en usar este inventario como línea base de oferta de recuperación y contrastarla con una demanda empresarial medida (empresas cerradas, tiempo de reapertura, necesidades de crédito, insumos, empleo), y evaluar con indicadores de uso y de resultado cuáles soluciones deberían transferirse y adaptarse a la reactivación productiva.
  areas_grises:
    - "Inventario sin protocolo reproducible: no se informan los términos de búsqueda, los sitios o las fechas de captura, ni cómo se verificó la disponibilidad de cada solución, de modo que el conjunto de 130 a 89 soluciones no se puede replicar ni acotar por sesgo de visibilidad."
    - "Consistencia de los conteos: se reportan 89 soluciones de 82 proveedores, 21 predesastre (con 11 de mitigación y 5 de preparación), 77 posdesastre y 81 plataformas clasificadas (67, 8 y 6); los totales no cuadran con 89 y el texto no explica el solapamiento entre fases ni las ocho soluciones sin plataforma clasificada."
    - "Ausencia de medición del impacto: aunque el título y la RQ4 hablan de impacto, no hay datos de usuarios, alcance, tiempo de respuesta, calidad de la información ni desinformación; las afirmaciones sobre mejora de comunicación y coordinación se apoyan en ejemplos."
    - "Definición de recuperación: la fase de recuperación (43 soluciones) incluye vivienda, donaciones, salud, becas y empleo, pero no distingue recuperación económica ni empresarial; el texto no analiza qué actividades productivas se reanudaron ni con qué apoyo digital."
  puntos_oscuros: >
    Llama la atención que 43 de las 98 asignaciones de fase correspondan a recuperación mientras el contenido descrito corresponde principalmente a ayuda inmediata, donaciones y apoyo (vivienda, becas, terapia, ropa y calefactores), es decir, a necesidades de continuación de la respuesta y no a reactivación de la economía. Una explicación plausible es que las soluciones espontáneas se desarrollaron en la semana posterior al evento, por voluntarios y empresas con motivaciones filantrópicas o reputacionales, y que la recuperación productiva exige datos y procesos (registro de empresas, crédito, permisos, cadenas de suministro) que no se improvisan en una plataforma de voluntariado. Esto sugiere que el etiquetado de fase refleja el momento de uso y no la función económica de la solución. Además, la apelación a 'proveedores privados' como líderes no distingue entre empresas tecnológicas, comerciales y de telecomunicaciones, y no se informa la sostenibilidad de las soluciones después de la emergencia, de modo que el inventario puede sobreestimar la capacidad instalada de recuperación.
  ideas:
    - "Mapa de brechas entre oferta de soluciones digitales y necesidades de recuperación empresarial: complementar el inventario de 89 soluciones con una encuesta rápida a empresas afectadas (cierre, causas de cierre, tiempo de reapertura, necesidades de financiamiento, insumos, empleo) y cruzar cada necesidad con la existencia de una solución digital, estimando la cobertura por tipo de necesidad. Fundamento: el artículo muestra solo cinco soluciones de reclutamiento y ninguna de reactivación de empresas. Verificabilidad: muestreo de empresas de las provincias afectadas, con definición común de necesidad y de cobertura. Utilidad: orienta el diseño o la transferencia de soluciones hacia la demanda productiva real."
    - "Evaluación de desempeño de las plataformas de emergencia con indicadores de uso y calidad: reconstruir, para una muestra de las 89 soluciones, el volumen de usuarios, el tiempo medio hasta respuesta, la tasa de solicitudes atendidas y la presencia de información errónea, usando registros de proveedores y capturas de actividad, y estimar qué rasgos (plataforma, proveedor, fase) se asocian con mejor desempeño. Fundamento: el artículo describe presencia pero no efecto. Verificabilidad: acuerdos de datos con proveedores y análisis descriptivo con intervalos. Utilidad: identifica qué soluciones merecen transferencia y mantenimiento y cuáles solo funcionaron por la urgencia del momento, y permite justificar la inversión pública en plataformas con evidencia de desempeño en vez de en el número de aplicaciones disponibles."
  relaciones:
    - "Interrupción de la telefonía móvil y de la electricidad (limita) el uso de soluciones digitales en las primeras horas: el artículo relata que la falta de energía y de estaciones móviles impidió una comunicación adecuada entre personas e instituciones, lo que condiciona el alcance de las plataformas."
    - "Participación de proveedores privados (aumenta) la oferta de plataformas web y móviles: según los conteos, las empresas lideran el desarrollo, mientras entidades públicas y ONG aportan menos, aunque el artículo no estima efectos sobre calidad o sostenibilidad."
  robustez: [3, 3, 2, 3]
  valor: [5, "Documenta un caso real y reciente de sismo con una clasificación clara de 89 soluciones digitales por fase, objetivo, proveedor y plataforma, y muestra que la recuperación concentra el mayor número de soluciones pero sin foco productivo. Su valor para el corpus es de línea base de oferta y de brecha en recuperación empresarial; se reduce porque no mide impacto, el inventario no es reproducible y los conteos no son consistentes."]
  conexiones: []
socratica:
  p1: "'Solución digital' es una plataforma web o móvil o un uso de redes sociales dirigido a una o más fases del ciclo de gestión de desastres; 'recuperación' se define como restauración de activos, sistemas y actividades de la comunidad."
  p2: "Supone que las soluciones encontradas en la web representan la oferta, que clasificarlas por fase refleja su función y que su existencia implica efectividad."
  p3: "La evidencia son conteos de 89 soluciones y descripciones de dos casos en redes sociales; no hay medición de uso o resultados."
  p4: "Si es cierto, conviene promover más aplicaciones móviles y soluciones de información confiable; si es falso, podrían multiplicarse plataformas sin uso ni resultado y sin atender la reactivación productiva."
  p5: "No se examinan soluciones que fracasaron, no se usaron o difundieron información falsa, ni la capacidad de las redes cuando la energía y las comunicaciones fallaron."
  p6: "Alternativas: que la oferta espontánea refleje la visibilidad mediática y no la necesidad; que el mejor desempeño provenga de organizaciones con experiencia previa; que la coordinación institucional pese más que la tecnología."
