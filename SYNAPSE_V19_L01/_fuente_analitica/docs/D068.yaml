falacias:
- - Ausencia de significancia interpretada como equivalencia
  - Los valores p de 0,621, 0,291, 0,130 y 0,359 se usan para afirmar que los sensores no difieren del LVDT (Sec. 5.2, p. 18-20)
  - Con pocas mediciones no se prueba equivalencia
- - Afirmación de alta precisión con un error elevado
  - Se califica de alta exactitud la deformación con error relativo medio de 34,3 % (Sec. 5.4, p. 22)
  - Contradice las cifras presentadas
- - Generalización desde un elemento simple
  - Se concluye la aplicabilidad a estructuras reales con una viga de laboratorio en carga estática (Sec. 6, p. 24-25)
  - Los autores reconocen que la calibración es adecuada para sistemas simples
recomendacion: Aceptar con reservas
