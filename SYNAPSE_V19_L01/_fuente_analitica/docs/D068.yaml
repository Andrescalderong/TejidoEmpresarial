doc_id: D068
relevancia: Adyacente
relevancia_just: Presenta un marco de monitoreo de salud estructural con gemelo digital de bajo costo que une dos sensores de desplazamiento económicos (potenciómetro e infrarrojo), un microcontrolador Arduino Nano 33 IoT con nube, un modelo de elementos finitos calibrado y un programa propio (ReConTwin) que estima carga, grietas y emite alertas. Aporta una referencia concreta de costos y de precisión de un gemelo digital con IoT accesible, pertinente para pequeñas organizaciones, pero no trata sismos, recuperación productiva ni empresas, y se valida con una viga de laboratorio.
cluster_tema: Gemelo digital e IoT de bajo costo para monitoreo de salud estructural y diagnóstico de daño
metodo_tipo: Diseño de prototipo y validación experimental de laboratorio con ensayos de flexión en cinco vigas de concreto armado, calibración numérica de un modelo de elementos finitos y comparación con sensores de control
tipo_recurso: Artículo científico (journal peer-reviewed, acceso abierto)
