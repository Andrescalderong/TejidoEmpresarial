socratica:
  p1: '''Gemelo digital'' es un modelo de elementos finitos calibrado que se actualiza con datos de sensores; ''ReConTwin'' es el programa que automatiza la calibración, la estimación de carga y el diagnóstico; ''diagnóstico de daño'' es la comparación de la deflexión con luz/250 y del ancho de fisura estimado con 0,3 mm; ''bajo costo'' se refiere al precio de los sensores y del microcontrolador.'
  p2: Supone que una viga calibrada representa una estructura real, que la ausencia de diferencia significativa equivale a exactitud, que el ancho de fisura derivado de la deformación del modelo es confiable y que una frecuencia de 0,39 Hz es suficiente.
  p3: La evidencia son ensayos de flexión de cinco vigas, comparaciones con LVDT y fibra óptica, 72 análisis de calibración y tablas de error de carga, de desplazamiento y de deformación, en un laboratorio.
  p4: Si es cierto, organizaciones con pocos recursos podrían monitorear estructuras con gemelos digitales; si es falso, el sistema puede dar falsas seguridades en condiciones reales de ruido, temperatura, comunicación y dinámica.
  p5: No se examinan estructuras completas, eventos dinámicos, costos totales, falsas alarmas, alimentación autónoma ni la validación del ancho de fisura.
  p6: 'Alternativas: que un modelo estadístico simple baste para detectar cambios de rigidez; que los acelerómetros MEMS sean mejores que los sensores de desplazamiento para campo; que el costo dominante sea el especialista y no el hardware.'
