  - Aporta una cadena completa y replicable de gemelo digital con IoT de bajo costo, con precios unitarios (84, 15 y 25 dólares), errores de desplazamiento frente a un LVDT (25,2 a 184,8 micrómetros), error de carga de 2,11 kN y calibración automatizada de 72 iteraciones en una hora. Su valor para el corpus es moderado, porque es una viga de laboratorio, estática, con un solo espécimen de validación, de baja frecuencia, con deformación de 34,3 % de error relativo y sin costos totales ni sismo, pero sirve como referencia de accesibilidad tecnológica.
