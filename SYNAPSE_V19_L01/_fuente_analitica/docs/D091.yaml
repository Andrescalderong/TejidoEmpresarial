notas: "Artículo de Biomédica 28:357-70 (2008) del bloque SciELO D087-D098; clasificado como Ajeno. Los cuadros 2 a 5 llegan desalineados en la extracción de texto; solo se citan cifras del texto. Inconsistencias: 268/308 = 87 % frente a 93 % de 'no emparentados'; poder de discriminación 93,2 %; Cuadro 7 con n = 267 y 41 frente a 183 y 35 usados en el texto; 6 + 34 = 40 individuos frente a 41 (19 parejas y un trío)."
