doc_id: D091
relevancia: "Ajeno"
relevancia_just: "Estudio de genética de poblaciones y forense (17 marcadores Y-STR en 308 varones del suroccidente colombiano) que contrasta apellido y linaje paterno; no trata gemelos digitales, IoT, transferencia tecnológica ni recuperación empresarial."
cluster_tema: "Genética de poblaciones: apellido y cromosoma Y en Colombia"
metodo_tipo: "Estudio descriptivo de genética de poblaciones con tipificación molecular (AmpFLSTR Yfiler) y correlación simple con el apellido"
tipo_recurso: "Artículo científico (investigación original, journal peer-reviewed)"
kw_inferidas: [cromosoma Y, microsatélites Y-STR, isonimia, apellido, DYS19, haplotipo, mestizaje, Valle del Cauca, Cauca, Nariño, genética forense]
c2:
  objetivo: >
    Determinar las frecuencias alélicas y haplotípicas poblacionales de 17 microsatélites del cromosoma Y (Y-STR) en 308 varones de los departamentos de Valle del Cauca, Cauca y Nariño (Colombia) y definir la correlación entre el haplotipo de cada individuo y su apellido paterno, para comparar dos códigos de identidad patrilineal (apellido de origen europeo o amerindio frente al alelo DYS19/13 característico de poblaciones amerindias) y valorar el uso del apellido como marcador de población en estudios genéticos y clínicos realizados en Colombia.
  pregunta: >
    [INFERIDA] ¿En qué medida coinciden el origen etimológico del apellido paterno (europeo o amerindio) y el linaje del cromosoma Y de varones del suroccidente colombiano, y qué diversidad haplotípica muestran los 17 marcadores en esa región?
  marco: >
    El marco es la genética de poblaciones con marcadores de herencia paterna. Los Y-STR se ubican en la región no recombinante del cromosoma Y, producen perfil haploide y se transmiten de padre a hijo varón sin recombinar, por lo que se comportan como un linaje; el apellido se hereda también por vía paterna y se ha comparado con un alelo neutral (isonimia). La utilidad forense se evalúa con diversidad haplotípica, poder de discriminación y probabilidad de coincidencia, tomando el haplotipo mínimo europeo (9 marcadores) y el extendido (11) como referencia y la base YHRD. El alelo DYS19/13 se usa como indicador de ascendencia amerindia, con la salvedad de que la sustitución C a T es lo que lo confirma. El estudio se inscribe en la historia del mestizaje colombiano.
  metodologia: >
    Estudio descriptivo con 308 varones no emparentados, nacidos y residentes en Valle del Cauca (104), Cauca (102) y Nariño (102), seleccionados al azar de un banco de muestras de casos de paternidad (presuntos padres) del convenio entre el Instituto Colombiano de Bienestar Familiar y Medicina Legal, con consentimiento escrito para estudios de población y aval del comité de ética de la Facultad de Medicina. Se extrajo ADN de tarjetas FTA con Chelex 100 y se tipificaron 17 Y-STR con el estuche AmpFLSTR Yfiler en un termociclador GeneAmp 2720 y un analizador genético ABI 3130, con controles positivo y negativo, y análisis alélico con GeneMapper 3.2.1. Se estimaron frecuencias alélicas y haplotípicas en Excel, diversidad génica y haplotípica, probabilidad de coincidencia, haplotipos únicos y análisis molecular de varianza (AMOVA) con Arlequin. Los apellidos se clasificaron por etimología en europeos y amerindios y sus frecuencias se contrastaron con la presencia del alelo DYS19/13 mediante una tabla de correlación simple.
  resultados: >
    Se observaron 288 haplotipos, 268 únicos y 20 compartidos, con diversidad haplotípica global de 0,9995 y diversidad subregional de 0,998 (Valle), 0,995 (Cauca) y 0,996 (Nariño); el poder de discriminación fue 93,2 % y la variación dentro de la población, 99,1 % en el AMOVA. Hubo 19 parejas y un trío con haplotipo idéntico (13,3 % de los individuos), de los cuales tres parejas compartían el primer apellido. Se hallaron 218 apellidos distintos, 183 (84 %) de origen europeo y 35 (16 %) amerindio, con predominio europeo (más de 77 %) en las tres cohortes. El alelo DYS19/13 tuvo frecuencia de 17,1 % en Valle, 31,4 % en Cauca, 41,2 % en Nariño y 29,8 % en la región. De los portadores de apellido europeo, 71 (38,8 %) presentaron DYS19/13, y de los de apellido amerindio, 21 (60 %) lo presentaron y 14 (40 %) no. En 12 de los 17 marcadores el alelo más frecuente fue el mismo en los tres departamentos y coincidió con el más frecuente en población europea; el marcador DYS385a/b mostró la mayor diversidad génica (mayor de 0,983). Los haplotipos coincidieron más con los caucásicos de la base de datos, luego con los hispanos y afroamericanos, y menos con los nativoamericanos.
  discusion: >
    Los autores concluyen que el apellido debe usarse con cautela como marcador de población, porque cerca de 40 % de quienes tienen apellido europeo tienen un cromosoma Y compatible con linaje amerindio, y cerca de 40 % de quienes tienen apellido amerindio, uno compatible con linaje europeo. Interpretan el predominio de alelos frecuentes europeos como evidencia de un componente patrilineal principalmente europeo derivado de la conquista, y el bajo grado de mestizaje del Valle y el Cauca frente a Nariño. Reconocen que la presencia de DYS19/13 no basta para afirmar ascendencia amerindia y que se requeriría analizar la sustitución C a T. Advierten que usar pocos marcadores aumenta falsas coincidencias de linaje. Dejan sin discutir la clasificación etimológica de apellidos, el sesgo de una muestra de presuntos padres y la comparación inconsistente entre apellidos e individuos en el cuadro 7.
  limitaciones: "No declaradas formalmente. Reconocen que la presencia del alelo DYS19/13 no es indicación suficiente de componente amerindio y que sería necesario analizar la sustitución C:T (p. 9); no pudieron comparar las frecuencias haplotípicas de los 17 marcadores con otros estudios por su menor número de marcadores (p. 10)."
  futuro: "Definir adecuadamente la proporción amerindio/europeo en estudios que usen isonimia en cualquier región de Colombia, y afinar el genérico de mestizos con las herramientas moleculares disponibles; corroborar el origen amerindio de DYS19/13 mediante la sustitución C:T (p. 9, 12)."
c3:
  tesis: >
    En el suroccidente colombiano el apellido paterno no es un indicador fiable del linaje del cromosoma Y: alrededor de 40 % de los individuos con apellido europeo portan el alelo DYS19/13 asociado a ascendencia amerindia y alrededor de 40 % de los de apellido amerindio portan un alelo compatible con ascendencia europea.
  antitesis: >
    La cifra de 40 % depende de dos clasificaciones imprecisas. Por un lado, DYS19/13 no es específico de ascendencia amerindia (los propios autores señalan que se requeriría la sustitución C a T), de modo que la proporción de apellidos europeos con linaje amerindio estaría sobreestimada. Por otro lado, la clasificación del apellido como europeo o amerindio por etimología no se describe con criterios ni se valida, y los apellidos pueden ser asignados por escribanos o adoptados, lo que hace de la discordancia una característica esperable de la historia colonial y no un hallazgo sobre la fiabilidad del apellido. Además, los cuadros mezclan unidades: el texto usa 183 y 35 como número de individuos, pero son apellidos distintos, mientras que el cuadro 7 muestra 267 y 41 individuos; las frecuencias de 38,8 % y 60 % se calculan sobre estos denominadores de apellidos. La muestra procede de presuntos padres en casos de paternidad, no de una selección poblacional, y no se prueba la significancia de la asociación.
  sintesis: >
    El estudio aporta frecuencias alélicas y haplotípicas de 17 Y-STR para tres departamentos y muestra una alta diversidad útil como referencia forense. Su inferencia sobre la fiabilidad del apellido es plausible en sentido cualitativo, pero la cuantificación de 40 % no resiste su misma metodología. La síntesis propone recalcular la concordancia con individuos como unidad, con intervalos de confianza y un modelo estadístico (tabla de contingencia con razón de momios), confirmar el origen amerindio con el polimorfismo C a T y clasificar apellidos con un protocolo reproducible. Para el corpus, el documento es ajeno al dominio de tecnología y recuperación productiva.
  areas_grises:
    - "Unidad de análisis inconsistente: el texto calcula 38,8 % (71 de 183) y 60 % (21 de 35) sobre apellidos distintos, pero los presenta como individuos, mientras que el cuadro 7 reporta 267 y 41 individuos; no se puede reconstruir la tabla de contingencia de 308 individuos ni estimar la discordancia a nivel de persona."
    - "Especificidad del marcador: DYS19/13 se toma como indicador de ancestro amerindio aunque los autores reconocen que se requeriría la sustitución C a T y que en poblaciones amerindias como los wayuu varios indígenas portaban citosina; la discordancia de 40 % puede estar sobreestimada en el grupo con apellido europeo."
    - "Clasificación del apellido: la división en europeos y amerindios 'de acuerdo con su etimología' no explica la fuente ni cómo se trataron apellidos ambiguos, y no hay valoración de la fiabilidad entre clasificadores; la concordancia depende de esa decisión."
    - "Representatividad y sesgo de selección: las muestras proceden de presuntos padres en pruebas de paternidad, con un 'convenio' institucional, sin examen de si esa población difiere de la general en edad, nivel socioeconómico o etnia; la proporción de la muestra por departamento (34 %, 33 %, 33 %) no sigue la población regional (58 %, 19 %, 23 %)."
  puntos_oscuros: >
    El texto afirma que 93 % de los individuos no están emparentados por línea paterna porque 268 de 308 haplotipos son únicos, pero 268/308 equivale a 87 %, y la cifra de 93,2 % corresponde a otro cálculo (haplotipos distintos sobre individuos) que el texto menciona sin conciliar. Esa afirmación mezcla el número de haplotipos únicos con el de haplotipos distintos, y la confusión afecta la validación del muestreo como no emparentado. Por otra parte, el texto interpreta el bajo grado de mestizaje en Valle y Cauca a partir del alelo DYS19/13, pero la frecuencia de ese alelo no mide mestizaje: mide la proporción de linajes paternos con ese alelo, sin relación con el componente materno, que en el mestizaje colombiano suele ser amerindio o africano. Hacer inferencias sobre mestizaje con solo línea paterna no es válido sin marcadores mitocondriales o autosómicos. Por último, comparar las poblaciones del Valle con la base de datos de Applied Biosystems y concluir sobre origen afroamericano requiere definir el tamaño de la base y la prueba estadística, que no se reportan.
  ideas:
    - "Reanálisis de concordancia con el individuo como unidad: construir la tabla de 308 individuos por apellido (europeo, amerindio) y presencia de DYS19/13, estimar proporciones con intervalos de confianza exactos, razón de momios y prueba de asociación, y repetir con la sustitución C a T confirmada. Fundamento: el cuadro 7 y el texto usan denominadores distintos y no hay prueba estadística. Verificabilidad: las muestras y los haplotipos están almacenados en el banco del estudio y los datos se pueden compartir. Utilidad: permite saber cuánta ancestría amerindia hay realmente en apellidos europeos y orienta a estudios clínicos y genéticos que usan el apellido como indicador de origen a decidir si necesitan ajustar por estratificación genética."
    - "Estimación de ancestría con marcadores multi-linaje: combinar Y-STR, ADN mitocondrial y marcadores autosómicos informativos de ancestría en la misma muestra, para comparar el componente paterno con el materno y el global, y estimar el error de clasificar la ancestría con el apellido. Fundamento: las conclusiones sobre mestizaje se basan en un solo linaje. Verificabilidad: genotipificación de paneles de ancestría con software de estructura poblacional, con cálculo de concordancia entre apellido y ancestría global. Utilidad: ofrece a la epidemiología genética de Colombia un criterio para ajustar por estratificación y evita sesgos al usar el apellido como sustituto de la ancestría."
  relaciones:
    - "Apellido de origen europeo (se asocia con) alelo DYS19/13 en 38,8 % de los portadores de apellido europeo: la relación se reporta sin intervalo de confianza ni prueba de asociación."
    - "Número de marcadores (aumenta) la diversidad haplotípica y reduce falsas coincidencias: relación señalada con 9, 11 y 17 marcadores, sin cuantificación en el texto."
  robustez: [5, 4, 3, 3]
  valor: [2, "Aporta frecuencias de 17 Y-STR en tres departamentos, útiles para bases de datos forenses, y un aviso metodológico sobre el uso del apellido como marcador de ancestría. Está fuera del dominio del corpus; su valor es de control negativo para el análisis temático y no se vincula con tecnología empresarial ni resiliencia."]
  conexiones: []
socratica:
  p1: "Define isonimia como el uso del apellido compartido como carácter semejante a un alelo neutral y el linaje paterno como el haplotipo de 17 Y-STR; define DYS19/13 como indicador de ascendencia amerindia."
  p2: "Supone que el alelo DYS19/13 identifica linaje amerindio, que la etimología del apellido define su origen y que presuntos padres de casos de paternidad representan la población regional."
  p3: "La evidencia es de 308 haplotipos con diversidad de 0,9995 y concordancia de 61,2 % y 60 % entre apellido y alelo, sin intervalos ni pruebas de asociación; los denominadores son inconsistentes."
  p4: "Si es cierto, estudios clínicos y genéticos no deben usar el apellido como indicador de origen; si es falso, el apellido sigue siendo un indicador razonable de ascendencia en Colombia."
  p5: "No se examinan apellidos ambiguos, adopción de apellidos ni linajes con la sustitución C a T verificada, que podrían cambiar la cifra de 40 %."
  p6: "Hipótesis rivales: la discordancia es esperable por la historia colonial y no por falta de fiabilidad; la baja especificidad de DYS19/13 sobreestima la discordancia de los apellidos europeos."
