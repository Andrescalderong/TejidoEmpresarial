doc_id: D007
relevancia: "Adyacente"
relevancia_just: "Estudio de caso sobre implementación organizacional de IoT (liderazgo, aceptación, vigilancia) en un municipio; sin eventos sísmicos ni empresas en sentido estricto, pero aporta los mecanismos humanos y organizacionales que condicionan la transferencia de tecnología."
cluster_tema: "Adopción organizacional de IoT y transformación digital"
metodo_tipo: "Estudio de caso cualitativo longitudinal (entrevistas y observación, teoría fundamentada)"
tipo_recurso: "Artículo científico (journal peer-reviewed)"
kw_inferidas: [transformación digital, Internet de las cosas, liderazgo digital, mentalidad digital, vigilancia laboral, observador y observado, heterogeneidad de objetivos, sector público, gestión de limpieza, LoRa]
c2:
  objetivo: >
    Explorar el potencial transformador del Internet de las cosas (IoT) y los mecanismos y procesos que apoyan o limitan la transformación digital habilitada por IoT en la práctica, a partir del seguimiento de un proyecto de implementación en un municipio durante dos años. El estudio busca responder cuál es el potencial transformador del IoT y cómo la transformación digital que habilita se apoya o se restringe en la práctica, atendiendo a los actores, sus acciones, sus conceptualizaciones de la tecnología y las condiciones organizacionales que crean o frenan el cambio.
  pregunta: >
    ¿Cuál es el potencial transformador del IoT y cómo se apoya o se restringe en la práctica la transformación digital habilitada por IoT?
  marco: >
    El marco es la literatura de transformación digital en sistemas de información, organizada en cuatro preguntas (qué, por qué, quién y cómo) que ligan las capacidades tecnológicas, la motivación estratégica, los actores involucrados y las condiciones organizacionales para el cambio. Recurre a la idea de tecnologías SMACIT (social, móvil, analítica, nube e IoT), a la noción de agencia distribuida, al liderazgo digital y la mentalidad digital como condiciones culturales, y a las reflexiones de Bernstein sobre transparencia y vigilancia (observador frente a observado). Incorpora el concepto de heterogeneidad de objetivos de los sistemas IoT (Lee y Lee). El paradigma es interpretativo y de procesos: privilegia el 'cómo' y el 'por qué' de la evolución de los eventos más que el resultado final.
  metodologia: >
    Estudio de caso cualitativo y orientado a procesos en un municipio del norte de Suecia de unos 130.000 habitantes que inició una estrategia de 'digital primero' en 2018. El proyecto 'Roomie' digitalizó la gestión de limpieza de edificios públicos que suman un millón de metros cuadrados: un sistema IoT con sensores de entrada y salida, calidad del aire y ocupación, red LoRa y aplicación móvil, desarrollado por un tercero (SysDev), que cambia la limpieza programada por limpieza según necesidad. El piloto se realizó en un edificio municipal con unas 500 salas y 1.100 empleados, con 30 salas equipadas y 50 sensores. Durante dos años se hicieron 18 entrevistas semiestructuradas de 45 a 60 minutos (grabadas, transcritas y anonimizadas por rol) con el gerente de proyecto, jefes de distrito, jefe de equipo, limpiadores y el desarrollador, además de observación en sitio y conversaciones informales. El análisis siguió teoría fundamentada en cuatro etapas: 132 códigos iniciales, 24 códigos de segundo orden, cuatro temas y diálogo con la literatura.
  resultados: >
    Los resultados se presentan como narrativa cronológica en tres momentos. En la iniciación, los gerentes concebían el IoT como un medio para digitalizar una labor 'analógica', elevar el estatus de la profesión de limpieza y optimizar recursos; los limpiadores, de baja madurez digital, desconfiaban y sospechaban un motivo oculto como recortes de personal. En la implementación, los limpiadores no habían sido invitados a las discusiones iniciales; el jefe de equipo se incorporó al grupo pero se sintió excluido por el lenguaje técnico; algunos limpiadores percibieron más carga de trabajo y estrés por tener que registrar salas en sus descansos, y cuestionaron el sistema de semáforo rojo-verde en espacios de tráfico continuo. Tras cambios técnicos y funcionales, mayor capacitación y atención del gerente a la retroalimentación, la actitud mejoró y los limpiadores empezaron a llamar 'app' al sistema. Al finalizar, los gerentes quisieron continuar y expandir Roomie, y se decidió su permanencia en el servicio de limpieza municipal, pero el jefe de equipo dudaba de la continuidad por costos de adquisición. Surgió además un giro de objetivos desde mejorar el trabajo hacia monitorear a los trabajadores y optimizar la dotación (el gerente mencionó probar con 85 % del personal). El texto cita como contexto que los dispositivos IoT pasarían de 15.100 millones a 29.400 millones en 2030.
  discusion: >
    Los autores sostienen que el potencial transformador del IoT se entendió bien en el nivel gerencial (el 'qué' y el 'por qué'), pero no se tradujo automáticamente en la práctica de todos los actores, y que la transformación depende de la aceptación de las partes interesadas más que de las capacidades técnicas. Identifican tres aportes: la importancia de reconocer a los actores afectados, sus conceptualizaciones y su espacio de acción; la necesidad de un liderazgo digital proactivo que forme mentalidad digital mediante educación, escucha e inclusión; y el efecto de la opacidad parcial del IoT, que hace que los trabajadores sean a la vez observadores y observados, con riesgos de vigilancia y vulneración de privacidad si la organización asume solo el rol de observador. Recomiendan aclarar la intención de uso y establecer estándares éticos. Aceptan que un solo caso limita la generalización y sugieren estudios de uso interorganizacional del IoT y de propiedad de datos.
  limitaciones: "Declaradas: estudio de un solo caso en un contexto específico (municipio sueco), con foco en actores internos; se sugiere investigar uso interorganizacional y cambios en distintos contextos y niveles."
  futuro: "Estudios de caso en otros contextos y niveles organizacionales, uso distribuido e interorganizacional de IoT, propiedad y reutilización de datos, y aspectos éticos de la visibilidad conductual ante el crecimiento exponencial del IoT."
c3:
  tesis: >
    El potencial transformador del IoT no reside en sus capacidades técnicas sino en la aceptación de las partes interesadas, que se construye con liderazgo digital, inclusión de los trabajadores afectados y gestión de la opacidad parcial del sistema, en la que los usuarios son a la vez observadores y observados.
  antitesis: >
    El caso es un piloto de 30 salas y 50 sensores en un solo edificio municipal, con nueve limpiadores y un jefe de equipo, de modo que las generalizaciones sobre 'transformación digital' superan la escala observada. La evidencia sobre el cambio de actitud procede de entrevistas con muy pocas personas en cada fase (de tres a siete) y está mediada por el entrevistador-observador, que además era uno de los autores; la mejora puede deberse a la maduración, a la capacitación o al efecto de ser estudiados, sin que se descarten explicaciones alternativas. El texto califica el proyecto como éxito aunque la jefa de equipo anticipa que no se adquirirá por costo, y no existe un caso de negocio ni medición de ahorro, tiempo de limpieza o calidad. La narrativa de 'observador y observado' se infiere, sin evidencia directa de vigilancia efectiva, de comentarios del gerente sobre el 85 % de personal.
  sintesis: >
    El artículo aporta una explicación convincente, aunque basada en un caso, de por qué las implementaciones de IoT fallan en el plano humano: la brecha entre la narrativa gerencial y la práctica operativa, y el uso potencial de los datos para vigilancia. Se acepta como hipótesis sólida sobre mecanismos, no como medición de efectos. Para el corpus, implica que cualquier programa de transferencia de tecnología a empresas o instituciones afectadas por un sismo requiere un componente explícito de participación de usuarios finales, de capacitación y de gobernanza ética de los datos, y que la evaluación debe medir resultados y no solo instalación.
  areas_grises:
    - "Escala y representatividad: el piloto cubre 30 de 500 salas en un edificio y un equipo de diez personas; se discute 'transformación digital' municipal sin mostrar que los hallazgos se mantienen a mayor escala o en otros servicios."
    - "Ausencia de medidas de resultado: no se informan ahorro de tiempo, horas de limpieza, calidad del servicio, estrés medido ni costo del sistema; la conclusión de que el proyecto fue 'un éxito' se basa en declaraciones del gerente y de los jefes de distrito."
    - "Rol del investigador: el segundo autor recolectó los datos en sitio, observó reuniones e hizo entrevistas, lo que puede haber influido en las respuestas, y no se describen estrategias de reflexividad ni triangulación con datos del sistema."
    - "Inferencia sobre vigilancia: la tesis del 'observador y observado' se apoya en una cita del gerente sobre optimizar con 85 % del personal y en percepciones de miedo a recortes; el texto no documenta que se haya usado el sistema para evaluar individuos."
  puntos_oscuros: >
    La paradoja de que los limpiadores se oponen al micro-control pero se vuelven favorables a una aplicación que lo permite se explica por la asimetría de visibilidad: perciben el sistema como una herramienta que les da información sobre las salas (rol de observadores) y no consideran que sus movimientos generen datos. El cambio de actitud también tiene otra lectura que el artículo no explora: la mejora de la aceptación coincide con la capacitación, con cambios técnicos que redujeron fallas y con el hecho de que el jefe de equipo fue incorporado al proyecto, de modo que la 'mentalidad digital' puede ser un efecto de reducción de fricciones y de reconocimiento y no un cambio cultural profundo. Esto sugiere que las intervenciones más eficientes serían la participación temprana y la usabilidad (por ejemplo, idioma de la interfaz para trabajadores no nativos) antes que programas de mentalidad digital, y que la evaluación debería separar el efecto de cada componente mediante un diseño comparativo.
  ideas:
    - "Evaluación de aceptación en dos etapas con datos del sistema: combinar entrevistas con registros de uso de la aplicación (frecuencia, tiempo de interacción, errores) para contrastar la aceptación declarada con la conducta, y comparar equipos con participación temprana y sin ella. Fundamento: el artículo observa que los trabajadores no participaron en el diseño y que la aceptación mejoró tras incluir al jefe de equipo. Verificabilidad: diseño cuasi-experimental con dos equipos y medición antes y después. Utilidad: identifica qué intervención (participación, capacitación, usabilidad) explica la aceptación y reduce costos de implantación, con lo cual los municipios y las empresas pequeñas podrían priorizar acciones de bajo costo antes de escalar el despliegue de sensores."
    - "Protocolo de gobernanza ética de datos de sensores en entornos laborales: documento de transparencia que declare qué datos se recogen, quién los ve y para qué se usan, con auditoría periódica y participación de representantes de trabajadores. Fundamento: la opacidad parcial del IoT genera riesgo de vigilancia y cambios de objetivo, como en el giro de apoyar a los limpiadores a optimizar el personal. Verificabilidad: comparar confianza y uso entre unidades con y sin protocolo mediante encuesta y registros. Utilidad: aplicable a programas públicos de IoT, incluidos sensores de monitoreo en empresas de zonas sísmicas."
  relaciones:
    - "Participación temprana de usuarios finales (se asocia con) menor resistencia y mayor adopción: relación sugerida por la trayectoria del jefe de equipo y que debe medirse con grupos comparativos."
    - "Heterogeneidad de objetivos del dato (apoyar al trabajador frente a optimizar la plantilla) (condiciona) la confianza en el sistema: relación central del artículo sin medición cuantitativa."
  robustez: [7, 5, 3, 3]
  valor: [5, "Brinda una explicación sólida y bien documentada de los mecanismos humanos que limitan la adopción de IoT, útil para diseñar programas de transferencia tecnológica, pero su contexto (limpieza municipal en Suecia) y su diseño de caso único limitan el alcance. Su valor para el eje del corpus es moderado y se concentra en las condiciones de liderazgo, participación y ética de datos."]
  conexiones: []
socratica:
  p1: "'Transformación digital' es el proceso en que la tecnología digital cambia la propuesta de valor y la identidad organizacional; 'potencial transformador del IoT' es su capacidad de cambiar percepciones de identidad laboral y prácticas de trabajo."
  p2: "Supone que la aceptación de los actores determina el efecto; que las entrevistas representan percepciones del conjunto; que el éxito se mide por la decisión de continuar."
  p3: "La evidencia son 18 entrevistas y observación en un proyecto; no hay indicadores cuantitativos de desempeño del servicio ni del costo."
  p4: "Si es cierto, los proyectos IoT deben invertir en liderazgo, educación e inclusión; si es falso, las diferencias de aceptación serían atribuibles a la usabilidad o al contexto específico de limpieza."
  p5: "Casos de IoT con alta aceptación sin liderazgo digital, o de resistencia pese a inclusión, no se discuten."
  p6: "Alternativas: que la mejora se deba a rediseño técnico, a rotación de personal o a efecto de novedad; que la adopción dependa de la política laboral y sindical del contexto sueco."
