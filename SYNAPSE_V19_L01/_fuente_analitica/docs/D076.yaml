socratica:
  p1: '''Nivel de daño'' es una de tres categorías visuales (menor, moderado o severo); ''ajuste fino'' es continuar el entrenamiento de las últimas capas de un modelo preentrenado; ''FLOPs'' son operaciones de coma flotante por inferencia; ''F1 ponderado'' promedia el F1 de cada clase según su número de imágenes.'
  p2: Supone que imágenes de redes sociales y de escenas representan el vuelo de un UAV, que las etiquetas asistidas por el modelo son correctas, que 3,21 cuadros por segundo es tiempo real y que el daño visible indica el daño estructural.
  p3: La evidencia son 1024 imágenes de prueba de un conjunto de 10 243, cinco corridas de entrenamiento, comparaciones con cinco modelos y dos estudios previos, y una prueba de velocidad en una Raspberry Pi 5.
  p4: Si es cierto, los equipos de rescate pueden priorizar con clasificación en el borde; si es falso, el modelo puede subestimar el daño moderado y fallar con imágenes aéreas reales, lo que desvía recursos.
  p5: No se examinan imágenes aéreas reales, división por evento, vuelo, energía, geolocalización ni decisiones de reocupación.
  p6: 'Alternativas: que un modelo de segmentación o detección dé información más útil que la clasificación por imagen; que una inspección híbrida con muestreo sea más confiable; que el cuello de botella sea el vuelo y la logística y no la clasificación.'
