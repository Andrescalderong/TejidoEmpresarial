doc_id: D076
relevancia: Adyacente
relevancia_just: Evalúa un clasificador de imágenes ligero (MobileNetV3-Small con ajuste fino) para predecir tres niveles de daño en edificios tras un terremoto con imágenes de vehículos aéreos no tripulados (UAV), sobre un conjunto de datos fusionado de tres fuentes, y lo despliega en una Raspberry Pi 5 con medidas de cuadros por segundo. Aporta evaluación rápida de daño en el borde, útil para priorizar inspección y rescate, y es pertinente a la fase de respuesta inmediata, aunque las imágenes proceden de bases no aéreas, la evaluación no se conecta con la recuperación empresarial ni con tiempos de reocupación y el vuelo real no se prueba.
cluster_tema: Evaluación de daño posterremoto con aprendizaje profundo ligero en el borde y UAV
metodo_tipo: Experimento computacional de clasificación de imágenes con transferencia de aprendizaje, comparación con cinco modelos de referencia y prueba de despliegue en una computadora de placa única
tipo_recurso: Artículo científico (journal peer-reviewed, acceso abierto)
kw_inferidas:
- UAV
- aprendizaje profundo
- evaluación de daño posterremoto
- MobileNetV3
- clasificación de imágenes
- cómputo en el borde
- Raspberry Pi
- ajuste fino
- conjunto de datos desbalanceado
- rescate
c2:
  objetivo: 'Investigar el uso del modelo convolucional ligero MobileNetV3-Small para la predicción en tiempo real del nivel de daño posterremoto con imágenes capturadas por vehículos aéreos no tripulados (UAV), de modo que el procesamiento pueda hacerse a bordo y se oriente de manera eficiente el trabajo de los equipos de búsqueda y rescate. El modelo clasifica tres niveles (sin daño o menor, moderado y severo) y se evalúa en un conjunto de datos fusionado de tres bases de imágenes de daño posterremoto, con comparación frente a cinco modelos ligeros, estudios previos y una prueba de despliegue en Raspberry Pi 5.

    '
  pregunta: 'El artículo no formula preguntas de investigación explícitas. Las preguntas implícitas son si un modelo ligero con transferencia de aprendizaje y ajuste fino de las últimas cinco capas alcanza una exactitud adecuada para clasificar tres niveles de daño, cuánto cuesta en operaciones de coma flotante frente a otros modelos ligeros, y si puede ejecutarse en un dispositivo embebido a una velocidad compatible con una aplicación en tiempo real.

    '
  marco: 'El marco combina el aprendizaje profundo en visión por computador, la transferencia de aprendizaje y el cómputo en el borde. Los autores sostienen que la inspección manual posterremoto es lenta, costosa y peligrosa, que los UAV pueden transmitir imágenes y construir mapas de daño, que las redes convolucionales extraen automáticamente grietas, desplazamientos y deformaciones y que modelos como MobileNet equilibran desempeño y complejidad. Las categorías de daño se definen por indicios visuales: leve (grietas superficiales y desprendimiento de revoque), moderado (grietas visibles en muros o columnas, deformación parcial) y severo (muros colapsados, refuerzo expuesto, inclinación o colapso total). La revisión de trabajos incluye EmergencyNet, WATT-EffNet, EFFC-Net, DiRecNetV2, variantes de YOLO para daño en edificios y trabajos con datos del terremoto de Hatay-Maraş de 2023.

    '
  metodologia: 'El modelo parte de MobileNetV3-Small preentrenado en ImageNet, con todas las capas congeladas al inicio, un clasificador final adaptado a tres clases y ajuste fino de las últimas cinco capas del extractor de características y del clasificador. Los datos fusionan MEDIC (imágenes de redes sociales filtradas para terremotos), la base Disaster Scenes Database y el conjunto de Ünlü et al. Alrededor de 30 % se limpió manualmente (ambigüedad, etiquetas incorrectas y valores atípicos) y el modelo entrenado en ese subconjunto asistió en la clasificación del 70 % restante, con revisión manual posterior, para un conjunto final de 10 243 imágenes. La división estratificada es de 8195 para entrenamiento, 1024 para validación y 1024 para prueba, con tasa de aprendizaje de 0,0001, tamaño de entrada de 224 por 224, lote de 32, decaimiento de pesos de 0,00001, desconexión de 0,2 y optimizador Adam, con pesos de clase en la función de pérdida. El modelo se entrenó cinco veces, y se comparó
    con MobileNetV2, MobileNetV3, SqueezeNet, ShuffleNetV2 y EfficientNet-B0, con modelos de estudios previos y con EmergencyNet en una Raspberry Pi 5 con cámara.

    '
  resultados: 'Los resultados indican que el modelo con ajuste fino logra un F1 ponderado de 0,93 y una exactitud de 0,93 en la prueba, con F1 de 0,85 para sin daño o menor, de 0,62 para moderado y de 0,97 para severo, y que supera a los modelos de referencia, cuyo F1 ponderado va de 0,85 a 0,90. La clase moderada, con 953 imágenes, tiene precisión de 0,60 y recall de 0,64, y la clase severa, con 8718 imágenes (85 % del conjunto), tiene precisión de 0,97 y recall de 0,96. El modelo requiere 61,6 millones de operaciones de coma flotante, 1,65 millones de parámetros y 6,29 MB, y MobileNetV3 sin ajuste fino requiere 61,5 millones. En comparación con estudios previos, el F1 sobre la base Disaster Scenes es de 0,65 frente a 0,63 de una red Faster R-CNN con ResNet-50, y la exactitud sobre el conjunto de Ünlü es de 0,73 frente a 0,66 de VGG19. En la Raspberry Pi 5 el modelo procesa 3,21 cuadros por segundo con 0,3117 s por imagen, frente a 5,11 cuadros por segundo de SqueezeNet y 6,11 de EmergencyNet,
    que tiene un F1 ponderado de 0,87. Los autores atribuyen el bajo desempeño en las clases minoritarias al desbalance de datos.

    '
  discusion: 'Los autores sostienen que el modelo ofrece un equilibrio entre exactitud y eficiencia apto para el despliegue a bordo, que el ajuste fino de las últimas cinco capas mejora el F1 en 0,04 puntos frente al ajuste solo del clasificador a un costo mínimo de operaciones, que la combinación de tres bases es novedosa y que el despliegue en Raspberry Pi 5 confirma la viabilidad en dispositivos de borde. Reconocen que la clase moderada es difícil por solapamiento de rasgos con las clases adyacentes y por el desbalance, que SqueezeNet y EmergencyNet son más rápidos y que su modelo tiene mayor exactitud pero menor velocidad. Concluyen que la información en tiempo real permite a los equipos de rescate priorizar esfuerzos y entregar ayuda a las zonas más afectadas.

    '
  limitaciones: 'Declaradas: el desbalance de clases persiste a pesar de las técnicas aplicadas y limita el desempeño en las clases moderada y sin daño o menor; el modelo es más lento que SqueezeNet y EmergencyNet en la Raspberry Pi. No declaradas: las imágenes proceden de redes sociales, de bases de escenas y de fotografías de edificios y no son imágenes aéreas de UAV, de modo que se desconoce el desempeño con el ángulo, la altura y la resolución de un vuelo; el etiquetado se apoyó en el propio modelo para el 70 % de las imágenes, lo que introduce circularidad entre las etiquetas y el modelo evaluado; los conteos de la Tabla 1 no coinciden con las descripciones de los conjuntos del texto; el desempeño en conjuntos independientes (F1 de 0,65 y exactitud de 0,73) es mucho menor que 0,93, lo que sugiere dependencia de la fuente dominante; 85 % de las imágenes son de daño severo; no hay división por evento o por sitio; no se reportan intervalos de confianza de las cinco corridas; la prueba
    de despliegue mide la velocidad con imágenes del conjunto de prueba y no con vuelo; no se evalúa el consumo de energía ni la geolocalización; la clasificación de edificios individuales no se vincula con la ocupación, la actividad económica ni los tiempos de reocupación.'
  futuro: 'Explícito: explorar optimizaciones para mejorar la robustez del modelo en condiciones ambientales variables y la eficiencia general del sistema de evaluación basado en UAV. Implícito: validación con imágenes aéreas de campañas reales, pruebas en vuelo, consumo de energía, pruebas en otras plataformas embebidas como Jetson e integración con mapas de daño y sistemas de gestión de emergencia.'
c3:
  tesis: 'Un modelo MobileNetV3-Small con transferencia de aprendizaje y ajuste fino de las últimas cinco capas clasifica tres niveles de daño posterremoto con un F1 ponderado de 0,93, supera a cinco modelos ligeros de referencia con solo 61,6 millones de operaciones de coma flotante y 6,29 MB, y se ejecuta en una Raspberry Pi 5 a 3,21 cuadros por segundo, lo que permite una evaluación de daño en el borde para orientar a los equipos de búsqueda y rescate.

    '
  antitesis: 'El desempeño de 0,93 se obtiene sobre un conjunto fusionado en el que 85 % de las imágenes son severas, cuyas etiquetas se refinaron con el propio modelo, y baja a 0,65 de F1 y 0,73 de exactitud en conjuntos independientes, lo que indica dependencia de la fuente y no capacidad general. Las imágenes no son aéreas ni de UAV, de manera que el título y la motivación no se contrastan con el escenario declarado. La clase moderada, la más útil para priorizar inspecciones, obtiene un F1 de 0,62. La prueba de despliegue mide 3,21 cuadros por segundo con imágenes del conjunto, sin vuelo ni energía, y modelos más simples son más rápidos. El resultado no se conecta con decisiones de reocupación, tiempos de inspección ni actividad económica.

    '
  sintesis: 'La contribución sostenible es una comparación reproducible de modelos ligeros para clasificar daño visible en imágenes, con una línea base de eficiencia en una computadora de placa única y una evidencia clara de la dificultad de la clase intermedia. Para el corpus, importa por mostrar que la evaluación visual automática de daño puede ejecutarse en el borde con hardware barato y por su relación con la rapidez de inspección, un insumo de la recuperación. No obstante, el desempeño informado depende de un conjunto desbalanceado y parcialmente etiquetado por el propio modelo, y su utilidad para la recuperación empresarial exige validación con imágenes aéreas de campañas reales, división por evento y conexión con los tiempos de inspección y de reapertura.

    '
  areas_grises:
  - 'Dominio de las imágenes: el estudio se plantea para un UAV que sobrevuela una ruta predefinida, pero las imágenes provienen de MEDIC (redes sociales), de Disaster Scenes Database y del conjunto de Ünlü et al., que incluyen fotografías a nivel de calle y de edificios, de modo que el desempeño con las vistas aéreas, la altura de vuelo, la oclusión y el movimiento no se mide.'
  - 'Circularidad del etiquetado: después de limpiar manualmente alrededor del 30 % de las imágenes, el modelo entrenado con ese subconjunto asistió en la clasificación del 70 % restante, que luego se revisó y se incorporó al conjunto; las etiquetas de entrenamiento, validación y prueba pueden reflejar los sesgos del modelo y sobrestimar su desempeño.'
  - 'Distribución de clases y de fuentes: 8718 de las 10 243 imágenes finales son severas (85 %), la clase moderada tiene 953 imágenes, y los conteos de la Tabla 1 (por ejemplo, 8666 imágenes asignadas a una fuente que el texto describe con 900) no coinciden con las descripciones, de modo que no se puede saber qué fuente domina ni si la división por conjunto se mezcla entre fuentes.'
  - 'Desempeño fuera del conjunto fusionado: sobre la base Disaster Scenes con la partición de un estudio previo el F1 es de 0,65 y sobre la base de Ünlü la exactitud es de 0,73, frente a 0,93 en el conjunto fusionado, lo que sugiere que la cifra principal no generaliza a conjuntos independientes y que la comparación con modelos previos (detección con Faster R-CNN, clasificación con VGG19) tiene objetivos distintos.'
  puntos_oscuros: Llama la atención que el resumen afirme una reducción de 58,8 % de las operaciones frente a ShuffleNetV2 cuando los valores de la Tabla 7 (61,5 y 151,7 millones) dan alrededor de 59,5 %, y que se indique un aumento de 0,2 % por el ajuste fino cuando la tabla muestra una diferencia de 0,1 millones, equivalente a 0,16 %. También es notable que se califique de tiempo real una velocidad de 3,21 cuadros por segundo obtenida en una Raspberry Pi con imágenes almacenadas, y que se afirme que el desempeño del modelo equilibra precisión y recall cuando la clase moderada tiene 0,60 y 0,64. El texto menciona un AUC de 0,91 y luego de 0,93 para la clase moderada. El entrenamiento se detuvo en la época 12 en un lugar y en la época 28 en otro. Además, el artículo celebra la primera combinación de tres bases de datos como novedad, aunque la fusión es la causa de las inconsistencias de etiquetas que obligaron a limpiar el 30 % de las imágenes y a reetiquetar más de 1300. Por último, el
    uso de un modelo que predice el daño de edificios no considera la información sobre qué edificios albergan actividad económica. La conclusión afirma que el modelo es el segundo con menos parámetros entre los de referencia, aunque la Tabla 7 lo sitúa tercero tras SqueezeNet (0,70 millones) y ShuffleNetV2 (1,30 millones), y que opera en plataformas como Jetson, que no se probaron.
  ideas:
  - 'Validación con imágenes aéreas por evento y por sitio: reunir imágenes de UAV de al menos dos terremotos recientes, con etiquetas de daño asignadas por ingenieros con una escala estándar y con división por evento y por barrio, y evaluar el modelo sin reentrenamiento, con ajuste fino por evento y con calibración de probabilidades, reportando F1 por clase con intervalos de confianza de 95 % y cinco repeticiones. El resultado mostraría cuánto de la cifra de 0,93 se mantiene fuera de las fuentes de entrenamiento, y si la clase moderada puede mejorarse con aumento de datos o con un criterio de decisión que priorice el recall de daño moderado y severo.'
  - 'De los mapas de daño a la reapertura de empresas: combinar la clasificación de daño de los edificios con el registro de actividades económicas de un distrito de ejemplo y estimar, en un simulacro con 100 edificios, el tiempo hasta la primera inspección de los edificios comerciales cuando se prioriza por nivel de daño y número de empresas frente a un recorrido manual. Se mediría el tiempo ahorrado, el número de empresas que pueden reabrir antes y los errores de clasificación que desvían recursos, información para decidir si la evaluación automática se justifica para las autoridades y para las cámaras de comercio.'
  relaciones:
  - 'Evaluación de daño en el borde (complementa) D060 y D086: D060 clasifica la intensidad sísmica en el borde y D086 usa inteligencia de borde para clasificar anomalías en monitoreo estructural inalámbrico; D076 aporta la clasificación visual de daño en edificios con un modelo ligero.'
  - 'Revisiones de UAV e IoT (se relaciona con) D050 y D056: las revisiones D050 y D056 discuten UAV e IoT en gestión de desastres sin recuperación empresarial; D076 ofrece un caso concreto con resultados cuantitativos y un despliegue en hardware barato.'
