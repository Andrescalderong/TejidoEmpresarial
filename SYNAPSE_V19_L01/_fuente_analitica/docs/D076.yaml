notas: Texto completo extraído (23 páginas). Los conteos de la Tabla 1 se leyeron con filas y columnas desordenadas y no coinciden con las descripciones de los conjuntos del texto; se citan solo los totales de las Tablas 3 y 5. La reducción de 59,5 % de operaciones frente a ShuffleNetV2 la calculó el analista con la Tabla 7. Las páginas siguen los marcadores del PDF. La conclusión del texto reitera la reducción de 58,8 % frente al modelo de referencia con menos operaciones y menciona mejoras de exactitud de 3,20 % a 18,90 % y un reentrenamiento en una tarea de clasificación de desastres naturales sin detalles.
