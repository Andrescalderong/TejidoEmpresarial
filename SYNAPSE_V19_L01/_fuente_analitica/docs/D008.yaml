doc_id: D008
relevancia: "Núcleo"
relevancia_just: "Combina gemelo digital, cosimulación estructural sísmica y evacuación de ocupantes; aunque no trata la recuperación empresarial, formaliza la interoperabilidad entre modelos que alimentarían un gemelo de continuidad operativa."
cluster_tema: "Gemelos digitales de edificios, cosimulación sísmica y evacuación"
metodo_tipo: "Desarrollo de marco conceptual + estudio de caso numérico (cosimulación manual ETABS-Pathfinder)"
tipo_recurso: "Artículo científico (journal peer-reviewed)"
kw_inferidas: [gemelo digital basado en BIM, cosimulación, eventos discretos, tiempo continuo, ficha de identidad de modelo, interoperabilidad, ETABS, Pathfinder, evacuación por sismo, FMI]
c2:
  objetivo: >
    Proponer y aplicar la Ficha de Identidad de Simulación de Edificios (Building Simulation Identity Card, BSIC), un marco para estandarizar, caracterizar e integrar las propiedades de los modelos de simulación usados en gemelos digitales de edificios, con el fin de mejorar la trazabilidad, la fiabilidad y la interoperabilidad entre modelos de dominios distintos. La aplicación se centra en una evacuación inducida por un sismo en un edificio de oficinas de varios pisos, donde la falla estructural (evento discreto) debe sincronizarse con el movimiento continuo de los ocupantes, y se busca documentar atributos que reduzcan errores de integración.
  pregunta: >
    ¿Con qué eficacia un marco para unidades de simulación de edificios facilita la integración novedosa de modelos de simulación y mejora la comunicación entre ellos en un proceso de cosimulación?
  marco: >
    El marco combina la teoría de gemelos digitales en arquitectura, ingeniería, construcción y operación (AECO) con la cosimulación como técnica de acoplamiento de simuladores especializados y con los estándares de interoperabilidad de otras industrias: Functional Mock-up Interface (FMI), System Structure and Parameterization (SSP), Model Identity Card (MIC) de la industria automotriz y aeroespacial, Simulation Model Portability (SMP) de la Agencia Espacial Europea, MoSSEC (ISO 10303-243) y High-Level Architecture (HLA). Formaliza la interacción con el formalismo de eventos discretos (DEVS) para el simulador de eventos y con representación de estado en tiempo continuo, y plantea el algoritmo maestro de Jacobi y un motor de orquestación de cosimulación. Es un paradigma de ingeniería con validación por caso, que enfatiza factores humanos como rasgo distintivo de la industria de edificios.
  metodologia: >
    El estudio sigue tres fases: revisión de literatura (consulta en Web of Science sobre cosimulación en edificios, evacuación, análisis sísmico, interoperabilidad y simulación basada en BIM), desarrollo del marco BSIC con atributos organizados en siete categorías (información general, integración e interoperabilidad, configuración del edificio, comportamiento, resultados, variables internas y hardware de referencia) y caso de estudio. El caso es un edificio de oficinas de cinco pisos en Islamabad (Pakistán), terminado en 2018, con capacidad para 170 personas y estructura de concreto reforzado. El análisis estructural usa ETABS con el registro del terremoto de Loma Prieta de 1989 (base de datos PEER) y comprobaciones con el código de edificación de Pakistán (factores de reducción de 0,75 para cortante y 0,90 para flexión); la evacuación usa Pathfinder, un simulador basado en agentes, con datos de ocupación de recursos humanos, velocidades diferenciadas por categoría (hombres, mujeres, adultos mayores, personas en silla de ruedas) y siete configuraciones de salidas evaluadas con 170 y 82 ocupantes. La transferencia de datos de ETABS a Pathfinder se realizó manualmente, y se propone, como integración teórica futura, el marco INTO-CPS con FMI. No hay validación experimental ni medición de errores de integración.
  resultados: >
    El análisis estructural indica un periodo fundamental de 0,96 s y, a los 14 s del registro sísmico, una viga sobre la puerta trasera excede su capacidad de diseño: cortante actual de 88,45 kN frente a 83,18 kN admisibles, momento de 313,68 kN·m frente a 308,36 kN·m y deflexión de 14,22 mm frente a 10,16 mm (L/240). Los excesos calculados por el analista son 6,3 % en cortante, 1,7 % en momento y 40 % en deflexión. El evento se traduce en el cierre de la puerta trasera a los 14 s en la simulación de evacuación. Con 170 ocupantes, la evacuación por las puertas principales toma 216,4 s; con salidas de emergencia y ascensor, 187,7 s; con escaleras bloqueadas a 9 m, 228,3 s; incluyendo la puerta trasera, 232,1 s, que sube a 234,9 s al cerrarla a los 14 s; solo salida de emergencia, 259,6 s; y puertas normales más ascensor, 375,9 s. Con 82 ocupantes los tiempos son 104,8; 94; 110,6; 105,5; 129,1; 110,5 y 161,2 s. Los autores informan que la cosimulación combinada de ETABS y Pathfinder tardó entre 97,4 y 118,3 s según el escenario. Concluyen que el BSIC permite alinear eventos discretos y tiempo continuo, sincronizar flujos de datos y reducir errores de integración.
  discusion: >
    Los autores sostienen que el BSIC estandariza intercambios de datos, sincroniza pasos de tiempo y asegura la propagación de eventos entre modelos, con ventajas de trazabilidad y de colaboración interdisciplinaria, y que la cosimulación es escalable porque el caso se resolvió en minutos. Distinguen el sector de edificios de otros por su larga vida útil, su carga de factores humanos, la ausencia de sensores en muchos edificios y la diversidad de funciones. Reconocen limitaciones: complejidad de implementar el marco en diversas herramientas, dependencia de formatos estándar como IFC y XML, integración manual de datos en el caso, y necesidad de probar en más casos y tipos de edificio. Anticipan trabajo futuro en modelado dinámico de datos en un gemelo digital integrado con BIM, retroalimentación de componentes no estructurales y vínculos con IFC, IDS y bSDD.
  limitaciones: "Declaradas: complejidad de implementar el BSIC en distintas herramientas, dependencia de formatos IFC y XML, integración manual de datos y necesidad de más casos de estudio para demostrar escalabilidad en distintos tipos de edificios."
  futuro: "Extender el modelado dinámico de datos dentro de un gemelo digital integrado con BIM a edificios de gran escala, incorporar retroalimentación de componentes no estructurales, conectar el BSIC con IFC, IDS y bSDD, y estudiar el efecto en el tiempo de ejecución de dependencias cíclicas entre simuladores."
c3:
  tesis: >
    Una ficha estándar de identidad de modelos de simulación (BSIC) permite sincronizar simulaciones estructurales de eventos discretos con simulaciones de evacuación en tiempo continuo, mejorando la interoperabilidad, la trazabilidad y la fiabilidad de los gemelos digitales de edificios.
  antitesis: >
    La eficacia del BSIC no se mide: el caso transfiere los datos a mano entre ETABS y Pathfinder, no se cuantifica ningún error de integración antes y después, y no existe comparación con un enfoque base ni con estándares como FMI aplicados al mismo problema. La 'falla' que dispara el evento a los 14 s es un exceso del 1,7 % en momento y del 6,3 % en cortante respecto de la capacidad de diseño con factores de reducción, no un colapso demostrado, de modo que el cierre de la puerta es una hipótesis del modelador. La afirmación de escalabilidad se apoya en el tiempo de cómputo de un edificio de cinco pisos con dos simuladores (97,4 a 118,3 s), cifra que no caracteriza el costo de acoplar modelos más complejos ni realimentaciones cíclicas, y que además se obtuvo en un procedimiento manual. El marco documenta atributos pero no valida su suficiencia, y la evacuación se modela con parámetros genéricos sin calibración con ejercicios reales.
  sintesis: >
    El artículo ofrece una taxonomía útil de atributos para describir modelos de simulación acoplables y un ejemplo ilustrativo sísmico, pero no demuestra mejoras cuantitativas. La síntesis es adoptar el BSIC como lista de verificación de interoperabilidad y no como evidencia de reducción de errores, y exigir en trabajos posteriores medir la diferencia de resultados con integración manual y automatizada, con desenlaces de seguridad. Para el eje del corpus, el aporte es el patrón de acoplar un simulador de daño estructural con un simulador de comportamiento humano, extensible a la recuperación funcional de edificios, siempre que se añadan incertidumbre en los eventos y variables económicas de uso del espacio.
  areas_grises:
    - "Ausencia de medición de eficacia: la afirmación del resumen de 'minimized integration errors' no se acompaña de una métrica de error, una línea base manual frente a automática ni una comparación con FMI/INTO-CPS; la integración del caso es manual por reconocimiento de los propios autores."
    - "Definición del evento de falla: se toma como falla de viga el exceso de la capacidad de diseño (con factor de reducción de 0,75 y 0,90) por 6,3 % en cortante y 1,7 % en momento, y se asume cierre inmediato de la puerta a los 14 s; no se discute la incertidumbre del modelo ni la diferencia entre exceder la capacidad de diseño y colapsar."
    - "Escalabilidad inferida de un solo caso: 'between 97.4 s and 118.3 s' se presenta como evidencia de que la cosimulación escala, pero depende de dos simuladores y un edificio de cinco pisos; el propio texto reconoce que los ciclos de realimentación entre simuladores no se evaluaron."
    - "Consistencia de normativas: el análisis aplica el Código de Edificación de Pakistán con el registro de Loma Prieta (California) sin justificar la compatibilidad del movimiento con el peligro local, lo que afecta la interpretación de los tiempos de falla."
  puntos_oscuros: >
    Resulta llamativo que el cierre de la puerta trasera a los 14 s aumente en solo 2,8 s el tiempo de evacuación con 170 personas (232,1 a 234,9 s) pero en 23,6 s con 82 personas (105,5 a 129,1 s). La explicación probable es que, con ocupación alta, la salida trasera es poco usada o está saturada, de modo que el cierre redistribuye poco flujo, mientras que con ocupación baja la distribución espacial de los ocupantes concentra a más personas cerca de la puerta cerrada. Esto sugiere que el resultado depende de la distribución inicial de ocupantes y no solo del número, un factor que el artículo no analiza. De igual modo, que los escenarios con ascensor sean los más largos (375,9 s) indica que se modeló la espera en ascensor como evacuación ordinaria; en sismos reales el ascensor se excluye, de modo que ese escenario no aporta información útil y conviene descartarlo del análisis comparativo.
  ideas:
    - "Cosimulación de recuperación funcional: añadir al BSIC un atributo de 'función económica del espacio' y acoplar un tercer simulador que, a partir del estado de daño estructural y de servicios, estime el tiempo de reocupación y la interrupción de actividades de las empresas alojadas. Fundamento: el artículo ya acopla daño estructural y comportamiento humano mediante atributos de eventos; agregar un simulador de continuidad operativa reutiliza el mismo mecanismo. Verificabilidad: aplicar el marco a un edificio con inquilinos conocidos y comparar el tiempo de reocupación simulado con el observado tras un sismo. Utilidad: conecta la ingeniería de edificios con la recuperación productiva y permite priorizar reforzamientos."
    - "Disparadores estocásticos de eventos discretos: reemplazar el umbral determinista de falla por funciones de fragilidad y muestrear el instante y la ubicación de la falla, ejecutando miles de cosimulaciones para obtener la distribución del tiempo de evacuación y la probabilidad de bloqueo de salidas. Fundamento: la falla del caso es un exceso marginal de capacidad, por lo que la decisión de bloquear la puerta es incierta. Verificabilidad: simulación de Monte Carlo con los mismos modelos y comparación de la distribución con el escenario determinista. Utilidad: ofrece planes de evacuación robustos y cuantifica el riesgo residual."
  relaciones:
    - "Distribución espacial inicial de los ocupantes (modula) el costo en tiempo de cerrar una salida: el efecto de 2,8 s con 170 personas frente a 23,6 s con 82 sugiere interacción entre ocupación y geometría que merece experimentos paramétricos."
    - "Dependencias cíclicas entre simuladores (aumentan) el tiempo de ejecución y exigen pausas y reconfiguraciones: el artículo lo señala como tema futuro y es clave para escalar a edificios con carga de ocupantes que afecte a la estructura."
  robustez: [6, 4, 3, 3]
  valor: [6, "Aporta una estructura reutilizable para documentar modelos y sincronizar eventos discretos con procesos continuos, directamente aplicable a gemelos digitales de edificios en zonas sísmicas, y proporciona datos numéricos transparentes de un caso. Su valor estratégico se limita por la falta de validación cuantitativa de la mejora, pero sirve como base para diseñar gemelos que incluyan continuidad operativa."]
  conexiones: []
socratica:
  p1: "BSIC es una ficha estándar con atributos de un modelo de simulación; 'cosimulación' es la ejecución coordinada de simuladores separados; 'falla' es el exceso de capacidad de diseño de una viga."
  p2: "Supone que la documentación de atributos reduce errores de integración, que el exceso marginal de capacidad equivale a cierre de puerta y que un solo edificio ilustra la escalabilidad."
  p3: "La evidencia es numérica y de un solo caso: tablas de verificación de la viga y tiempos de evacuación; no hay medida de errores de integración ni validación empírica."
  p4: "Si es cierto, las organizaciones pueden construir gemelos de edificios con modelos intercambiables; si es falso, el marco aumentaría la carga documental sin mejorar la fiabilidad."
  p5: "Casos con realimentación entre ocupantes y estructura, edificios con sistemas no estructurales críticos, o evacuaciones en las que el comportamiento real difiera del modelo, no se examinan."
  p6: "Alternativas: aplicar FMI y SSP sin una ficha específica; usar herramientas integradas de simulación sísmica y de evacuación; validar con ejercicios de evacuación."
