doc_id: D016
relevancia: "Periférico"
relevancia_just: "Mapea la literatura de IoT en logística y cadena de suministro (2680 artículos de Scopus) con co-ocurrencia de palabras clave y co-citación; aporta el panorama de tecnologías, usos y barreras del IoT empresarial, pero no trata sismos, desastres ni recuperación productiva y solo menciona la resiliencia de forma genérica."
cluster_tema: "IoT en logística y gestión de la cadena de suministro"
metodo_tipo: "Análisis bibliométrico (co-ocurrencia de palabras clave, co-citación, indicadores de productividad) con síntesis cualitativa de clústeres"
tipo_recurso: "Artículo de revisión (journal peer-reviewed, acceso abierto)"
kw_inferidas: [internet de las cosas, cadena de suministro, logística, bibliometría, blockchain, industria 4.0, RFID, cadena de suministro de alimentos, gemelo digital, seguridad]
c2:
  objetivo: >
    Cartografiar la estructura intelectual y temática de la investigación sobre aplicaciones del internet de las cosas (IoT) en logística y gestión de la cadena de suministro (SCM) mediante un análisis bibliométrico de 2680 publicaciones de Scopus. Los objetivos específicos responden seis preguntas: evolución del campo, revistas, autores, instituciones y países líderes, temas por frecuencia de palabras clave, estudios más influyentes, temas de la red de co-ocurrencia de palabras clave y clústeres de la red de co-citación, con el fin de identificar áreas emergentes y direcciones futuras.
  pregunta: >
    P1: ¿cómo evolucionó la investigación sobre IoT en logística y SCM desde su inicio? P2: ¿qué revistas, autores, instituciones y países lideran? P3: ¿qué temas y avances tecnológicos aparecen según la frecuencia de palabras clave? P4: ¿cuáles son los estudios más influyentes? P5: ¿qué temas emergen de la red de co-ocurrencia de palabras clave? P6: ¿qué clústeres temáticos emergen de la red de co-citación?
  marco: >
    El marco es bibliométrico: la estructura intelectual de un campo se infiere de patrones de co-ocurrencia de términos y de co-citación de documentos, con el supuesto de que mayor frecuencia conjunta indica mayor cercanía temática. Se apoya en una definición de IoT como red de objetos físicos con conexión digital, con arquitectura de tres capas (orientada a internet, a cosas y a semántica) según Atzori y colaboradores, y en la idea de que las revisiones periódicas son necesarias en campos de rápido cambio. El enfoque es descriptivo y cuantitativo, con interpretación cualitativa posterior de los diez artículos principales de cada clúster; no se declara una teoría explicativa de adopción ni de desempeño.
  metodologia: >
    La búsqueda se realizó en Scopus el 19 de enero de 2024 sobre títulos, resúmenes y palabras clave con términos de IoT, logística y SCM, sin restricción de área, y arrojó 7412 registros. Se retuvieron artículos de revista y revisiones en inglés (3069 documentos tras el primer filtro y 2951 tras el criterio de idioma) y tres investigadores realizaron un cribado manual independiente con resolución de discrepancias por consenso, que dejó 2680 artículos. Se analizaron año, autoría, revista, palabras clave, resumen, citas y distribución geográfica con BibExcel, VOSviewer y Gephi. La red de co-ocurrencia se construyó con VOSviewer (conteo completo, mínimo cinco ocurrencias por término) y la de co-citación con Gephi, con detección de comunidades mediante el algoritmo de Louvain. Se ajustaron manualmente parámetros de visualización y agrupación. No se aplicó evaluación de calidad de los artículos, no se informa la concordancia entre los tres revisores y los datos se ofrecen solo bajo solicitud a los autores.
  resultados: >
    La producción pasó de una fase incipiente entre 2000 y 2010 a un crecimiento de 11 a 109 publicaciones entre 2011 y 2017 y a 632 publicaciones en 2018-2023, según el texto. Las revistas más productivas fueron Sensors (128), IEEE Access (118) y Sustainability (84); los autores más productivos fueron Huang GQ (28), Zhong RY (15) y Luthra S (11); las instituciones, la Universidad de Hong Kong (43), la Universidad Politécnica de Hong Kong (29) y la Universidad King Abdulaziz (26); y los países, China (719), India (459) y Estados Unidos (303). Los porcentajes de las tablas se calculan sobre el total de cada lista de diez, no sobre las 2680 publicaciones. Las palabras clave más frecuentes fueron IoT (1425), blockchain (437), Industria 4.0 (293), aprendizaje automático (191), RFID (162) y sostenibilidad (86). El artículo más citado fue Lee y Lee, con 1843 citas. La red de palabras clave formó cinco clústeres (tecnologías base y analítica de datos, Industria 4.0 y sostenibilidad con gemelo digital y COVID-19, blockchain y trazabilidad, aprendizaje automático y ciberseguridad, y comunicaciones y cifrado) y la de co-citación seis clústeres con modularidad de 0,388: análisis de datos masivos e IoT, cadena de suministro de alimentos, blockchain y contratos inteligentes, Industria 4.0 y transformación digital, sistemas inteligentes y seguridad, y tecnologías avanzadas para Industria 4.0 y 5.0.
  discusion: >
    Los autores sostienen que el campo pasó de exploraciones conceptuales a implementaciones maduras y que seguirá creciendo, con concentración en revistas de ciencias de la computación y en Asia. Proponen como direcciones futuras la validación empírica de la integración entre blockchain e IoT, criptografía resistente a la computación cuántica, el uso de 5G, la convergencia de IoT e inteligencia artificial para logística predictiva y el estudio de barreras de adopción, seguridad, privacidad, interoperabilidad y gobernanza de datos, que califican como ausentes en la literatura. Afirman que su análisis es el primero de este alcance y que ofrece resultados imparciales frente a revisiones subjetivas, y reconocen como limitaciones el uso de una sola base de datos, el idioma inglés y los términos de búsqueda, con sugerencias de análisis por periodos y de modelado de tópicos.
  limitaciones: "Declaradas: una sola base de datos (Scopus), solo artículos en inglés, posibles omisiones por los términos de búsqueda. No declaradas: ajuste manual de la agrupación, ausencia de evaluación de calidad y de análisis de sensibilidad a los umbrales, inconsistencias en los conteos y en el número de clústeres, y datos no públicos."
  futuro: "Segmentar el análisis por periodos de cinco a siete años con mapas estratégicos, aplicar modelado dinámico de tópicos y análisis de trayectoria principal, añadir bases como Web of Science, ampliar los términos de búsqueda, validar empíricamente blockchain con IoT y estudiar barreras, seguridad, interoperabilidad y gobernanza de datos."
c3:
  tesis: >
    La literatura de IoT en logística y cadena de suministro es amplia, creció con rapidez desde 2017, se concentra en China, India y Estados Unidos y se organiza en pocos ejes tecnológicos (analítica de datos, alimentos, blockchain, Industria 4.0, seguridad y comunicaciones); el análisis bibliométrico de 2680 artículos permite identificar temas emergentes como 5G, blockchain y optimización con inteligencia artificial.
  antitesis: >
    El artículo describe frecuencias y agrupaciones, pero no evalúa calidad ni resultados de los estudios; por eso 'madurez' se infiere del volumen de publicaciones y no de evidencia de implementación. La afirmación de resultados 'imparciales' y de un análisis 'sin precedentes' es discutible: la agrupación se ajustó manualmente, la Tabla 1 lista varias revisiones bibliométricas previas del mismo campo con redes de co-citación y de palabras clave, y los conteos no son consistentes (3069, 2951 y 2680 documentos; seis clústeres de co-citación en los resultados y siete en las conclusiones; periodo 2000-2023 frente a 'desde 2011'). La interpretación de que el liderazgo de países en desarrollo refleja 'inversión estratégica' no se prueba con datos de financiamiento, y las tablas de porcentaje usan como base el total de cada lista de diez. El texto concluye con generalidades sobre eficiencia, resiliencia y sostenibilidad que no provienen de los datos bibliométricos.
  sintesis: >
    El valor de la revisión es el mapa de términos, revistas, autores y clústeres que permite ubicar a qué literatura recurrir para tecnologías de IoT en operaciones empresariales: seguimiento con RFID, comunicaciones ligeras como MQTT, trazabilidad, analítica y seguridad. Debe leerse como inventario de la producción académica y no como evidencia de eficacia. Para el corpus, la síntesis consiste en usar este mapa como línea base de oferta tecnológica y contrastarlo con la demanda de empresas afectadas por sismos: qué soluciones de IoT en cadena de suministro tienen costos, madurez y barreras compatibles con micro y pequeñas empresas, y cuáles apoyan continuidad y reapertura tras un desastre, un uso que la revisión no examina.
  areas_grises:
    - "Conteos inconsistentes del proceso de selección: se mencionan 7412 registros, 3069 documentos tras el filtro de tipo, 2951 tras el de idioma, 4732 documentos excluidos y 2680 finales; las cifras no son consecutivas, el diagrama de flujo no se lee en la extracción y no se detalla el motivo de las exclusiones del cribado manual."
    - "Número de clústeres y periodo: la red de co-citación se reporta con seis clústeres en los resultados (modularidad 0,388) y con siete en las conclusiones; el periodo se describe como 2000-2023 en la tabla comparativa y como 'desde 2011' en la discusión."
    - "Base de los porcentajes: los porcentajes de las tablas de revistas, autores y países se calculan sobre el total de cada lista de diez (569, 120 y 2435), por lo que no representan la participación sobre las 2680 publicaciones; el texto sí usa 4,4 % para los autores sobre el total, de forma no uniforme."
    - "Ausencia de resiliencia y desastres: el texto menciona resiliencia de forma genérica pero ningún clúster, palabra clave principal ni artículo de las tablas trata disrupciones por desastres naturales o recuperación; no se informa cuántos de los 2680 artículos abordan riesgo de interrupción."
  puntos_oscuros: >
    Llama la atención que un campo con 2680 artículos y 1843 citas para el artículo más citado no tenga entre sus 20 palabras clave principales ningún término de riesgo, interrupción o recuperación, mientras que las conclusiones hablan de cadenas de suministro más 'resilientes'. Una explicación plausible es que la literatura se organiza en torno a la tecnología (IoT, blockchain, RFID, aprendizaje automático) y a la eficiencia operativa en condiciones normales, y que los estudios de interrupción se publican bajo etiquetas distintas (gestión de riesgo, resiliencia de cadenas de suministro) que la cadena de búsqueda no captura. Esto indica que el mapa no puede usarse para concluir que el IoT mejora la continuidad ante desastres, y que cualquier uso en recuperación posterior a un sismo requiere buscar en la intersección con esos términos. Además, la fuerte presencia de seguridad, cifrado y blockchain sugiere que gran parte del volumen es de ingeniería de sistemas y no de gestión, de modo que la evidencia sobre costos, adopción en pequeñas empresas y resultados económicos es escasa en proporción al volumen total.
  ideas:
    - "Medición de la brecha de resiliencia en la literatura de IoT en cadena de suministro: aplicar a los registros de la búsqueda los términos de interrupción, desastre, sismo, recuperación y continuidad, y estimar la proporción de los 2680 artículos que los incluyen, por clúster y por año, comparándola con la proporción en una búsqueda de resiliencia de cadenas de suministro sin IoT. Fundamento: el mapa no muestra términos de riesgo entre los más frecuentes. Verificabilidad: reproducir la consulta de Scopus de enero de 2024 con reglas de conteo declaradas y codificación doble de una muestra. Utilidad: cuantifica el vacío y orienta la búsqueda de literatura para el corpus."
    - "Índice de preparación tecnológica de IoT para pequeñas empresas: construir, a partir de los clústeres y de los artículos más citados, un catálogo de usos (seguimiento con RFID, monitoreo de cadena de frío, trazabilidad, mantenimiento predictivo) con costo estimado, madurez, requisitos de conectividad y barreras, y calificarlos con criterios de uso posterior a un desastre (instalación rápida, energía autónoma, interoperabilidad). Fundamento: la revisión señala barreras de adopción como poco estudiadas pero no las mide. Verificabilidad: validar el catálogo con entrevistas a empresas de una zona sísmica y con cotizaciones. Utilidad: permite seleccionar soluciones de IoT viables para reapertura y continuidad en pequeñas empresas antes de pensar en gemelos digitales completos."
  relaciones:
    - "Concentración de la literatura en tecnología y eficiencia (reduce) la evidencia disponible sobre desempeño frente a interrupciones: los términos de riesgo y recuperación no figuran entre los más frecuentes, por lo que la revisión no permite inferir efectos sobre continuidad."
    - "Barreras de adopción, seguridad e interoperabilidad (condicionan) el paso de piloto a implementación a escala: los autores las reconocen como ausentes en la literatura, de modo que el avance de IoT en cadenas de suministro depende de resolverlas, aunque no las cuantifican."
  robustez: [4, 3, 3, 3]
  valor: [5, "Ofrece un inventario cuantitativo reciente de la producción sobre IoT en logística y cadena de suministro, con clústeres temáticos y artículos de referencia, útil para ubicar tecnologías y literatura de apoyo a operaciones empresariales. Su valor para el corpus es de contexto y de línea base de oferta tecnológica; se reduce porque no trata sismos ni recuperación, no evalúa calidad ni resultados económicos y contiene inconsistencias numéricas."]
  conexiones: []
socratica:
  p1: "'IoT en logística y SCM' es una red de objetos con conexión digital para sensar, vigilar e interactuar en la cadena; 'madurez' del campo se infiere en el artículo del volumen y la diversidad de publicaciones."
  p2: "Supone que Scopus en inglés representa el campo, que la frecuencia de palabras clave y de co-citación equivale a importancia temática y que los clústeres de Louvain y VOSviewer corresponden a áreas de conocimiento."
  p3: "La evidencia son conteos de 2680 artículos y dos redes; no se evalúa el contenido de resultados ni su calidad."
  p4: "Si es cierto, quien busque tecnología de IoT para operaciones puede orientarse por los clústeres; si es falso, se tomaría el volumen de publicaciones como prueba de eficacia o de adopción real."
  p5: "No se examinan los estudios de IoT en cadenas de suministro con fracaso de implementación ni el sesgo de publicación a favor de resultados positivos."
  p6: "Alternativas: que la mayor producción de Asia refleje volumen editorial y no adopción; que otras bases y otros idiomas cambien los clústeres; que el crecimiento se deba a mayor indexación en Scopus."
