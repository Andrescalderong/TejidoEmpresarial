  - ["Falsa dicotomía (bibliometría imparcial frente a revisión subjetiva)", "Se sostiene que la bibliometría produce 'unbiased findings' mientras la agrupación se ajusta manualmente y la selección depende de la consulta y del cribado (Sec. 3, p. 7; Sec. 6.1, p. 16)", "Subestima los sesgos de método"]
