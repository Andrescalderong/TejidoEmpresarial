  valor:
  - 5
  - Aporta una revisión sistemática reproducible, con 453 registros, 127 exclusiones desglosadas por motivo y 69 estudios incluidos, un registro de protocolo y cuatro dominios de aplicación del IoT en producción, además de la advertencia de que la dimensión social y la transición a Industria 5.0 carecen de evidencia empírica. Su valor para el corpus es medio, porque usa una sola base de datos, no cuantifica efectos, trata la resiliencia como mención conceptual y no aborda desastres ni recuperación, pero confirma el papel del IoT como infraestructura de datos y sus condiciones de gobernanza y capacidades.
