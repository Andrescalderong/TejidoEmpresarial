doc_id: D083
relevancia: Adyacente
relevancia_just: Revisión sistemática de 69 artículos de Web of Science (2016-2026) sobre el papel del IoT como habilitador de sostenibilidad en sistemas de producción de Industria 4.0, con cuatro dominios (eficiencia energética y de recursos, monitoreo y control, mantenimiento predictivo y sistemas centrados en las personas de la transición a Industria 5.0) y una conclusión de que la dimensión social está poco desarrollada. Aporta evidencia sobre qué hace el IoT en la operación industrial y menciona gemelos digitales, interoperabilidad y resiliencia operativa, pertinentes para el corpus, aunque no trata desastres ni recuperación, usa una sola base de datos y la resiliencia aparece como transición conceptual.
cluster_tema: IoT, sostenibilidad y transición a manufactura centrada en las personas en sistemas de producción
metodo_tipo: Revisión sistemática con PRISMA 2020 y Systematic Search Flow, con una sola base (Web of Science), apreciación de calidad de cinco criterios y síntesis temática cualitativa sin metaanálisis
tipo_recurso: Artículo de revisión sistemática (journal peer-reviewed, acceso abierto)
