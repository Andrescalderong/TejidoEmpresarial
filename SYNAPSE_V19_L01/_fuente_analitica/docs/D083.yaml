notas: Texto completo extraído (30 páginas). El recuento 453 - 257 - 127 = 69 y la suma de los motivos de exclusión (36 + 24 + 41 + 26 = 127) los verificó el analista y son coherentes. La Tabla 5 del texto principal solo contiene una muestra de diez estudios. Las páginas siguen los marcadores del PDF.
