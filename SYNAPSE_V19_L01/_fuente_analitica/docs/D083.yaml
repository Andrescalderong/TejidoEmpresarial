socratica:
  p1: '''Sostenibilidad en producción'' abarca las dimensiones ambiental, económica y social; ''IoT'' es la interconexión de máquinas, sensores y sistemas; ''mantenimiento predictivo'' es la anticipación de fallas con datos de condición; ''centrado en las personas'' es la orientación de Industria 5.0 hacia el bienestar y la colaboración humano-máquina.'
  p2: Supone que Web of Science representa la literatura relevante, que una síntesis temática cualitativa revela mecanismos, que los estudios de casos se generalizan y que la resiliencia de Industria 5.0 se deriva de la infraestructura IoT.
  p3: La evidencia son 69 estudios seleccionados de 453 registros, una apreciación de calidad de cinco criterios sin puntajes reportados y una síntesis en cuatro dominios.
  p4: Si es cierto, el IoT con gobernanza y capacidades mejora la eficiencia y la confiabilidad y prepara sistemas más adaptativos; si es falso, los beneficios pueden depender de casos controlados y no extenderse a pymes ni a perturbaciones externas.
  p5: No se examinan magnitudes agregadas, otras bases de datos, la fiabilidad de la selección, la resiliencia ante desastres ni la dimensión social con datos.
  p6: 'Alternativas: que las mejoras se deban a la automatización más que al IoT; que el efecto dependa del tamaño de la planta; que la resiliencia dependa de la redundancia física y no de la sensorización.'
