c2:
  objetivo: 'Examinar cómo el Internet de las cosas (IoT) actúa como habilitador clave de la sostenibilidad en sistemas de producción industrial dentro del paradigma de Industria 4.0, para atender la comprensión fragmentada de los mecanismos que vinculan las tecnologías digitales con resultados ambientales, operativos y, de forma emergente, centrados en las personas. El estudio busca una síntesis orientada a mecanismos que explique cómo las infraestructuras habilitadas por IoT generan resultados de sostenibilidad y que establezca un puente conceptual entre la digitalización de Industria 4.0 y la transición hacia modelos de manufactura centrados en las personas y resilientes asociados a Industria 5.0.

    '
  pregunta: 'Las preguntas de investigación son: RQ1, cómo actúa el IoT como habilitador clave de la sostenibilidad en sistemas de producción dentro del paradigma de Industria 4.0; RQ2, cuáles son las principales tendencias tecnológicas, enfoques y agrupaciones temáticas en sistemas de producción sostenibles habilitados por IoT; y RQ3, cuáles son las implicaciones de la adopción del IoT para la transición hacia modelos de producción centrados en las personas y resilientes en el contexto de Industria 5.0.

    '
  marco: 'El marco ubica el IoT como infraestructura digital que permite captura de datos, monitoreo en tiempo real y comunicación bidireccional entre activos físicos y plataformas digitales, y sostiene que su contribución a la sostenibilidad radica en convertir datos operativos en información accionable. Distingue cuatro dominios: eficiencia energética y de recursos, monitoreo y control, mantenimiento predictivo y gestión de activos, y sistemas de producción centrados en las personas de Industria 5.0. Considera las dimensiones ambiental, económica y social de la sostenibilidad y señala que los beneficios dependen de la interoperabilidad, la calidad de los datos y la madurez digital. Menciona gemelos digitales alimentados por IoT para evaluar ajustes operativos antes de implementarlos y la integración con sistemas MES y ERP.

    '
  metodologia: 'La revisión combinó el Systematic Search Flow con PRISMA 2020. El protocolo se registró en el Open Science Framework antes de la extracción de datos. La búsqueda se hizo en enero de 2026 en la Colección Principal de Web of Science, con la ecuación de campo de tema que combina IoT, sostenibilidad de manufactura o eficiencia de recursos y Industria 4.0 o transformación digital, para artículos y revisiones de 2016 a 2026 en inglés o español. Se recuperaron 453 registros, de los que 257 se excluyeron por el título, 196 pasaron a evaluación de resumen y texto completo y 127 se excluyeron por falta de alineación con el objetivo (36), contexto no industrial (24), aplicaciones no relacionadas con producción sostenible o IoT industrial (41) y baja relevancia o profundidad insuficiente (26), con 69 estudios incluidos. Siete integrantes hicieron la selección por título y resumen y el texto completo, con resolución por consenso y un octavo investigador senior para discrepancias. La calidad
    se apreció con cinco criterios en escala de 0 a 2 (máximo de 10) sin excluir estudios solo por calidad, y la síntesis fue temática y cualitativa porque no era viable un metaanálisis por la heterogeneidad de resultados y unidades.

    '
  resultados: 'Los resultados indican cuatro dominios interrelacionados en los 69 artículos. En eficiencia energética y de recursos, el IoT permite medir consumo, uso de materiales y condiciones de operación, apoya prácticas de economía circular y se integra con analítica y aprendizaje automático. En monitoreo y control, entrega visibilidad en tiempo real, se integra con MES y ERP, apoya la incorporación de restricciones energéticas y ambientales en la decisión y se usa con gemelos digitales para simular ajustes. En mantenimiento predictivo, la medición de vibración, temperatura, corriente y consumo permite estimar fallas, priorizar intervenciones y reducir paros no programados. Los tres primeros dominios tienen una orientación empírica fuerte y mejoras medibles de desempeño ambiental, mientras que el cuarto, de sistemas centrados en las personas de Industria 5.0, tiene evidencia empírica comparativamente limitada y es sobre todo conceptual. Se reportan reducciones de consumo de energía,
    mejor aprovechamiento de recursos, mayor confiabilidad de equipos y menor tiempo de inactividad por mantenimiento, sin cifras agregadas. La evolución temporal muestra un paso de arquitecturas centradas en conectividad a configuraciones intensivas en analítica y apoyo a la decisión, y la dimensión social de la sostenibilidad aparece desarrollada de manera incipiente. Entre los retos persisten la integración de datos, la adaptación de la fuerza laboral y las brechas de capacidad digital.

    '
  discusion: 'Los autores sostienen que el IoT es la columna estructural de las transformaciones de sostenibilidad basadas en datos y que los avances no provienen solo de su adopción, sino de su integración sistémica con IA y aprendizaje automático, sistemas ciberfísicos y gemelos digitales. Proponen un marco conceptual integrador que articula infraestructura IoT, mecanismos operativos y resultados de sostenibilidad desde una perspectiva sociotécnica, según el cual la sostenibilidad no es un resultado tecnológico automático sino una propiedad emergente de la alineación entre arquitectura digital, capacidades organizacionales, gobernanza y diseño centrado en las personas. Recomiendan acompañar la inversión en IoT con gobernanza de datos, desarrollo de competencias, planificación de interoperabilidad y supervisión ética, y marcos regulatorios que faciliten la adopción por pymes.

    '
  limitaciones: 'Declaradas: la dependencia de una sola base de datos (Web of Science) puede limitar la cobertura y excluir estudios indexados solo en otras; muchos estudios se basan en casos específicos o validaciones en entornos controlados, lo que limita la generalización; la evidencia sobre aplicaciones centradas en las personas y de Industria 5.0 es sobre todo conceptual y requiere estudios longitudinales; no fue viable un metaanálisis. No declaradas: el texto principal solo presenta un subconjunto representativo de diez estudios y no reporta puntajes de calidad ni su distribución; la afirmación de que las mejoras ambientales y operativas están validadas de manera consistente no se acompaña de magnitudes ni de intervalos; la ecuación exige simultáneamente términos de IoT, sostenibilidad de manufactura e Industria 4.0, por lo que la literatura sobre resiliencia ante perturbaciones externas queda fuera; la confiabilidad entre revisores no se cuantifica; se registra el protocolo en OSF
    con una fecha de acceso de junio de 2026 posterior a la búsqueda de enero, sin indicar la fecha de registro; la resiliencia de Industria 5.0 se menciona como transición y no se define ni se mide.'
  futuro: 'Explícito: investigación longitudinal y estudios de campo más sólidos sobre las implicaciones sociotécnicas de los sistemas de producción habilitados por IoT, con atención a la dimensión social, a la adopción por pymes y a la gobernanza de datos. Implícito: ampliación a otras bases de datos, medición de resiliencia operativa ante interrupciones y estudios de costo-beneficio de la adopción.'
c3:
  tesis: 'El IoT es la infraestructura digital que habilita la sostenibilidad de los sistemas de producción al convertir datos operativos en decisiones de eficiencia energética, monitoreo y control y mantenimiento predictivo, con mejoras ambientales y operativas consistentes en 69 estudios, siempre que se integre con analítica, sistemas ciberfísicos y gemelos digitales y con gobernanza, capacidades de la fuerza laboral y diseño centrado en las personas, mientras que la dimensión social y la transición a Industria 5.0 siguen poco respaldadas por evidencia.

    '
  antitesis: 'La síntesis se basa en una sola base de datos y en una ecuación de tres términos obligatorios, y declara mejoras consistentes sin cifras agregadas ni puntajes de calidad, con casos mayormente específicos y entornos controlados. La etiqueta de síntesis orientada a mecanismos no equivale a una prueba de mecanismos, ya que los estudios son heterogéneos y la síntesis es cualitativa. La conclusión de que la sostenibilidad es una propiedad emergente de la alineación sociotécnica no se contrasta con casos comparables. El apartado de resiliencia se limita a una referencia a Industria 5.0, sin definición ni evidencia, y no considera perturbaciones externas como desastres naturales ni la recuperación.

    '
  sintesis: 'La contribución sostenible es un mapa ordenado de cuatro dominios de aplicación del IoT en producción con una advertencia sobre la brecha social y de resiliencia, y un énfasis práctico en que el IoT no basta sin gobernanza y capacidades. Para el corpus, valida que el IoT como infraestructura de datos funciona en la operación industrial y que la integración con gemelos y sistemas de gestión es la ruta de madurez, pero no aporta evidencia sobre cómo esa infraestructura se comporta o ayuda a recuperar una empresa tras un desastre. Sus conclusiones son indicativas y requieren una revisión ampliada y cuantitativa.

    '
  areas_grises:
  - 'Una sola base de datos: la búsqueda se hizo solo en Web of Science, con justificación de consistencia y calidad de metadatos, y el texto reconoce que esto puede excluir estudios indexados en Scopus, IEEE Xplore u otras bases; en un tema de ingeniería e IoT industrial, el porcentaje de estudios no recuperados no se estima.'
  - 'Evidencia de mejoras: la revisión afirma que el IoT mejora de manera consistente la confiabilidad operativa y la eficiencia de recursos, pero reporta resultados en términos cualitativos, sin cifras agregadas, y la Tabla de estudios del texto principal presenta solo una muestra de diez, de modo que la magnitud y la heterogeneidad de las mejoras no pueden evaluarse.'
  - 'Resiliencia e Industria 5.0: el resumen establece un puente con modelos de manufactura resilientes y centrados en las personas, pero el cuarto dominio se describe como predominantemente conceptual, no se define la resiliencia ni se miden indicadores de recuperación, y la mención de sistemas más adaptativos y seguros no se apoya en estudios de interrupciones reales.'
  - 'Calidad y confiabilidad: se aplicaron cinco criterios de calidad de 0 a 2 y no se excluyó ningún estudio solo por calidad, pero el texto no presenta la distribución de puntajes ni indicadores de acuerdo entre los siete revisores, y declara una calidad media-alta en términos generales.'
  puntos_oscuros: 'Llama la atención que el artículo declare un registro previo del protocolo en OSF con una fecha de acceso de junio de 2026, un día antes de la aceptación del 17 de junio, y una búsqueda de enero de 2026, sin indicar cuándo se registró. También es notable que se describa el trabajo como orientado a mecanismos cuando la síntesis es temática y cualitativa y los dominios son los mismos de la literatura de aplicaciones. La conclusión repite un párrafo sobre el desequilibrio entre dimensiones de sostenibilidad. El texto afirma que la combinación de IoT con gemelos digitales produce mayores beneficios, pero cita este resultado como parte de la descripción de la literatura y no como hallazgo cuantitativo. Además, la selección excluyó estudios de IoT en agricultura, ciudades o casas inteligentes, lo que limita el aprendizaje transversal hacia infraestructuras no industriales. Por último, aunque la ecuación incluye transformación digital, no incluye resiliencia, de modo que la RQ3
    sobre resiliencia se responde con literatura recuperada por otros términos.

    '
  ideas:
  - 'Replicación en Scopus e IEEE con extracción de efectos: repetir la ecuación en otras dos bases y extraer de los 69 estudios y de los nuevos las magnitudes de reducción de energía, de paros y de costos con sus unidades, para calcular rangos y una síntesis ponderada por calidad con reporte de la distribución de puntajes y del acuerdo entre revisores. El resultado mostraría cuánto del conjunto de mejoras es cuantificable, qué dominio tiene mayores efectos y cuánto cambia la conclusión al ampliar la cobertura, y daría una base numérica para estimar el retorno de una instalación de IoT industrial. Los resultados y el código de extracción se publicarían para su verificación.'
  - 'Prueba de resiliencia operativa del IoT industrial ante interrupciones: seleccionar tres plantas con monitoreo IoT y mantenimiento predictivo y registrar durante un año los eventos de falla de energía, de red y de sensores, midiendo el tiempo de detección, el tiempo de restablecimiento del monitoreo y las pérdidas de producción con y sin respaldo local. Con ello se podría pasar de la mención conceptual de resiliencia a indicadores medidos y determinar cuánta redundancia necesita una pyme para que su infraestructura de datos sirva en la recuperación tras una perturbación mayor. Los resultados y el código de extracción se publicarían para su verificación.'
  relaciones:
  - 'IoT y resiliencia en Industria 5.0 (complementa) D074 y D082: D074 propone requisitos de resiliencia y sostenibilidad en un gemelo IoT y D082 identifica mecanismos organizacionales; D083 aporta el inventario de aplicaciones de IoT en producción y confirma la brecha de evidencia social y de resiliencia.'
  - 'Gemelos con IoT en producción (se relaciona con) D081 y D086: D081 revisa gemelos y resiliencia en cadenas de suministro y D086 usa inteligencia de borde para clasificar anomalías en monitoreo estructural; D083 muestra el uso de IoT para mantenimiento predictivo y anomalías en planta.'
