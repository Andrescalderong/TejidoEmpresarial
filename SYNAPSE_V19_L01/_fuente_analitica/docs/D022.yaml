doc_id: D022
relevancia: "Adyacente"
relevancia_just: "Revisión sistemática PRISMA de 117 estudios sobre vehículos aéreos no tripulados (UAV) que sustituyen temporalmente estaciones base terrestres dañadas por desastres; trata la restauración de comunicaciones como condición de respuesta y recuperación, con un solo término de amenaza sísmica en la búsqueda, y no analiza recuperación productiva ni empresas."
cluster_tema: "UAV y restauración de comunicaciones posdesastre"
metodo_tipo: "Revisión sistemática (PRISMA) con síntesis temática"
tipo_recurso: "Artículo de revisión (journal peer-reviewed, acceso abierto)"
kw_inferidas: [vehículos aéreos no tripulados, estaciones base aéreas, comunicaciones de emergencia, recuperación comunitaria, aprendizaje por refuerzo profundo, optimización de energía, despliegue multi-UAV, backhaul, resiliencia adaptativa, gestión de riesgo de desastres]
c2:
  objetivo: >
    Sintetizar el estado del conocimiento sobre el uso de vehículos aéreos no tripulados (UAV) como estaciones base aéreas (ABS) desplegadas como reemplazo temporal de estaciones terrestres inoperativas en escenarios posteriores a desastres. La revisión se propone sintetizar arquitecturas y modelos de despliegue validados, evaluar su viabilidad, beneficios y limitaciones, e identificar barreras técnicas y operativas críticas, para orientar la investigación futura, los marcos de despliegue y la estandarización, con atención particular a regiones de bajos recursos y de alto riesgo.
  pregunta: >
    El artículo no formula preguntas de investigación numeradas; plantea tres objetivos de síntesis: arquitecturas y modelos de despliegue validados, evaluación de su viabilidad, beneficios y limitaciones, e identificación de barreras técnicas y operativas. Las dimensiones analizadas son tipos de UAV, estrategias de despliegue y coordinación, operaciones impulsadas por inteligencia artificial y optimización de energía.
  marco: >
    El marco combina el ciclo de gestión de desastres, en el que la fase de respuesta requiere comunicación para coordinar y asignar recursos, con la arquitectura de redes celulares aéreas (UAV como relé o como estación base con femtoceldas o picoceldas) y con criterios de ingeniería de comunicaciones: cobertura, capacidad, latencia, energía, estabilidad, seguridad y regulación. Distingue la sustitución de estaciones inoperativas, objeto de la revisión, de las ampliaciones de cobertura o de capacidad de redes operativas. El paradigma es de ingeniería de sistemas inalámbricos y de inteligencia artificial aplicada a la optimización de despliegue, sin teoría de recuperación comunitaria ni de adopción tecnológica.
  metodologia: >
    Se buscó en Web of Science e IEEE Xplore en diciembre de 2025 con una cadena de términos de UAV, estación base aérea, comunicación o cobertura y emergencia, desastre, terremoto o tormenta. Los criterios de inclusión exigieron artículos de revista en inglés de 2015 a 2025 con evidencia empírica a nivel de sistema (simulación, validación experimental, ensayo de campo o despliegue real) en contextos de falla de infraestructura; se excluyeron estudios conceptuales o teóricos y revisiones. El proceso identificó 2060 registros, 1883 tras eliminar duplicados, 1742 excluidos en el cribado de títulos y resúmenes (1708 irrelevantes y 34 revisiones), 141 evaluados a texto completo (uno no recuperable), 35 excluidos por ser conceptuales y 12 añadidos por referencias cruzadas, con 117 estudios finales. El cribado fue manual y se describe como independiente; no se informa concordancia entre revisores ni evaluación de calidad o de riesgo de sesgo. Los estudios se clasificaron por dominio temático y por nivel de madurez (simulación, validación experimental, ensayo de campo).
  resultados: >
    La literatura se concentra en Asia (84 estudios), con China (42), seguida de Estados Unidos (11), India y Corea del Sur (8 cada uno), Europa (14) y América del Sur (6); la actividad comenzó en 2018 y llegó a 26 artículos en 2023, con 25 en 2024 y 19 en 2025. Los drones de ala rotatoria dominan los estudios (96), frente a pocos de ala fija o de plataformas de gran altitud; las estrategias centralizadas predominan sobre las descentralizadas e híbridas; la optimización de trayectorias es el tema de IA más frecuente y la conservación de energía se investiga mucho más que la recolección. Los drones de ala rotatoria ofrecen cobertura localizada y autonomía de unos 15 a 90 minutos; los de ala fija y las plataformas de gran altitud, de horas a días con energía solar o vuelo de crucero eficiente. La síntesis concluye que el aprendizaje por refuerzo (profundo y multiagente) es el paradigma principal, que las arquitecturas heterogéneas superan a las homogéneas en simulación y que la resistencia limitada, el backhaul, la latencia de cómputo en equipos embebidos y la regulación son los cuellos de botella. La mayoría de los estudios se valida con simulación; los ensayos de campo y los despliegues reales son escasos, por lo que la eficacia de los UAV como reemplazo de estaciones terrestres 'sigue sin probarse en gran medida'.
  discusion: >
    Los autores sostienen que la autonomía energética y el backhaul son los principales obstáculos, que existe una brecha entre la factibilidad teórica y la preparación operativa por supuestos idealizados (baterías que no se agotan, información perfecta de canal, carga inalámbrica ininterrumpida), y que los marcos de aprendizaje profundo se entrenan en equipos con GPU que no son los procesadores embebidos de los drones. Señalan barreras no técnicas: regulación, privacidad, seguridad y aceptación comunitaria. La agenda propuesta incluye marcos de validación de alta fidelidad con mediciones de campo y simulación en el lazo con hardware, algoritmos de IA ligeros y seguros, sistemas híbridos de energía y arquitecturas multicapa (ala rotatoria, ala fija, plataformas de gran altitud o satélites), y marcos estandarizados y éticos con zonas regulatorias de prueba.
  limitaciones: "Declaradas: cribado manual sin software bibliométrico, posible omisión de estudios; exclusión de informes de mercado, revistas del sector y normas nacionales. No declaradas: solo dos bases de datos (sin Scopus), cadena con un único término sísmico y exclusión de estudios conceptuales, ausencia de evaluación de calidad, y clasificación de madurez por los autores."
  futuro: "Validación de alta fidelidad con pruebas de campo y simulación en el lazo con hardware, algoritmos ligeros y seguros para equipos embebidos, aprendizaje federado, sistemas híbridos de energía y arquitecturas multicapa, y estandarización técnica, regulación ágil y marcos éticos."
c3:
  tesis: >
    Los UAV como estaciones base aéreas son una alternativa viable y técnicamente prometedora para restablecer comunicaciones tras un desastre, con arquitecturas heterogéneas, despliegue coordinado, control mediante aprendizaje por refuerzo y optimización de energía, aunque la autonomía, el backhaul y la falta de validación de campo limitan la implementación real.
  antitesis: >
    La revisión admite como evidencia 'empírica' principalmente estudios de simulación bajo supuestos idealizados, y reconoce que los ensayos de campo y los despliegues reales son escasos; por eso conclusiones como 'las arquitecturas heterogéneas superan a las homogéneas' proceden de modelos y no de operación. La búsqueda se limitó a dos bases, usó un solo término sísmico entre los de amenaza y no evaluó la calidad de los estudios, y el cribado manual no informa concordancia entre revisores. Los porcentajes y conteos de las tablas de madurez no son legibles de forma consistente en el texto, y no se cuantifican costos, tiempos de despliegue en desastres reales ni cobertura efectiva. El título y las palabras clave aluden a 'recuperación comunitaria' pero la revisión se circunscribe a conectividad inalámbrica, no a la recuperación económica o social, y los resultados provienen de ciencias de la computación e ingeniería de comunicaciones sin evidencia de efectos sobre la respuesta o la recuperación.
  sintesis: >
    La contribución sólida es el mapa de plataformas, estrategias de despliegue, métodos de IA y de energía, junto con la evidencia de que la madurez es baja (predominio de simulación) y de que las barreras dominantes son energía, backhaul, cómputo embebido y regulación. Debe leerse como inventario técnico de una solución emergente y no como prueba de eficacia operativa. Para el corpus, la síntesis consiste en tratar la conectividad temporal como habilitador de la continuidad empresarial y del flujo de datos de los gemelos y sistemas IoT después de un sismo: medir el tiempo de restablecimiento de comunicaciones y su efecto sobre la reapertura de empresas, y comparar las alternativas (UAV, estaciones móviles, redes malladas) por costo, rapidez y dependencia de energía.
  areas_grises:
    - "Madurez real de la tecnología: aunque se señala que la mayoría de los estudios se valida por simulación, el texto no entrega recuentos claros por nivel (simulación, experimento, ensayo de campo) por categoría, y los valores de la Tabla 3 no son legibles de forma consistente, por lo que no se puede estimar la proporción de despliegues reales."
    - "Cobertura de la búsqueda: dos bases de datos, una cadena con un único término sísmico ('earthquake') y exclusión de estudios conceptuales pueden sesgar el conjunto; no se informan concordancia de cribado, evaluación de calidad ni los 35 estudios conceptuales excluidos."
    - "Validez de las comparaciones: la superioridad de arquitecturas heterogéneas y de métodos de aprendizaje por refuerzo sobre heurísticas se reporta a partir de simulaciones con supuestos idealizados (baterías ideales, información perfecta de canal), sin metaanálisis ni normalización de métricas entre estudios."
    - "Alcance de la 'recuperación': el artículo trata la conectividad inalámbrica de emergencia, pero no examina cómo la restauración de comunicaciones afecta la reapertura de servicios, empresas y hogares, de modo que el vínculo con la recuperación comunitaria que sugieren las palabras clave no se establece."
  puntos_oscuros: >
    Resulta llamativo que 117 estudios, con crecimiento de citas hasta más de 4.891 en 2025, deriven en una conclusión de que la eficacia operativa 'sigue sin probarse', y que la producción se concentre en un país (China, 42 estudios) sin que el texto explique esa concentración. Una explicación plausible es que el área es atractiva para la ingeniería de comunicaciones y la optimización, porque permite publicar con simulación y con técnicas de aprendizaje de moda, mientras que los ensayos de campo requieren autorizaciones, coordinación con operadores y datos de desastres reales. Esto sugiere que el volumen de publicaciones refleja disponibilidad metodológica más que madurez, y que la decisión de una agencia de gestión de desastres no puede basarse en la literatura actual sin pruebas de campo. Además, que la regulación y la aceptación comunitaria aparezcan solo como barreras no técnicas indica que el diseño tecnológico se ha desarrollado sin los actores que los desplegarían, de modo que la validación debería incluir a operadores móviles, autoridades de aviación y organismos de respuesta.
  ideas:
    - "Indicador de tiempo hasta restablecer conectividad y su efecto sobre la reapertura empresarial: medir en un sismo reciente el tiempo de recuperación de cobertura móvil por zona y relacionarlo con el tiempo de reapertura de comercios y de pequeñas empresas, controlando por daño físico y por energía eléctrica, y estimar cuánto reducirían ese tiempo alternativas como UAV, estaciones móviles o redes malladas. Fundamento: la revisión asume que la comunicación es crítica para la coordinación y la asignación de recursos, pero no mide su efecto en la actividad económica. Verificabilidad: datos de operadores, registros de reapertura y modelo de diferencias entre zonas. Utilidad: permite priorizar inversión en conectividad temporal según su retorno en continuidad productiva."
    - "Prueba comparativa de campo con criterios de aceptación: diseñar un protocolo de ensayo con metas de autonomía, capacidad de backhaul, tiempo de despliegue y continuidad de servicio, aplicable a UAV, estaciones móviles y redes malladas en un ejercicio de simulacro, y publicar los resultados con datos abiertos. Fundamento: la propia revisión reconoce la escasez de ensayos de campo y de métricas estandarizadas. Verificabilidad: ejercicio con operadores de telecomunicaciones y autoridades de gestión de riesgo. Utilidad: crea evidencia homogénea para decidir qué solución incluir en planes de contingencia y qué requisitos regulatorios facilitar."
  relaciones:
    - "Autonomía energética y backhaul (limitan) la capacidad de los UAV para sustituir estaciones terrestres: la propia revisión identifica la energía y la conexión con la red troncal como cuellos de botella dominantes."
    - "Idealización de supuestos en simulación (reduce) la transferibilidad de resultados a desastres reales: baterías sin degradación, canal perfecto y carga ininterrumpida no representan condiciones posteriores a un desastre."
  robustez: [5, 4, 3, 4]
  valor: [6, "Ofrece una síntesis sistemática y reciente de plataformas, estrategias de despliegue, métodos de IA y de energía para restaurar comunicaciones tras un desastre, con un diagnóstico claro de baja madurez y de barreras técnicas y regulatorias. Su valor para el corpus es de habilitador de continuidad de datos y de comunicación; se reduce porque no analiza sismos de forma específica ni efectos sobre la recuperación productiva, y por la dependencia de estudios de simulación."]
  conexiones: []
socratica:
  p1: "'Estación base aérea' es un UAV con equipo celular que reemplaza temporalmente una estación terrestre inoperativa; 'estudio empírico' incluye simulación, validación experimental, ensayo de campo o despliegue real."
  p2: "Supone que la simulación es evidencia empírica suficiente, que los dos repositorios consultados cubren el campo y que restablecer conectividad mejora la respuesta y la recuperación."
  p3: "La evidencia son 117 estudios clasificados por tema y madurez, con predominio de simulación; los ensayos de campo son escasos."
  p4: "Si es cierto, las agencias deberían considerar los UAV como complemento, con flotas heterogéneas y energía híbrida; si es falso, podrían depender de una tecnología sin respaldo operativo."
  p5: "No se examinan despliegues reales fallidos ni comparaciones directas con estaciones móviles terrestres o redes malladas."
  p6: "Alternativas: que las estaciones móviles sobre vehículos sean más costo-efectivas; que la energía y el backhaul impidan escalar los UAV; que la regulación sea el obstáculo principal."
