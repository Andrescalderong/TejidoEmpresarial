doc_id: D088
relevancia: "Ajeno"
relevancia_just: "Estudio epidemiológico de vigilancia de resistencia de Mycobacterium tuberculosis a fármacos en Colombia (2004-2005); pertenece al campo de la salud pública y no trata gemelos digitales, IoT, transferencia tecnológica, sismos ni recuperación empresarial."
cluster_tema: "Salud pública: resistencia a fármacos antituberculosos"
metodo_tipo: "Estudio de corte transversal de vigilancia con pruebas de laboratorio (proporciones múltiples de Canetti, Rist y Grosset)"
tipo_recurso: "Artículo científico (investigación original, journal peer-reviewed)"
kw_inferidas: [tuberculosis, tuberculosis multirresistente, Mycobacterium tuberculosis, vigilancia epidemiológica, resistencia a medicamentos, estreptomicina, isoniacida, rifampicina, etambutol, Colombia]
c2:
  objetivo: >
    Determinar la prevalencia de la resistencia de Mycobacterium tuberculosis a los fármacos antituberculosos, tanto en pacientes con tuberculosis pulmonar sin tratamiento previo como en pacientes previamente tratados, a nivel nacional en Colombia durante 2004 y 2005 mediante vigilancia con red de laboratorios y control de calidad externo, y comparar los hallazgos con los dos estudios nacionales anteriores (1992 y 1999-2000) para valorar la tendencia y la adecuación del esquema de tratamiento del Programa Nacional de Control de Tuberculosis, con especial atención a los pacientes con fracaso terapéutico.
  pregunta: >
    La pregunta no se formula de manera explícita; el objetivo declarado permite expresarla así: [INFERIDA] ¿Cuál es la prevalencia de resistencia global y de multirresistencia a los fármacos antituberculosos en casos nuevos y previamente tratados de tuberculosis pulmonar en Colombia en 2004-2005, y ha aumentado respecto de los estudios previos?
  marco: >
    El marco es el de la vigilancia de la resistencia a fármacos antituberculosos recomendada por la Organización Mundial de la Salud y la Organización Panamericana de la Salud: la vigilancia periódica permite conocer la magnitud y las tendencias de la resistencia, formular y evaluar directrices de tratamiento y vigilar el efecto de las intervenciones. Define la tuberculosis multirresistente (MDR-TB) como resistencia al menos a rifampicina e isoniacida. Se apoya en las cifras globales de 2005 (8,8 millones de casos nuevos y 1,6 millones de muertes), en los dos estudios nacionales previos de Colombia (resistencia global de 14,1 % y MDR-TB de 1,81 % en 1992; 15,6 % y 1,5 % en 1999-2000) y en la estrategia de tratamiento acortado estrictamente supervisado.
  metodologia: >
    Estudio de corte transversal de vigilancia con recolección nacional de cultivos durante un año (de septiembre de 2004 a agosto de 2005, en dos grupos de departamentos de seis meses cada uno) a cargo de la Red Nacional de Laboratorios de salud pública departamentales y distritales. Incluyó 1 189 pacientes con tuberculosis pulmonar con baciloscopia positiva, en dos grupos: casos nuevos mayores de 15 años sin tratamiento previo y casos previamente tratados (fracaso, abandono o recaída). El tamaño de muestra de casos nuevos se calculó con Epi-Info 6.04 usando la prevalencia de resistencia al etambutol del estudio previo, con 95 % de confianza y 0,5 % de precisión, proporcional a los casos registrados por departamento en 2002 (7 787 casos), lo que dio 1 055 pacientes más 20 % por pérdidas (1 266). Para los casos previamente tratados se proyectaron 243 pacientes y se incluyó el 100 % de los que consultaron en un año. Los cultivos se procesaron en el Laboratorio Nacional de Referencia con pruebas de susceptibilidad a estreptomicina, isoniacida, rifampicina y etambutol por el método de proporciones múltiples. Se aplicó control de calidad directo con 60 cepas de referencia e indirecto con 201 cepas colombianas del laboratorio supranacional de Chile. Los datos se manejaron con el programa SDRTB; los participantes firmaron consentimiento informado y el proyecto tuvo aval del comité de ética del Instituto Nacional de Salud.
  resultados: >
    Se recibieron 1 250 cultivos de casos nuevos (98,7 % de la meta de 1 266) y 925 (73,1 %) fueron aptos para el análisis. El control de calidad externo evaluó 201 cepas colombianas. Entre los casos nuevos, la resistencia global fue de 11,78 % (IC 95 %: 9,86-14,02) y la MDR-TB de 2,38 % (IC 95 %: 1,58-3,57); la mayor resistencia a un solo fármaco correspondió a estreptomicina (4,32 %) e isoniacida (2,27 %), y 12 cepas (1,30 %) fueron resistentes a los cuatro fármacos. Entre los 264 casos previamente tratados (41,7 % abandonos, 27,3 % recaídas, 22,7 % fracasos), la resistencia global fue de 44,32 % (IC 95 %: 38,45-50,35) y la MDR-TB de 31,44 % (IC 95 %: 26,14-37,27); 32 cepas (12,12 %) fueron resistentes a los cuatro fármacos. La MDR-TB se distribuyó en 50,6 % de los fracasos, 25,3 % de los abandonos y 19,3 % de las recaídas. El control de calidad de las baciloscopias tuvo concordancia de 99,9 %; 66 de 70 lotes de medios de cultivo (94 %) cumplieron los parámetros; la sensibilidad de las pruebas fue de 95 % a 100 % y la especificidad osciló entre 82,08 % y 100 %, con los valores más bajos para estreptomicina.
  discusion: >
    Los autores concluyen que la resistencia y la MDR-TB muestran una ligera tendencia al aumento respecto de los estudios anteriores, no significativa desde el punto de vista estadístico, y que el esquema del Programa Nacional de Tuberculosis es adecuado. Interpretan que el 50,6 % de MDR-TB entre fracasos exige cultivo y pruebas de susceptibilidad ante cualquier sospecha de fracaso y manejo individual en centros de alta complejidad, y que el alto porcentaje de abandonos requiere estrategias de adherencia. Ubican a Colombia en quinto lugar en prevalencia de MDR-TB en casos no tratados en las Américas (1,5 % en 1999-2002). Reconocen que no todos los departamentos aportaron el número requerido de muestras, lo que introduce sesgo de selección, que los datos no sirven para evaluar tendencias departamentales y que no se analizaron la coinfección con VIH, el régimen de afiliación en salud ni los municipios. No explican por qué la afirmación de no significancia carece de prueba estadística en el texto.
  limitaciones: "Sesgo de selección porque no todos los departamentos aportaron las muestras requeridas; datos no representativos para tendencias departamentales; no se analizaron variables como coinfección VIH/sida, régimen de afiliación y aporte de casos por municipio (p. 6-7)."
  futuro: "Fortalecer la vigilancia en los departamentos con más casos, ampliar la estrategia TAES o DOTS, realizar análisis de cohortes de pacientes con tuberculosis pulmonar en tratamiento y vigilar mediante cultivo y pruebas de susceptibilidad ante cualquier sospecha de fracaso (p. 6-7)."
c3:
  tesis: >
    En Colombia, la resistencia a fármacos antituberculosos y la tuberculosis multirresistente no han aumentado de manera significativa entre 1999-2000 y 2004-2005, lo que sugiere que el esquema estandarizado del Programa Nacional es adecuado para la mayoría de los casos, con excepción de los pacientes con fracaso terapéutico, que concentran la multirresistencia.
  antitesis: >
    La afirmación de ausencia de aumento significativo no se respalda con una prueba estadística, y los intervalos de confianza reportados la matizan: la MDR-TB de 2,38 % (IC 95 %: 1,58-3,57) excluye el 1,5 % del estudio de 1999-2000, de modo que podría haber un aumento pequeño. Solo 925 de 1 266 casos nuevos previstos (73,1 %) fueron aptos, y la ausencia de algunos departamentos introduce un sesgo de selección que los propios autores reconocen. La muestra de previamente tratados es de conveniencia (el 100 % de quienes consultaron), y sus cifras no se ponderan por departamento. Los controles de calidad indican especificidad de 82 % a 87 % para estreptomicina, lo que sugiere sobreestimación de su resistencia. La conclusión de que el esquema es adecuado no se contrasta con resultados clínicos (curación, abandono, mortalidad), y no se analiza la coinfección por VIH.
  sintesis: >
    El estudio ofrece una estimación nacional de prevalencia con diseño muestral explícito, control de calidad externo e intervalos de confianza, y es un insumo válido de vigilancia. Su inferencia de tendencia es débil: debe leerse como comparación descriptiva con dos estudios previos y no como contraste formal. La síntesis propone contrastar la tendencia con una prueba de proporciones entre encuestas y reportar la heterogeneidad departamental, y evaluar la adecuación del esquema con resultados de cohortes de tratamiento. Para el corpus de transferencia de tecnología y recuperación empresarial, el documento queda fuera de alcance temático y sirve solo como ejemplo de vigilancia con control de calidad externo.
  areas_grises:
    - "Inferencia de tendencia sin prueba: el texto concluye que no hubo aumento significativo comparando porcentajes de tres encuestas sin reportar una prueba de proporciones, y la MDR-TB actual (2,38 %, IC 95 %: 1,58-3,57) supera el 1,5 % de 1999-2000; no se informa el intervalo de la encuesta anterior ni ajustes por diferencias de diseño."
    - "Representatividad: de 1 266 casos nuevos previstos solo 925 (73,1 %) fueron aptos y los departamentos aportaron cantidades dispares (por ejemplo, cumplimientos entre 0 % y 244,4 % en el Cuadro 1); el texto sostiene que la muestra es representativa del país sin reponderar ni mostrar sensibilidad."
    - "Calidad de las pruebas de susceptibilidad: la especificidad para estreptomicina fue de 86,67 % (directa) y 82,08 % (indirecta), de modo que parte de las resistencias a estreptomicina puede ser falso positivo; el texto no ajusta la prevalencia por la exactitud de la prueba."
    - "Adecuación del esquema: se afirma que el esquema del programa es adecuado a partir de sensibilidad in vitro, sin datos de resultados de tratamiento ni de coinfección por VIH, variable que los autores admiten no haber analizado."
  puntos_oscuros: >
    El texto atribuye la alta MDR-TB entre fracasos (50,6 %) a falla terapéutica, pero la dirección causal puede ser inversa: los casos con resistencia primaria o adquirida previa tienen mayor probabilidad de fracasar. Sin datos de historia terapéutica ni de adherencia no puede separarse resistencia adquirida de resistencia transmitida. Además, la comparación con los estudios previos mezcla diseños: el primero incluyó 829 pacientes en 1992 y el segundo 1 087 en 1999-2000, con marcos muestrales no descritos aquí. La resistencia global de casos nuevos bajó de 15,6 % a 11,78 %, mientras que la MDR-TB subió de 1,5 % a 2,38 %; el texto presenta ambos movimientos como estabilidad, aunque indican patrones distintos que el análisis no explora (menos resistencia a fármacos individuales, más multirresistencia). Esa divergencia sería compatible con una mejora de la monoterapia inadecuada y una mayor selección de cepas multirresistentes, hipótesis que los datos del artículo no permiten contrastar.
  ideas:
    - "Contraste formal de tendencia entre encuestas nacionales: combinar los tres estudios (1992, 1999-2000 y 2004-2005) en un modelo de regresión logística con año como variable y ajuste por diseño muestral, reportando razones de momios con intervalos de confianza para resistencia global y MDR-TB. Fundamento: el artículo concluye ausencia de aumento significativo sin prueba y con una MDR-TB cuyo intervalo excluye el valor previo. Verificabilidad: las cifras de los tres estudios están en el texto y pueden reanalizarse con datos individuales del programa. Utilidad: permite a los gestores del programa distinguir entre estabilidad y aumento lento de la multirresistencia y decidir si ampliar la vigilancia por cultivo."
    - "Ajuste de la prevalencia por exactitud de la prueba: aplicar correcciones de clasificación errónea con la sensibilidad y especificidad reportadas por el control de calidad para estimar la prevalencia real de resistencia a estreptomicina y a los demás fármacos, con análisis de sensibilidad. Fundamento: el control de calidad muestra especificidad de 82 % a 87 % para estreptomicina. Verificabilidad: los valores de sensibilidad y especificidad con intervalos están en el texto y permiten simulaciones. Utilidad: reduce el riesgo de sobreestimar la resistencia a estreptomicina y mejora la decisión sobre qué fármacos incluir en el esquema de primera línea, con efectos directos en costo y adherencia."
  relaciones:
    - "Fracaso terapéutico previo (se asocia con) multirresistencia: 50,6 % de MDR-TB entre fracasos, 25,3 % entre abandonos y 19,3 % entre recaídas; la dirección causal no puede establecerse en un corte transversal."
    - "Tratamiento previo (se asocia con) mayor resistencia global: 44,32 % entre previamente tratados frente a 11,78 % entre casos nuevos, sin ajuste por edad, coinfección ni departamento."
  robustez: [6, 5, 4, 4]
  valor: [2, "Aporta una estimación nacional de resistencia con control de calidad externo, útil para la salud pública colombiana, pero está fuera del dominio del corpus (tecnología, transferencia y recuperación empresarial). Solo ilustra el uso de vigilancia con control de calidad externo y de intervalos de confianza como práctica de reporte, y servirá como contraste negativo al verificar que las búsquedas por palabras clave del corpus no confundan literatura biomédica con literatura de tecnología empresarial."]
  conexiones: []
socratica:
  p1: "Define la multirresistencia como resistencia al menos a rifampicina e isoniacida, y la resistencia global como resistencia a cualquiera de los cuatro fármacos evaluados."
  p2: "Supone que la muestra de 925 casos nuevos es representativa del país y que las comparaciones con 1992 y 1999-2000 son válidas pese a diseños distintos."
  p3: "La evidencia es una prevalencia con intervalos: 11,78 % (9,86-14,02) y 2,38 % (1,58-3,57) en casos nuevos, 44,32 % y 31,44 % en tratados, con control de calidad externo; no hay prueba formal de tendencia."
  p4: "Si es cierto que no hay aumento, se justifica mantener el esquema; si es falso, la multirresistencia crece y los fracasos terapéuticos requieren esquemas individuales."
  p5: "Casos de resistencia por departamento, coinfección con VIH y resultados clínicos del tratamiento no se analizan y podrían contradecir la conclusión."
  p6: "Hipótesis rivales: la resistencia a estreptomicina se sobreestima por baja especificidad; el aumento de MDR-TB es real pero pequeño y no se detecta por la muestra incompleta."
