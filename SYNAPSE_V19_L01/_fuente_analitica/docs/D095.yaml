doc_id: D095
relevancia: "Ajeno"
relevancia_just: "Estudio de validación de ecuaciones antropométricas de pliegues cutáneos frente a hidrodensitometría en 52 mujeres de Medellín; es nutrición y composición corporal, sin relación con gemelos digitales, IoT, transferencia tecnológica ni recuperación empresarial."
cluster_tema: "Nutrición: validación de ecuaciones de pliegues cutáneos"
metodo_tipo: "Estudio descriptivo de corte transversal de validación contra método de referencia (hidrodensitometría)"
tipo_recurso: "Artículo científico (investigación original, journal peer-reviewed)"
kw_inferidas: [composición corporal, pliegues cutáneos, hidrodensitometría, porcentaje de grasa, validación, Bland-Altman, mujeres, Jackson y Pollock, Durning y Womersley, Ramírez y Torun]
c2:
  objetivo: >
    Validar mediante hidrodensitometría (método de referencia basado en pesaje hidrostático con medición simultánea del volumen pulmonar residual) las ecuaciones de pliegues cutáneos de Durning/Womersley, Jackson/Pollock y Ramírez/Torun para estimar el porcentaje de grasa corporal en mujeres de 18 a 40 años de Medellín (Colombia), y establecer si sus resultados son comparables e intercambiables con los del método de referencia, dado que en la población colombiana esas ecuaciones no se habían contrastado con un método de referencia en una muestra de mujeres voluntarias de la Universidad de Antioquia.
  pregunta: >
    [INFERIDA] ¿Concuerdan las estimaciones del porcentaje de grasa obtenidas con tres ecuaciones de pliegues cutáneos con las obtenidas por hidrodensitometría en mujeres adultas jóvenes colombianas, y son intercambiables con ese método?
  marco: >
    El marco es la antropometría y la composición corporal. La hidrodensitometría se toma como método de referencia con un modelo de dos componentes (masa grasa de 0,900 g/ml y masa libre de grasa de 1,100 g/ml) y la ecuación de Siri para convertir densidad en porcentaje de grasa. Las ecuaciones de pliegues relacionan la suma de pliegues con la densidad corporal y son específicas de población por edad, sexo y grupo étnico, por lo que deben validarse antes de aplicarse. Se contrastan ecuaciones derivadas de mujeres estadounidenses (Jackson/Pollock, n = 249), escocesas (Durning/Womersley, n = 272) y guatemaltecas (Ramírez/Torun, n = 83). La metodología de validación sigue a Bellido y emplea el método de Bland y Altman.
  metodologia: >
    Estudio descriptivo de corte transversal con muestra por conveniencia de 58 mujeres voluntarias, estudiantes y empleadas de la Universidad de Antioquia, de 18 a 40 años, sin cirugías de reducción de grasa ni implantes de silicona; 52 completaron todas las pruebas. Con ayuno de al menos cuatro horas, se midieron peso, estatura, perímetro de cadera y pliegues cutáneos (calibrador Harpenden) por duplicado. El pesaje hidrostático se hizo al final de una espiración máxima en un tanque a 36 grados, con báscula Chatillon y volumen pulmonar residual por barrido de nitrógeno (espirómetro VMAX 22), repetido hasta lograr variación de la densidad de 0,002 g/ml o menos, con descuento de 0,1 L de gas intestinal. El porcentaje de grasa se calculó con la ecuación de Siri y con las tres ecuaciones de pliegues. El análisis incluyó t de Student pareada, correlación de Pearson, coeficiente de correlación intraclase (CCI), límites de concordancia de Bland y Altman y pruebas de normalidad (Kolmogorov-Smirnov) y de homogeneidad de varianzas (Levene), con SPSS 13.0. Se consideró clínicamente relevante un CCI superior a 0,6. El estudio fue de riesgo mínimo con consentimiento informado.
  resultados: >
    El porcentaje de grasa fue 29,6 ± 5,8 por hidrodensitometría, 34,2 ± 4,5 por Durning/Womersley, 25,7 ± 5,6 por Jackson/Pollock y 32,0 ± 5,3 por Ramírez/Torun; las diferencias medias respecto del método de referencia fueron de -4,67, 3,81 y -2,49 puntos, todas significativas. La correlación de Pearson con la hidrodensitometría fue 0,626, 0,717 y 0,676; el error estándar del estimado, 4,16 %, 3,72 % y 3,94 %; el CCI, 0,426, 0,578 y 0,612. Los límites de concordancia con la hidrodensitometría fueron -13,25 a 3,90 (Durning/Womersley), -4,44 a 12,06 (Jackson/Pollock) y -11,00 a 6,03 (Ramírez/Torun), con amplitud de 16,5 a 17,1 puntos. Entre las ecuaciones, las correlaciones fueron superiores a 0,87 y los CCI de 0,36 a 0,80. El porcentaje de grasa no se correlacionó con la edad (p = 0,339) ni con la estatura (p = 0,084) y sí con el peso, el IMC y los pliegues; el 25 % de las mujeres con IMC adecuado tenía exceso de grasa y el 7,7 % de las de sobrepeso eran obesas por porcentaje de grasa. El texto atribuye la sobreestimación de Durning/Womersley al pliegue ileocrestal (33,7 mm frente a 19,1 mm de las mujeres originales), y la subestimación de Jackson/Pollock a menor grasa en el muslo y mayor supraespinal.
  discusion: >
    Los autores concluyen que las tres ecuaciones tienen pobre validez, con diferencias significativas, baja concordancia y límites amplios, de modo que sus resultados no son comparables ni intercambiables con la hidrodensitometría, aunque la de Ramírez/Torun fue la mejor, quizá porque la población guatemalteca de origen mestizo se parece más a la colombiana. Atribuyen las diferencias a patrones de distribución de grasa y a la especificidad poblacional de las ecuaciones. Recomiendan usar las ecuaciones más para seguimiento que para decisiones clínicas y plantean desarrollar ecuaciones específicas para la población colombiana. Reconocen implícitamente la validez limitada del IMC. Dejan sin discutir la muestra pequeña y de conveniencia, las limitaciones de la hidrodensitometría como referencia (modelo de dos componentes), la repetibilidad del medidor de pliegues y la clasificación inconsistente de las ecuaciones como buenas según Lohman y pobres según Bland y Altman.
  limitaciones: "No declaradas formalmente. El texto indica que el estudio es el punto de partida y que se necesitan estudios en otros grupos de edad y sexo; no discute el tamaño de la muestra de 52 mujeres ni su selección por conveniencia."
  futuro: "Validar ecuaciones de pliegues en diferentes grupos de edad y sexo, evaluar otros métodos de campo (impedancia bioeléctrica y luz infrarroja) y desarrollar ecuaciones y metodologías específicas para la población colombiana por etnia y nivel de actividad física (p. 8)."
c3:
  tesis: >
    Las ecuaciones de pliegues cutáneos de Durning/Womersley, Jackson/Pollock y Ramírez/Torun no estiman con validez suficiente el porcentaje de grasa de mujeres colombianas de 18 a 40 años frente a la hidrodensitometría, por lo que no son intercambiables con ese método ni adecuadas para decisiones clínicas individuales.
  antitesis: >
    La validación se basa en 52 mujeres universitarias de Medellín seleccionadas por conveniencia, con edad media de 28 años, de modo que la conclusión sobre 'nuestra población' no se generaliza a otras edades, etnias o regiones. La hidrodensitometría de dos componentes, usada como patrón, asume densidades constantes de la masa grasa y libre de grasa, supuesto que varía con la etnia y la hidratación; por tanto, parte de la discrepancia puede deberse al método de referencia. La interpretación es inconsistente: se clasifican las ecuaciones de Jackson/Pollock y Ramírez/Torun como buenas según el error estándar (3,72 % y 3,94 %) y a la vez como de pobre validez, y se declara pobre validez con CCI de 0,43 a 0,61 sin intervalos de confianza. Los valores de p se reportan como 0,000, y el IMC aparece con desviaciones de 4,0 y 2,8. La ecuación de Siri se escribe con una forma incorrecta (4,95/(Dc-4,50)).
  sintesis: >
    El estudio muestra con un método de referencia que las ecuaciones evaluadas producen sesgos de -4,7 a +3,8 puntos y límites de concordancia de unos 17 puntos en mujeres colombianas jóvenes, lo que obliga a la cautela en su uso clínico. La síntesis propone interpretar el hallazgo como evidencia de sesgo sistemático por ecuación y de imprecisión individual, ampliar la muestra y la diversidad etaria y étnica, usar un modelo de cuatro componentes como referencia y desarrollar una ecuación local con validación cruzada. Para el corpus, el documento es ajeno al dominio de tecnología y recuperación productiva, y aporta un ejemplo de validación contra un patrón de referencia con análisis de concordancia.
  areas_grises:
    - "Tamaño y selección de la muestra: 52 mujeres voluntarias de una universidad, por conveniencia, con edad media de 28 años y IMC medio inferior al nacional (22,3 frente a 24,6 en la encuesta nacional), de modo que los resultados no son extrapolables a mujeres con otras edades, ocupaciones, etnias o niveles de adiposidad."
    - "Calidad del método de referencia: la hidrodensitometría de dos componentes asume densidades constantes de los componentes y no se contrasta con otros métodos; no se reporta variación intraindividual de la densidad ni el efecto de la hidratación o la fase del ciclo menstrual sobre la masa libre de grasa."
    - "Interpretación contradictoria: las ecuaciones de Jackson/Pollock y Ramírez/Torun se califican como buenas por el error estándar de estimación según Lohman, y como de pobre validez por el CCI y el intervalo de Bland y Altman; los autores no explican qué criterio prevalece ni fijan límites de aceptación clínicos a priori."
    - "Errores de reporte: p igual a 0,000 en lugar de p menor de 0,001, desviación del IMC de 4,0 en el cuadro y 2,8 en el texto, ecuación de Siri mal escrita, y correlaciones descritas como 'r menor de 0,72' mientras el resumen dice entre 0,62 y 0,72; estos errores merman la confianza en la transcripción de resultados."
  puntos_oscuros: >
    El texto sostiene que la ecuación de Durning/Womersley sobreestima por la acumulación de grasa en la cresta ilíaca, que contribuye con 40 % de la suma de pliegues, y a la vez que ese pliegue es el peor correlacionado con la grasa (r = 0,508). Esa explicación es plausible, pero no se prueba: no se reajusta la ecuación sin ese pliegue ni se compara el error. También se interpreta que la mejor concordancia de Ramírez/Torun se debe a que las guatemaltecas son semejantes a las colombianas en grasa y pliegues, pero las comparaciones de medias (p de 0,1396 a 0,9217) no demuestran equivalencia; la ausencia de diferencia significativa con 52 mujeres puede reflejar poca potencia. Además, el sesgo y los límites de concordancia no se evalúan contra el nivel de grasa (patrón proporcional): una ecuación puede sobreestimar a las mujeres delgadas y subestimar a las obesas, y el artículo solo ofrece gráficos globales. Por último, la afirmación de que el 25 % de las mujeres con IMC adecuado tienen exceso de grasa depende de un punto de corte de 31 % que se aplica a una grasa estimada con error de 5 puntos.
  ideas:
    - "Validación con modelo de cuatro componentes y muestra diversa: repetir la comparación en al menos 200 mujeres y hombres de varias edades, etnias y regiones, usando como referencia un modelo de cuatro componentes (densidad, agua corporal y mineral óseo) o absorciometría de rayos X de doble energía, y evaluar sesgo proporcional con regresión de la diferencia sobre el promedio. Fundamento: el estudio emplea 52 mujeres y una referencia de dos componentes. Verificabilidad: cálculo de muestra para límites de concordancia y análisis de Bland y Altman con intervalos de confianza de los límites. Utilidad: define si hay ecuaciones locales utilizables en clínicas, gimnasios y encuestas, y evita decisiones nutricionales basadas en estimaciones con error de 17 puntos."
    - "Desarrollo de una ecuación local con validación cruzada: ajustar un modelo de regresión del porcentaje de grasa de referencia sobre pliegues y perímetros seleccionados en una muestra de desarrollo, y validarlo con partición en una muestra independiente y validación cruzada por exclusión de uno, reportando error estándar, sesgo y límites. Fundamento: los autores proponen ecuaciones específicas para la población colombiana pero no las desarrollan, y la ecuación de Ramírez/Torun muestra un error cercano a 4 %. Verificabilidad: división previa de la muestra y registro del protocolo. Utilidad: ofrece al sistema de salud una herramienta de bajo costo con error conocido para la tamización de adiposidad, más sensible que el IMC."
  relaciones:
    - "Ecuación de Durning/Womersley (sobreestima) el porcentaje de grasa en 4,67 puntos respecto de la hidrodensitometría, asociado al pliegue ileocrestal: 33,7 mm frente a 19,1 mm de la población original."
    - "Ecuación de Jackson/Pollock (subestima) el porcentaje de grasa en 3,81 puntos, asociado a menor grasa del muslo y mayor grasa supraespinal en la muestra."
  robustez: [5, 4, 4, 3]
  valor: [2, "Aporta una comparación cuantitativa de tres ecuaciones de pliegues contra hidrodensitometría en mujeres colombianas, con sesgos y límites de concordancia, y recomienda cautela clínica. Está fuera del dominio del corpus de tecnología y recuperación empresarial; su valor es de control negativo temático y como ejemplo de validación de instrumentos frente a un patrón de referencia."]
