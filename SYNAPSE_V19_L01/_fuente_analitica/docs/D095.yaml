socratica:
  p1: "Define validez como concordancia con la hidrodensitometría, medida con diferencias de medias, correlación, CCI y límites de Bland y Altman."
  p2: "Supone que la hidrodensitometría de dos componentes es un patrón de referencia adecuado para esta población y que 52 mujeres representan a las colombianas de 18 a 40 años."
  p3: "La evidencia es de 52 mujeres con diferencias de -4,67 a 3,81 puntos, CCI de 0,43 a 0,61 y límites de unos 17 puntos de amplitud."
  p4: "Si es cierto, las ecuaciones no deben usarse para decisiones clínicas individuales; si es falso, se descartan herramientas útiles de bajo costo para tamización."
  p5: "No se examinan mujeres de otras edades o etnias, hombres ni la repetibilidad entre medidores de pliegues."
  p6: "Hipótesis rivales: el sesgo se debe a la referencia de dos componentes; la muestra de conveniencia universitaria no representa la población general."
