socratica:
  p1: '''Resiliencia'' es la integral de la funcionalidad del puente en un horizonte de tiempo; ''funcionalidad'' va de 0 a 1 y cae al ocurrir el sismo según la pérdida total; ''RBCBR'' es la ganancia de resiliencia dividida por la razón del costo del refuerzo respecto del costo de reemplazo; ''tiempo de control'' es el horizonte de evaluación definido por el decisor.'
  p2: Supone que la funcionalidad de tráfico representa el beneficio, que una función exponencial describe la recuperación, que los tiempos de recuperación del manual valen para Charleston y que el horizonte de control es igual al tiempo de recuperación.
  p3: La evidencia son las curvas de fragilidad de Padgett, los costos de refuerzo de Padgett et al., ocho tablas de resultados, diagramas de tornado y 32 combinaciones de muestreo por refuerzo, sin datos de recuperación del puente estudiado.
  p4: Si es cierto, la inversión en refuerzo se prioriza por la ganancia de funcionalidad por dólar; si es falso, la elección puede variar con el horizonte de control y con pérdidas de actividad económica que no se modelaron.
  p5: No se examinan pérdidas de empresas, datos de recuperación del propio puente, beneficios de vidas, efectos de red ni un análisis de ciclo de vida.
  p6: 'Alternativas: que una razón de pérdidas esperadas evitadas por costo conduzca a la misma elección; que la logística de reparación determine el tiempo de recuperación más que el daño; que el refuerzo de la red sea más rentable que el de un puente.'
