falacias:
- - Validación circular
  - El parámetro lambda se ajusta a las curvas de recuperación con las que luego se declara validado el modelo (Sec. 2.3, p. 6)
  - El acuerdo está garantizado por construcción
- - Contraste con la literatura presentado como validación
  - La coincidencia con el estudio de Padgett et al. sobre el mejor refuerzo se usa para validar la metodología (Sec. 3.2.3, p. 13)
  - Un solo resultado coincidente no valida el modelo
- - Justificación ad hoc de un resultado desfavorable
  - Los valores negativos se atribuyen a beneficios no cuantificados que tampoco se cuantifican para las demás medidas (Sec. 3.2.3, p. 13)
  - Asimetría en el tratamiento de beneficios
recomendacion: Aceptar con reservas
