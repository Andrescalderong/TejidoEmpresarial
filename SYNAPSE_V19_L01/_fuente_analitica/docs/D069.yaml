doc_id: D069
relevancia: Adyacente
relevancia_just: Propone un análisis costo-beneficio basado en resiliencia sísmica probabilística para elegir el refuerzo más rentable de un puente, con un modelo de funcionalidad que usa funciones de recuperación exponenciales, tiempos de recuperación por estado de daño y pérdidas indirectas por desvío (hasta 80 veces las directas). Aporta una formulación explícita de cómo el tiempo de recuperación se convierte en beneficio económico de un refuerzo, pertinente para la continuidad posterremoto, pero trata un puente aislado, no usa gemelos digitales ni IoT y no estima pérdidas de empresas.
cluster_tema: Resiliencia sísmica, tiempo de recuperación y análisis costo-beneficio de refuerzos de puentes
metodo_tipo: Modelo analítico probabilístico de resiliencia y costo-beneficio con fragilidad de la literatura, caso de estudio de un puente, análisis de sensibilidad por diagramas de tornado y muestreo de hipercubo latino
tipo_recurso: Artículo científico (journal peer-reviewed)
