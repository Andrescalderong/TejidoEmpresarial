c2:
  objetivo: 'Explorar un modelo probabilístico de costo-beneficio basado en resiliencia que permita identificar las mejores medidas de refuerzo sísmico para puentes, en el cual el incremento de resiliencia se considera el beneficio del refuerzo. Los autores proponen además un modelo de evaluación de la funcionalidad del puente, basado en pérdidas sísmicas y funciones de recuperación exponenciales, lo validan con datos de campo de la recuperación posterremoto de puentes y lo aplican a un puente de vigas de concreto simplemente apoyadas de varios tramos sin diseño sísmico, ubicado en Charleston, con siete medidas de refuerzo, para comparar su costo-efectividad.

    '
  pregunta: 'El artículo no formula preguntas de investigación explícitas. Las preguntas implícitas son cuál refuerzo es más rentable cuando el beneficio se mide por el incremento de resiliencia y no solo por pérdidas esperadas, cómo varía la elección con la intensidad del suelo, y qué parámetros inciertos dominan la incertidumbre de la razón costo-beneficio.

    '
  marco: 'El marco combina la teoría de resiliencia sísmica, entendida como la integral de la funcionalidad en un horizonte de tiempo, con el análisis costo-beneficio. Los autores sostienen que los métodos previos solo consideran la dimensión económica y no capturan la reducción de probabilidades de falla, de consecuencias socioeconómicas y de tiempo de recuperación, y adoptan las cuatro dimensiones técnica, organizacional, social y económica de la resiliencia. La funcionalidad combina dos componentes ponderados con funciones de recuperación exponenciales, la pérdida inicial se obtiene de curvas de fragilidad y de pérdidas directas e indirectas, y el tiempo de recuperación por estado de daño sigue distribuciones normales tomadas del manual de pérdidas sísmicas. La razón costo-beneficio basada en resiliencia (RBCBR) es la ganancia de resiliencia dividida por la razón de costo del refuerzo respecto del costo de reemplazo del puente.

    '
  metodologia: 'El modelo calcula la resiliencia como la integral de la funcionalidad Q(t) sobre un horizonte de control, con funcionalidad inicial igual a uno menos la pérdida total, que suma la pérdida directa, ponderada por razones de daño de 0,03, 0,08, 0,25 y 2 sobre el número de tramos, y la pérdida indirecta, calculada con costos de operación vehicular por desvío y valor del tiempo de adultos y camiones. Los parámetros de las funciones de recuperación se obtuvieron ajustando la constante lambda de modo que la resiliencia del modelo iguale la de las curvas bilineales de recuperación de puentes medianos chinos en seis niveles de intensidad sísmica, con valores de 4,948 a 2,363. Las curvas de fragilidad del puente original y de siete medidas de refuerzo provienen de Padgett, los costos se tomaron de Padgett et al., y el costo de reemplazo es de 483 814 dólares de 2019. Se evaluaron diez valores de aceleración de 0,1 a 1,0 g y el peligro de Charleston con tres probabilidades de excedencia
    en 50 años (0,2453, 0,4651 y 0,8676 g). La sensibilidad se estudió con diagramas de tornado para el costo de refuerzo, el tiempo de control y los tiempos de recuperación, y la incertidumbre con 32 combinaciones de hipercubo latino por refuerzo, ajuste normal e intervalos de confianza de 90 %.

    '
  resultados: 'Los resultados indican que, salvo las llaves de cortante, todas las medidas elevan la resiliencia entre 0,2 y 1,0 g, y que la medida con mayor resiliencia depende de la intensidad: los aislantes elastoméricos a 0,2 g y las camisas de acero a 0,4 g, con aumentos de resiliencia de las camisas de 2,4 %, 4,2 % y 1 % a 0,2, 0,4 y 1,0 g. Las razones de costo de refuerzo respecto del costo de reemplazo son 12,57 % para camisas de acero, 4,99 % para aislantes, 3,94 % para cables de retención, 3,14 % para extensores de apoyo, 8,12 % para llaves de cortante y 11,26 a 12,06 % para las combinaciones. Las pérdidas indirectas resultan entre 6 y 80 veces mayores que las directas y crecen con la intensidad. Los extensores de apoyo alcanzan una razón costo-beneficio de 0,521 a 0,2 g, 0,543 a 0,4 g y 0,164 a 0,8 g, la más alta de 0,2 a 1,0 g, y los aislantes alcanzan 0,255 a 0,1 g. Con el peligro de Charleston, el mejor refuerzo es el de extensores de apoyo, seguido de los aislantes. El tiempo
    de recuperación y el tiempo de control son los parámetros dominantes de la incertidumbre y el costo del refuerzo es despreciable, y la razón costo-beneficio de los extensores tiene media de 4,492 con intervalo de 90 % de 3,030 a 5,954 y la de las llaves de cortante es negativa. Los valores medios de la Tabla 9 son de 1,4 a 4,5, mientras que los de la Tabla 7 a intensidades cercanas son menores que 0,6, y el texto no explica la diferencia.

    '
  discusion: 'Los autores sostienen que el análisis basado en resiliencia identifica una estrategia distinta de la que se obtendría solo con resiliencia, porque a 0,4 g las camisas de acero dan la mayor resiliencia pero los extensores son los más rentables, y que el costo del refuerzo no puede ignorarse. Explican que las llaves de cortante y los cables aumentan la vulnerabilidad de columnas y estribos, y que los valores negativos de la razón no implican inviabilidad porque no se cuantifican beneficios como vidas salvadas, vehículos y limpieza evitados. Señalan consideraciones prácticas, como la complejidad del diseño de los extensores, el cierre temporal que exigen los aislantes y la corrosión y la socavación de las camisas, y sostienen que el método puede extenderse a carteras de edificios, redes de carreteras y comunidades. Reconocen que los resultados son específicos del puente de estudio y proponen un análisis de costo-beneficio de ciclo de vida como trabajo futuro.

    '
  limitaciones: 'Declaradas: los resultados de mejor refuerzo, parámetros dominantes e incertidumbres son específicos del puente del caso, y se requiere un análisis de una población grande de puentes en todas las intensidades; el trabajo futuro debe incluir el ciclo de vida. No declaradas: la validación del modelo ajusta la constante lambda a las mismas curvas de recuperación con las que se compara, de modo que no es una validación independiente; las curvas de fragilidad y los costos proceden de otros estudios y no se recalculan; el horizonte de control iguala el tiempo de recuperación de cada puente, lo que hace que la resiliencia dependa de ese horizonte; los tiempos de recuperación vienen de un manual genérico; el tamaño de muestra de 32 combinaciones es pequeño; los desvíos, el tráfico y el valor del tiempo son valores supuestos o de un solo estudio; las pérdidas indirectas incluyen solo costos de desvío y de tiempo y no la interrupción de empresas, pese a que el texto la menciona; el
    beneficio de vidas y daños evitados queda fuera de la razón; las Tablas 7 y 9 no concuerdan en magnitud; los autores no estudian la distribución espacial de pérdidas ni efectos de red.'
  futuro: 'Explícito: análisis de costo-beneficio basado en resiliencia en el ciclo de vida, análisis de una población grande de puentes en todas las intensidades y extensión a carteras de edificios, redes de carreteras y comunidades, y a otros peligros como inundaciones y huracanes. Implícito: mejores modelos de tiempo de recuperación y de tiempo de control, y datos de recuperación de puentes reales.'
c3:
  tesis: 'Medir el beneficio de un refuerzo sísmico por el aumento de resiliencia, y no solo por pérdidas económicas evitadas, permite elegir mejor entre medidas alternativas, porque la ganancia de funcionalidad depende del tiempo de recuperación y de las pérdidas indirectas, que son entre 6 y 80 veces las directas; para un puente de tres tramos de 48,8 m en Charleston, los extensores de apoyo (3,14 % del costo de reemplazo) son la medida más rentable, seguidos de los aislantes, y el tiempo de recuperación y el horizonte de control dominan la incertidumbre.

    '
  antitesis: 'La razón propuesta es sensible a un horizonte de control que los autores igualan al tiempo de recuperación, por lo que la resiliencia y la razón dependen de una decisión de modelación y no de una propiedad del puente. La validación ajusta lambda con los mismos datos que dice reproducir, y el acuerdo con un estudio previo no sustituye datos independientes. Las pérdidas indirectas se reducen a costos de desvío y de tiempo, sin pérdidas empresariales ni de cadenas de suministro, y los tiempos de recuperación provienen de un manual genérico. El tamaño de muestra es de 32 combinaciones, los valores negativos se justifican con beneficios no calculados y las Tablas 7 y 9 no son consistentes. Un solo puente y fragilidades prestadas limitan la generalización.

    '
  sintesis: 'La contribución sostenible es una formulación transparente que conecta la fragilidad, el tiempo de recuperación, las pérdidas indirectas y el costo del refuerzo en una razón comparable, y que muestra que el tiempo de recuperación y el horizonte de control dominan la decisión. Para el corpus, importa porque explicita cómo el tiempo de recuperación se traduce en beneficio económico y porque identifica ese tiempo como el parámetro más incierto, lo cual da un lugar natural a los gemelos digitales y a la medición con IoT. No obstante, la razón depende de supuestos de modelación y de datos genéricos, no incluye pérdidas de empresas y debe calibrarse con tiempos de recuperación observados y con pérdidas de actividad económica para ser útil a la continuidad empresarial.

    '
  areas_grises:
  - 'Horizonte de control: la resiliencia se calcula como la integral de la funcionalidad dividida por un horizonte que, en el caso base, se iguala al tiempo de recuperación de cada puente; así, un puente que se recupera más rápido tiene un horizonte menor, y la comparación entre refuerzos depende de ese supuesto, que además aparece como el segundo parámetro de mayor incertidumbre con media de 22 días y desviación de 10 días.'
  - 'Alcance de las pérdidas indirectas: el texto menciona interrupción de negocios, reubicación y retraso de tráfico como componentes de la pérdida indirecta, pero las ecuaciones solo calculan costos de operación vehicular por desvío y valor del tiempo (con 15 640 vehículos diarios, 15 km de desvío supuestos y valores de tiempo de 7,05 y 20,56 dólares por hora), de modo que la pérdida de empresas no se modela.'
  - 'Validez de la validación: el parámetro lambda se ajusta para igualar la resiliencia de curvas de recuperación de puentes medianos chinos, de modo que el acuerdo con esas curvas está garantizado por construcción; la evidencia de contraste independiente se limita a la coincidencia con el estudio de Padgett et al. sobre el mejor refuerzo.'
  - 'Coherencia entre tablas: las razones costo-beneficio de la Tabla 7 a intensidades de 0,4 y 0,5 g son de 0,543 y 0,342 para los extensores, mientras que la media del muestreo de la Tabla 9 a 0,4651 g es de 4,492 con intervalo de 3,030 a 5,954; el texto no explica la diferencia de magnitud, que impide interpretar los valores absolutos.'
  puntos_oscuros: 'Llama la atención que la sensibilidad concluya que el costo del refuerzo es despreciable para la incertidumbre cuando el estudio le asigna un coeficiente de variación de 0,5, y que a la vez el costo sea el denominador de la razón. También es notable que se describan como no concluyentes los valores negativos de los cables de retención y las llaves de cortante porque no se contabilizaron beneficios como vidas salvadas y limpieza evitada, siendo que esos beneficios tampoco se cuantificaron para las demás medidas. El texto declara que el método permite capturar la dimensión social y organizacional de la resiliencia, aunque la única variable es la funcionalidad de tráfico. Además, los tiempos de recuperación de 0,6, 2,5, 75 y 230 días para los cuatro estados de daño se toman de un manual, y las curvas de recuperación chinas corresponden a un contexto distinto de Charleston. La calibración de lambda produce valores casi idénticos (4,948, 4,948 y 4,947) para tres niveles de
    intensidad, lo que sugiere poca sensibilidad de los datos. Por último, la muestra de 32 combinaciones por refuerzo se usa para afirmar una distribución normal con pruebas de bondad de ajuste sin reportar sus estadísticos.

    '
  ideas:
  - 'Razón costo-beneficio con pérdidas empresariales: sustituir las pérdidas indirectas de desvío por la pérdida de ingresos de las empresas que dependen del puente, estimada con datos de ventas, número de empleados y dependencia de la ruta de una muestra de 50 a 100 empresas de la zona, y recalcular la razón de los siete refuerzos con tiempos de recuperación de eventos pasados. El resultado mostraría si el orden de las medidas cambia cuando se incluye la actividad económica y qué fracción del beneficio corresponde a empresas pequeñas, información para priorizar inversiones con criterios de continuidad productiva. El análisis se repetiría con y sin la actividad económica para medir el cambio de orden.'
  - 'Tiempo de recuperación medido por gemelos digitales: instrumentar con sensores de bajo costo un puente de una ruta crítica, actualizar un gemelo con datos de tráfico y deformaciones, y comparar los tiempos de recuperación predichos con el modelo en simulacros y en eventos menores con los registrados, ajustando la distribución de recuperación y el horizonte de control. Con 30 a 50 eventos de calibración se podría reducir la incertidumbre dominante del modelo y medir cuánto cambia la elección del refuerzo, de modo que el gemelo funcione como instrumento de decisión de inversión y no solo de monitoreo. Los resultados se compartirían con la autoridad vial.'
  relaciones:
  - 'Tiempo de recuperación y funcionalidad (complementa) D053: D053 estima el tiempo de recuperación funcional con modelos probabilísticos; D069 aporta el vínculo con el beneficio económico del refuerzo y muestra que ese tiempo domina la incertidumbre.'
  - 'Refuerzo y cierre (corrige) D040, D054 y D067: D040 y D054 evalúan refuerzos sin el tiempo de cierre y D067 estima días de recuperación sin costos; D069 integra ambos, aunque solo para tráfico de un puente.'
