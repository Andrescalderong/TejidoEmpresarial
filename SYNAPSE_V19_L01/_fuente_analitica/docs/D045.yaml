doc_id: D045
relevancia: "Adyacente"
relevancia_just: "Revisión sistemática de 59 artículos sobre sistemas de alerta temprana sísmica con sensores de movimiento del suelo de bajo costo (MEMS), con una clasificación por tipo de aviso y por algoritmo y con desafíos para países de recursos limitados. Aporta la capa de sensado e IoT de bajo costo que alimentaría un gemelo o un sistema de continuidad, y menciona acciones automáticas como apagar maquinaria, pero no trata empresas ni recuperación."
cluster_tema: "Alerta temprana sísmica de bajo costo con sensores MEMS (revisión)"
metodo_tipo: "Revisión sistemática de literatura (Scopus y Web of Science, 59 artículos) con clasificación propuesta y síntesis cualitativa"
tipo_recurso: "Artículo de revisión (journal peer-reviewed, acceso abierto)"
kw_inferidas: [alerta temprana sísmica, sensores MEMS, bajo costo, acelerómetros, redes de sensores, ciencia ciudadana, procesamiento en el nodo, algoritmos basados en movimiento del suelo, resiliencia sísmica, países en desarrollo]
c2:
  objetivo: >
    Revisar de manera sistemática los métodos y enfoques para construir sistemas de alerta temprana sísmica (EEWS) de bajo costo con sensores de movimiento del suelo basados en sistemas microelectromecánicos (MEMS) en distintos territorios, proponer una clasificación de estos sistemas según el tipo de aviso y el algoritmo utilizado, resumir las implementaciones existentes, discutir los desafíos de su implementación y mantenimiento y proponer áreas de investigación futura. La motivación es que el costo de sensores de gama alta impide que muchos países sísmicos dispongan de un sistema de alerta.
  pregunta: >
    El artículo formula tres preguntas: cómo clasificar los EEWS de bajo costo con sensores MEMS; cuáles son los EEWS de bajo costo ya implementados en el mundo; y cuáles son las limitaciones, desafíos y áreas de investigación futura en este dominio. La primera es conceptual, la segunda descriptiva y la tercera prospectiva, sin comparación cuantitativa de desempeño entre sistemas.
  marco: >
    El marco distingue los sensores por clases de adquisición de datos de movimiento fuerte (A a D, según resolución y rango dinámico) y los sistemas por costo, entre EEWS convencionales de gama alta, con costo de millones de dólares, y EEWS de bajo costo, con costo de miles de dólares. La clasificación propuesta separa los sistemas en 'en sitio' (un solo sensor) y regionales (red de sensores), y los regionales según el algoritmo: basados en la fuente (puntual o de falla finita) y basados en el movimiento del suelo (como el algoritmo PLUM). Se añade la distinción entre etapa experimental y etapa de generación de alertas públicas.
  metodologia: >
    La búsqueda se hizo en Scopus y Web of Science el 30 de marzo de 2022, con combinaciones de 'earthquake early warning' y alternativas de 'low-cost' (MEMS, teléfono inteligente, ciencia ciudadana, económico), para artículos posteriores a septiembre de 2009, revisados por pares, en inglés y con texto completo; se excluyó literatura gris. La búsqueda produjo 354 registros y 218 únicos. La revisión manual de resúmenes excluyó trabajos con sensores distintos de MEMS (fibra óptica, satélite), detección de otros desastres o monitoreo estructural, encuestas de percepción, teléfonos usados solo para notificar y artículos sin información suficiente. Quedaron 59 artículos. Los datos se extrajeron en una hoja de cálculo y se analizaron por comparación constante de nombrado y clasificación, sin evaluación de calidad ni de sesgo de los estudios. El protocolo adopta los pasos de Algiriyage y colaboradores (2022) para establecer preguntas, buscar, excluir, extraer y analizar, y no registra un protocolo previo ni describe si más de una persona realizó el cribado, de modo que la selección de los 59 artículos no puede verificarse de forma independiente.
  resultados: >
    La revisión propone la clasificación por tipo de aviso (en sitio o regional) y por algoritmo (basado en la fuente o en el movimiento del suelo), y resume en tablas los sistemas encontrados y el número de enfoques por categoría. El primer sistema de bajo costo con sensores propios fue SOSEWIN en Alemania (Fleming y colaboradores, 2009), seguido por despliegues en Taiwán, California, Islandia, China y Nueva Zelanda. Los sistemas basados en la fuente puntual saturan para magnitudes mayores que 6 aproximadamente, y hay poca información sobre algoritmos de falla finita en bajo costo. Los algoritmos basados en el movimiento del suelo ganan popularidad por su robustez y rapidez. Se reportan, además, las siguientes limitaciones: procesamiento centralizado, baja densidad de sensores, falsas alarmas por menor calidad de los sensores, dificultad de detección en teléfonos en movimiento y ausencia de soporte multisensor, y desafíos de seguridad de redes para sistemas con participación comunitaria. El artículo resume las implementaciones por país y por etapa (experimental o de generación de alertas públicas), pero no informa tiempos de aviso medidos, tasas de falsas alarmas ni costos totales por sistema, y la distribución de los 59 artículos por categoría se presenta en tablas de lectura parcial.
  discusion: >
    Los autores concluyen que los EEWS de bajo costo con sensores MEMS pueden constituir una solución viable para generar alertas confiables y precisas, en especial para países en desarrollo, y como apoyo a los sistemas de gama alta al aumentar la densidad de sensores. Sostienen que el procesamiento centralizado genera cuellos de botella y plantean tres líneas de investigación: procesamiento descentralizado en el nodo, capacidad multisensor y adopción de algoritmos basados en el movimiento del suelo. Señalan que la participación comunitaria abre vías para sistemas abiertos y colaborativos, con riesgos de seguridad de red, y que el cambio hacia el procesamiento en el nodo reduciría la dependencia de la conectividad central y la latencia, un punto crítico después de un evento.
  limitaciones: "Declaradas: el estudio no analiza cómo se entregan las alertas porque la mayoría de los artículos no describe el método de distribución; se limita a sensores MEMS y a literatura revisada por pares en inglés. No declaradas: sin evaluación de calidad ni de sesgo; solo dos bases de datos; sin comparación cuantitativa de tiempos de aviso, falsos positivos ni costos entre sistemas; la categoría de bajo costo es amplia (miles de dólares) y no se define un umbral; sin evidencia de efecto de los sistemas sobre daños, víctimas o continuidad de actividades; sin análisis de sostenibilidad financiera ni de operación y mantenimiento en la práctica."
  futuro: "Explícito: exploración del procesamiento descentralizado o en el nodo, introducción de soporte multisensor y adopción de algoritmos basados en el movimiento del suelo para generar alertas. Implícito: seguridad de redes en sistemas comunitarios, densificación de sensores y evaluación operativa."
c3:
  tesis: >
    Los sensores MEMS de bajo costo permiten construir sistemas de alerta temprana sísmica confiables y asequibles, útiles en países que no pueden costear redes convencionales y como complemento denso de los sistemas de gama alta; la clasificación por tipo de aviso y algoritmo ordena los enfoques existentes, y el procesamiento en el nodo, la capacidad multisensor y los algoritmos basados en el movimiento del suelo son las áreas prioritarias para mejorar su desempeño.
  antitesis: >
    La revisión no demuestra la fiabilidad que afirma. No compara tiempos de aviso, tasas de falsas alarmas ni tasas de detección entre sistemas, y reconoce que los sensores de menor calidad generan más falsas alertas. Solo usa dos bases de datos, excluye literatura gris (donde se documentan operaciones reales) y no evalúa la calidad de los estudios. Muchos sistemas están en etapa experimental o inicial, y los que generan alertas públicas son pocos. La conclusión de viabilidad para países en desarrollo se infiere del bajo costo de los sensores y no de resultados operativos ni de evaluaciones de sostenibilidad. Tampoco se examinan los usos finales de la alerta, de modo que el beneficio sobre daños evitados no se estima.
  sintesis: >
    La contribución sostenible es un mapa organizado de los enfoques técnicos de EEWS de bajo costo, con una taxonomía útil y una lista de limitaciones técnicas (centralización, densidad, falsas alarmas, multisensor, seguridad). La afirmación de viabilidad debe entenderse como plausibilidad técnica en despliegues piloto, no como demostración operativa, y las cifras de costo son órdenes de magnitud y no presupuestos verificados. Para el corpus, importa entonces como capa de sensado e IoT de bajo costo susceptible de conectarse con acciones automáticas de continuidad (apagar maquinaria, cortar gas), cuya evaluación económica para empresas pequeñas queda abierta y debe abordarse con datos de pérdidas evitadas.
  areas_grises:
    - "Comparabilidad de los sistemas: las tablas resumen sistemas por tipo de aviso y algoritmo, pero no reportan tiempos de aviso, tasas de detección ni de falsas alarmas con definiciones homogéneas, de modo que no se puede ordenar los sistemas por desempeño y la conclusión de confiabilidad queda sin respaldo cuantitativo."
    - "Definición de bajo costo: el texto contrasta costos de millones de dólares con miles de dólares y usa clases de sensores A a D, pero no establece un umbral ni incluye costos de operación, mantenimiento, comunicaciones y personal, lo que afecta la afirmación de asequibilidad para países en desarrollo."
    - "Alcance de la evidencia: la revisión excluye literatura gris, informes gubernamentales y estudios en otros idiomas, y se limita a artículos con información técnica; los sistemas operativos con menos publicación académica pueden quedar subrepresentados."
    - "Uso de la alerta: el estudio no analiza cómo se distribuye la alerta ni qué acciones siguen, aunque menciona la posibilidad de detener trenes, apagar maquinaria y cerrar válvulas de gas; no hay evidencia de pérdidas evitadas ni de adopción por empresas."
  puntos_oscuros: >
    Llama la atención que la revisión concluya la viabilidad de sistemas confiables sin comparar tasas de falsas alarmas, aunque reconoce que los sensores de menor calidad son más propensos a ellas. También es notable que el análisis excluya cómo se entregan las alertas, que es el eslabón que decide el valor del sistema, con el argumento de que los artículos no lo describen. La clasificación se presenta como contribución principal, pero la Tabla 1 muestra pocos enfoques en algunas categorías (por ejemplo, de falla finita), lo que sugiere que la taxonomía es más amplia que la evidencia disponible. Además, el texto señala que los EEWS no ofrecen aviso en la zona cercana al epicentro (zona ciega) y propone sistemas en sitio para cubrirla, sin presentar resultados de desempeño. Finalmente, no se menciona ninguna evaluación económica del beneficio de la alerta para actividades productivas, pese a que se cita la posibilidad de apagar maquinaria para reducir pérdidas.
  ideas:
    - "Valor económico del aviso para pymes: combinar los sensores MEMS de bajo costo con un actuador mínimo (corte automático de gas y energía, parada de línea) en una nave industrial, y estimar con simulación de escenarios sísmicos los segundos de aviso por distancia, las acciones posibles y las pérdidas evitadas. El resultado sería una curva costo-beneficio de la alerta para una pyme en zona sísmica, comparable con la inversión en sensores de miles de dólares que reporta la revisión, e incluiría el costo de falsas alarmas (paros innecesarios) como parámetro de sensibilidad. El piloto duraría al menos doce meses para observar eventos menores reales."
    - "Red mixta de sensores como insumo de un gemelo de continuidad: usar la red densa de bajo costo, con procesamiento en el nodo, para alimentar un gemelo que registre intensidad de sacudida por sitio y active listas de inspección priorizadas de instalaciones, y evaluar si reduce el tiempo hasta la decisión de reocupación. Se podría contrastar con una red de gama alta como referencia, midiendo diferencias de intensidad estimada y falsas alarmas, para decidir el compromiso entre densidad y calidad, y se estimaría el costo anual de mantenimiento por nodo para empresas que adopten la red."
  relaciones:
    - "Alerta temprana de bajo costo (profundiza) D044 y D031: D044 enumera usos de IoT sin método, D031 propone una arquitectura semántica con un caso de tsunami, y D045 aporta una taxonomía y un inventario sistemático de EEWS con sensores MEMS."
    - "Sensores de bajo costo en edificios y puentes (complementa) D039 y D034: D039 corrige errores de sincronización en redes inalámbricas de monitoreo estructural y D034 simula daño urbano; D045 aporta la perspectiva de sensado de bajo costo para alerta."
  robustez: [3, 2, 3, 3]
  valor: [5, "Ofrece una taxonomía y un inventario sistemático de EEWS de bajo costo con sensores MEMS, y una lista de limitaciones técnicas y áreas de investigación, útil como referencia para la capa de sensado e IoT de un sistema de continuidad. Su valor es adyacente porque no trata empresas ni recuperación, y se reduce por la falta de comparación cuantitativa de desempeño, la exclusión de literatura gris y de la entrega de alertas, y la ausencia de evaluación económica."]
  conexiones: []
socratica:
  p1: "'Bajo costo' es un sistema con sensores de clase C o D, de miles de dólares; 'en sitio' es un sistema de un sensor; 'regional' es una red; 'basado en movimiento del suelo' predice la intensidad sin estimar los parámetros de la fuente."
  p2: "Supone que los 59 artículos representan la literatura, que los sensores MEMS pueden detectar con fiabilidad suficiente y que un aviso de segundos es útil para quienes lo reciben."
  p3: "La evidencia es una síntesis cualitativa de 59 artículos, dos tablas de clasificación y una lista de sistemas implementados, sin métricas comparadas."
  p4: "Si es cierto, países y comunidades con pocos recursos pueden desplegar alertas asequibles; si es falso, pueden desplegar sistemas con muchas falsas alarmas y bajo uso."
  p5: "No se examinan costos de operación, falsas alarmas comparadas, entrega de alertas, beneficio económico ni experiencias de abandono de sistemas."
  p6: "Alternativas: que los teléfonos inteligentes o las redes convencionales densificadas resuelvan el aviso; que el cuello de botella sea la entrega y la respuesta del usuario; que los sistemas de bajo costo no logren la calidad exigida."
