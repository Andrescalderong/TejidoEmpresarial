  - Organizaciones de nivel de empresa, 60 % grandes y 17 % pymes
- - TEMP
  - Estudios de 2017 a 2025 y búsqueda de febrero a abril de 2025
- - MET
  - Revisión con umbrales de citación y codificación asistida por un modelo de lenguaje
- - VAR
  - Faltan tiempo de recuperación, costos, resultados de continuidad y medición de habilitadores digitales
- - TEOR
  - Realismo crítico y capacidades dinámicas; sin teoría de recuperación posdesastre físico
- - CAUS
  - Efecto de las prácticas y los habilitadores sobre la resiliencia sin evidencia causal
