doc_id: D082
relevancia: Núcleo
relevancia_just: Revisión sistemática con realismo crítico de 30 estudios empíricos sobre cómo se conceptualiza, se ejecuta y se habilita la resiliencia organizacional en la era digital (IA, IA generativa, IoT, macrodatos y robótica), con diez prácticas de resiliencia, tres mecanismos generativos (capacidad colectiva, adaptativa y dinámica) y un modelo contexto-mecanismo-resultado que desemboca en preparación sistémica, recuperación rápida y estabilidad generativa. Reúne IoT como habilitador, resiliencia empresarial y recuperación, ejes del corpus, aunque no trata gemelos digitales ni sismos, el marco es conceptual y la selección impone umbrales de citación.
cluster_tema: Mecanismos de resiliencia organizacional en la era digital con IoT, IA y datos
metodo_tipo: Revisión sistemática de la literatura con PRISMA 2020 y paradigma de realismo crítico, con síntesis temática asistida por herramienta de IA y construcción de un marco conceptual en tres etapas
tipo_recurso: Artículo de revisión sistemática (journal peer-reviewed, acceso abierto)
