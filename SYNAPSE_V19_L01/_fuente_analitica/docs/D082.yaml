socratica:
  p1: '''Mecanismo generativo'' es un poder causal no observable que produce respuestas organizacionales; ''contexto-mecanismo-resultado'' es una configuración que explica cuándo un mecanismo produce un resultado; ''capacidad colectiva, adaptativa y dinámica'' son los tres mecanismos del modelo; ''resiliencia organizacional'' es la capacidad de anticipar, responder y recuperarse manteniendo la funcionalidad.'
  p2: Supone que 30 estudios filtrados por citación representan el campo, que las diez prácticas hipotetizadas agotan el fenómeno, que la codificación asistida es fiable y que la salience temática indica relevancia.
  p3: La evidencia son 30 estudios empíricos de 29 revistas, frecuencias de prominencia de diez prácticas, una síntesis temática y una discusión de tensiones, sin datos primarios ni pruebas del modelo.
  p4: Si es cierto, las empresas deben invertir en configuraciones de liderazgo, redundancia, coordinación y habilitadores digitales y no en tecnología aislada; si es falso, el marco puede ser una clasificación sin poder explicativo.
  p5: No se examinan efectos medidos de recuperación, empresas pequeñas afectadas por desastres, estudios sin umbral de citación, la fiabilidad de la codificación asistida ni la dinámica durante el evento.
  p6: 'Alternativas: que la resiliencia dependa más de recursos financieros y de redes que de las prácticas; que el efecto de los habilitadores digitales sea indirecto y pequeño; que las prácticas sean consecuencia de la resiliencia previa.'
