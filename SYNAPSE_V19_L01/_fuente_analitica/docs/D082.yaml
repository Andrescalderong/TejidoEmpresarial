c2:
  objetivo: 'Examinar cómo se conceptualiza, se ejecuta y se habilita la resiliencia organizacional en la era digital, caracterizada por la inteligencia artificial (IA), la IA generativa, el Internet de las cosas (IoT), los macrodatos y la robótica, y construir un marco conceptual y un modelo explicativo con lógica contexto-mecanismo-resultado. Los autores sostienen que estas tecnologías se tratan con frecuencia como herramientas periféricas y no como mecanismos centrales de las arquitecturas de resiliencia, y que falta una explicación integrada de cómo interactúan los mecanismos tecnológicos con las estructuras organizacionales para generar resultados de resiliencia.

    '
  pregunta: 'Las tres preguntas de investigación son: RQ1, cómo representa la literatura la comprensión de líderes y empleados sobre la influencia de las tecnologías de la era digital en la resiliencia organizacional; RQ2, qué mecanismos, prácticas y condiciones organizacionales habilitan el desarrollo y el sostenimiento de capacidades de resiliencia en un entorno tecnológicamente dinámico; y RQ3, qué adaptaciones estructurales y de capacidades reflejan cómo las organizaciones usan IA, IA generativa, IoT, robótica y tecnologías basadas en datos para fortalecer los resultados de resiliencia.

    '
  marco: 'El marco adopta el realismo crítico, que distingue el dominio real (mecanismos generativos), el actual (respuestas organizacionales) y el empírico (indicadores observables), y concibe la resiliencia como una capacidad emergente de la interacción de mecanismos y no como un atributo estático. La resiliencia organizacional se define como la capacidad de anticipar, prepararse, responder y recuperarse de disrupciones significativas para restaurar la funcionalidad a un estado operativo estable. Un marco conceptual previo a la revisión vincula la inteligencia de negocios con la capacidad de respuesta y propone diez prácticas de resiliencia. El modelo posterior identifica tres mecanismos generativos (capacidad colectiva, adaptativa y dinámica), con los habilitadores digitales incrustados en las capacidades adaptativa y dinámica, que producen preparación sistémica, recuperación rápida y estabilidad generativa.

    '
  metodologia: 'La revisión siguió PRISMA 2020 con búsquedas entre febrero y marzo de 2025 en Scopus, Web of Science, ProQuest Social Sciences y Business Source Ultimate, con seguimiento de citas hasta abril de 2025 y Google Scholar solo como apoyo. Se incluyeron estudios de 2017 a 2025 sobre resiliencia a nivel de empresa (incluidas pymes) en gestión, estudios organizacionales, ingeniería, negocios y sistemas de información, con umbrales mínimos de citación (10 citas para estudios de más de tres años y 3 para los más recientes), metodología explícita e inglés, y se excluyeron estudios de resiliencia individual, ecológica, de ciudades o regiones. Los registros se gestionaron con Rayyan y Excel. Se evaluó la calidad por transparencia metodológica, coherencia analítica y vínculo entre evidencia y conclusión, con un análisis de sensibilidad que excluyó o ponderó a la baja los estudios de menor calidad. La codificación temática y el cálculo de frecuencias se apoyaron en la función de proyectos
    de ChatGPT (GPT-5.1) con validación humana. La síntesis llevó a un marco posterior en tres etapas (marco previo, marco refinado y modelo operacionalizable futuro).

    '
  resultados: 'Los resultados indican que el corpus tiene 30 estudios, de los cuales 83 % son posteriores a 2020 y 77 % de 2022 a 2024, 87 % son artículos de revista y 13 % ponencias, y 60 % están en revistas Q1. Predominan los métodos cualitativos (47 %), seguidos de los cuantitativos (40 %) y los mixtos (13 %). El 90 % tiene alcance organizacional global, 60 % se centra en grandes empresas, 17 % en pymes y 23 % en ambas, y en cuanto al momento, 53 % abarca antes y después del evento, 37 % solo después y 10 % durante el evento. Las diez prácticas hipotetizadas aparecen en la literatura, con frecuencias de salience de 63 para sistemas modernizados, 52 para flexibilidad estratégica (dominante en pymes), 47 para flexibilidad de procesos, 45 para personal preparado, 42 para redundancia de sistemas, 39 para funciones integradas, 35 para funciones defensivas, 32 para recuperación rápida, 31 para liderazgo preparado y 28 para equipos integrados. Los habilitadores digitales rara vez aparecen como
    impulsores autónomos y funcionan como infraestructuras que mejoran la detección, la conciencia situacional, la automatización y la velocidad de decisión. Se identifican tensiones entre un enfoque tecnocrático (cerca de 40 % de los estudios) y uno relacional (27 %). Los autores subrayan que las frecuencias indican prominencia temática y no fuerza causal.

    '
  discusion: 'Los autores sostienen que la resiliencia organizacional en la era digital es un fenómeno relacional y multidimensional que emerge de la interacción dinámica de configuraciones humanas, estructurales y habilitadas digitalmente, que las prácticas aparecen en configuraciones agrupadas que se complementan, que las tecnologías no sustituyen las condiciones organizacionales (liderazgo, gobernanza, capacidades de la fuerza laboral y coordinación institucionalizada) y que la IA generativa es relevante para la capacidad adaptativa porque apoya la interpretación de señales débiles y la generación de opciones. Reconceptualizan la resiliencia como resultado emergente no lineal de las interacciones entre mecanismos. Proponen cuatro líneas futuras: prueba empírica con estudios de caso múltiples longitudinales, análisis de productividad, aplicaciones sectoriales comparativas y paradigmas alternativos con modelos de ecuaciones estructurales e interpretativos.

    '
  limitaciones: 'Declaradas: el marco es conceptual y requiere validación empírica longitudinal y cuantitativa; las frecuencias son indicadores de prominencia y no de causalidad; los estudios de pymes y de la fase durante el evento son pocos. No declaradas: el umbral de citación (10 y 3) favorece a estudios consolidados y excluye evidencia reciente en un campo de rápida evolución; las diez prácticas se hipotetizan antes de la revisión y luego se encuentran todas en la literatura, lo que puede reflejar confirmación por el esquema de codificación; la codificación temática y las frecuencias se apoyaron en un modelo de lenguaje con revisión humana cuya concordancia y reproducibilidad no se reportan en el texto principal; la tabla de criterios deja el contexto sectorial sin definir; se excluyen estudios de sistemas, ciudades y regiones, de modo que el marco no cubre la resiliencia de empresas ante desastres físicos con efectos territoriales; no se identifican estudios sobre sismos u otros peligros
    naturales; la búsqueda se cerró en abril de 2025 y el artículo se publicó en mayo de 2026; los mecanismos del realismo crítico no son observables y la inferencia desde la literatura no puede refutarse con los mismos datos.'
  futuro: 'Explícito: pruebas empíricas con estudios de caso múltiples longitudinales y desarrollo de indicadores (latencia de respuesta, trayectorias de recuperación, continuidad y adaptación posterior), análisis de productividad bajo disrupción, aplicaciones y comparaciones sectoriales (energía, transporte, salud, centros de datos y manufactura) y paradigmas alternativos con modelos de ecuaciones estructurales, enfoques interpretativos y diseños mixtos. Implícito: estudios de la dinámica en tiempo real durante el evento y de pymes.'
c3:
  tesis: 'La resiliencia organizacional en la era digital es una propiedad emergente de la interacción entre mecanismos colectivos, adaptativos y dinámicos, con los habilitadores digitales (IA, IA generativa, IoT, macrodatos y robótica) incrustados como infraestructuras de detección, automatización y decisión, de modo que genera preparación sistémica, recuperación rápida y estabilidad generativa, y no se explica por la adopción tecnológica ni por una práctica aislada, como lo muestran diez prácticas presentes en 30 estudios empíricos.

    '
  antitesis: 'El modelo es conceptual y su evidencia procede de una selección de 30 estudios filtrados por citación, lo que sesga hacia trabajos consolidados, con prácticas hipotetizadas antes de la revisión y luego encontradas todas, y una codificación asistida por un modelo de lenguaje cuya fiabilidad no se muestra. Las frecuencias miden prominencia y no efecto, los mecanismos son no observables por definición del paradigma, y solo 10 % de los estudios examina la dinámica durante el evento y 17 % a pymes, de modo que la recuperación rápida, central para el corpus, se apoya en pocos datos. El modelo no incorpora el territorio, la infraestructura compartida ni los desastres físicos, por la exclusión de estudios de ciudades y regiones, y ninguna conclusión se contrasta con resultados medidos de continuidad.

    '
  sintesis: 'La contribución sostenible es una taxonomía de prácticas y mecanismos de resiliencia organizacional con un papel explícito de los habilitadores digitales, útil como estructura conceptual para formular hipótesis sobre cómo el IoT y los datos se integran con liderazgo, redundancia y coordinación. Para el corpus, aporta el eslabón organizacional que falta a los estudios técnicos de sensores y gemelos y reitera que la tecnología sola no explica la resiliencia. Sus afirmaciones deben tratarse como hipótesis que requieren casos longitudinales y cuantitativos, ampliación de la búsqueda sin umbral de citación y estudios de empresas afectadas por desastres físicos como los sismos.

    '
  areas_grises:
  - 'Criterio de selección por citación: se exige un mínimo de 10 citas para estudios de más de tres años y de 3 para los recientes, y se incluyen tesis doctorales, ponencias de alta calidad y documentos de política, pero se excluyen los preprints y los libros que no cumplan el umbral; en un campo de IA generativa y IoT que cambia rápido, el umbral penaliza la evidencia reciente y el texto no explica cuántos estudios se perdieron por esta razón.'
  - 'Hipótesis previa y confirmación: el marco previo a la revisión propone diez prácticas de resiliencia y la revisión informa que las diez se identificaron en la literatura, algunas de manera directa y otras indirecta; sin un procedimiento que permitiera refutar alguna práctica, la coincidencia total puede reflejar el diseño de la codificación y no el estado de la evidencia.'
  - 'Codificación asistida por un modelo de lenguaje: las frecuencias de las prácticas se obtuvieron con la función de proyectos de ChatGPT con instrucciones ajustadas hasta que las salidas fueran estables y con validación humana; el texto indica que los resultados de confiabilidad están en un apéndice, y no se informa la concordancia entre la codificación automática y la manual.'
  - 'Alcance organizacional frente a territorial: los criterios excluyen estudios de resiliencia de ciudades, regiones y sistemas en aislamiento, y el 60 % de los estudios se centra en grandes empresas y 17 % en pymes; así, la resiliencia de empresas pequeñas ante desastres físicos con daño a infraestructura común, que es relevante para la recuperación tras un sismo, queda poco representada.'
  puntos_oscuros: 'Llama la atención que el resumen presente el resultado como una reconceptualización de la resiliencia como un resultado emergente no lineal sin que el artículo proponga ninguna medición, y que el marco combine nombres para el mismo mecanismo (recuperación rápida y respuesta rápida). También es notable que la tabla de frecuencias asigne a la flexibilidad estratégica la dominancia de las pymes con base en cuatro estudios, y que el texto indique que solo una parte de los estudios examina la dinámica durante el evento, que es la que más importa para la recuperación. El estudio señala que más de la mitad de las prácticas aparecen en configuraciones agrupadas, pero la unidad de análisis de la co-ocurrencia es el estudio y no la empresa. La tabla de criterios deja el contexto sectorial como pendiente de definición. Además, el texto sostiene que las tecnologías digitales reducen las asimetrías de información, afirmación que se apoya en pocos estudios cuantitativos. Por último,
    el artículo admite el uso de una herramienta generativa para la síntesis temática sin describir los controles de alucinación más allá de la validación humana.

    '
  ideas:
  - 'Prueba cuantitativa de configuraciones contexto-mecanismo-resultado en pymes tras un desastre: reunir datos de 150 a 200 pymes afectadas por un sismo reciente (tiempo de interrupción, pérdida de ingresos, existencia de sensores o telemetría, plan de continuidad, liderazgo y redundancia de proveedores) y aplicar un análisis comparativo cualitativo de conjuntos difusos o modelos de ecuaciones estructurales para identificar qué combinaciones de prácticas y habilitadores digitales se asocian a recuperación rápida. El resultado indicaría si el aporte del IoT depende del contexto y de la gobernanza, como propone el marco, y qué configuraciones minimizan el tiempo de reapertura. Los datos y el protocolo se publicarían para su verificación.'
  - 'Replicación de la revisión sin umbral de citación y con peligros físicos: repetir la búsqueda eliminando el mínimo de citas, incluyendo ponencias y documentos de política, y añadiendo términos de desastres naturales, terremotos y continuidad del negocio, con doble codificación independiente humana y automática y reporte de concordancia (kappa) en una muestra de 20 %. Se podría medir cuánto cambian la lista de prácticas y sus frecuencias, cuántos estudios de pymes y de la fase durante el evento aparecen y si la recuperación rápida gana relevancia, información para acotar el marco al contexto de desastres físicos. Los datos y el protocolo se publicarían para su verificación.'
  relaciones:
  - 'Resiliencia de cadenas de suministro y gemelos (complementa) D081 y D077: D081 estructura las capacidades del gemelo en cuatro etapas de la disrupción con 89 estudios y D077 propone un marco de colaboración con IoT; D082 aporta los mecanismos organizacionales que condicionan que esas capacidades produzcan resiliencia.'
  - 'Resiliencia, sostenibilidad y gemelos IoT (se relaciona con) D074 y D083: D074 incorpora requisitos de resiliencia en un gemelo IoT de Industria 5.0 y D083 trata IoT y sostenibilidad en sistemas de producción; D082 muestra que la resiliencia depende de liderazgo y coordinación más que de la tecnología.'
