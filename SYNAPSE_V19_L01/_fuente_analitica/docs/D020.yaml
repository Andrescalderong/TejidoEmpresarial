notas: "Texto completo extraído (10 páginas más referencias). Las tablas 1, 3 y 4 se extrajeron con el orden desordenado y las cifras de HTMT y cargas cruzadas se leyeron de forma aproximada. La coincidencia de cifras de mercado con D015 se verificó por comparación directa de textos. El artículo presenta expresiones de redacción anómalas que se señalan como indicio de calidad del texto, sin afirmar su causa."
