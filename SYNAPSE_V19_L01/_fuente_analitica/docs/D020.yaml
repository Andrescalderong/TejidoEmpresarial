doc_id: D020
relevancia: "Adyacente"
relevancia_just: "Estima con PLS-SEM la relación entre cinco componentes de IoT (control adaptativo, adquisición y transmisión de datos, alerta temprana, integración normativa, monitoreo y analítica en tiempo real) y la resiliencia sísmica de edificios a partir de una encuesta; trata IoT y SHM sísmico, pero con percepciones de profesionales y sin medición de desempeño ni de recuperación."
cluster_tema: "IoT, SHM y resiliencia sísmica de edificios"
metodo_tipo: "Encuesta Likert y modelación de ecuaciones estructurales por mínimos cuadrados parciales (PLS-SEM)"
tipo_recurso: "Artículo científico (journal peer-reviewed, acceso abierto)"
kw_inferidas: [internet de las cosas, resiliencia sísmica, monitoreo de salud estructural, control estructural adaptativo, alerta temprana, códigos de construcción, PLS-SEM, analítica en tiempo real, encuesta a profesionales, edificios]
c2:
  objetivo: >
    Analizar el papel del internet de las cosas (IoT) en la resiliencia sísmica de edificios mediante un análisis funcional de cinco componentes identificados en la literatura (control estructural adaptativo, adquisición y transmisión de datos, sistemas de alerta temprana, integración con códigos y normas de construcción, y monitoreo y analítica en tiempo real) y mediante un marco de implementación. El propósito declarado es cubrir la falta de análisis empírico del IoT en contextos geográficos específicos y ofrecer a desarrolladores de infraestructura y a investigadores un marco verificado para decisiones y estudios posteriores.
  pregunta: >
    El artículo no formula preguntas de investigación; plantea cinco hipótesis, una por cada componente, según las cuales cada uno contribuye de forma positiva y significativa a la resiliencia sísmica asociada con el IoT. La pregunta implícita es qué componentes de IoT percibidos por profesionales tienen mayor relación con la resiliencia sísmica de los edificios en una zona sísmica.
  marco: >
    El marco es una revisión de la literatura que identifica cinco constructos, cada uno con cinco variables operativas, y un modelo causal reflectivo en PLS-SEM en el que los cinco constructos predicen un constructo resultado denominado 'IoT para una resiliencia sísmica mejorada'. Se apoya en la idea de que el IoT permite monitoreo continuo, control adaptativo, alertas previas al arribo de ondas dañinas y verificación del cumplimiento normativo. No se define con precisión el concepto de resiliencia ni se vincula con teoría de resiliencia, de adopción de tecnología o de desempeño estructural; el enfoque es cuantitativo, transversal y de percepción de profesionales.
  metodologia: >
    La búsqueda en Scopus, con términos de IoT, ingeniería sísmica y monitoreo de salud estructural, arrojó 1562 documentos y 789 tras restringir a 2018-2024, utilizados como corpus de contexto. Se diseñó un cuestionario Likert de cinco puntos con 25 variables (cinco por constructo) distribuido a 239 personas, con tasa de respuesta de 58,99 %, que equivale a 141 respuestas según la sección de limitaciones. Los participantes son ingenieros civiles (65 %), gerentes de proyecto (15 %), ingenieros de seguridad (10 %) y otros (10 %), con 28 % de doctorado y 54 % de maestría. La modelación se hizo en SmartPLS 4: se evaluaron cargas, alfa de Cronbach, confiabilidad compuesta, varianza media extraída (AVE), razón HTMT y cargas cruzadas, y se aplicó bootstrapping a los cinco coeficientes de trayectoria; se calculó Q2 con el procedimiento de blindfolding. El texto no indica la zona sísmica estudiada, el muestreo ni las preguntas del constructo resultado.
  resultados: >
    La consistencia interna fue alta: el alfa de Cronbach osciló entre 0,783 y 0,93, la confiabilidad compuesta (rho-c) entre 0,801 y 0,949 y la AVE entre 0,572 y 0,792. Los valores de HTMT entre constructos fueron de 0,092 a 0,359 y las cargas cruzadas mostraron cargas propias de 0,654 a 0,969. Los cinco coeficientes de trayectoria hacia 'IoT para una resiliencia sísmica mejorada' fueron positivos y significativos: control adaptativo 0,157 (t de 3,303), adquisición y transmisión de datos 0,313 (t de 5,699), alerta temprana 0,175 (t de 6,453), integración con códigos y normas 0,392 (t de 9,69) y monitoreo y analítica en tiempo real 0,507 (t de 14,713), con valores p de 0,001 o menores. La relevancia predictiva fue Q2 de 0,168 (suma de cuadrados 14.150 y de errores 11.775,42), que los autores describen como capacidad de pronosticar cerca de 16,8 % de la variabilidad. El texto afirma que todas las hipótesis fueron aceptadas y que el monitoreo y la analítica son el factor con mayor efecto. El artículo contiene además una descripción de trayectorias entre constructos con signos contradictorios con la tabla de hipótesis (por ejemplo, un efecto negativo de alerta temprana sobre monitoreo), sin que las tablas reporten esa trayectoria entre constructos.
  discusion: >
    Los autores interpretan que cada componente de IoT mejora la resiliencia sísmica y que el monitoreo y la analítica en tiempo real, seguidos de la integración con códigos y normas, son los de mayor contribución. Sostienen que el marco final puede guiar la adopción estratégica del IoT, que los resultados implican para las agencias de infraestructura integrar IoT en el monitoreo y la planificación estructural, y que el marco sirve de base para estudios empíricos posteriores. Reconocen como limitaciones una muestra de 141 participantes y un área limitada, que restringen la generalización, y sugieren replicar el estudio en otras regiones con muestras mayores.
  limitaciones: "Declaradas: muestra de 141 participantes y un área limitada. No declaradas: percepciones de profesionales como medida de resiliencia, ausencia de datos de sensores o de desempeño estructural, zona sísmica y muestreo no especificados, constructo resultado sin indicadores descritos, y varianza de método común no examinada."
  futuro: "Replicación en otras regiones geográficas con muestras mayores para mejorar la validez externa; el marco queda como base de estudios empíricos posteriores."
c3:
  tesis: >
    Los cinco componentes de IoT identificados (control adaptativo, adquisición y transmisión de datos, alerta temprana, integración con códigos y normas, y monitoreo y analítica en tiempo real) se asocian de forma positiva y significativa con la resiliencia sísmica asociada al IoT, según la percepción de profesionales, y el monitoreo con analítica en tiempo real es el de mayor peso.
  antitesis: >
    El estudio mide percepciones de 141 profesionales y las trata como evidencia del efecto de componentes técnicos sobre la resiliencia, sin datos de sensores ni de desempeño de edificios; las cinco variables independientes y la dependiente provienen del mismo cuestionario, por lo que la varianza de método común puede producir asociaciones inflados. El constructo resultado 'IoT para una resiliencia sísmica mejorada' no tiene indicadores descritos y mezcla la presencia de IoT con su efecto, de modo que su definición es circular. La zona sísmica, el muestreo y la procedencia de los participantes no se informan. Hay errores de reporte (se interpreta la media de bootstrapping 0,303 como estadístico t, se describen trayectorias negativas que no están en las tablas, se usa 'p < 0,005'), una tasa de respuesta ambigua entre 239 invitados y 141 respuestas, un Q2 de 0,168 que no equivale a 'predecir 16,8 % de la variabilidad', y una introducción con cifras de mercado idénticas a las de otro artículo del corpus, junto con expresiones de redacción anómalas ('rattle displacements', 'facts seize') que sugieren reescritura automática.
  sintesis: >
    El artículo ofrece una lista operacional de 25 variables de IoT para resiliencia sísmica y una estimación de asociaciones de percepción que sirve como hipótesis para estudios con datos observados. Debe leerse con las reservas propias de un estudio transversal de percepción con problemas de reporte, y no como evidencia de que los componentes de IoT aumenten la resiliencia. Para el corpus, la síntesis consiste en usar la lista de variables como instrumento de partida y validarla contra desempeño observado (daño, tiempo de inhabilitación, reapertura de actividades) en edificios con y sin IoT, de modo que la asociación pase de percepción a resultado medible y se cuantifique su valor económico.
  areas_grises:
    - "Definición y medición del constructo resultado: 'IoT para una resiliencia sísmica mejorada' no tiene indicadores listados en la Tabla 1, que solo describe los cinco constructos predictores con cinco variables cada uno; no queda claro qué ítems miden el resultado ni si se trata de resiliencia observada o percibida."
    - "Zona, muestreo y tamaño de muestra: el texto no nombra la zona sísmica ni los criterios de selección; el resumen habla de 239 encuestados distribuidos, la sección de resultados de 239 participantes y la de limitaciones de 141, y no se discute el sesgo de no respuesta de 41 %."
    - "Errores de interpretación estadística: se presenta 0,303 como estadístico t para el control adaptativo cuando corresponde a la media del bootstrapping del coeficiente de adquisición de datos; se describen trayectorias negativas entre alerta temprana y monitoreo que no figuran en las tablas; Q2 de 0,168 se interpreta como porcentaje de variabilidad pronosticada y no se informa R2."
    - "Calidad del reporte e integridad: la introducción repite cifras de mercado y frases de otro artículo del corpus (IoT en construcción de 16 mil millones de dólares, 26,0 % de crecimiento, 17,9 % de crecimiento del monitoreo estructural, reducción de costos de 20 a 25 %), y hay frases anómalas que indican parafraseo automático, lo que dificulta atribuir las fuentes."
  puntos_oscuros: >
    Resulta llamativo que las razones HTMT entre constructos sean de 0,09 a 0,36 y las cargas propias lleguen a 0,97 para cinco constructos que, según la teoría descrita, deberían estar fuertemente relacionados, y que los coeficientes de trayectoria sumen más de 1,5 con el mayor efecto en monitoreo y analítica. Una explicación plausible es que los participantes respondieron cada bloque de ítems de forma casi uniforme y que la baja correlación entre bloques refleja respuestas poco diferenciadas, o que los datos se tratan con un modelo mal especificado en el que el constructo resultado no se mide con ítems propios. Esto indica que los índices de validez discriminante, aun siendo favorables, no garantizan que el modelo describa fenómenos distintos, y que el hallazgo de que la analítica tiene mayor efecto puede deberse a la forma del instrumento. La coincidencia de la introducción con otro artículo del corpus sugiere una fuente común de cifras de mercado o reutilización de texto, cuyo origen primario no se identifica y que debe tratarse como dato no verificado.
  ideas:
    - "Contraste de la percepción con desempeño observado: aplicar el cuestionario de 25 variables a responsables de edificios con IoT y sin IoT y vincular las respuestas con datos observados de daño, tiempo de inhabilitación y costo de interrupción de actividades en eventos sísmicos recientes, estimando el efecto de cada componente con un modelo que controle por tipología, edad y tamaño. Fundamento: el artículo mide percepción y declara que el análisis empírico del efecto es la brecha, pero no usa datos de desempeño. Verificabilidad: muestreo documentado, datos de eventos reales y análisis de varianza de método común. Utilidad: identifica qué componentes de IoT justifican la inversión por su efecto sobre continuidad y no por la opinión de profesionales."
    - "Auditoría de reutilización y de fuentes de las cifras de mercado: rastrear el origen primario de las cifras de IoT en construcción y de monitoreo estructural que aparecen en varios artículos del corpus y construir una tabla de fuentes verificadas, descartando las no trazables. Fundamento: la coincidencia textual entre artículos indica una fuente común no citada con claridad. Verificabilidad: búsqueda de informes originales de mercado y comparación de fechas y cifras. Utilidad: evita que cifras no verificables sustenten el caso de negocio del corpus y permite documentar el nivel de evidencia de cada afirmación de mercado."
  relaciones:
    - "Percepción de la calidad del monitoreo y la analítica (se asocia con) la percepción de resiliencia: el mayor coeficiente (0,507) está entre dos constructos medidos por el mismo instrumento, de modo que parte de la asociación puede deberse a un sesgo de respuesta compartido."
    - "Integración con códigos y normas (condiciona) la adopción práctica del IoT: los autores sostienen que el IoT debe ajustarse a los marcos regulatorios para aumentar la resiliencia, aunque el vínculo se mide como percepción y no como cumplimiento normativo observado."
  robustez: [3, 3, 2, 3]
  valor: [4, "Aporta un inventario operacional de 25 variables agrupadas en cinco componentes de IoT para resiliencia sísmica y una primera estimación de asociaciones de percepción, útiles como punto de partida de instrumentos de evaluación. Su valor para el corpus es limitado por la muestra pequeña y no descrita, la medición de percepción, el constructo resultado sin indicadores, errores de reporte estadístico y la reutilización de texto; solo es utilizable como hipótesis a contrastar."]
  conexiones: []
socratica:
  p1: "'Resiliencia sísmica mejorada por IoT' es un constructo latente medido por percepciones; 'monitoreo y analítica en tiempo real' es la capacidad de observar y procesar la respuesta estructural de forma continua."
  p2: "Supone que las respuestas de profesionales representan el efecto real de los componentes técnicos y que el modelo reflectivo con cinco predictores y un resultado está bien especificado."
  p3: "La evidencia son 141 respuestas de cuestionario con índices de fiabilidad altos y coeficientes significativos; no hay datos de sensores ni de desempeño de edificios."
  p4: "Si es cierto, quien invierta en IoT debe priorizar monitoreo con analítica y la integración con normas; si es falso, la priorización estaría guiada por percepciones sin efecto verificable sobre daño o continuidad."
  p5: "No se examinan casos de edificios con IoT que sufrieron daño o interrupción, ni muestras con baja percepción del IoT."
  p6: "Alternativas: que la varianza de método común explique la asociación; que el tamaño de la organización explique ambas percepciones; que el constructo resultado mida preferencias por IoT y no resiliencia."
