doc_id: D096
relevancia: "Ajeno"
relevancia_just: "Análisis demográfico de la contribución de causas de muerte a la esperanza de vida temporal de adultos de 15 a 74 años en regiones de Colombia (1985-1999); es salud pública y demografía sin relación con gemelos digitales, IoT, transferencia tecnológica ni recuperación empresarial."
cluster_tema: "Demografía en salud: mortalidad adulta y esperanza de vida en Colombia"
metodo_tipo: "Estudio descriptivo retrospectivo con tablas de vida y descomposición de Arriaga"
tipo_recurso: "Artículo científico (investigación original, journal peer-reviewed)"
kw_inferidas: [esperanza de vida temporal, mortalidad adulta, causas externas, homicidios, suicidios, método de Arriaga, tablas de vida, regiones de Colombia, diferencias por sexo, estadísticas vitales]
c2:
  objetivo: >
    Establecer los cambios de la mortalidad por causas entre 1985 y 1999 y su contribución a la esperanza de vida temporal de la población colombiana de 15 a 74 años, según sexo y región (Atlántica, Oriental, Central, Pacífica y nuevos departamentos), con el fin de identificar las causas que más afectan la longevidad y orientar programas de promoción de la salud y prevención de la mortalidad acordes con las necesidades de cada región y evaluar si las mejoras en las causas naturales compensan el efecto de las muertes violentas.
  pregunta: >
    [INFERIDA] ¿Cuánto contribuyeron los cambios en la mortalidad por grupos de causas al cambio de la esperanza de vida temporal de adultos de 15 a 74 años entre 1985 y 1999 en las regiones de Colombia, y cómo difieren hombres y mujeres?
  marco: >
    El marco es la demografía de la mortalidad: la esperanza de vida como medida resumen, la esperanza de vida temporal entre dos edades exactas, los índices de cambio absoluto y relativo, y la descomposición de Arriaga, que atribuye el cambio a las causas bajo el supuesto de que la contribución de cada una es proporcional al cambio de su tasa central de mortalidad. Se apoya en las tendencias de América Latina, donde la esperanza de vida al nacer aumentó sobre todo por la reducción de la mortalidad en menores de 15 años mientras la mortalidad adulta masculina por causas violentas aumentó, y en las diferencias regionales por acceso a servicios, ruralidad, etnia y migración. El método tiene la ventaja de medir sustitución entre causas y la desventaja de ser sensible al nivel basal.
  metodologia: >
    Estudio descriptivo retrospectivo con registros de defunción de 1983 a 2001 y proyecciones de población del DANE. Las defunciones de 1985 y de 1999 se obtuvieron promediando los quinquenios 1983-1987 y 1997-2001, y se ajustaron por subregistro en departamentos de baja cobertura conservando la estructura por edad, causa y la razón de masculinidad. Las causas se agruparon según Arriaga (infecciosas, tumores, circulatorias, neumonía y bronquitis, digestivas, accidentes, suicidios, homicidios y otras violencias, mortalidad materna, mal definidas y resto) con la equivalencia entre CIE-9 (1985-1996) y CIE-10 (1997-2001). Se incluyeron defunciones de 15 a 74 años y las variables sexo y región. Se construyeron tablas de vida para 1985 y 1999 y se calcularon la esperanza de vida temporal, los índices de cambio absoluto y relativo y la contribución de cada causa por grupo de edad. El procesamiento se hizo con SPSS 11.5. No se reportan intervalos de incertidumbre ni análisis de sensibilidad del ajuste por subregistro.
  resultados: >
    La proporción de muertes por causas violentas aumentó en todas las regiones y en ambos sexos, con más del 50 % de las muertes en los nuevos departamentos. La tasa de mortalidad masculina aumentó en casi todas las regiones (salvo la oriental), por ejemplo hasta 951 por 100 000 en la región central en 1999; la femenina disminuyó en todas. La esperanza de vida temporal masculina cambió -0,04 años en la región atlántica, +0,57 en la oriental, -1,03 en la central, -0,41 en la pacífica y -2,04 en los nuevos departamentos; la femenina aumentó entre 0,52 y 1,66 años (mayor en la oriental, con 27,3 % del máximo posible). Los suicidios, homicidios y otras violencias restaron entre 0,18 y 2,55 años a los hombres y entre 0,15 y 1,60 años a las mujeres según la región. Las enfermedades circulatorias aportaron hasta 0,78 años (hombres, región pacífica) y 1,20 (mujeres, región central), y los accidentes hasta 0,65 años (hombres, región central). La brecha entre hombres y mujeres creció en todas las regiones (hasta 2,56 años en los nuevos departamentos). Las enfermedades infecciosas aportaron hasta 0,15 años (nuevos departamentos), los tumores disminuyeron solo en la región oriental (0,07 años) y la mortalidad materna disminuyó en todas las regiones, con el mayor aporte en la región central (0,11 años).
  discusion: >
    Las autoras interpretan que el incremento de la mortalidad masculina y la disminución de la femenina ampliaron la brecha de esperanza de vida entre sexos, y que la ganancia fue mínima porque los aportes positivos de la disminución de causas naturales se anularon con los negativos de las violencias evitables. Señalan que los accidentes disminuyeron y recomiendan impulsar la reducción del consumo de alcohol, el uso de cinturón y de casco, y acciones sobre los factores que producen violencia, con programas acordes a cada región. Comparan la esperanza de vida temporal de las regiones con la de Argentina, Uruguay, Chile y México. Dejan sin discutir el subregistro y su ajuste, la comparabilidad CIE-9 y CIE-10, la categoría mal definida y los factores de la violencia, así como la contradicción entre la ganancia mínima declarada y las ganancias femeninas de 0,52 a 1,66 años.
  limitaciones: "No declaradas formalmente. El texto reconoce la baja cobertura de las estadísticas vitales en algunos departamentos y la necesidad de ajustar las defunciones; el método es sensible a los valores extremos del nivel basal de mortalidad."
  futuro: "Programas de promoción de la salud y de reducción de la mortalidad acordes con la situación de cada población; acciones sobre los factores que producen violencia y continuidad de las medidas de seguridad vial y reducción del consumo de alcohol (p. 8)."
c3:
  tesis: >
    Entre 1985 y 1999 la mortalidad adulta por suicidios, homicidios y otras violencias anuló los aportes positivos de la disminución de causas naturales a la esperanza de vida temporal en Colombia, con pérdidas mayores en hombres y en las regiones central y los nuevos departamentos, y con aumento de la brecha entre sexos.
  antitesis: >
    La conclusión de 'ganancia mínima' describe a los hombres pero no a las mujeres, cuya esperanza de vida temporal aumentó entre 0,52 y 1,66 años en todas las regiones; el resumen la generaliza a ambos sexos. Los resultados dependen de un ajuste por subregistro en departamentos de baja cobertura que no se documenta ni se somete a análisis de sensibilidad, y de la equivalencia entre CIE-9 y CIE-10 en el medio del periodo, lo que puede alterar la distribución por causas, en particular las 'mal definidas'. La contribución de Arriaga supone proporcionalidad entre el cambio de la tasa de una causa y su contribución, y es sensible al nivel basal; sin intervalos de incertidumbre no puede saberse si diferencias como -0,04 años o 0,57 años son distinguibles de cero. Además, el texto afirma que las enfermedades circulatorias afectan más a las mujeres, mientras las tasas del cuadro 2 son mayores en hombres. Las explicaciones sobre violencia, alcohol o seguridad vial no se prueban con datos del estudio.
  sintesis: >
    El estudio ofrece una descripción regional útil del peso de las causas externas en la longevidad adulta colombiana de fines del siglo XX, con un método reconocido, y sirve de línea base para evaluar políticas de seguridad. Su inferencia causal sobre los determinantes de la violencia es especulativa. La síntesis propone acompañar las estimaciones con intervalos de incertidumbre por remuestreo o simulación, evaluar la sensibilidad al ajuste por subregistro y a la clasificación CIE, y distinguir contribuciones por edad y causa específica (homicidio frente a suicidio). Para el corpus, el documento es ajeno al dominio de tecnología y recuperación empresarial, aunque ilustra el efecto de choques externos sobre indicadores agregados.
  areas_grises:
    - "Sin incertidumbre estadística: las esperanzas de vida temporales y sus contribuciones se reportan como cifras puntuales con dos decimales, sin intervalos ni pruebas; cambios como -0,04 años en la región atlántica o 0,07 años por tumores no pueden distinguirse de ruido, y las diferencias entre regiones se interpretan sin evaluar su precisión."
    - "Ajuste por subregistro y comparabilidad de causas: las defunciones se ajustaron con estimaciones en departamentos de baja cobertura 'conservando la estructura' registrada, y las causas se codifican con CIE-9 hasta 1996 y CIE-10 desde 1997; el efecto de ambos supuestos sobre el cambio de la proporción de violentas y mal definidas no se evalúa."
    - "Contradicción entre conclusión y datos: el resumen y la discusión hablan de ganancia mínima en ambos sexos, pero las mujeres ganaron entre 0,52 y 1,66 años y la brecha entre sexos creció por esa diferencia; además, el texto dice que las enfermedades circulatorias afectan más a las mujeres, aunque las tasas del cuadro 2 son mayores en hombres."
    - "Atribución causal de la violencia: las autoras asignan a 'los factores que producen violencia' y a alcohol y seguridad vial las pérdidas, sin analizar determinantes como conflicto armado, narcotráfico, urbanización o desigualdad, de modo que las recomendaciones de política no se derivan del análisis."
  puntos_oscuros: >
    El texto agrupa suicidios, homicidios y otras violencias como una sola categoría, y los accidentes por separado, lo que oculta la heterogeneidad: los homicidios responden a dinámicas de conflicto y crimen, y los suicidios, a factores de salud mental. Su suma como 'causa' principal de pérdida de esperanza de vida impide orientar acciones diferenciadas. Por otra parte, la disminución de circulatorias y accidentes puede deberse en parte a mejoras de certificación y a la reducción de 'mal definidas', y no a cambios de riesgo, hipótesis que no se examina; el cuadro muestra que las mal definidas bajaron en varias regiones. Además, la región 'nuevos departamentos' agrupa departamentos con poblaciones pequeñas, por lo que sus tasas (más del 50 % de muertes violentas, pérdida de 2,04 años) tienen mayor variabilidad y mayor subregistro; la lectura de ese resultado como 'más afectada' es sensible a los supuestos del ajuste. Por último, el uso de dos puntos en el tiempo (promedios de quinquenios) ignora la trayectoria interna del periodo, incluidos picos de violencia en los años noventa.
  ideas:
    - "Intervalos de incertidumbre y sensibilidad al subregistro: reestimar las tablas de vida con simulación de Monte Carlo sobre el número de defunciones y los factores de corrección por departamento, y reportar intervalos de 95 % para la esperanza de vida temporal y las contribuciones de Arriaga, con escenarios de subregistro bajo, medio y alto. Fundamento: el artículo presenta cifras puntuales y depende de un ajuste no documentado. Verificabilidad: los registros del DANE y las proyecciones permiten replicar el procedimiento. Utilidad: permite al Ministerio de Salud saber qué diferencias regionales son estables y priorizar recursos de prevención de violencia donde el efecto es estadísticamente distinguible."
    - "Descomposición por causa específica y edad con series anuales: separar homicidios, suicidios y accidentes de transporte y usar series anuales de 1985 a 2001 en lugar de dos quinquenios, para identificar el momento y los grupos de edad que concentran la pérdida y relacionarlos con eventos del periodo. Fundamento: el agrupamiento de violencias oculta mecanismos distintos y los dos puntos ignoran la trayectoria. Verificabilidad: reaplicación del método de Arriaga por año y causa con datos del DANE y modelos de regresión de puntos de cambio. Utilidad: entrega a los diseñadores de política un mapa de dónde y cuándo la mortalidad externa tiene mayor efecto, para focalizar intervenciones diferenciadas."
  relaciones:
    - "Aumento de la mortalidad por violencia (reduce) la esperanza de vida temporal masculina: contribuciones de -0,18 a -2,55 años según la región, con mayor pérdida en la región central y los nuevos departamentos."
    - "Disminución de enfermedades circulatorias (aumenta) la esperanza de vida temporal: contribuciones de hasta 0,78 años en hombres y 1,20 años en mujeres, que no compensan la pérdida por violencias en los hombres de varias regiones."
  robustez: [5, 4, 3, 3]
  valor: [2, "Aporta una descripción regional de la carga de la violencia sobre la esperanza de vida adulta de Colombia con un método reconocido, útil como línea base para evaluar políticas. Está fuera del dominio del corpus de tecnología y recuperación empresarial; su valor para el análisis es indirecto como ejemplo de choque externo con efecto agregado, y como control negativo temático."]
  conexiones: []
socratica:
  p1: "Define esperanza de vida temporal como años promedio vividos entre dos edades exactas bajo un nivel de mortalidad, y contribución de causa como años ganados o perdidos por el cambio de su tasa central."
  p2: "Supone que el ajuste por subregistro conserva la estructura por edad y causa, que la equivalencia CIE-9 y CIE-10 es válida y que la contribución es proporcional al cambio de la tasa."
  p3: "La evidencia procede de registros de defunción y proyecciones del DANE, con cifras puntuales por región y sexo, sin intervalos de incertidumbre."
  p4: "Si es cierto, la reducción de violencias evitables tiene el mayor potencial para elevar la esperanza de vida adulta; si es falso, el cambio observado puede deberse a artefactos de registro."
  p5: "No se examinan las causas específicas de violencia, el subregistro por departamento ni los cambios de certificación que podrían contradecir los resultados."
  p6: "Hipótesis rivales: la disminución de mal definidas aumenta la proporción de causas violentas por mejor registro; las diferencias regionales reflejan variabilidad de poblaciones pequeñas."
