doc_id: D065
relevancia: Periférico
relevancia_just: Comunicación breve (3 páginas) sobre asignación descentralizada de recursos y tareas en sistemas de cómputo distribuido de IoT mediante subastas VCG y sistemas multiagente, con un escenario de optimización de tráfico urbano y pruebas de escalabilidad de 10 a 50 nodos de borde. Aporta un mecanismo de asignación de cómputo sin punto único de falla, pero no trata desastres, sismos ni empresas.
cluster_tema: Asignación de recursos en cómputo en el borde con subastas y sistemas multiagente
metodo_tipo: Desarrollo de mecanismo de subasta VCG con agentes y evaluación por simulación en tres escalas de banco de pruebas
tipo_recurso: Artículo breve de congreso o revista (Physics of Particles and Nuclei)
