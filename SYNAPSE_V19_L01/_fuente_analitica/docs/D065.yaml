socratica:
  p1: '''VCG'' es un mecanismo de pagos que induce a declarar el valor verdadero; ''bienestar social'' es la suma de utilidades de la asignación; ''equidad de Jain'' es un índice de reparto entre 0 y 1.'
  p2: Supone que los agentes son racionales y declaran valores privados, que los bancos de pruebas representan equipos reales y que el subastador no es un punto de falla.
  p3: La evidencia es una tabla de tres escalas con bienestar de 89 % a 92 %, eficiencia de 86 % a 92 %, equidad de 0,81 a 0,84 y tiempos de 45 a 175 ms.
  p4: Si es cierto, los nodos de borde pueden repartirse tareas sin servidor central; si es falso, el sistema puede fallar al aumentar la escala o al caer el subastador.
  p5: No se examinan fallas de nodos, comparación con asignación centralizada, escala de cientos de nodos ni datos reales de tráfico.
  p6: 'Alternativas: que un asignador centralizado con respaldo sea más sencillo; que la sobrecarga de VCG anule la ventaja; que otros mecanismos sean más baratos.'
