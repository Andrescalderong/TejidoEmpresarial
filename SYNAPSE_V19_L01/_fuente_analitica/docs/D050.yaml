doc_id: D050
relevancia: "Adyacente"
relevancia_just: "Revisión bibliométrica y cualitativa (Scopus y Web of Science, 285 documentos; 27 analizados) del internet de las cosas en la gestión de desastres, que incluye mitigación, rescate, respuesta y recuperación, y lista 'transferencia de tecnología' entre sus palabras clave. Aporta un panorama temprano (2021) de aplicaciones, pero es genérica para desastres naturales y no trata empresas, gemelos digitales ni recuperación económica."
cluster_tema: "IoT en gestión de desastres (revisión bibliométrica y cualitativa)"
metodo_tipo: "Revisión de literatura con análisis bibliométrico (VOSviewer) y clasificación por índice InOrdinatio, con análisis cualitativo de 27 artículos"
tipo_recurso: "Artículo de revisión (journal peer-reviewed)"
kw_inferidas: [internet de las cosas, gestión de desastres, monitoreo ambiental, bibliometría, InOrdinatio, rescate, respuesta, recuperación, transferencia de tecnología, comunicación en emergencias]
c2:
  objetivo: >
    Presentar los resultados de una revisión de la literatura sobre el uso del internet de las cosas (IoT) en la gestión de desastres, con el fin de ayudar a los profesionales a conocer procedimientos y tecnologías eficientes. El estudio busca describir el panorama bibliométrico (años, revistas, áreas, autores y países) y analizar de manera cualitativa las contribuciones más pertinentes, distinguiendo discusiones generales sobre el IoT en la gestión de desastres y aplicaciones de dispositivos o tecnologías específicas en las fases de mitigación, rescate, respuesta y recuperación.
  pregunta: >
    El artículo no formula preguntas de investigación explícitas. La intención declarada es explorar la combinación 'disaster management' e 'internet of things', con la pregunta implícita de qué tecnologías y usos del IoT se han estudiado en la gestión de desastres, en qué áreas del conocimiento se publican, y qué beneficios y desafíos se identifican.
  marco: >
    El marco entiende la gestión de desastres como un conjunto de procesos estructurados de planeación, gestión y acción en cualquier etapa (mitigación, rescate, respuesta y recuperación) con integración de procesos para analizar, monitorear, predecir y gestionar los desastres. Las tecnologías de información y comunicación de interés incluyen datos masivos, computación en la nube, redes sociales, aplicaciones móviles, sensores inteligentes y estructuras de IoT. La revisión describe el IoT como interconexión de objetos y sensores con capas de percepción, red y aplicación, sin proponer una teoría del efecto sobre los resultados de respuesta. Las aplicaciones se agrupan en comunicación entre profesionales, monitoreo ambiental, primeros auxilios, rastreo de personas, logística de suministros y medicinas y gestión de inventario para ayuda.
  metodologia: >
    La revisión sigue el procedimiento de nueve pasos de Pagani y colaboradores: definición de la intención, búsqueda exploratoria, sintaxis de investigación, búsqueda final en Scopus y Web of Science (21 de agosto de 2020, sin restricción temporal, palabras clave en título o resumen), filtrado de duplicados con Mendeley, obtención de factor de impacto y citas (Google Scholar), clasificación con el índice InOrdinatio, que pondera factor de impacto, año y citas con un coeficiente de relevancia fijado por los investigadores, y lectura completa. La búsqueda arrojó 285 documentos, de los cuales 151 son artículos de revista; tras eliminar duplicados quedaron 97, y el uso del InOrdinatio seleccionó 27 artículos para el análisis cualitativo. Para la bibliometría se usaron las herramientas de las bases y el programa VOSviewer. El texto reconoce como limitaciones el número de bases y el uso exclusivo de artículos de revista. La búsqueda no incluye términos de tecnologías específicas ni de tipo de desastre, de modo que mezcla inundaciones, terremotos e incendios sin distinción.
  resultados: >
    La producción sobre el tema es reciente: la primera publicación en revista se indexó en 2010 y se registraron 10 artículos en 2017, 17 en 2018, 32 en 2019 y 25 entre enero y agosto de 2020. Las revistas con más artículos fueron IEEE Access (8), Computer Communications (6) y Sensors (5), junto con IEEE Internet of Things Journal, Natural Hazards, Sustainability e International Journal of Disaster Risk Reduction, en áreas de informática, ingeniería electrónica y ambiental. El análisis cualitativo muestra macrodiscusiones sobre IoT en gestión de desastres (estándares, arquitecturas, estado del arte, seguridad y comunicación) y aplicaciones específicas (gestión de inventario para ayuda, ajuste tarea-tecnología, monitoreo ambiental, primeros auxilios, rastreo de personas y distribución de suministros y medicinas). El principal impacto positivo señalado es la comunicación facilitada entre profesionales y los datos y el monitoreo más robustos. La Tabla 3 resume los estudios principales con su enfoque, desde estándares y estados del arte hasta diseño de inventarios y análisis de ajuste tarea-tecnología, sin reportar resultados numéricos de desempeño. Los autores señalan que el IoT es de especial utilidad para mitigación, rescate, respuesta y recuperación, aunque la evidencia se concentra en comunicación y monitoreo, y no distingue los resultados por tipo de desastre.
  discusion: >
    Los autores concluyen que el IoT, aunque lleva años en circulación, solo recientemente adquirió mayor alcance y claridad en sus enfoques y arquitecturas; que la informática es el área de mayor interés y que, dentro de la gestión de desastres, predominan además la ingeniería y las ciencias ambientales. Sostienen que las tecnologías de IoT ayudan a profesionales de salud, logística de materiales, monitoreo ambiental y control global de datos, y que los desastres afectan a las personas, al gobierno, a los aspectos políticos y económicos y a los entornos. Sugieren herramientas con mayor disponibilidad de acceso, menor consumo, agilidad y confianza.
  limitaciones: "Declaradas: el número de bases bibliográficas empleadas y el uso exclusivo de artículos de revista, por lo que se sugiere explorar más bases y artículos de congreso, y realizar estudios prácticos de aplicación. No declaradas: la selección con InOrdinatio depende de un coeficiente subjetivo y favorece artículos de revistas con alto factor de impacto y muchas citas, no necesariamente los más pertinentes; la Tabla 1 no distingue con claridad los totales por base; no se evalúa la calidad de los estudios ni la evidencia de efecto de las aplicaciones; sin cuantificación de resultados; el análisis es previo a 2021 y no incluye gemelos digitales ni UAV de forma sistemática."
  futuro: "Explícito: explorar bases de datos adicionales y otros tipos de contribución (artículos de congreso) y realizar estudios prácticos de aplicación de tecnologías IoT. Implícito: herramientas con mayor disponibilidad de acceso, menor consumo, agilidad y confianza para la captura de datos en desastres."
c3:
  tesis: >
    El IoT es una tecnología cuyo alcance y claridad crecieron recientemente y que, en la gestión de desastres, facilita la comunicación entre profesionales, aporta datos y monitoreo más robustos, y apoya el monitoreo ambiental, los primeros auxilios, el rastreo de personas y la distribución de suministros; su estudio se concentra en informática, ingeniería electrónica y ciencias ambientales y crece desde 2017.
  antitesis: >
    La revisión no muestra evidencia de efectos. Describe temas y funciones sin cuantificar beneficios, y la clasificación con InOrdinatio, que pondera factor de impacto y citas con un coeficiente subjetivo, tiende a seleccionar artículos populares y no a evaluar su calidad. Solo 27 de 285 documentos se analizan en profundidad, con dos bases y artículos de revista, y la tabla de totales por base es ambigua. Las aplicaciones listadas provienen de propuestas de arquitectura o de estados del arte, no de despliegues evaluados. El título anuncia tecnologías y usos, pero las fases de recuperación económica y los usuarios empresariales no aparecen. La transferencia de tecnología figura en las palabras clave sin análisis en el texto.
  sintesis: >
    La contribución sostenible, con las cautelas anteriores, es un panorama temprano de la literatura de IoT en gestión de desastres, con tendencias de publicación y una lista de funciones y usos útil como mapa de partida. Para el corpus, el valor reside en confirmar que la literatura de 2010 a 2020 prioriza la comunicación, el monitoreo y la logística de respuesta, y no la continuidad de actividades productivas ni la transferencia efectiva de tecnología, que figura como palabra clave pero no se desarrolla, y que las conclusiones deben leerse como descripción del interés académico y no como evidencia de efectividad.
  areas_grises:
    - "Selección por InOrdinatio: el índice combina factor de impacto, año de publicación y número de citas con un coeficiente alfa asignado por los investigadores según la importancia de la novedad o del tema; los 27 artículos analizados dependen de ese criterio, y se desconoce el valor de alfa y la sensibilidad de la lista a su cambio."
    - "Totales de la búsqueda: el texto indica 285 documentos y 151 artículos de revista, y la Tabla 1 muestra 83, 151, 97 y 36 en distintas celdas; sin lectura clara de la tabla, el número de artículos por base y el papel del filtro de duplicados quedan ambiguos."
    - "Evidencia de efecto: se afirma que el principal impacto positivo es la comunicación facilitada y los datos más robustos, pero ni la revisión ni los estudios descritos cuantifican mejoras en tiempos de respuesta, costos o víctimas."
    - "Transferencia de tecnología: la palabra clave aparece en el resumen, pero el cuerpo del texto no analiza cómo se transfieren las tecnologías a organismos de emergencia o a empresas ni qué barreras existen, de modo que el vínculo con el eje del corpus queda sin desarrollar."
  puntos_oscuros: >
    Llama la atención que una revisión que declara atender 'usos' del IoT en desastres no cuantifique ningún beneficio y que sus conclusiones se limiten a la distribución por áreas y revistas. También es notable que la transferencia de tecnología figure como palabra clave y no se analice en el texto. La selección de 27 artículos de 285 mediante un índice que premia el factor de impacto y las citas favorece trabajos antiguos y consolidados, lo cual no necesariamente refleja la pertinencia temática. La Tabla 1 no permite reconstruir sin ambigüedad cuántos documentos aportó cada base. Además, el texto afirma que los desastres afectan los aspectos políticos y económicos, pero no revisa estudios de recuperación económica. Por último, al tratarse de una revisión de 2021, no recoge los gemelos digitales ni el auge de los UAV posterior, y el hecho de que el texto no distinga tipos de desastre limita su utilidad para el caso sísmico.
  ideas:
    - "Actualización con la dimensión de transferencia de tecnología: repetir la revisión con las mismas bases pero añadiendo términos de transferencia, adopción y barreras, y extraer de los artículos quién usa las tecnologías (autoridades, comunidades, empresas), cómo se financian y qué obstáculos de adopción se reportan. El resultado sería un mapa de barreras de transferencia de IoT en desastres, que hoy no existe en el corpus, y se contrastaría con la literatura de transferencia en otros sectores. Permitiría priorizar intervenciones para llevar sensores y alertas de bajo costo a pequeñas empresas de regiones sísmicas, con una clasificación de barreras técnicas, financieras e institucionales."
    - "Análisis de sensibilidad del InOrdinatio: reproducir la clasificación variando el coeficiente alfa y el peso de las citas para medir cuántos de los 27 artículos persisten, y comparar con una selección por pertinencia temática hecha por dos revisores independientes. Con ello se evaluaría, en cada corrida, el sesgo del índice hacia artículos de alto impacto y se determinaría con un criterio explícito si la síntesis cualitativa cambia, lo que indicaría cuánta confianza dar a las conclusiones de una revisión basada en ese método, y se publicaría la lista completa de los 97 artículos con su puntaje, para permitir la réplica independiente."
  relaciones:
    - "Panorama de IoT en gestión de desastres (antecede a) D042, D019 y D022: las revisiones posteriores del corpus añaden UAV, método PRISMA y comunicaciones; D050 aporta el mapa de 2010 a 2020 con 285 documentos."
    - "Comunicación y monitoreo (se relaciona con) D044: ambos describen usos de IoT en emergencias; D050 se apoya en una revisión bibliométrica con método, mientras D044 presenta cifras de impacto sin método."
  robustez: [2, 2, 2, 3]
  valor: [4, "Ofrece un mapa bibliométrico temprano y una lista de funciones del IoT en las fases de la gestión de desastres, con método de nueve pasos reproducible en principio. Su valor para el corpus es adyacente-bajo: no cuantifica efectos, selecciona con un índice subjetivo, omite recuperación económica y no desarrolla la transferencia de tecnología pese a figurar como palabra clave. Sirve como referencia de contexto previa a 2021."]
  conexiones: []
socratica:
  p1: "'InOrdinatio' es un índice que ordena artículos por factor de impacto, año y citas con un coeficiente del investigador; 'IoT en gestión de desastres' es la combinación de ambas palabras clave en título o resumen."
  p2: "Supone que el factor de impacto y las citas reflejan relevancia para el tema, que dos bases bastan y que los artículos de revista representan el campo."
  p3: "La evidencia es un conteo de 285 documentos, una distribución por años y revistas y una síntesis de 27 artículos sin cuantificación de efectos."
  p4: "Si es cierto, los profesionales pueden orientarse sobre tecnologías de IoT disponibles; si es falso, pueden suponer beneficios no demostrados."
  p5: "No se examinan resultados cuantitativos, estudios de congreso, otras bases, ni barreras de transferencia de tecnología."
  p6: "Alternativas: que el índice favorezca artículos antiguos; que los hallazgos cambien con otro coeficiente; que la literatura gris contenga más evidencia operativa."
