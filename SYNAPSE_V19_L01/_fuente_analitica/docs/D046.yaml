doc_id: D046
relevancia: "Periférico"
relevancia_just: "Revisión bibliométrica y sistemática (método LRSB, Scopus) de 91 documentos sobre cómo el internet de las cosas y los sistemas de computación distribuida transforman los modelos de negocio (eficiencia, personalización, seguridad, decisión). Aporta el vínculo entre IoT y modelos de negocio, pero es genérica: no trata sismos, desastres, resiliencia ni recuperación empresarial."
cluster_tema: "IoT, computación distribuida y modelos de negocio (revisión)"
metodo_tipo: "Revisión bibliométrica y sistemática de literatura (LRSB) con análisis temático de contenido sobre 91 documentos de Scopus"
tipo_recurso: "Artículo de revisión (journal peer-reviewed, acceso abierto)"
kw_inferidas: [internet de las cosas, sistemas de computación distribuida, modelos de negocio, propuesta de valor, eficiencia operativa, mantenimiento predictivo, cadena de bloques, computación en el borde, bibliometría, transformación digital]
c2:
  objetivo: >
    Determinar en qué medida la integración del internet de las cosas (IoT) y de los sistemas de computación distribuida (DCS) mejora los modelos de negocio en términos de eficiencia y de eficacia, mediante una revisión bibliométrica de literatura (LRSB) de 91 documentos. El estudio busca describir las capacidades de ambas tecnologías (monitoreo inmediato, automatización, análisis de datos, personalización, seguridad y cumplimiento), analizar cómo afectan los componentes del modelo de negocio (propuesta de valor, segmentos de clientes, relaciones, canales y fuentes de ingreso) y proponer líneas de investigación futura.
  pregunta: >
    El artículo no formula preguntas de investigación con enunciado explícito; la pregunta rectora es hasta qué punto IoT y DCS, en conjunto, potencian los modelos de negocio en eficiencia y eficacia. Subordinadas a ella, el análisis bibliométrico examina quiénes publican, en qué revistas y países, y el análisis de contenido agrupa los hallazgos en infraestructuras inteligentes, computación en el borde, analítica predictiva, servicios personalizados y seguridad.
  marco: >
    El marco combina el concepto de modelo de negocio (propuesta de valor, segmentos, relaciones con clientes, canales y fuentes de ingreso) con descripciones técnicas de IoT (conexión de dispositivos que interactúan y envían datos) y de sistemas distribuidos (arquitecturas en las que el procesamiento ocurre en varios nodos). La tesis implícita es un paso de marcos centralizados a modelos descentralizados y basados en datos. No se formula una teoría específica de modelos de negocio ni de ventaja competitiva, y el análisis se organiza por beneficios y desafíos que se relacionan después con los cinco componentes del modelo. Los desafíos incluyen seguridad y privacidad, costos de implementación y mantenimiento, calidad del software y consistencia y sincronización de los datos.
  metodologia: >
    El método LRSB, de Rosário y colaboradores, se presenta como extensión flexible de PRISMA en tres etapas y seis pasos. La búsqueda se hizo solo en Scopus hasta agosto de 2024: 206 901 documentos con 'internet of thing', 2926 al añadir 'distributed computer systems' y 91 al limitar el área temática a 'Business'. Los criterios de inclusión fueron abordar el efecto de IoT y DCS en modelos de negocio, estar revisados por pares y publicados en el área 'Business'; se excluyeron los artículos en idiomas distintos del inglés, inaccesibles o duplicados. Los 91 documentos pasaron a la selección final sin exclusiones adicionales descritas. El análisis combinó indicadores bibliométricos (años, países, revistas, citas) con análisis temático de contenido, sin evaluación de calidad ni de sesgo de los estudios. El texto reconoce críticas a PRISMA y afirma que el método LRSB mitiga el formalismo, pero no detalla quién realizó el cribado ni cómo se resolvieron discrepancias, de modo que la reproducibilidad se limita a la cadena de búsqueda en Scopus.
  resultados: >
    El análisis bibliométrico muestra crecimiento de las publicaciones, con contribuciones por país encabezadas por China (80), Estados Unidos (24), Alemania (22), Grecia (15), Malasia (14), Italia (12), Australia (10), Austria (8) e Irán (7), contadas por afiliación de autores. Entre 68 revistas, 13 son de cuartil Q1, siete Q2, una Q3 y tres Q4, y 44 (65 %) no tienen datos de indexación; la revista de mayor SJR es Technological Forecasting and Social Change. El análisis de contenido concluye que IoT y DCS permiten monitoreo en tiempo real, mantenimiento predictivo, automatización de fábricas y cadenas de suministro, servicios personalizados, modelos de suscripción y pago por uso, mayor seguridad con sistemas distribuidos y cumplimiento regulatorio. Se identifican desafíos de seguridad y privacidad, costos de implementación y mantenimiento, calidad del software, consistencia y sincronización de datos y errores de transmisión. La sección de costos señala que el almacenamiento escalable y el cómputo de alto rendimiento pueden ser problemáticos para pequeñas y medianas empresas con pocos recursos. Los ejemplos citados incluyen redes eléctricas inteligentes, vehículos autónomos, comercio electrónico y dispositivos portátiles de salud, sin cifras de efecto, y el texto no distingue entre beneficios observados en estudios empíricos y beneficios anticipados por los autores citados.
  discusion: >
    Los autores concluyen que IoT y DCS transforman los modelos de negocio al permitir recolección de información en el momento, análisis avanzado y decisiones automatizadas, y que promueven ventaja competitiva, innovación continua y adaptabilidad al mercado. Proponen líneas futuras en inteligencia artificial y aprendizaje automático con IoT, arquitecturas descentralizadas como cadena de bloques para confianza y seguridad, computación en el borde para baja latencia y sistemas autónomos que operen sin intervención humana. Recomiendan que las empresas evalúen riesgos y costos de implementación y capacitación de personal, y destacan que el valor de IoT y DCS depende de integrarlos con estrategias de datos. No contrastan estas recomendaciones con evidencia de empresas que fracasaron en la adopción.
  limitaciones: "Declaradas: la dependencia de Scopus puede omitir otras bases importantes. No declaradas: el área temática 'Business' como filtro final puede excluir estudios de ingeniería con aplicaciones empresariales; los 91 documentos no se reducen en la selección, lo que indica que el cribado de contenido no aplicó exclusiones; sin evaluación de calidad; el conteo por país es ambiguo (China con 80 en un conjunto de 91 documentos); sin cuantificación de beneficios de negocio (ingresos, costos, márgenes); la síntesis es narrativa y los ejemplos provienen de estudios individuales."
  futuro: "Explícito: integración de inteligencia artificial y aprendizaje automático con IoT para decisiones y respuestas automatizadas, arquitecturas descentralizadas (cadena de bloques, registros distribuidos) para confianza y seguridad, y sistemas autónomos basados en IoT y computación distribuida. Implícito: ampliación a otras bases de datos y evaluación cuantitativa de efectos en negocios."
c3:
  tesis: >
    El IoT y la computación distribuida, en conjunto, transforman los modelos de negocio al habilitar monitoreo inmediato, mantenimiento predictivo, automatización, análisis de datos, personalización y seguridad descentralizada, lo que conduce a mayor eficiencia y eficacia, ventaja competitiva y adaptabilidad al mercado, aunque su adopción enfrenta desafíos de seguridad, interoperabilidad, escalabilidad y costos.
  antitesis: >
    La revisión no cuantifica ninguno de los beneficios que afirma. Se apoya en una sola base de datos, en un filtro de área temática que reduce 2926 documentos a 91 y en un cribado que no descarta ningún documento, de modo que la selección es automática y no editorial, y no se declara ninguna lectura crítica de los textos completos. La síntesis narra ejemplos (fábricas, redes eléctricas, vehículos autónomos, comercio electrónico) sin comparar con empresas que no adoptan IoT. Se afirma una mejora de eficiencia y eficacia que no se mide con indicadores. Los desafíos se mencionan como lista, sin pesarlos frente a los beneficios, y el conteo de publicaciones por país es ambiguo. La conclusión de que las tecnologías promueven ventaja competitiva carece de evidencia de desempeño financiero.
  sintesis: >
    La contribución sostenible es un mapa temático amplio de cómo la literatura de negocios asocia IoT y sistemas distribuidos con componentes del modelo de negocio, útil como marco para clasificar beneficios y riesgos de adopción. La afirmación de efecto positivo debe entenderse como consenso narrativo de la literatura seleccionada, no como evidencia de impacto, y requiere contraste con estudios cuantitativos y con casos de adopción fallida. Para el corpus, importa en cuanto describe el lado de modelo de negocio del IoT (monitoreo, mantenimiento predictivo, suscripción, cumplimiento) que podría ponerse al servicio de la continuidad, pero no incluye resiliencia ni desastres.
  areas_grises:
    - "Selección de estudios: la cadena de filtros reduce 206 901 registros a 2926 y a 91 mediante palabras clave y área temática, y el texto indica que los 91 documentos son la selección final, sin exclusiones por contenido; no hay lectura crítica que garantice que cada documento trate el efecto de IoT y DCS en modelos de negocio."
    - "Cuantificación de efectos: el resumen afirma mejoras en eficiencia y eficacia, pero el texto no presenta indicadores de desempeño (productividad, costos, ingresos), tamaños de efecto ni comparaciones, de modo que las conclusiones de ventaja competitiva son afirmaciones de la literatura citada."
    - "Indicadores bibliométricos: la tabla de países muestra China con 80, Estados Unidos con 24 y valores menores, pero el total de documentos es 91 y el texto aclara que los conteos dependen de las afiliaciones; no es posible interpretar el valor de China como número de documentos."
    - "Pertinencia de los dominios: los ejemplos (redes eléctricas, vehículos autónomos, salud portátil, comercio electrónico) son heterogéneos; no se analizan resiliencia, continuidad ni recuperación después de interrupciones, aunque el IoT se menciona como habilitador de seguridad operacional."
  puntos_oscuros: >
    Llama la atención que una revisión que se presenta como sistemática y rigurosa reduzca el conjunto de 2926 a 91 documentos con un filtro de área temática y que ningún documento quede excluido en la selección final, lo que sugiere que el cribado de contenido no se aplicó. También es notable que la revisión concluya que IoT y computación distribuida promueven ventaja competitiva sin ofrecer una sola cifra de desempeño empresarial. El conteo de China con 80 en un total de 91 documentos exige una aclaración que el texto solo da de forma general. Además, la lista de beneficios coincide con la de la introducción, lo que indica que el análisis confirma el marco inicial. Por último, la presentación de un 'enfoque flexible' que reduce el sesgo se acompaña de la limitación de usar una sola base de datos, y el artículo no discute cómo el filtro de área temática, que descarta estudios de ingeniería con aplicación empresarial, condiciona la visión de los modelos de negocio.
  ideas:
    - "Mapa de modelos de negocio para continuidad: reasignar los beneficios identificados (mantenimiento predictivo, monitoreo, suscripción, cumplimiento) a la fase de continuidad y recuperación de una pyme, y proponer un modelo de negocio de 'servicio de continuidad' donde un proveedor ofrezca sensado, gemelo ligero y alertas por suscripción. Se podría evaluar con un piloto de tres a cinco empresas, midiendo el costo mensual, la reducción de tiempos de parada tras eventos y la disposición a pagar. El diseño compararía un esquema de suscripción con la compra de equipos propios, para conocer cuál reduce la barrera de entrada de una pyme con restricciones de capital y de personal técnico."
    - "Replicar el análisis con evaluación de calidad: repetir la búsqueda con Web of Science y Scopus, aplicar cribado independiente por dos revisores y extraer de cada estudio la evidencia cuantitativa de efecto (ahorro, productividad, ingresos). El resultado permitiría estimar tamaños de efecto de IoT y sistemas distribuidos en modelos de negocio y comprobar si las conclusiones narrativas se sostienen, con especial atención a estudios de contextos de riesgo. El protocolo se registraría de antemano y se publicaría la lista de exclusiones con sus motivos, para eliminar la opacidad del cribado actual y permitir que otros equipos lo repliquen."
  relaciones:
    - "IoT y resiliencia de cadena de suministro (se relaciona con) D017 y D037: D017 revisa IoT y resiliencia de cadenas con Web of Science, y D037 cuantifica la asociación con tecnologías digitales (r = 0,33); D046 aporta la dimensión de modelo de negocio sin medir resiliencia."
    - "Adopción de gemelos digitales y resiliencia operativa (complementa) D029 y D030: los estudios por encuesta de D029 y D030 miden percepciones en empresas, mientras D046 revisa los modelos de negocio que sustentan la adopción de IoT."
  robustez: [2, 2, 1, 2]
  valor: [3, "Aporta un marco narrativo de cómo IoT y computación distribuida se asocian con componentes del modelo de negocio y una lista de desafíos de adopción. Su valor para el corpus es periférico: no trata desastres, resiliencia ni recuperación, no cuantifica efectos y su selección de 91 documentos no pasó por exclusión de contenido. Además, sirve como inventario de beneficios declarados que deben verificarse con evidencia cuantitativa."]
  conexiones: []
socratica:
  p1: "'Modelo de negocio' es la forma en que una empresa crea, entrega y captura valor; 'eficiencia' y 'eficacia' son mejoras de operación y de resultado, no medidas en el texto; 'LRSB' es el método de revisión usado."
  p2: "Supone que los 91 documentos del área 'Business' representan la literatura, que los beneficios narrados equivalen a efectos y que IoT y sistemas distribuidos actúan en conjunto."
  p3: "La evidencia es un conteo bibliométrico y una síntesis temática de 91 documentos de Scopus, sin indicadores de desempeño de empresas."
  p4: "Si es cierto, las empresas pueden esperar ventaja competitiva de IoT y sistemas distribuidos; si es falso, pueden invertir sin una mejora medible."
  p5: "No se examinan casos de fracaso, estudios cuantitativos de efecto, otras bases ni resultados financieros."
  p6: "Alternativas: que el efecto provenga de la digitalización general y no de IoT; que los beneficios dependan del tamaño o del sector; que los costos superen los beneficios en pymes."
